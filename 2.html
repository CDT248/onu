<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Support Dashboard</title>

<style>
:root{
  --bg:#f4f7f6;
  --card:#ffffff;
  --card2:#f8faf9;
  --text:#17221d;
  --muted:#718078;
  --border:#dfe8e3;
  --primary:#159447;
  --primary2:#0c7436;
  --danger:#dc3545;
  --warning:#f0a202;
  --info:#1684d4;
  --shadow:0 10px 30px rgba(20,60,40,.08);
  --radius:16px;
}

body.dark{
  --bg:#0d1511;
  --card:#142019;
  --card2:#18271f;
  --text:#edf7f0;
  --muted:#9caf a4;
  --border:#293b31;
  --shadow:0 12px 35px rgba(0,0,0,.3);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
}

/* ================= HEADER ================= */

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--card);
  border-bottom:1px solid var(--border);
  box-shadow:0 4px 20px rgba(0,0,0,.04);
}

.header-inner{
  max-width:1500px;
  margin:auto;
  min-height:72px;
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  margin-right:auto;
  min-width:190px;
}

.logo-icon{
  width:42px;
  height:42px;
  border-radius:13px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:800;
  box-shadow:0 7px 18px rgba(21,148,71,.25);
}

.logo-text strong{
  display:block;
  font-size:17px;
}

.logo-text span{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:11px;
  padding:10px 14px;
  font-weight:700;
  transition:.2s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:var(--primary);
}

.btn-primary{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
}

.btn-primary:hover{
  background:var(--primary2);
  border-color:var(--primary2);
}

.btn-danger{
  background:var(--danger);
  border-color:var(--danger);
  color:#fff;
}

.btn-info{
  background:var(--info);
  border-color:var(--info);
  color:#fff;
}

.btn-warning{
  background:var(--warning);
  border-color:var(--warning);
  color:#fff;
}

.btn-sm{
  padding:7px 10px;
  border-radius:8px;
  font-size:12px;
}

.profile-wrap{
  position:relative;
}

.profile{
  width:42px;
  height:42px;
  border-radius:50%;
  border:2px solid var(--primary);
  background:linear-gradient(135deg,#b9eac9,#51bc7b);
  color:#0b5e2d;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
}

.profile-menu{
  position:absolute;
  top:52px;
  right:0;
  width:190px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:13px;
  box-shadow:var(--shadow);
  padding:7px;
  display:none;
}

.profile-menu.show{
  display:block;
}

.profile-menu button{
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  padding:11px;
  border-radius:9px;
  text-align:left;
}

.profile-menu button:hover{
  background:var(--card2);
}

/* ================= MAIN ================= */

.main{
  max-width:1500px;
  margin:auto;
  padding:20px;
}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:16px;
}

.page-title h1{
  margin:0;
  font-size:24px;
}

.page-title p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}

/* ================= TABS ================= */

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:4px;
  margin-bottom:15px;
}

.tab{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--muted);
  border-radius:11px;
  padding:10px 18px;
  font-weight:800;
  white-space:nowrap;
}

.tab.active{
  color:#fff;
  background:var(--primary);
  border-color:var(--primary);
}

/* ================= FILTER ================= */

.filter-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.filter-grid{
  display:grid;
  grid-template-columns:minmax(220px,1fr) 150px 150px 145px auto;
  gap:10px;
  align-items:center;
}

.field{
  position:relative;
}

.field label{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin:0 0 5px 2px;
  font-weight:700;
}

.input,
.select{
  width:100%;
  height:42px;
  padding:0 12px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  background:var(--card2);
  color:var(--text);
}

.input:focus,
.select:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(21,148,71,.1);
}

/* ================= TABLE ================= */

.table-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.table-wrap{
  width:100%;
  overflow:auto;
}

table{
  width:100%;
  min-width:900px;
  border-collapse:collapse;
}

thead{
  background:var(--card2);
}

th{
  padding:13px 12px;
  text-align:left;
  font-size:12px;
  color:var(--muted);
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}

td{
  padding:13px 12px;
  border-bottom:1px solid var(--border);
  font-size:13px;
  white-space:nowrap;
}

tbody tr:hover{
  background:var(--card2);
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
}

.empty-icon{
  font-size:38px;
  margin-bottom:8px;
}

/* ================= ACTIONS ================= */

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.action{
  border:0;
  border-radius:8px;
  padding:7px 9px;
  font-size:11px;
  font-weight:800;
  color:#fff;
}

.action-edit{
  background:var(--info);
}

.action-sell,
.action-paid{
  background:var(--primary);
}

.action-delete{
  background:var(--danger);
}

/* ================= BADGES ================= */

.badge{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:30px;
  font-size:11px;
  font-weight:800;
}

.badge-active{
  color:#087432;
  background:#dff7e7;
}

.badge-blocked{
  color:#b4232f;
  background:#ffe1e4;
}

.badge-inactive{
  color:#986900;
  background:#fff0c7;
}

/* ================= PAGINATION ================= */

.footer-bar{
  padding:13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-top:1px solid var(--border);
}

.page-info{
  color:var(--muted);
  font-size:12px;
}

.pagination{
  display:flex;
  gap:5px;
}

.page-btn{
  min-width:34px;
  height:34px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:8px;
}

.page-btn.active{
  color:#fff;
  background:var(--primary);
  border-color:var(--primary);
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:0 30px 70px rgba(0,0,0,.25);
}

.modal-head{
  padding:17px 19px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-head h2{
  margin:0;
  font-size:18px;
}

.close{
  width:35px;
  height:35px;
  border:0;
  background:var(--card2);
  color:var(--text);
  border-radius:9px;
  font-size:20px;
}

.modal-body{
  padding:19px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  display:block;
  font-size:12px;
  font-weight:800;
  color:var(--muted);
  margin-bottom:6px;
}

.readonly{
  opacity:.75;
  cursor:not-allowed;
}

.modal-foot{
  padding:15px 19px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

/* ================= USERS ================= */

.users-list{
  overflow:auto;
}

.user-row{
  display:grid;
  grid-template-columns:1.2fr 1.2fr 1fr 1fr 1fr auto;
  gap:10px;
  align-items:center;
  padding:11px 0;
  border-bottom:1px solid var(--border);
  font-size:12px;
}

.user-row:last-child{
  border-bottom:0;
}

.user-name{
  font-weight:800;
}

.user-muted{
  color:var(--muted);
}

.user-actions{
  display:flex;
  gap:5px;
}

/* ================= ITEMS ================= */

.item-add{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.item-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.item-line{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:11px 13px;
  border:1px solid var(--border);
  background:var(--card2);
  border-radius:10px;
}

/* ================= LOADER ================= */

.loader{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.4);
}

.loader.show{
  display:flex;
}

.loader-box{
  min-width:190px;
  background:var(--card);
  border-radius:16px;
  padding:22px;
  text-align:center;
  box-shadow:var(--shadow);
}

.spinner{
  width:38px;
  height:38px;
  margin:auto auto 12px;
  border:4px solid var(--border);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* ================= TOAST ================= */

.toast-container{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:400;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.toast{
  min-width:260px;
  max-width:380px;
  padding:13px 15px;
  border-radius:11px;
  background:var(--card);
  border-left:4px solid var(--primary);
  box-shadow:var(--shadow);
  font-size:13px;
  animation:toastIn .25s ease;
}

.toast.error{
  border-left-color:var(--danger);
}

.toast.warning{
  border-left-color:var(--warning);
}

@keyframes toastIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* ================= RESPONSIVE ================= */

@media(max-width:1050px){
  .filter-grid{
    grid-template-columns:1fr 1fr;
  }

  .filter-grid .search-field{
    grid-column:1/-1;
  }

  .user-row{
    min-width:800px;
  }

  .users-list{
    overflow-x:auto;
  }
}

@media(max-width:720px){
  .header-inner{
    padding:10px 12px;
  }

  .logo{
    min-width:auto;
  }

  .logo-text{
    display:none;
  }

  .header-actions .label{
    display:none;
  }

  .header-actions .btn{
    width:42px;
    height:42px;
    padding:0;
  }

  .main{
    padding:12px;
  }

  .page-title{
    align-items:flex-start;
  }

  .page-title h1{
    font-size:20px;
  }

  .filter-grid{
    grid-template-columns:1fr;
  }

  .filter-grid .search-field{
    grid-column:auto;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .footer-bar{
    flex-direction:column;
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- ================= HEADER ================= -->

<header class="header">
  <div class="header-inner">

    <div class="logo">
      <div class="logo-icon">S</div>
      <div class="logo-text">
        <strong>Support Dashboard</strong>
        <span>Management System</span>
      </div>
    </div>

    <div class="header-actions">

      <button class="btn" onclick="reloadCurrent()">
        ↻ <span class="label">Reload</span>
      </button>

      <button class="btn" onclick="openUsersModal()">
        👥 <span class="label">Users</span>
      </button>

      <button class="btn" onclick="openItemsModal()">
        📦 <span class="label">Items</span>
      </button>

      <button class="btn btn-primary" onclick="openNewEntry()">
        ＋ <span class="label">New Entry</span>
      </button>

      <button class="btn" onclick="toggleTheme()" id="themeBtn">
        🌙 <span class="label">Dark</span>
      </button>

      <div class="profile-wrap">
        <button class="profile" id="profileButton" onclick="toggleProfileMenu()">U</button>

        <div class="profile-menu" id="profileMenu">
          <button onclick="openPasswordModal();closeProfileMenu()">🔐 Change Password</button>
          <button onclick="logout()">🚪 Logout</button>
        </div>
      </div>

    </div>

  </div>
</header>


<!-- ================= MAIN ================= -->

<main class="main">

  <div class="page-title">
    <div>
      <h1 id="pageTitle">Data</h1>
      <p id="pageSubtitle">Manage support entries</p>
    </div>
  </div>


  <!-- TABS -->

  <div class="tabs">

    <button class="tab active" id="tab-data" onclick="switchView('data')">
      DATA
    </button>

    <button class="tab" id="tab-sell" onclick="switchView('sell')">
      SELL
    </button>

    <button class="tab" id="tab-paid" onclick="switchView('paid')">
      PAID
    </button>

    <button class="tab" id="tab-delete" onclick="switchView('delete')">
      DELETE
    </button>

  </div>


  <!-- FILTER -->

  <div class="filter-card">

    <div class="filter-grid">

      <div class="field search-field">
        <label>Search</label>
        <input
          class="input"
          id="searchInput"
          type="text"
          placeholder="Search Name, IP, Work, Item..."
          oninput="applyFilters()"
        >
      </div>

      <div class="field">
        <label>From</label>
        <input
          class="input"
          id="fromDate"
          type="date"
          onchange="applyFilters()"
        >
      </div>

      <div class="field">
        <label>To</label>
        <input
          class="input"
          id="toDate"
          type="date"
          onchange="applyFilters()"
        >
      </div>

      <div class="field">
        <label>View</label>
        <select class="select" id="viewSelect" onchange="switchView(this.value)">
          <option value="data">DATA</option>
          <option value="sell">SELL</option>
          <option value="paid">PAID</option>
          <option value="delete">DELETE</option>
        </select>
      </div>

      <button class="btn" onclick="clearFilters()">
        ✕ Clear
      </button>

    </div>

  </div>


  <!-- TABLE -->

  <div class="table-card">

    <div class="table-wrap">
      <table>

        <thead id="tableHead"></thead>

        <tbody id="tableBody"></tbody>

      </table>
    </div>

    <div class="footer-bar">

      <div class="page-info" id="pageInfo">
        Loading...
      </div>

      <div class="pagination" id="pagination"></div>

    </div>

  </div>

</main>

</div>


<!-- ================= ENTRY MODAL ================= -->

<div class="modal" id="entryModal">

  <div class="modal-box">

    <div class="modal-head">
      <h2 id="entryModalTitle">New Entry</h2>
      <button class="close" onclick="closeModal('entryModal')">×</button>
    </div>

    <div class="modal-body">

      <div class="form-grid">

        <div class="form-group">
          <label>Name</label>
          <input
            class="input readonly"
            id="entryName"
            readonly
          >
        </div>

        <div class="form-group">
          <label>IP</label>
          <input
            class="input"
            id="entryIP"
            placeholder="Enter IP"
          >
        </div>

        <div class="form-group">
          <label>Work</label>
          <input
            class="input"
            id="entryWork"
            placeholder="Enter Work"
          >
        </div>

        <div class="form-group">
          <label>Date</label>
          <input
            class="input readonly"
            id="entryDate"
            type="date"
            readonly
          >
        </div>

        <div class="form-group full">
          <label>Item</label>
          <select class="select" id="entryItem">
            <option value="">Select Item</option>
          </select>
        </div>

      </div>

    </div>

    <div class="modal-foot">

      <button class="btn" onclick="closeModal('entryModal')">
        Cancel
      </button>

      <button class="btn btn-primary" onclick="saveEntry()">
        Save
      </button>

    </div>

  </div>

</div>


<!-- ================= USERS MODAL ================= -->

<div class="modal" id="usersModal">

  <div class="modal-box" style="width:min(1050px,100%)">

    <div class="modal-head">

      <h2>Users Management</h2>

      <button class="close" onclick="closeModal('usersModal')">×</button>

    </div>

    <div class="modal-body">

      <div style="display:flex;justify-content:flex-end;margin-bottom:14px">
        <button class="btn btn-primary" onclick="openUserForm()">
          ＋ Add User
        </button>
      </div>

      <div class="users-list" id="usersList">
        Loading...
      </div>

    </div>

  </div>

</div>


<!-- ================= USER FORM ================= -->

<div class="modal" id="userFormModal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="userFormTitle">Add User</h2>

      <button class="close" onclick="closeModal('userFormModal')">×</button>

    </div>

    <div class="modal-body">

      <input type="hidden" id="originalUsername">

      <div class="form-grid">

        <div class="form-group">
          <label>Username</label>
          <input class="input" id="userUsername">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input class="input" id="userPassword" type="password">
        </div>

        <div class="form-group">
          <label>Name</label>
          <input class="input" id="userName">
        </div>

        <div class="form-group">
          <label>Role</label>
          <select class="select" id="userRole">
            <option value="admin">admin</option>
            <option value="manager">manager</option>
            <option value="support">support</option>
            <option value="call">call</option>
            <option value="guest">guest</option>
          </select>
        </div>

        <div class="form-group">
          <label>Status</label>
          <select class="select" id="userStatus">
            <option value="Active">Active</option>
            <option value="Blocked">Blocked</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

      </div>

    </div>

    <div class="modal-foot">

      <button class="btn" onclick="closeModal('userFormModal')">
        Cancel
      </button>

      <button class="btn btn-primary" onclick="saveUser()">
        Save User
      </button>

    </div>

  </div>

</div>


<!-- ================= ITEMS MODAL ================= -->

<div class="modal" id="itemsModal">

  <div class="modal-box">

    <div class="modal-head">

      <h2>Items Management</h2>

      <button class="close" onclick="closeModal('itemsModal')">×</button>

    </div>

    <div class="modal-body">

      <div class="item-add">

        <input
          class="input"
          id="newItemInput"
          placeholder="Enter item name"
        >

        <button class="btn btn-primary" onclick="addItem()">
          Add
        </button>

      </div>

      <div class="item-list" id="itemsList">
        Loading...
      </div>

    </div>

  </div>

</div>


<!-- ================= PASSWORD MODAL ================= -->

<div class="modal" id="passwordModal">

  <div class="modal-box">

    <div class="modal-head">

      <h2>Change Password</h2>

      <button class="close" onclick="closeModal('passwordModal')">×</button>

    </div>

    <div class="modal-body">

      <div class="form-grid">

        <div class="form-group full">
          <label>Current Password</label>
          <input
            class="input"
            id="currentPassword"
            type="password"
          >
        </div>

/* ============================================================

async function getJson(url){

  const response =
    await fetch(url,{
      method:"GET",
      cache:"no-store"
    });

  const text =
    await response.text();

  let result;

  try{
    result = JSON.parse(text);
  }catch(e){
    throw new Error("Invalid server response.");
  }

  return result;

}


async function postJson(url,payload){

  const response =
    await fetch(url,{
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },
      body:JSON.stringify(payload),
      redirect:"follow"
    });

  const text =
    await response.text();

  let result;

  try{
    result = JSON.parse(text);
  }catch(e){
    throw new Error(
      "Invalid server response: " +
      text.substring(0,150)
    );
  }

  return result;

}

async function loadData(force=false){

        return;
      }

      if(currentView === "paid" && paidCache){

      }

      if(currentView === "delete" && deleteCache){
        renderCurrentView();
        return;
      }

    }

    showLoader("Loading " + currentView.toUpperCase() + "...");

    let url;
    let result;

    if(currentView === "data"){

      url =
        DATA_API_URL +
        "?action=getData&t=" +
        Date.now();

      result =
        await getJson(url);

      if(!result.success){
        throw new Error(result.message || "Unable to load data.");
      }

      dataCache =
        Array.isArray(result.data)
          ? result.data
          : [];

    }

    else if(currentView === "sell"){

      url =
        SELL_API_URL +
        "?action=getSellData&t=" +
        Date.now();

      result =
        await getJson(url);

      if(!result.success){
        throw new Error(result.message || "Unable to load sell data.");

        throw new Error(result.message || "Unable to load deleted data.");

  catch(error){

    showToast(
      error.message || "Data loading failed.",

function renderCurrentView(){

  const rows =

  const search =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const from =
    document.getElementById("fromDate").value;

  const to =
    document.getElementById("toDate").value;

  filteredData =
    rows.filter(function(row){

      if(search){

        const found =
          Object.keys(row || {}).some(function(key){

            return String(row[key] ?? "")
              .toLowerCase()
              .includes(search);

          });

        if(!found) return false;

      }

      const rowDate =
        normalizeDate(row?.Date);

      if(from && rowDate && rowDate < from)
        return false;

      if(to && rowDate && rowDate > to)
        return false;

      return true;

    });

  renderTable();

}

/* ============================================================
   PAGINATION
============================================================ */

function updatePagination(){

  const total =
    filteredData.length;

  const pages =
    Math.max(
      1,
      Math.ceil(total / PAGE_SIZE)
    );

  if(currentPage > pages)
    currentPage = pages;

  const start =
    total
      ? ((currentPage - 1) * PAGE_SIZE) + 1
      : 0;

  const end =
    Math.min(
      currentPage * PAGE_SIZE,
      total
    );

  document.getElementById("pageInfo").textContent =
    total
      ? `Showing ${start}-${end} of ${total}`
      : "Showing 0 of 0";

  const pagination =
    document.getElementById("pagination");

  pagination.innerHTML = "";

  if(pages <= 1)
    return;

  const prev =
    document.createElement("button");

  prev.className =
    "page-btn";

  prev.textContent =
    "‹";

  prev.disabled =
    currentPage === 1;

  prev.onclick =
    function(){
      if(currentPage > 1){
        currentPage--;
        renderTable();
      }
    };

  pagination.appendChild(prev);


  let begin =
    Math.max(
      1,
      currentPage - 2
    );

  let finish =
    Math.min(
      pages,
      currentPage + 2
    );


  for(let i=begin;i<=finish;i++){

    const btn =
      document.createElement("button");

    btn.className =
      "page-btn" +
      (i === currentPage ? " active" : "");

    btn.textContent =
      i;

    btn.onclick =
      function(){
        currentPage = i;
        renderTable();
      };

    pagination.appendChild(btn);

  }


  const next =
    document.createElement("button");

  next.className =
    "page-btn";

  next.textContent =
    "›";

  next.disabled =
    currentPage === pages;

  next.onclick =
    function(){

      if(currentPage < pages){

        currentPage++;

        renderTable();

      }

    };

  pagination.appendChild(next);

}

/* ============================================================
   SAVE ENTRY
============================================================ */

async function saveEntry(){

  const name =
    document.getElementById("entryName")
      .value
      .trim();

  const ip =
    document.getElementById("entryIP")
      .value
      .trim();

  const work =
    document.getElementById("entryWork")
      .value
      .trim();

  const date =
    document.getElementById("entryDate")
      .value;

  const item =
    document.getElementById("entryItem")
      .value
      .trim();


  if(!name){

    showToast("Name is required.","error");
    return;

  }

  if(!ip){

    showToast("IP is required.","error");
    return;

  }

  if(!work){

    showToast("Work is required.","error");
    return;

  }

  if(!date){

    showToast("Date is required.","error");
    return;

  }

  if(!item){

    showToast("Please select an Item.","error");
    return;

  }


  showLoader("Saving...");


  try{

    let result;


    if(editingType === "sell"){

      const row =
        filteredData[editingIndex];

      const rowNumber =
        getRealRowNumber(row);

      result =
        await postJson(
          SELL_API_URL,
          {
            action:"editSellData",

            row:rowNumber,
            rowNumber:rowNumber,

            name:name,
            ip:ip,
            work:work,
            date:date,
            item:item,

            username:currentUsername,
            user:currentUsername
          }
        );

    }


    else if(editingIndex >= 0){

      const row =
        filteredData[editingIndex];

      const rowNumber =
        getRealRowNumber(row);

      result =
        await postJson(
          DATA_API_URL,
          {

async function loadUsers(){

        USER_API_URL +

      );

      !result ||
      result.success !== true
    ){

      );

    }

      Array.isArray(result.data)
        ? result.data
        : Array.isArray(result.users)
          ? result.users
          : [];


    renderUsers();

  }
  catch(error){

function renderUsers(){

  const list =
    document.getElementById("usersList");

  if(!usersCache || !usersCache.length){

    list.innerHTML =
      `<div class="empty">
        <div class="empty-icon">👥</div>
        <div>No users found.</div>
      </div>`;

    return;

  }


  list.innerHTML =
    usersCache.map(function(user,index){

      const username =
        user.Username ??
        user.username ??
        "";

      const name =
        user.Name ??
        user.name ??
        "";

      const role =
        user.Role ??
        user.role ??
        "";

      const status =
        user.Status ??
        user.status ??
        "Inactive";

      let badge =
        "badge-inactive";

      if(
        String(status).toLowerCase() === "active"
      )
        badge = "badge-active";

      else if(
        String(status).toLowerCase() === "blocked"
      )
        badge = "badge-blocked";


      return `
        <div class="user-row">

          <div class="user-name">
            ${escapeHtml(username)}
          </div>

          <div>
            ${escapeHtml(name)}
          </div>

          <div class="user-muted">
            ${escapeHtml(role)}
          </div>

          <div>
            <span class="badge ${badge}">
              ${escapeHtml(status)}
            </span>
          </div>

          <div class="user-muted">
            ${username === currentUsername ? "You" : ""}
          </div>

          <div class="user-actions">

            <button
              class="btn btn-sm"
              onclick="editUser(${index})">
              Edit
            </button>

            ${
              username !== currentUsername
              ? `
                <button
                  class="btn btn-sm ${
                    String(status).toLowerCase() === "blocked"
                      ? "btn-primary"
                      : "btn-danger"
                  }"
                  onclick="toggleUserStatus(${index})">
                  ${
                    String(status).toLowerCase() === "blocked"
                      ? "Unblock"
                      : "Block"
                  }
                </button>
              `
              : ""
            }

          </div>

        </div>
      `;

    }).join("");

}

function populateItemSelect(selected){

  const select =
    document.getElementById("entryItem");

  if(!select)
    return;


  select.innerHTML =
    `<option value="">Select Item</option>`;


  (itemsCache || []).forEach(function(item){

    const option =
      document.createElement("option");

    option.value =
      item;

    option.textContent =
      item;

    if(item === selected)
      option.selected = true;

    select.appendChild(option);

  });


  /*
   * If an old item exists but is no longer
   * in Item API, keep it selectable.
   */

  if(
    selected &&
    !(itemsCache || []).includes(selected)
  ){

    const option =
      document.createElement("option");

    option.value =
      selected;

    option.textContent =
      selected;

    option.selected = true;

    select.appendChild(option);

  }

}

/* ============================================================
   DATE HELPERS
============================================================ */

function normalizeDate(value){

  if(!value)
    return "";

  const text =
    String(value).trim();


  if(
    /^\d{4}-\d{2}-\d{2}$/.test(text)
  )
    return text;


  const match =
    text.match(
      /^(\d{2})\/(\d{2})\/(\d{4})$/
    );


  if(match){

    return (
      match[3] +
      "-" +
      match[2] +
      "-" +
      match[1]
    );

  }


  const date =
    new Date(value);


  if(isNaN(date.getTime()))
    return "";


  const year =
    date.getFullYear();

  const month =
    String(date.getMonth()+1)
      .padStart(2,"0");

  const day =
    String(date.getDate())
      .padStart(2,"0");


  return `${year}-${month}-${day}`;

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

   INACTIVITY

function setupInactivity(){

  const events = [
    "mousemove",
    "mousedown",
    "keydown",
    "touchstart",
    "scroll",
    "click"
  ];


  events.forEach(function(event){

    document.addEventListener(
      event,
      resetInactivity,
      {passive:true}
    );

  });


  resetInactivity();

}


function resetInactivity(){

  clearTimeout(inactivityTimer);


  inactivityTimer =
    setTimeout(function(){

      showToast(
        "Session expired due to inactivity.",
        "warning"
      );

      setTimeout(
        logout,
        1000
      );

    },5 * 60 * 1000);

}


/* ============================================================
   BACK BUTTON PROTECTION
============================================================ */

history.pushState(null,"",location.href);

window.addEventListener(
  "popstate",
  function(){

    history.pushState(
      null,
      "",
      location.href
    );

  }
);


/* ============================================================
   ESC KEY
============================================================ */

document.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Escape"){

      document
        .querySelectorAll(".modal.show")
        .forEach(function(modal){
          modal.classList.remove("show");
        });

      closeProfileMenu();

    }

  }
);

</script>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Login</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

:root{
  --green:#087f5b;
  --green-dark:#066b4d;
  --bg:#f3f7f5;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#e5e7eb;
  --danger:#dc2626;
  --shadow:rgba(0,0,0,.15);
}

body{

  min-height:100vh;

  display:flex;

  justify-content:center;

  align-items:center;

  padding:20px;

  background:
    linear-gradient(
      135deg,
      #f0fdf4,
      #f8fafc
    );

  color:var(--text);

}


/* =====================================================
LOGIN CARD
===================================================== */

.login-wrapper{

  width:100%;

  max-width:430px;

}


.login-card{

  width:100%;

  background:var(--card);

  border:1px solid var(--border);

  border-radius:18px;

  padding:35px;

  box-shadow:
    0 20px 60px var(--shadow);

}


.logo{

  width:70px;

  height:70px;

  margin:0 auto 18px;

  border-radius:18px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:var(--green);

  color:#fff;

  font-size:30px;

  font-weight:700;

  box-shadow:
    0 10px 25px rgba(8,127,91,.25);

}


.title{

  text-align:center;

  font-size:27px;

  font-weight:700;

  margin-bottom:7px;

}


.subtitle{

  text-align:center;

  color:var(--muted);

  font-size:14px;

  margin-bottom:30px;

}


/* =====================================================
FORM
===================================================== */

.form-group{

  margin-bottom:18px;

}


.form-group label{

  display:block;

  font-size:13px;

  font-weight:600;

  margin-bottom:8px;

}


.input-box{

  position:relative;

}


.input-box input{

  width:100%;

  height:50px;

  padding:0 14px;

  border:1px solid var(--border);

  border-radius:9px;

  outline:none;

  background:#fff;

  color:var(--text);

  font-size:14px;

  transition:.2s;

}


.input-box input:focus{

  border-color:var(--green);

  box-shadow:
    0 0 0 3px rgba(8,127,91,.08);

}


.password-input{

  padding-right:50px !important;

}


.show-password{

  position:absolute;

  right:10px;

  top:50%;

  transform:translateY(-50%);

  width:35px;

  height:35px;

  border-radius:7px;

  background:#f3f4f6;

  color:#374151;

  font-size:16px;

}


.show-password:hover{

  background:#e5e7eb;

}


/* =====================================================
LOGIN BUTTON
===================================================== */

.login-btn{

  width:100%;

  height:50px;

  margin-top:8px;

  border:none;

  border-radius:9px;

  background:var(--green);

  color:#fff;

  font-size:15px;

  font-weight:700;

  cursor:pointer;

  transition:.2s;

}


.login-btn:hover{

  background:var(--green-dark);

}


.login-btn:disabled{

  cursor:not-allowed;

  opacity:.6;

}


/* =====================================================
MESSAGE
===================================================== */

.message{

  display:none;

  margin-top:17px;

  padding:12px 14px;

  border-radius:8px;

  font-size:13px;

  line-height:1.5;

}


.message.show{

  display:block;

}


.message.error{

  background:#fee2e2;

  color:#b91c1c;

  border:1px solid #fecaca;

}


.message.success{

  background:#dcfce7;

  color:#15803d;

  border:1px solid #bbf7d0;

}


.footer{

  text-align:center;

  margin-top:25px;

  color:var(--muted);

  font-size:12px;

}


/* =====================================================
LOADING
===================================================== */

.loading-spinner{

  display:inline-block;

  width:16px;

  height:16px;

  border:2px solid rgba(255,255,255,.4);

  border-top-color:#fff;

  border-radius:50%;

  animation:spin .7s linear infinite;

  vertical-align:middle;

  margin-right:7px;

}


@keyframes spin{

  to{

    transform:rotate(360deg);

  }

}


/* =====================================================
MOBILE
===================================================== */

@media(max-width:500px){

  body{

    padding:15px;

  }


  .login-card{

    padding:28px 20px;

    border-radius:15px;

  }


  .title{

    font-size:23px;

  }


  .logo{

    width:62px;

    height:62px;

    font-size:26px;

  }

}

</style>

</head>


<body>


<div class="login-wrapper">

  <div class="login-card">


    <div class="logo">
      🔐
    </div>


    <h1 class="title">
      Welcome Back
    </h1>


    <p class="subtitle">
      Login to your Data Dashboard
    </p>


    <!-- =================================================
    LOGIN FORM
    ================================================= -->

    <form
      id="loginForm"
      onsubmit="loginUser(event)"
    >


      <div class="form-group">

        <label>
          Username
        </label>

        <div class="input-box">

          <input
            type="text"
            id="username"
            placeholder="Enter username"
            autocomplete="username"
            required
          >

        </div>

      </div>


      <div class="form-group">

        <label>
          Password
        </label>

        <div class="input-box">

          <input
            type="password"
            id="password"
            class="password-input"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showPasswordBtn"
            onclick="togglePassword()"
          >
            👁
          </button>

        </div>

      </div>


      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >
        Login
      </button>


      <div
        class="message"
        id="message"
      ></div>


    </form>


    <div class="footer">

      Data Dashboard System

    </div>


  </div>

</div>


<script>

/* =====================================================
API
===================================================== */

const USER_API_URL =
"https://script.google.com/macros/s/AKfycby1wEKzuThOiXdf9lVmoJVysfasR14ivssXFjGFfDnnc-d16uQRjNhel5LKNXDK4ZbxDw/exec";


const DASHBOARD_PAGE =
"dashboard.html";


/* =====================================================
PASSWORD SHOW / HIDE
===================================================== */

function togglePassword(){

  const password =
    document.getElementById(
      "password"
    );

  const button =
    document.getElementById(
      "showPasswordBtn"
    );


  if(password.type === "password"){

    password.type = "text";

    button.textContent = "🙈";

  }else{

    password.type = "password";

    button.textContent = "👁";

  }

}


/* =====================================================
MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message show " +
    (type || "error");

}


/* =====================================================
CLEAR MESSAGE
===================================================== */

function clearMessage(){

  const message =
    document.getElementById(
      "message"
    );

  message.className =
    "message";

  message.textContent =
    "";

}


/* =====================================================
LOGIN
===================================================== */

async function loginUser(event){

  event.preventDefault();


  clearMessage();


  const username =
    document.getElementById(
      "username"
    )
    .value
    .trim();


  const password =
    document.getElementById(
      "password"
    )
    .value
    .trim();


  if(!username){

    showMessage(
      "Please enter username.",
      "error"
    );

    return;

  }


  if(!password){

    showMessage(
      "Please enter password.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById(
      "loginBtn"
    );


  button.disabled = true;

  button.innerHTML =
    `
      <span class="loading-spinner"></span>
      Checking...
    `;


  try{


    /*
      First GET request
    */

    let response =
      await fetch(
        USER_API_URL +
        "?action=login" +
        "&username=" +
        encodeURIComponent(username) +
        "&password=" +
        encodeURIComponent(password) +
        "&_=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    let result =
      await response.json();


    /*
      যদি backend login action support করে
    */

    if(
      result &&
      (
        result.success === true ||
        result.success === false
      )
    ){

      if(result.success !== true){

        throw new Error(
          result.message ||
          "Invalid username or password."
        );

      }

    }else{

      /*
        কিছু backend অন্য format দিলে
        users list থেকে check করার চেষ্টা
      */

      result =
        await checkFromUsers(
          username,
          password
        );

    }


    /*
      User data
    */

    const user =
      result.user ||
      result.data ||
      result;


    /*
      Status check
    */

    const status =
      String(
        user.status ||
        user.Status ||
        "Active"
      )
      .trim()
      .toLowerCase();


    if(
      status === "blocked"
    ){

      throw new Error(
        "Your account is blocked."
      );

    }


    if(
      status === "inactive"
    ){

      throw new Error(
        "Your account is inactive."
      );

    }


    /*
      Save login information
    */

    localStorage.setItem(
      "username",
      username
    );


    localStorage.setItem(
      "Username",
      username
    );


    localStorage.setItem(
      "dashboardAuth",
      "true"
    );


    localStorage.setItem(
      "loggedIn",
      "true"
    );


    localStorage.setItem(
      "loginData",
      JSON.stringify({
        username:
          username,

        Username:
          username,

        name:
          user.name ||
          user.Name ||
          username,

        role:
          user.role ||
          user.Role ||
          "",

        status:
          user.status ||
          user.Status ||
          "Active"
      })
    );


    /*
      Success
    */

    showMessage(
      "Login successful. Opening dashboard...",
      "success"
    );


    /*
      একটু delay দিলে message দেখা যাবে
    */

    setTimeout(
      function(){

        window.location.href =
          DASHBOARD_PAGE;

      },
      400
    );


  }catch(error){

    console.error(
      "Login Error:",
      error
    );


    showMessage(
      error.message ||
      "Login failed. Please try again.",
      "error"
    );


  }finally{

    button.disabled = false;

    button.textContent =
      "Login";

  }

}


/* =====================================================
FALLBACK USER CHECK
===================================================== */

async function checkFromUsers(
  username,
  password
){

  const response =
    await fetch(
      USER_API_URL +
      "?action=getUsers&_=" +
      Date.now(),
      {
        method:"GET",
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      "Unable to connect to server."
    );

  }


  const result =
    await response.json();


  const users =
    Array.isArray(
      result.users
    )
      ? result.users
      : Array.isArray(
          result.data
        )
        ? result.data
        : [];


  const found =
    users.find(
      function(user){

        const u =
          String(
            user.username ||
            user.Username ||
            ""
          )
          .trim()
          .toLowerCase();


        const p =
          String(
            user.password ||
            user.Password ||
            ""
          )
          .trim();


        return (
          u ===
          username
            .trim()
            .toLowerCase()
          &&
          p === password
        );

      }
    );


  if(!found){

    throw new Error(
      "Invalid username or password."
    );

  }


  return {
    success:true,
    user:found
  };

}


/* =====================================================
ENTER KEY
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      const active =
        document.activeElement;


      if(
        active &&
        (
          active.id === "username" ||
          active.id === "password"
        )
      ){

        const form =
          document.getElementById(
            "loginForm"
          );


        if(form){

          /*
            Browser-এর normal form submit
            handle করবে।
          */

        }

      }

    }

  }
);


/* =====================================================
PAGE LOAD
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    document
      .getElementById("username")
      .focus();

  }
);

</script>

</body>

</html>

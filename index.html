<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hello - Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(0, 255, 140, 0.12), transparent 35%),
        radial-gradient(circle at bottom right, rgba(255, 0, 60, 0.10), transparent 35%),
        #080b0f;

      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(18, 22, 28, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 35px 30px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.55);
      backdrop-filter: blur(15px);
      animation: show 0.7s ease;
    }

    @keyframes show {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hello {
      text-align: center;
      margin-bottom: 30px;
    }

    .hello-icon {
      width: 75px;
      height: 75px;
      margin: auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;

      background: linear-gradient(135deg, #00d084, #00a86b);
      box-shadow: 0 0 35px rgba(0,208,132,0.25);
    }

    .hello h1 {
      margin-top: 18px;
      font-size: 30px;
      font-weight: 700;
    }

    .hello p {
      color: #8f98a5;
      margin-top: 8px;
      font-size: 14px;
    }

    .input-box {
      margin-bottom: 18px;
    }

    .input-box label {
      display: block;
      font-size: 13px;
      color: #aeb6c2;
      margin-bottom: 8px;
    }

    .input-box input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid #252c35;
      background: #0d1116;
      color: white;
      outline: none;
      font-size: 15px;
      transition: 0.25s;
    }

    .input-box input:focus {
      border-color: #00d084;
      box-shadow: 0 0 0 3px rgba(0,208,132,0.08);
    }

    .login-btn {
      width: 100%;
      height: 53px;
      border: none;
      border-radius: 12px;
      margin-top: 5px;

      background: linear-gradient(135deg, #00d084, #00a86b);
      color: #06110c;

      font-size: 16px;
      font-weight: 700;
      cursor: pointer;

      transition: 0.25s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0,208,132,0.25);
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .location {
      margin-top: 25px;
      padding: 13px 15px;
      border-radius: 12px;
      background: #0d1116;
      border: 1px solid #202731;

      display: flex;
      align-items: center;
      gap: 10px;
    }

    .location-icon {
      font-size: 20px;
    }

    .location-text {
      flex: 1;
      min-width: 0;
    }

    .location-title {
      font-size: 11px;
      color: #7e8794;
      margin-bottom: 3px;
    }

    #location {
      font-size: 13px;
      color: #d7dde5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 12px;
      color: #626b77;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      display: none;
    }

    .success {
      color: #00d084;
    }

    .error {
      color: #ff4d67;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 22px;
        border-radius: 20px;
      }

      .hello h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="hello">

      <div class="hello-icon">
        👋
      </div>

      <h1>Hello!</h1>

      <p>Welcome back. Please login to continue.</p>

    </div>


    <div class="input-box">

      <label>Username</label>

      <input
        type="text"
        id="username"
        placeholder="Enter your username"
        autocomplete="username"
      >

    </div>


    <div class="input-box">

      <label>Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
      >

    </div>


    <button class="login-btn" onclick="login()">
      Login
    </button>


    <div id="message" class="message"></div>


    <div class="location">

      <div class="location-icon">
        📍
      </div>

      <div class="location-text">

        <div class="location-title">
          YOUR LOCATION
        </div>

        <div id="location">
          Detecting location...
        </div>

      </div>

    </div>


    <div class="footer">
      Secure Login • Welcome Back
    </div>

  </div>


  <script>

    // ================================
    // LOCATION
    // ================================

    const locationText = document.getElementById("location");

    if (navigator.geolocation) {

      navigator.geolocation.getCurrentPosition(

        function(position) {

          const lat = position.coords.latitude.toFixed(4);
          const lon = position.coords.longitude.toFixed(4);

          locationText.innerHTML =
            `Latitude: ${lat}, Longitude: ${lon}`;

        },

        function() {

          locationText.innerHTML =
            "Location permission denied";

        }

      );

    } else {

      locationText.innerHTML =
        "Location not supported";

    }


    // ================================
    // LOGIN
    // ================================

    function login() {

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value.trim();

      const message =
        document.getElementById("message");


      if (!username || !password) {

        message.style.display = "block";
        message.className = "message error";
        message.innerHTML =
          "Please enter username and password.";

        return;
      }


      // Demo login
      // পরে Google Sheet / Apps Script
      // login system এখানে connect করা যাবে।

      message.style.display = "block";
      message.className = "message success";
      message.innerHTML =
        "Login button working!";

    }


    // Enter key login

    document.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        login();
      }

    });

  </script>

</body>
</html>

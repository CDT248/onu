
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#4f46e5,#7c3aed,#06b6d4);
}

/* Login Box */
.login{
  width:360px;
  padding:35px;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.3);
  border-radius:20px;
  backdrop-filter:blur(15px);
  box-shadow:0 20px 50px rgba(0,0,0,.25);
  color:white;
}

/* Logo */
.logo{
  width:65px;
  height:65px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:18px;
  background:white;
  color:#4f46e5;
  font-size:30px;
  box-shadow:0 8px 20px rgba(0,0,0,.2);
}

h2{
  text-align:center;
  margin:18px 0 7px;
  font-size:28px;
}

.subtitle{
  text-align:center;
  font-size:13px;
  opacity:.8;
  margin-bottom:25px;
}

/* Input */
.input{
  margin-bottom:16px;
}

.input label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
}

.input-box{
  position:relative;
}

input{
  width:100%;
  padding:13px 42px 13px 14px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:10px;
  outline:none;
  background:rgba(255,255,255,.15);
  color:white;
  font-size:14px;
}

input::placeholder{
  color:rgba(255,255,255,.6);
}

input:focus{
  border-color:white;
  background:rgba(255,255,255,.22);
}

/* Password Eye */
.eye{
  position:absolute;
  right:13px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
}

/* Button */
button{
  width:100%;
  padding:13px;
  margin-top:8px;
  border:0;
  border-radius:10px;
  background:white;
  color:#4f46e5;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.footer{
  text-align:center;
  margin-top:20px;
  font-size:12px;
  opacity:.65;
}
</style>
</head>

<body>

<div class="login">

  <div class="logo">🔐</div>

  <h2>Welcome Back</h2>

  <div class="subtitle">
    Login to access your dashboard
  </div>

  <div class="input">
    <label>Username</label>
    <input
      type="text"
      id="username"
      placeholder="Enter username"
    >
  </div>

  <div class="input">
    <label>Password</label>

    <div class="input-box">

      <input
        type="password"
        id="password"
        placeholder="Enter password"
      >

      <span class="eye" onclick="showPassword()">👁</span>

    </div>
  </div>

  <button onclick="login()">Login</button>

  <div class="footer">
    © 2026 Dashboard
  </div>

</div>

<script>

function showPassword(){

  let p = document.getElementById("password");

  p.type = p.type === "password"
    ? "text"
    : "password";

}

function login(){

  let user =
    document.getElementById("username").value;

  let pass =
    document.getElementById("password").value;

  if(user === "admin" && pass === "1234"){

    window.location.href = "ad.html";

  }else{

    alert("Wrong username or password");

  }

}

</script>

</body>
</html>

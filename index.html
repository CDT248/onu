<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Login</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

:root{
  --black:#050505;
  --black2:#0b0b0b;
  --card:#111111;
  --card2:#151515;
  --border:#292929;
  --text:#ffffff;
  --muted:#999999;
  --green:#00c853;
  --green2:#00a844;
  --red:#ff3b30;
  --shadow:rgba(0,0,0,.65);
}

html,
body{
  width:100%;
  min-height:100%;
}

body{

  min-height:100vh;

  background:
    radial-gradient(
      circle at top left,
      rgba(0,200,83,.10),
      transparent 30%
    ),
    radial-gradient(
      circle at bottom right,
      rgba(0,200,83,.07),
      transparent 30%
    ),
    #050505;

  color:var(--text);

  display:flex;
  justify-content:center;
  align-items:center;

  padding:20px;

}


/* =====================================================
LOGIN WRAPPER
===================================================== */

.login-wrapper{

  width:100%;
  max-width:430px;

}


/* =====================================================
BRAND
===================================================== */

.brand{

  text-align:center;

  margin-bottom:25px;

}

.brand-icon{

  width:65px;
  height:65px;

  margin:0 auto 15px;

  border-radius:18px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      145deg,
      #00c853,
      #008f3b
    );

  color:#fff;

  font-size:30px;
  font-weight:800;

  box-shadow:
    0 12px 35px
    rgba(0,200,83,.22);

}

.brand h1{

  font-size:26px;

  font-weight:700;

  letter-spacing:.3px;

}

.brand p{

  margin-top:7px;

  color:var(--muted);

  font-size:13px;

}


/* =====================================================
LOGIN CARD
===================================================== */

.login-card{

  width:100%;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.015)
    );

  border:1px solid var(--border);

  border-radius:20px;

  padding:30px;

  box-shadow:
    0 25px 70px
    var(--shadow);

  backdrop-filter:blur(15px);

}


/* =====================================================
FIELD
===================================================== */

.field{

  margin-bottom:19px;

}

.field label{

  display:block;

  margin-bottom:8px;

  font-size:13px;

  font-weight:600;

  color:#d6d6d6;

}

.input-box{

  position:relative;

}

.input-box .icon{

  position:absolute;

  left:14px;
  top:50%;

  transform:translateY(-50%);

  color:#777;

  font-size:16px;

  pointer-events:none;

}

.input-box input{

  width:100%;

  height:50px;

  padding:
    0 45px
    0 43px;

  border:1px solid var(--border);

  border-radius:10px;

  outline:none;

  background:#0b0b0b;

  color:#fff;

  font-size:14px;

  transition:.2s;

}

.input-box input::placeholder{

  color:#626262;

}

.input-box input:focus{

  border-color:var(--green);

  box-shadow:
    0 0 0 3px
    rgba(0,200,83,.08);

}

.password-toggle{

  position:absolute;

  right:8px;
  top:50%;

  transform:translateY(-50%);

  width:36px;
  height:36px;

  border:none;

  border-radius:8px;

  background:transparent;

  color:#888;

  cursor:pointer;

  font-size:15px;

}

.password-toggle:hover{

  color:#fff;

  background:#181818;

}


/* =====================================================
DEVICE
===================================================== */

.device-box{

  width:100%;

  min-height:50px;

  display:flex;

  align-items:center;

  gap:12px;

  padding:10px 13px;

  border:1px solid var(--border);

  border-radius:10px;

  background:#0b0b0b;

}

.device-icon{

  width:32px;
  height:32px;

  border-radius:8px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#191919;

  font-size:16px;

}

.device-info{

  min-width:0;

}

.device-name{

  color:#fff;

  font-size:13px;

  font-weight:600;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

}

.device-browser{

  margin-top:3px;

  color:#777;

  font-size:11px;

}


/* =====================================================
LOGIN BUTTON
===================================================== */

.login-btn{

  width:100%;

  height:50px;

  margin-top:5px;

  border:none;

  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      var(--green),
      var(--green2)
    );

  color:#fff;

  font-size:14px;

  font-weight:700;

  cursor:pointer;

  transition:.2s;

  box-shadow:
    0 8px 25px
    rgba(0,200,83,.15);

}

.login-btn:hover{

  transform:translateY(-1px);

  box-shadow:
    0 12px 30px
    rgba(0,200,83,.23);

}

.login-btn:active{

  transform:translateY(0);

}

.login-btn:disabled{

  opacity:.6;

  cursor:not-allowed;

  transform:none;

}


/* =====================================================
MESSAGE
===================================================== */

.message{

  display:none;

  margin-bottom:18px;

  padding:12px 13px;

  border-radius:9px;

  font-size:13px;

  line-height:1.4;

}

.message.show{

  display:block;

}

.message.error{

  background:
    rgba(255,59,48,.10);

  border:1px solid
    rgba(255,59,48,.25);

  color:#ff817a;

}

.message.success{

  background:
    rgba(0,200,83,.10);

  border:1px solid
    rgba(0,200,83,.25);

  color:#53e88b;

}


/* =====================================================
FOOTER
===================================================== */

.login-footer{

  text-align:center;

  margin-top:20px;

  color:#666;

  font-size:11px;

}


/* =====================================================
LOADING
===================================================== */

.spinner{

  display:inline-block;

  width:15px;
  height:15px;

  margin-right:7px;

  border:
    2px solid
    rgba(255,255,255,.3);

  border-top-color:#fff;

  border-radius:50%;

  vertical-align:-3px;

  animation:
    spin .7s linear infinite;

}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =====================================================
MOBILE
===================================================== */

@media(max-width:500px){

  body{

    padding:15px;

  }

  .login-card{

    padding:23px 18px;

    border-radius:16px;

  }

  .brand{

    margin-bottom:20px;

  }

  .brand-icon{

    width:58px;
    height:58px;

    font-size:26px;

  }

  .brand h1{

    font-size:23px;

  }

}

</style>

</head>


<body>


<div class="login-wrapper">


  <!-- BRAND -->

  <div class="brand">

    <div class="brand-icon">
      🔐
    </div>

    <h1>
      Data Dashboard
    </h1>

    <p>
      Sign in to continue
    </p>

  </div>


  <!-- LOGIN CARD -->

  <div class="login-card">


    <!-- MESSAGE -->

    <div
      class="message"
      id="message"
    ></div>


    <!-- FORM -->

    <form
      id="loginForm"
      onsubmit="login(event)"
    >


      <!-- USERNAME -->

      <div class="field">

        <label>
          Username
        </label>

        <div class="input-box">

          <span class="icon">
            👤
          </span>

          <input
            type="text"
            id="username"
            placeholder="Enter username"
            autocomplete="username"
            required
          >

        </div>

      </div>


      <!-- PASSWORD -->

      <div class="field">

        <label>
          Password
        </label>

        <div class="input-box">

          <span class="icon">
            🔒
          </span>

          <input
            type="password"
            id="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="password-toggle"
            onclick="togglePassword()"
            id="passwordToggle"
          >
            👁
          </button>

        </div>

      </div>


      <!-- DEVICE -->

      <div class="field">

        <label>
          Current Device
        </label>

        <div class="device-box">

          <div
            class="device-icon"
            id="deviceIcon"
          >
            💻
          </div>

          <div class="device-info">

            <div
              class="device-name"
              id="deviceName"
            >
              Detecting device...
            </div>

            <div
              class="device-browser"
              id="deviceBrowser"
            >
              Detecting browser...
            </div>

          </div>

        </div>

      </div>


      <!-- LOGIN -->

      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >
        Login
      </button>


    </form>


  </div>


  <div class="login-footer">

    Secure Dashboard Login

  </div>


</div>


<script>

/* =====================================================
API
===================================================== */

/*
  তোমার User Management / Login Apps Script URL
*/

const USER_API_URL =
"https://script.google.com/macros/s/AKfycby1wEKzuThOiXdf9lVmoJVysfasR14ivssXFjGFfDnnc-d16uQRjNhel5LKNXDK4ZbxDw/exec";


/* =====================================================
PAGE
===================================================== */

const ADMIN_PAGE =
"ad.html";

const SUPPORT_PAGE =
"2S.html";

const CALL_PAGE =
"2S.html";


/* =====================================================
DEVICE DETECTION
===================================================== */

function getDeviceInfo(){

  const ua =
    navigator.userAgent || "";

  let device =
    "Unknown Device";

  let icon =
    "💻";


  /*
    Android
  */

  if(/Android/i.test(ua)){

    device =
      "Android Phone";

    icon =
      "📱";

  }


  /*
    iPhone
  */

  else if(/iPhone/i.test(ua)){

    device =
      "iPhone";

    icon =
      "📱";

  }


  /*
    iPad
  */

  else if(/iPad/i.test(ua)){

    device =
      "iPad";

    icon =
      "📱";

  }


  /*
    Mac
  */

  else if(/Macintosh|Mac OS X/i.test(ua)){

    device =
      "Mac";

    icon =
      "💻";

  }


  /*
    Windows
  */

  else if(/Windows/i.test(ua)){

    device =
      "Windows PC";

    icon =
      "💻";

  }


  /*
    Linux
  */

  else if(/Linux/i.test(ua)){

    device =
      "Linux PC";

    icon =
      "💻";

  }


  /*
    Browser
  */

  let browser =
    "Unknown Browser";


  if(
    /Edg\//i.test(ua)
  ){

    browser =
      "Microsoft Edge";

  }

  else if(
    /OPR\//i.test(ua)
  ){

    browser =
      "Opera";

  }

  else if(
    /Chrome\//i.test(ua)
    &&
    !/Edg\//i.test(ua)
  ){

    browser =
      "Google Chrome";

  }

  else if(
    /Firefox\//i.test(ua)
  ){

    browser =
      "Mozilla Firefox";

  }

  else if(
    /Safari\//i.test(ua)
    &&
    !/Chrome\//i.test(ua)
  ){

    browser =
      "Safari";

  }


  return {

    device,
    browser,
    icon,

    full:
      device +
      " • " +
      browser

  };

}


/* =====================================================
SHOW DEVICE
===================================================== */

function showDevice(){

  const info =
    getDeviceInfo();


  document.getElementById(
    "deviceIcon"
  ).textContent =
    info.icon;


  document.getElementById(
    "deviceName"
  ).textContent =
    info.device;


  document.getElementById(
    "deviceBrowser"
  ).textContent =
    info.browser;

}


/* =====================================================
PASSWORD TOGGLE
===================================================== */

function togglePassword(){

  const input =
    document.getElementById(
      "password"
    );

  const button =
    document.getElementById(
      "passwordToggle"
    );


  if(
    input.type === "password"
  ){

    input.type =
      "text";

    button.textContent =
      "🙈";

  }

  else{

    input.type =
      "password";

    button.textContent =
      "👁";

  }

}


/* =====================================================
MESSAGE
===================================================== */

function showMessage(
  text,
  type
){

  const box =
    document.getElementById(
      "message"
    );


  box.textContent =
    text;


  box.className =
    "message show " +
    type;

}


function hideMessage(){

  const box =
    document.getElementById(
      "message"
    );


  box.className =
    "message";

  box.textContent =
    "";

}


/* =====================================================
LOGIN
===================================================== */

async function login(event){

  event.preventDefault();


  hideMessage();


  const username =
    document.getElementById(
      "username"
    ).value.trim();


  const password =
    document.getElementById(
      "password"
    ).value.trim();


  if(!username){

    showMessage(
      "Please enter username.",
      "error"
    );

    return;

  }


  if(!password){

    showMessage(
      "Please enter password.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById(
      "loginBtn"
    );


  button.disabled =
    true;

  button.innerHTML =
    '<span class="spinner"></span>Logging in...';


  try{


    /*
      Login API
    */

    const url =
      USER_API_URL +
      "?action=login" +
      "&username=" +
      encodeURIComponent(username) +
      "&password=" +
      encodeURIComponent(password) +
      "&device=" +
      encodeURIComponent(
        getDeviceInfo().full
      ) +
      "&_=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "Login response:",
      result
    );


    if(
      result.success === false
    ){

      throw new Error(
        result.message ||
        "Invalid username or password."
      );

    }


    /*
      বিভিন্ন Apps Script response format
      support করার জন্য
    */

    const user =
      result.user ||
      result.data ||
      result;


    const loggedUsername =
      user.username ||
      user.Username ||
      result.username ||
      result.Username ||
      username;


    const role =
      String(
        user.role ||
        user.Role ||
        result.role ||
        result.Role ||
        ""
      )
      .trim()
      .toLowerCase();


    const status =
      String(
        user.status ||
        user.Status ||
        result.status ||
        result.Status ||
        "Active"
      )
      .trim()
      .toLowerCase();


    /*
      যদি API success দেয় কিন্তু role না দেয়
    */

    if(!role){

      throw new Error(
        "Login successful, but user role was not received."
      );

    }


    /*
      Blocked / inactive user
    */

    if(
      status === "blocked" ||
      status === "inactive"
    ){

      throw new Error(
        "Your account is " +
        status +
        ". Please contact administrator."
      );

    }


    /*
      Session save
    */

    localStorage.setItem(
      "dashboardAuth",
      "true"
    );


    localStorage.setItem(
      "username",
      String(loggedUsername)
    );


    localStorage.setItem(
      "role",
      role
    );


    /*
      Additional compatibility keys
    */

    localStorage.setItem(
      "Username",
      String(loggedUsername)
    );


    localStorage.setItem(
      "loggedIn",
      "true"
    );


    localStorage.setItem(
      "loginData",
      JSON.stringify({

        username:
          String(loggedUsername),

        role:
          role,

        status:
          status,

        device:
          getDeviceInfo().full,

        loginTime:
          new Date().toISOString()

      })
    );


    /*
      Success message
    */

    showMessage(
      "Login successful. Opening dashboard...",
      "success"
    );


    /*
      Role অনুযায়ী redirect
    */

    setTimeout(
      function(){

        redirectByRole(
          role
        );

      },
      300
    );


  }catch(error){

    console.error(
      "Login error:",
      error
    );


    /*
      Login failed হলে session clear
    */

    localStorage.removeItem(
      "dashboardAuth"
    );

    localStorage.removeItem(
      "loggedIn"
    );

    localStorage.removeItem(
      "role"
    );


    showMessage(
      error.message ||
      "Login failed. Please try again.",
      "error"
    );


    button.disabled =
      false;

    button.textContent =
      "Login";

  }

}


/* =====================================================
ROLE REDIRECT
===================================================== */

function redirectByRole(role){

  role =
    String(role || "")
      .trim()
      .toLowerCase();


  let page =
    "";


  /*
    ADMIN
  */

  if(
    role === "admin"
  ){

    page =
      ADMIN_PAGE;

  }


  /*
    SUPPORT
  */

  else if(
    role === "support"
  ){

    page =
      SUPPORT_PAGE;

  }


  /*
    CALL
  */

  else if(
    role === "call"
  ){

    page =
      CALL_PAGE;

  }


  /*
    MANAGER
    আপাতত access বন্ধ
  */

  else if(
    role === "manager"
  ){

    showMessage(
      "Manager dashboard is not configured.",
      "error"
    );

    return;

  }


  /*
    GUEST
  */

  else if(
    role === "guest"
  ){

    showMessage(
      "Guest dashboard is not configured.",
      "error"
    );

    return;

  }


  else{

    showMessage(
      "Your account role is not allowed.",
      "error"
    );

    return;

  }


  /*
    Dashboard-এ যাও
  */

  window.location.replace(
    page
  );

}


/* =====================================================
ALREADY LOGGED IN
===================================================== */

function checkExistingLogin(){

  const auth =
    localStorage.getItem(
      "dashboardAuth"
    );


  const role =
    localStorage.getItem(
      "role"
    );


  /*
    আগে থেকেই login থাকলে
    আবার index-এ থাকার দরকার নেই।
  */

  if(
    auth === "true" &&
    role
  ){

    /*
      automatic redirect বন্ধ রাখতে চাইলে
      এই অংশ remove করতে পারো।
    */

    redirectByRole(
      role
    );

  }

}


/* =====================================================
INIT
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    showDevice();

    /*
      এখানে automatic redirect রাখা হয়েছে।
      যদি login page সবসময় দেখতে চাও,
      তাহলে নিচের line comment করে দিও।
    */

    checkExistingLogin();

  }
);


/* =====================================================
ENTER KEY
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      const active =
        document.activeElement;


      if(
        active &&
        (
          active.id === "username" ||
          active.id === "password"
        )
      ){

        document
          .getElementById(
            "loginForm"
          )
          .requestSubmit();

      }

    }

  }
);


/* =====================================================
PREVENT BACK TO DASHBOARD
===================================================== */

window.addEventListener(
  "pageshow",
  function(){

    /*
      Page যদি browser cache থেকে আসে,
      এবং session না থাকে তাহলে login page-তেই থাকবে।
    */

    if(
      localStorage.getItem(
        "dashboardAuth"
      ) !== "true"
    ){

      return;

    }

  }
);

</script>

</body>

</html>

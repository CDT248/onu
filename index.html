<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Login to Dashboard</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f4f7fb;
}

.login{
  width:520px;
  padding:55px 70px;
  background:white;
  border:1px solid #ddd;
  border-radius:16px;
  box-shadow:0 15px 40px rgba(0,0,0,.08);
}

h1{
  text-align:center;
  font-size:32px;
  color:#171717;
  margin-bottom:45px;
}

.input{
  display:flex;
  height:58px;
  border:2px solid #e3e5e8;
  border-radius:10px;
  margin-bottom:20px;
  overflow:hidden;
}

.icon{
  width:62px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
  color:#888;
  border-right:2px solid #e5e5e5;
}

.input input{
  flex:1;
  border:0;
  outline:0;
  padding:0 20px;
  font-size:18px;
  color:#333;
}

.input input::placeholder{
  color:#999;
  font-style:italic;
}

.options{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:28px 0;
  font-size:16px;
}

.remember{
  color:#777;
}

.remember input{
  width:18px;
  height:18px;
  vertical-align:middle;
  margin-right:7px;
}

.forgot{
  color:#1761a8;
  text-decoration:none;
}

.forgot:hover{
  text-decoration:underline;
}

button{
  display:block;
  width:210px;
  height:65px;
  margin:0 auto 35px;
  border:0;
  border-radius:18px;
  background:linear-gradient(#1765b4,#124d87);
  color:white;
  font-size:27px;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(20,80,140,.25);
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 22px rgba(20,80,140,.3);
}

.continue{
  display:flex;
  align-items:center;
  gap:15px;
  color:#999;
  font-size:17px;
  margin-bottom:25px;
}

.line{
  flex:1;
  height:1px;
  background:#aaa;
}

.social{
  display:flex;
  justify-content:center;
  gap:45px;
}

.social div{
  width:65px;
  height:65px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#1765b4;
  color:white;
  font-size:28px;
}

@media(max-width:600px){

  .login{
    width:92%;
    padding:40px 25px;
  }

  h1{
    font-size:27px;
    margin-bottom:35px;
  }

  button{
    width:190px;
  }

  .options{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="login">

  <h1>Log in to Dashboard</h1>

  <div class="input">
    <div class="icon">✉</div>
    <input
      type="text"
      id="username"
      placeholder="Username"
    >
  </div>

  <div class="input">
    <div class="icon">🔒</div>
    <input
      type="password"
      id="password"
      placeholder="Password"
    >
  </div>

  <div class="options">

    <label class="remember">
      <input type="checkbox">
      Remember me
    </label>

    <a href="#" class="forgot">
      Forgot Password?
    </a>

  </div>

  <button onclick="login()">
    Login
  </button>

  <div class="continue">
    <div class="line"></div>
    <span>Continue with</span>
    <div class="line"></div>
  </div>

  <div class="social">
    <div>✉</div>
    <div>▣</div>
    <div>👤</div>
  </div>

</div>

<script>
function login(){

  let username =
    document.getElementById("username").value;

  let password =
    document.getElementById("password").value;

  if(username=="admin" && password=="1234"){
    window.location.href="ad.html";
  }else{
    alert("Wrong username or password");
  }

}
</script>

</body>
</html>

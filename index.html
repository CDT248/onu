<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at top left,
          rgba(0, 255, 140, 0.12),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(255, 0, 60, 0.10),
          transparent 35%
        ),
        #070a0e;

      color: white;
    }

    .login-card {
      width: 100%;
      max-width: 420px;

      padding: 35px 30px;

      background: rgba(18, 22, 28, 0.96);

      border: 1px solid rgba(255,255,255,0.08);

      border-radius: 24px;

      box-shadow:
        0 25px 70px rgba(0,0,0,0.60);

      backdrop-filter: blur(15px);

      animation: cardShow 0.7s ease;
    }

    @keyframes cardShow {

      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    .logo {
      width: 78px;
      height: 78px;

      margin: 0 auto 18px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 34px;

      background:
        linear-gradient(
          135deg,
          #00d084,
          #00a86b
        );

      box-shadow:
        0 0 40px rgba(0,208,132,0.25);
    }

    .title {
      text-align: center;
    }

    .title h1 {
      font-size: 30px;
      font-weight: 700;

      margin-bottom: 8px;
    }

    .title p {
      color: #8e97a4;

      font-size: 14px;

      margin-bottom: 30px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;

      margin-bottom: 8px;

      color: #aeb6c2;

      font-size: 13px;
    }

    .input-group input {
      width: 100%;
      height: 53px;

      padding: 0 16px;

      border-radius: 12px;

      border: 1px solid #252c35;

      background: #0c1015;

      color: white;

      outline: none;

      font-size: 15px;

      transition: 0.25s;
    }

    .input-group input::placeholder {
      color: #555e69;
    }

    .input-group input:focus {
      border-color: #00d084;

      box-shadow:
        0 0 0 3px rgba(0,208,132,0.08);
    }

    .login-btn {
      width: 100%;
      height: 54px;

      margin-top: 5px;

      border: none;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #00d084,
          #00a86b
        );

      color: #04100a;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.25s;
    }

    .login-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 10px 30px rgba(0,208,132,0.25);
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .login-btn:disabled {
      opacity: 0.6;

      cursor: not-allowed;

      transform: none;

      box-shadow: none;
    }

    #message {
      display: none;

      text-align: center;

      margin-top: 16px;

      padding: 11px;

      border-radius: 10px;

      font-size: 13px;
    }

    #message.error {
      display: block;

      color: #ff667d;

      background:
        rgba(255,60,85,0.08);

      border:
        1px solid rgba(255,60,85,0.15);
    }

    #message.success {
      display: block;

      color: #00d084;

      background:
        rgba(0,208,132,0.08);

      border:
        1px solid rgba(0,208,132,0.15);
    }

    .phone-box {
      margin-top: 25px;

      padding: 15px;

      border-radius: 13px;

      background: #0c1015;

      border: 1px solid #202731;

      display: flex;

      align-items: center;

      gap: 12px;
    }

    .phone-icon {
      width: 42px;
      height: 42px;

      border-radius: 10px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        rgba(0,208,132,0.08);

      font-size: 21px;

      flex-shrink: 0;
    }

    .phone-info {
      min-width: 0;
    }

    .phone-title {
      color: #707985;

      font-size: 10px;

      letter-spacing: 0.5px;

      margin-bottom: 4px;
    }

    #phoneName {
      color: #e2e7ed;

      font-size: 13px;

      font-weight: 600;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    #phoneDetails {
      color: #737d89;

      font-size: 11px;

      margin-top: 3px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .footer {
      text-align: center;

      margin-top: 22px;

      color: #5e6672;

      font-size: 11px;
    }

    @media(max-width:480px) {

      .login-card {
        padding: 30px 22px;

        border-radius: 20px;
      }

      .title h1 {
        font-size: 27px;
      }

    }

  </style>

</head>


<body>


  <div class="login-card">


    <div class="logo">
      👋
    </div>


    <div class="title">

      <h1>
        Hello!
      </h1>

      <p>
        Login to continue to your dashboard
      </p>

    </div>


    <!-- USERNAME -->

    <div class="input-group">

      <label>
        Username
      </label>

      <input
        type="text"
        id="username"
        placeholder="Enter username"
        autocomplete="username"
      >

    </div>


    <!-- PASSWORD -->

    <div class="input-group">

      <label>
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
      >

    </div>


    <!-- LOGIN BUTTON -->

    <button
      class="login-btn"
      id="loginBtn"
      onclick="login()">

      Login

    </button>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- DEVICE -->

    <div class="phone-box">

      <div class="phone-icon">
        📱
      </div>

      <div class="phone-info">

        <div class="phone-title">
          YOUR DEVICE
        </div>

        <div id="phoneName">
          Detecting device...
        </div>

        <div id="phoneDetails">
          Please wait...
        </div>

      </div>

    </div>


    <div class="footer">
      Secure Login System
    </div>


  </div>



<script>


/* =====================================================
   GOOGLE APPS SCRIPT WEB APP URL
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycby1wEKzuThOiXdf9lVmoJVysfasR14ivssXFjGFfDnnc-d16uQRjNhel5LKNXDK4ZbxDw/exec";


/* =====================================================
   ROLE → DASHBOARD
===================================================== */

const ROLE_PAGES = {

  admin: "ad.html",

  support: "2S.html",

  call: "2S.html"

};


/* =====================================================
   SESSION KEY
===================================================== */

const SESSION_KEY = "LOGIN_SESSION";


/* =====================================================
   GET SESSION
===================================================== */

function getSession() {

  try {

    const session =
      localStorage.getItem(
        SESSION_KEY
      );

    if (!session) {
      return null;
    }

    const data =
      JSON.parse(session);

    if (
      !data ||
      data.loggedIn !== true
    ) {

      return null;

    }

    return data;

  }

  catch(error) {

    console.error(
      "Session read error:",
      error
    );

    return null;

  }

}


/* =====================================================
   SAVE SESSION
===================================================== */

function saveSession(data) {

  const session = {

    loggedIn: true,

    username:
      data.username || "",

    name:
      data.name || "",

    role:
      data.role || "",

    status:
      data.status || "Active",

    loginTime:
      Date.now(),

    lastActivity:
      Date.now()

  };


  localStorage.setItem(

    SESSION_KEY,

    JSON.stringify(session)

  );


  /*
    Compatibility values.
    Dashboard যদি এগুলো ব্যবহার করে,
    তাহলে সেগুলোও থাকবে।
  */

  localStorage.setItem(
    "loggedIn",
    "true"
  );

  localStorage.setItem(
    "username",
    session.username
  );

  localStorage.setItem(
    "name",
    session.name
  );

  localStorage.setItem(
    "role",
    session.role
  );

  localStorage.setItem(
    "status",
    session.status
  );

  localStorage.setItem(
    "loginTime",
    session.loginTime
  );

  localStorage.setItem(
    "lastActivity",
    session.lastActivity
  );

}


/* =====================================================
   CLEAR SESSION
===================================================== */

function clearSession() {

  localStorage.removeItem(
    SESSION_KEY
  );

  localStorage.removeItem(
    "loggedIn"
  );

  localStorage.removeItem(
    "username"
  );

  localStorage.removeItem(
    "name"
  );

  localStorage.removeItem(
    "role"
  );

  localStorage.removeItem(
    "status"
  );

  localStorage.removeItem(
    "loginTime"
  );

  localStorage.removeItem(
    "lastActivity"
  );

}


/* =====================================================
   INDEX PAGE SESSION CHECK
   IMPORTANT:
   এখানে login করার সময় redirect করা হবে না।
   শুধু আগে থেকে valid session থাকলে dashboard খুলবে।
===================================================== */

function checkExistingSession() {

  const session =
    getSession();


  if (
    !session ||
    session.loggedIn !== true
  ) {

    return;

  }


  const role =
    String(
      session.role || ""
    )
    .trim()
    .toLowerCase();


  if (
    !ROLE_PAGES[role]
  ) {

    clearSession();

    return;

  }


  /*
    যদি index page-এ valid login session
    আগে থেকেই থাকে, dashboard-এ পাঠাবে।
  */

  window.location.replace(
    ROLE_PAGES[role]
  );

}


/*
  Page load হওয়ার পরে check করবে।
*/

window.addEventListener(
  "DOMContentLoaded",
  function() {

    checkExistingSession();

  }
);


/* =====================================================
   DEVICE DETECTION
===================================================== */

function detectPhone() {

  const ua =
    navigator.userAgent;

  let device =
    "Unknown Device";

  let os =
    "Unknown OS";

  let browser =
    "Unknown Browser";


  /* DEVICE */

  if (/iPhone/i.test(ua)) {

    device =
      "Apple iPhone";

  }

  else if (/iPad/i.test(ua)) {

    device =
      "Apple iPad";

  }

  else if (/Samsung/i.test(ua)) {

    device =
      "Samsung Galaxy";

  }

  else if (
    /SM-[A-Z0-9-]+/i.test(ua)
  ) {

    device =
      "Samsung Galaxy";

  }

  else if (/Xiaomi/i.test(ua)) {

    device =
      "Xiaomi";

  }

  else if (/Redmi/i.test(ua)) {

    device =
      "Redmi";

  }

  else if (/Huawei/i.test(ua)) {

    device =
      "Huawei";

  }

  else if (/OPPO/i.test(ua)) {

    device =
      "OPPO";

  }

  else if (/vivo/i.test(ua)) {

    device =
      "Vivo";

  }

  else if (/realme/i.test(ua)) {

    device =
      "Realme";

  }

  else if (/OnePlus/i.test(ua)) {

    device =
      "OnePlus";

  }

  else if (/Android/i.test(ua)) {

    device =
      "Android Phone";

  }

  else if (/Windows/i.test(ua)) {

    device =
      "Windows PC";

  }

  else if (/Macintosh/i.test(ua)) {

    device =
      "Mac";

  }


  /* OS */

  if (
    /Windows NT 10/i.test(ua)
  ) {

    os =
      "Windows 10/11";

  }

  else if (/Android/i.test(ua)) {

    const match =
      ua.match(
        /Android\s([0-9.]+)/i
      );

    os =
      match
        ? "Android " + match[1]
        : "Android";

  }

  else if (
    /iPhone|iPad/i.test(ua)
  ) {

    const match =
      ua.match(
        /OS\s([0-9\_]+)/i
      );

    os =
      match
        ? "iOS " +
          match[1].replace(
            /\_/g,
            "."
          )
        : "iOS";

  }

  else if (/Mac OS X/i.test(ua)) {

    os =
      "macOS";

  }

  else if (/Linux/i.test(ua)) {

    os =
      "Linux";

  }


  /* BROWSER */

  if (/Edg/i.test(ua)) {

    browser =
      "Microsoft Edge";

  }

  else if (/Chrome/i.test(ua)) {

    browser =
      "Google Chrome";

  }

  else if (/Firefox/i.test(ua)) {

    browser =
      "Mozilla Firefox";

  }

  else if (
    /Safari/i.test(ua) &&
    !/Chrome/i.test(ua)
  ) {

    browser =
      "Safari";

  }


  document.getElementById(
    "phoneName"
  ).textContent =
    device;


  document.getElementById(
    "phoneDetails"
  ).textContent =
    os + " • " + browser;

}


detectPhone();


/* =====================================================
   LOGIN
===================================================== */

async function login() {


  const username =
    document
      .getElementById(
        "username"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "password"
      )
      .value
      .trim();


  const button =
    document.getElementById(
      "loginBtn"
    );


  /* VALIDATION */

  if (
    !username ||
    !password
  ) {

    showMessage(
      "Please enter username and password.",
      "error"
    );

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "Logging in...";


  hideMessage();


  try {


    /* =================================================
       LOGIN REQUEST
    ================================================= */

    const response =
      await fetch(
        API_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              action:
                "login",

              username:
                username,

              password:
                password

            })

        }
      );


    if (!response.ok) {

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "Server Response:",
      data
    );


    /* =================================================
       LOGIN SUCCESS
    ================================================= */

    if (
      data.success === true
    ) {


      const loginUsername =
        data.username ||
        data.Username ||
        username;


      const userName =
        data.name ||
        data.Name ||
        "";


      const userRole =
        data.role ||
        data.Role ||
        "";


      const userStatus =
        data.status ||
        data.Status ||
        "Active";


      /* NORMALIZE ROLE */

      const role =
        String(
          userRole
        )
        .trim()
        .toLowerCase();


      /* NORMALIZE STATUS */

      const status =
        String(
          userStatus
        )
        .trim()
        .toLowerCase();


      console.log(
        "Username:",
        loginUsername
      );

      console.log(
        "Name:",
        userName
      );

      console.log(
        "Role:",
        role
      );

      console.log(
        "Status:",
        status
      );


      /* STATUS CHECK */

      if (
        status !== "active"
      ) {

        showMessage(
          "Your account is not active.",
          "error"
        );

        button.disabled =
          false;

        button.textContent =
          "Login";

        return;

      }


      /* ROLE CHECK */

      if (
        !ROLE_PAGES[role]
      ) {

        showMessage(
          "No dashboard assigned for this role.",
          "error"
        );

        console.error(
          "Unknown role:",
          role
        );

        button.disabled =
          false;

        button.textContent =
          "Login";

        return;

      }


      /* =================================================
         SAVE SESSION
      ================================================= */

      saveSession({

        username:
          loginUsername,

        name:
          userName,

        role:
          role,

        status:
          userStatus

      });


      /* =================================================
         VERIFY SESSION
      ================================================= */

      const savedSession =
        getSession();


      if (
        !savedSession ||
        savedSession.loggedIn !== true
      ) {

        throw new Error(
          "Unable to create login session."
        );

      }


      /* =================================================
         SUCCESS
      ================================================= */

      showMessage(
        "Login successful! Opening dashboard...",
        "success"
      );


      /*
        replace ব্যবহার করা হচ্ছে।
        তাই login page browser history-তে
        আগের মতো পড়ে থাকবে না।
      */

      setTimeout(
        function() {

          window.location.replace(
            ROLE_PAGES[role]
          );

        },
        500
      );


    }


    /* =================================================
       LOGIN FAILED
    ================================================= */

    else {

      showMessage(

        data.message ||
        "Invalid username or password.",

        "error"

      );


      button.disabled =
        false;


      button.textContent =
        "Login";

    }


  }

  catch(error) {


    console.error(
      "Login Error:",
      error
    );


    showMessage(

      error.message ||
      "Unable to connect to server.",

      "error"

    );


    button.disabled =
      false;


    button.textContent =
      "Login";

  }

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
) {


  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    type;


  message.style.display =
    "block";

}


function hideMessage() {


  const message =
    document.getElementById(
      "message"
    );


  message.style.display =
    "none";


  message.className =
    "";

}


/* =====================================================
   ENTER KEY LOGIN
===================================================== */

document.addEventListener(
  "keydown",
  function(event) {


    if (
      event.key !== "Enter"
    ) {

      return;

    }


    const username =
      document
        .getElementById(
          "username"
        )
        .value
        .trim();


    const password =
      document
        .getElementById(
          "password"
        )
        .value
        .trim();


    const button =
      document.getElementById(
        "loginBtn"
      );


    if (
      username &&
      password &&
      !button.disabled
    ) {

      login();

    }

  }
);


/* =====================================================
   PREVENT BF CACHE PROBLEM
===================================================== */

window.addEventListener(
  "pageshow",
  function(event) {

    /*
      Back/forward cache থেকে index এলে
      session আবার check করবে।
    */

    if (event.persisted) {

      checkExistingSession();

    }

  }
);


</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Login</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#183f35;
}

/* Main Box */
.login-box{
  width:900px;
  height:520px;
  display:flex;
  overflow:hidden;
  border-radius:30px;
  background:#285b4d;
  box-shadow:0 25px 60px rgba(0,0,0,.35);
}

/* Left */
.left{
  width:55%;
  background:#f7fbfa;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* Curved edge */
.left:after{
  content:"";
  position:absolute;
  width:250px;
  height:650px;
  right:-170px;
  top:-65px;
  background:#f7fbfa;
  border-radius:50%;
}

.left-content{
  position:relative;
  z-index:2;
  text-align:center;
}

.logo{
  position:absolute;
  top:30px;
  left:35px;
  font-size:16px;
  font-weight:bold;
  color:#286052;
}

.illustration{
  width:270px;
  height:270px;
  border-radius:50%;
  background:#dcefeb;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:110px;
}

.welcome{
  margin-top:20px;
  color:#285b4d;
  font-size:18px;
}

/* Right */
.right{
  width:45%;
  padding:75px 55px;
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.right h1{
  font-size:34px;
  margin-bottom:30px;
}

label{
  display:block;
  font-size:13px;
  margin-bottom:7px;
}

input{
  width:100%;
  height:42px;
  border:0;
  outline:0;
  border-radius:22px;
  padding:0 18px;
  margin-bottom:18px;
  background:#173f34;
  color:white;
}

input::placeholder{
  color:#91aaa2;
}

.forgot{
  display:block;
  text-align:right;
  color:#91aaa2;
  font-size:11px;
  margin-top:-8px;
  margin-bottom:22px;
  cursor:pointer;
}

button{
  width:100%;
  height:45px;
  border:0;
  border-radius:25px;
  background:#68b8b1;
  color:white;
  font-size:14px;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  background:#80cbc4;
  transform:translateY(-2px);
}

.register{
  text-align:center;
  margin-top:22px;
  font-size:12px;
  color:#d0ddd9;
}

.register a{
  color:#79c7c0;
  text-decoration:underline;
}

.footer{
  text-align:center;
  margin-top:45px;
  font-size:9px;
  color:#77958d;
}

/* Mobile */
@media(max-width:700px){

  body{
    padding:20px;
  }

  .login-box{
    width:100%;
    height:auto;
    min-height:600px;
    display:block;
  }

  .left{
    width:100%;
    height:220px;
  }

  .left:after{
    display:none;
  }

  .logo{
    top:18px;
    left:20px;
  }

  .illustration{
    width:120px;
    height:120px;
    font-size:55px;
  }

  .welcome{
    display:none;
  }

  .right{
    width:100%;
    padding:35px 30px;
  }

  .right h1{
    font-size:28px;
  }

  .footer{
    margin-top:25px;
  }
}
</style>
</head>

<body>

<div class="login-box">

  <!-- LEFT SIDE -->
  <div class="left">

    <div class="logo">
      YOUR LOGO
    </div>

    <div class="left-content">

      <div class="illustration">
        🎄
      </div>

      <div class="welcome">
        Welcome to our Dashboard
      </div>

    </div>

  </div>


  <!-- RIGHT SIDE -->
  <div class="right">

    <h1>Login</h1>

    <label>Username</label>

    <input
      type="text"
      id="username"
      placeholder="Enter your username"
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
    >

    <span class="forgot" onclick="forgotPassword()">
      Forgot Password?
    </span>

    <button id="loginButton" onclick="login()">
      Login to Dashboard
    </button>

    <div class="register">
      Don't have an account?
      <a href="#">Register Now</a>
    </div>

    <div class="footer">
      © 2026 Dashboard • Terms and Services
    </div>

  </div>

</div>


<script>

/* YOUR APPS SCRIPT URL */

const API_URL =
"https://script.google.com/macros/s/AKfycbw00GHHheuvtdQtgPURjs4PtsM48-4yaFx-_ms0ZBV5FHhnmcdbJ5DHr3Aix8JPF0kQzA/exec";


/* LOGIN */

async function login(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const button =
    document.getElementById("loginButton");


  if(!username){
    alert("Please enter your username.");
    return;
  }

  if(!password){
    alert("Please enter your password.");
    return;
  }


  button.disabled = true;
  button.innerText = "Checking...";


  try{

    const url =
      API_URL +
      "?action=login" +
      "&username=" +
      encodeURIComponent(username) +
      "&password=" +
      encodeURIComponent(password);


    const response =
      await fetch(url, {
        method:"GET",
        cache:"no-store"
      });


    const result =
      await response.json();


    if(result.success){

      /* Save login information */

      localStorage.setItem(
        "dashboardAuth",
        "true"
      );

      sessionStorage.setItem(
        "dashboardAuth",
        "true"
      );

      localStorage.setItem(
        "username",
        result.user.username
      );

      localStorage.setItem(
        "userData",
        JSON.stringify(result.user)
      );

      localStorage.setItem(
        "loginData",
        JSON.stringify(result.user)
      );

      localStorage.setItem(
        "loggedUser",
        result.user.username
      );

      localStorage.setItem(
        "currentUser",
        result.user.username
      );

      localStorage.setItem(
        "userInfo",
        JSON.stringify(result.user)
      );


      /* Role based page */

      const role =
        String(result.user.role || "")
        .trim()
        .toLowerCase();


      let page = "2S.html";


      if(role === "admin"){
        page = "t2.html";
      }

      else if(role === "manager"){
        page = "ad.html";
      }

      else if(role === "support"){
        page = "testad.html";
      }

      else if(role === "call"){
        page = "ad.html";
      }

      else if(role === "guest"){
        page = "2S.html";
      }

      else if(role === "accounting"){
        page = "2S.html";
      }


      button.innerText = "Login Successful";


      setTimeout(function(){

        window.location.replace(page);

      },500);


    }

    else{

      alert(
        result.message ||
        "Wrong username or password."
      );

      button.disabled = false;
      button.innerText = "Login to Dashboard";

    }

  }

  catch(error){

    console.error(error);

    alert(
      "Unable to connect to the server. Please try again."
    );

    button.disabled = false;
    button.innerText = "Login to Dashboard";

  }

}


/* ENTER KEY */

document
.getElementById("password")
.addEventListener("keydown",function(e){

  if(e.key === "Enter"){
    login();
  }

});


document
.getElementById("username")
.addEventListener("keydown",function(e){

  if(e.key === "Enter"){
    login();
  }

});


/* FORGOT PASSWORD */

function forgotPassword(){

  alert(
    "Please contact your administrator to reset your password."
  );

}

</script>

</body>
</html>

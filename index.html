```html
<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <style>
    body{
      font-family:Arial;
      background:#f2f5f9;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .login{
      width:300px;
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 5px 20px #ccc;
    }

    h2{
      text-align:center;
      margin-bottom:25px;
    }

    input{
      width:100%;
      padding:12px;
      margin:8px 0;
      box-sizing:border-box;
      border:1px solid #ddd;
      border-radius:6px;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:15px;
      border:0;
      border-radius:6px;
      background:#1976d2;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:#125ca8;
    }
  </style>
</head>

<body>

  <div class="login">

    <h2>Login</h2>

    <input
      type="text"
      id="username"
      placeholder="Username"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">Login</button>

  </div>

  <script>
    function login(){

      let username =
        document.getElementById("username").value;

      let password =
        document.getElementById("password").value;

      if(username == "admin" && password == "1234"){
        window.location.href = "ad.html";
      }else{
        alert("Wrong username or password");
      }

    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Support Dashboard</title>

<link
  rel="icon"
  type="image/png"
  sizes="128x128"
  href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
>

<style>

/* ============================================================
   RESET
============================================================ */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #f4f7fb,
      #eaf2ff
    );

  color:#1f2937;

  transition:
    background .3s,
    color .3s;

}


/* ============================================================
   DARK MODE
============================================================ */

body.dark{

  background:
    linear-gradient(
      135deg,
      #0f172a,
      #111827
    );

  color:#f3f4f6;

}


/* ============================================================
   TOP HEADER
============================================================ */

.header{

  width:100%;

  min-height:70px;

  padding:
    12px 20px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  background:
    rgba(255,255,255,.92);

  border-bottom:
    1px solid #e5e7eb;

  position:sticky;

  top:0;

  z-index:1000;

  backdrop-filter:
    blur(12px);

}

body.dark .header{

  background:
    rgba(17,24,39,.94);

  border-color:
    #374151;

}


/* ============================================================
   HEADER LEFT
============================================================ */

.header-left{

  display:flex;

  align-items:center;

  gap:10px;

  flex-wrap:wrap;

}


/* ============================================================
   TITLE
============================================================ */

.logo-title{

  font-size:21px;

  font-weight:800;

  color:#166534;

  white-space:nowrap;

}

body.dark .logo-title{

  color:#4ade80;

}


/* ============================================================
   BUTTONS
============================================================ */

.btn{

  border:none;

  outline:none;

  padding:
    10px 15px;

  border-radius:
    9px;

  cursor:pointer;

  font-size:14px;

  font-weight:700;

  transition:
    .2s;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:6px;

}

.btn:hover{

  transform:
    translateY(-1px);

  opacity:.92;

}

.btn:active{

  transform:
    scale(.97);

}


.btn-green{

  background:#16a34a;

  color:#fff;

}

.btn-green:hover{

  background:#15803d;

}


.btn-blue{

  background:#2563eb;

  color:#fff;

}


.btn-red{

  background:#dc2626;

  color:#fff;

}


.btn-orange{

  background:#ea580c;

  color:#fff;

}


.btn-purple{

  background:#7c3aed;

  color:#fff;

}


.btn-gray{

  background:#6b7280;

  color:#fff;

}


.btn-dark{

  background:#111827;

  color:#fff;

}

body.dark .btn-dark{

  background:#f3f4f6;

  color:#111827;

}


/* ============================================================
   PROFILE
============================================================ */

.profile-area{

  position:relative;

}

.profile-btn{

  width:42px;

  height:42px;

  border-radius:50%;

  border:none;

  cursor:pointer;

  background:
    linear-gradient(
      135deg,
      #16a34a,
      #2563eb
    );

  color:#fff;

  font-weight:800;

  font-size:16px;

}


/* ============================================================
   PROFILE MENU
============================================================ */

.profile-menu{

  display:none;

  position:absolute;

  right:0;

  top:52px;

  width:180px;

  background:#fff;

  border:
    1px solid #e5e7eb;

  border-radius:12px;

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.15);

  overflow:hidden;

  z-index:2000;

}

body.dark .profile-menu{

  background:#1f2937;

  border-color:#374151;

}

.profile-menu.show{

  display:block;

}

.profile-menu button{

  width:100%;

  padding:12px 14px;

  border:none;

  background:transparent;

  text-align:left;

  cursor:pointer;

  font-size:14px;

  color:#111827;

}

body.dark .profile-menu button{

  color:#f9fafb;

}

.profile-menu button:hover{

  background:#f3f4f6;

}

body.dark .profile-menu button:hover{

  background:#374151;

}


/* ============================================================
   MAIN
============================================================ */

.main{

  width:100%;

  padding:20px;

}


/* ============================================================
   FILTER BAR
============================================================ */

.filter-bar{

  width:100%;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  margin-bottom:15px;

  flex-wrap:wrap;

}


.search-box{

  flex:1;

  min-width:220px;

}

.search-box input{

  width:100%;

  padding:11px 13px;

  border:
    1px solid #d1d5db;

  border-radius:9px;

  outline:none;

  font-size:14px;

  background:#fff;

  color:#111827;

}

body.dark .search-box input{

  background:#1f2937;

  color:#fff;

  border-color:#4b5563;

}


.date-filter{

  display:flex;

  align-items:center;

  gap:8px;

  flex-wrap:wrap;

}

.date-filter input{

  padding:10px;

  border:
    1px solid #d1d5db;

  border-radius:9px;

  outline:none;

  background:#fff;

  color:#111827;

}

body.dark .date-filter input{

  background:#1f2937;

  color:#fff;

  border-color:#4b5563;

}


.data-type{

  padding:10px 12px;

  border:
    1px solid #d1d5db;

  border-radius:9px;

  background:#fff;

  color:#111827;

  outline:none;

  font-weight:700;

}

body.dark .data-type{

  background:#1f2937;

  color:#fff;

  border-color:#4b5563;

}


/* ============================================================
   TABLE CARD
============================================================ */

.table-card{

  width:100%;

  background:#fff;

  border-radius:14px;

  overflow:hidden;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.08);

  border:
    1px solid #e5e7eb;

}

body.dark .table-card{

  background:#111827;

  border-color:#374151;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.25);

}


.table-wrapper{

  width:100%;

  overflow-x:auto;

}


table{

  width:100%;

  border-collapse:collapse;

  min-width:900px;

}


thead{

  background:
    linear-gradient(
      135deg,
      #166534,
      #15803d
    );

  color:#fff;

}


th{

  padding:13px 12px;

  text-align:left;

  font-size:13px;

  white-space:nowrap;

}


td{

  padding:12px;

  border-bottom:
    1px solid #e5e7eb;

  font-size:13px;

  white-space:nowrap;

}

body.dark td{

  border-color:#374151;

}

tbody tr:hover{

  background:#f0fdf4;

}

body.dark tbody tr:hover{

  background:#1f2937;

}


/* ============================================================
   ACTION BUTTON
============================================================ */

.action-btn{

  border:none;

  padding:7px 10px;

  border-radius:7px;

  cursor:pointer;

  color:#fff;

  font-size:12px;

  font-weight:700;

  margin-right:4px;

  margin-bottom:3px;

}

.action-edit{

  background:#2563eb;

}

.action-delete{

  background:#dc2626;

}

.action-sell{

  background:#ea580c;

}

.action-paid{

  background:#16a34a;

}


/* ============================================================
   EMPTY
============================================================ */

.empty{

  text-align:center;

  padding:35px;

  color:#6b7280;

}


/* ============================================================
   LOADING
============================================================ */

.loading{

  text-align:center;

  padding:35px;

  color:#6b7280;

}


/* ============================================================
   PAGINATION
============================================================ */

.pagination{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:8px;

  padding:15px;

  flex-wrap:wrap;

}

.page-btn{

  min-width:38px;

  height:36px;

  padding:0 10px;

  border:none;

  border-radius:8px;

  cursor:pointer;

  background:#e5e7eb;

  color:#111827;

  font-weight:700;

}

body.dark .page-btn{

  background:#374151;

  color:#fff;

}

.page-btn.active{

  background:#16a34a;

  color:#fff;

}


/* ============================================================
   MODAL
============================================================ */

.modal{

  display:none;

  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.55);

  z-index:3000;

  align-items:center;

  justify-content:center;

  padding:15px;

}

.modal.show{

  display:flex;

}


.modal-box{

  width:100%;

  max-width:500px;

  max-height:90vh;

  overflow-y:auto;

  background:#fff;

  border-radius:16px;

  padding:22px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.3);

}

body.dark .modal-box{

  background:#111827;

  color:#fff;

}


.modal-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:18px;

}


.modal-header h2{

  font-size:19px;

}


.close-btn{

  width:35px;

  height:35px;

  border:none;

  border-radius:8px;

  cursor:pointer;

  background:#ef4444;

  color:#fff;

  font-size:20px;

}


.form-group{

  margin-bottom:14px;

}


.form-group label{

  display:block;

  margin-bottom:6px;

  font-size:13px;

  font-weight:700;

}


.form-group input,

.form-group select{

  width:100%;

  padding:11px;

  border:
    1px solid #d1d5db;

  border-radius:9px;

  outline:none;

  font-size:14px;

  background:#fff;

  color:#111827;

}

body.dark .form-group input,

body.dark .form-group select{

  background:#1f2937;

  color:#fff;

  border-color:#4b5563;

}


.modal-actions{

  display:flex;

  justify-content:flex-end;

  gap:8px;

  margin-top:18px;

}


/* ============================================================
   TOAST
============================================================ */

.toast{

  position:fixed;

  right:20px;

  bottom:20px;

  min-width:250px;

  max-width:360px;

  padding:13px 16px;

  border-radius:10px;

  color:#fff;

  font-size:14px;

  font-weight:700;

  opacity:0;

  transform:
    translateY(20px);

  pointer-events:none;

  transition:.3s;

  z-index:5000;

}

.toast.show{

  opacity:1;

  transform:
    translateY(0);

}

.toast.success{

  background:#16a34a;

}

.toast.error{

  background:#dc2626;

}

.toast.info{

  background:#2563eb;

}


/* ============================================================
   RESPONSIVE
============================================================ */

@media(max-width:800px){

  .header{

    padding:10px;

  }

  .main{

    padding:10px;

  }

  .logo-title{

    font-size:18px;

  }

  .btn{

    padding:9px 11px;

    font-size:12px;

  }

  .filter-bar{

    align-items:stretch;

  }

  .search-box{

    min-width:100%;

  }

  .date-filter{

    width:100%;

  }

  .date-filter input{

    flex:1;

    min-width:120px;

  }

}


/* ============================================================
   USER TABLE
============================================================ */

.user-table{

  width:100%;

  overflow-x:auto;

}

.user-table table{

  min-width:700px;

}


/* ============================================================
   SMALL TEXT
============================================================ */

.small-text{

  font-size:12px;

  color:#6b7280;

}

body.dark .small-text{

  color:#9ca3af;

}

</style>

</head>


<body>


<!-- ============================================================
     HEADER
============================================================ -->

<header class="header">

  <div class="header-left">

    <div class="logo-title">
      Support Dashboard
    </div>

    <button
      class="btn btn-gray"
      onclick="loadData(true)"
    >
      ↻ Reload
    </button>

    <button
      class="btn btn-green"
      onclick="openNewEntryModal()"
    >
      + New Entry
    </button>

    <button
      class="btn btn-blue"
      onclick="openUsersModal()"
    >
      Users
    </button>

    <button
      class="btn btn-purple"
      onclick="openItemsModal()"
    >
      Items
    </button>

    <button
      class="btn btn-dark"
      onclick="toggleDarkMode()"
      id="darkBtn"
    >
      🌙 Dark
    </button>

  </div>


  <div class="profile-area">

    <button
      class="profile-btn"
      onclick="toggleProfileMenu()"
      id="profileBtn"
    >
      U
    </button>

    <div
      class="profile-menu"
      id="profileMenu"
    >

      <button
        onclick="changePassword()"
      >
        🔑 Change Password
      </button>

      <button
        onclick="logout()"
      >
        🚪 Logout
      </button>

    </div>

  </div>

</header>



<!-- ============================================================
     MAIN
============================================================ -->

<main class="main">


  <!-- FILTER BAR -->

  <div class="filter-bar">

    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="Search..."
        oninput="applyFilters()"
      >

    </div>


    <div class="date-filter">

      <input
        type="date"
        id="fromDate"
        onchange="applyFilters()"
      >

      <input
        type="date"
        id="toDate"
        onchange="applyFilters()"
      >


      <select
        class="data-type"
        id="dataType"
        onchange="changeDataType()"
      >

        <option value="data">
          Data
        </option>

        <option value="sell">
          Sell
        </option>

        <option value="delete">
          Deleted
        </option>

        <option value="paid">
          Paid
        </option>

      </select>

    </div>

  </div>



  <!-- TABLE -->

  <div class="table-card">

    <div class="table-wrapper">

      <table>

        <thead id="tableHead">

          <tr>

            <th>Name</th>
            <th>IP</th>
            <th>Work</th>
            <th>Date</th>
            <th>Action</th>

          </tr>

        </thead>

        <tbody id="tableBody">

          <tr>

            <td
              colspan="6"
              class="loading"
            >
              Loading...
            </td>

          </tr>

        </tbody>

      </table>

    </div>


    <div
      class="pagination"
      id="pagination"
    ></div>

  </div>

</main>



<!-- ============================================================
     NEW ENTRY MODAL
============================================================ -->

<div
  class="modal"
  id="entryModal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2 id="entryModalTitle">
        New Entry
      </h2>

      <button
        class="close-btn"
        onclick="closeModal('entryModal')"
      >
        ×
      </button>

    </div>


    <input
      type="hidden"
      id="editRowNumber"
    >


    <div class="form-group">

      <label>
        IP
      </label>

      <input
        type="text"
        id="entryIP"
        placeholder="Enter IP"
      >

    </div>


    <div class="form-group">

      <label>
        Work
      </label>

      <input
        type="text"
        id="entryWork"
        placeholder="Enter Work"
      >

    </div>


    <div class="form-group">

      <label>
        Name
      </label>

      <input
        type="text"
        id="entryName"
        readonly
      >

    </div>


    <div class="form-group">

      <label>
        Date
      </label>

      <input
        type="date"
        id="entryDate"
        readonly
      >

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-gray"
        onclick="closeModal('entryModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-green"
        onclick="saveEntry()"
      >
        Save
      </button>

    </div>

  </div>

</div>



<!-- ============================================================
     SELL MODAL
============================================================ -->

<div
  class="modal"
  id="sellModal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2>
        Sell Data
      </h2>

      <button
        class="close-btn"
        onclick="closeModal('sellModal')"
      >
        ×
      </button>

    </div>


    <input
      type="hidden"
      id="sellRowNumber"
    >


    <div class="form-group">

      <label>
        Name
      </label>

      <input
        type="text"
        id="sellName"
        readonly
      >

    </div>


    <div class="form-group">

      <label>
        IP
      </label>

      <input
        type="text"
        id="sellIP"
        readonly
      >

    </div>


    <div class="form-group">

      <label>
        Work
      </label>

      <input
        type="text"
        id="sellWork"
        readonly
      >

    </div>


    <div class="form-group">

      <label>
        Date
      </label>

      <input
        type="date"
        id="sellDate"
        readonly
      >

    </div>


    <div class="form-group">

      <label>
        Item
      </label>

      <select id="sellItem">

        <option value="">
          Select Item
        </option>

      </select>

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-gray"
        onclick="closeModal('sellModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-orange"
        onclick="confirmSell()"
      >
        Sell
      </button>

    </div>

  </div>

</div>



<!-- ============================================================
     EDIT SELL MODAL
============================================================ -->

<div
  class="modal"
  id="editSellModal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2>
        Edit Sell
      </h2>

      <button
        class="close-btn"
        onclick="closeModal('editSellModal')"
      >
        ×
      </button>

    </div>


    <input
      type="hidden"
      id="editSellRowNumber"
    >


    <div class="form-group">

      <label>
        Name
      </label>

      <input
        type="text"
        id="editSellName"
      >

    </div>


    <div class="form-group">

      <label>
        IP
      </label>

      <input
        type="text"
        id="editSellIP"
      >

    </div>


    <div class="form-group">

      <label>
        Work
      </label>

      <input
        type="text"
        id="editSellWork"
      >

    </div>


    <div class="form-group">

      <label>
        Date
      </label>

      <input
        type="date"
        id="editSellDate"
      >

    </div>


    <div class="form-group">

      <label>
        Item
      </label>

      <select id="editSellItem">

        <option value="">
          Select Item
        </option>

      </select>

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-gray"
        onclick="closeModal('editSellModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-blue"
        onclick="saveEditSell()"
      >
        Save
      </button>

    </div>

  </div>

</div>



<!-- ============================================================
     USERS MODAL
============================================================ -->

<div
  class="modal"
  id="usersModal"
>

  <div
    class="modal-box"
    style="max-width:900px"
  >

    <div class="modal-header">

      <h2>
        Users
      </h2>

      <button
        class="close-btn"
        onclick="closeModal('usersModal')"
      >
        ×
      </button>

    </div>


    <div
      style="
        display:flex;
        justify-content:flex-end;
        margin-bottom:12px;
      "
    >

      <button
        class="btn btn-green"
        onclick="openUserForm()"
      >
        + Add User
      </button>

    </div>


    <div class="user-table">

      <table>

        <thead>

          <tr>

            <th>
              Username
            </th>

            <th>
              Name
            </th>

            <th>
              Role
            </th>

            <th>
              Status
            </th>

            <th>
              Action
            </th>

          </tr>

        </thead>

        <tbody id="usersTableBody">

          <tr>

            <td
              colspan="5"
              class="loading"
            >
              Loading...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>



<!-- ============================================================
     USER FORM MODAL
============================================================ -->

<div
  class="modal"
  id="userFormModal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2 id="userFormTitle">
        Add User
      </h2>

      <button
        class="close-btn"
        onclick="closeModal('userFormModal')"
      >
        ×
      </button>

    </div>


    <input
      type="hidden"
      id="originalUsername"
    >


    <div class="form-group">

      <label>
        Username
      </label>

      <input
        type="text"
        id="userUsername"
      >

    </div>


    <div class="form-group">

      <label>
        Password
      </label>

      <input
        type="text"
        id="userPassword"
      >

    </div>


    <div class="form-group">

      <label>
        Name
      </label>

      <input
        type="text"
        id="userName"
      >

    </div>


    <div class="form-group">

      <label>
        Role
      </label>

      <select id="userRole">

        <option value="admin">
          Admin
        </option>

        <option value="manager">
          Manager
        </option>

        <option value="support">
          Support
        </option>

        <option value="call">
          Call
        </option>

        <option value="guest">
          Guest
        </option>

      </select>

    </div>


    <div class="form-group">

      <label>
        Status
      </label>

      <select id="userStatus">

        <option value="Active">
          Active
        </option>

        <option value="Blocked">
          Blocked
        </option>

        <option value="Inactive">
          Inactive
        </option>

      </select>

    </div>


    <div class="modal-actions">

      <button

       DELETE
    ======================================================== */

      currentDataType === "delete"
    ){

        DELETE_API_URL;

      action =
        "getDeletedData";

    }


    /* ========================================================
       PAID

       Paid data is coming from SELL API / Paid Sheet.
    ======================================================== */

    else if(
      currentDataType === "paid"
    ){

      apiUrl =
        SELL_API_URL;

      action =
        "getPaidData";

    }


    /* ========================================================
       CACHE
    ======================================================== */

    let cache =
      null;


    if(
      !force
    ){

      if(
        currentDataType === "data"
      ){

        cache =
          dataCache;

      }

      else if(
        currentDataType === "sell"
      ){

        cache =
          sellCache;

      }

      else if(
        currentDataType === "delete"
      ){

        cache =
          deleteCache;

      }

      else if(
        currentDataType === "paid"
      ){

        cache =
          paidCache;

      }

    if(
      cache

        cache;

      applyFilters();

      return;

      .getElementById("tableBody")
      .innerHTML = `

    const response =
      await fetch(
        apiUrl +
        "?action=" +
        encodeURIComponent(
          action
        )
      );


    const result =
      await response.json();


    if(
      !result.success &&
      !Array.isArray(result)
    ){

      throw new Error(
        result.message ||
        "Failed to load data."
      );

    }


    let rows =
      Array.isArray(result)
        ? result
        : (
            result.data ||
            result.rows ||
            []

    allData =
      rows;


    /* ========================================================
       SAVE CACHE
    ======================================================== */

    if(
      currentDataType === "data"
    ){

        rows;

    }

    ){

    }

    }

/* ============================================================
   FILTER
============================================================ */

function applyFilters(){

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  const from =
    document
      .getElementById("fromDate")
      .value;


  const to =
    document
      .getElementById("toDate")
      .value;


  filteredData =
    allData.filter(
      function(row){

        const text =
          JSON.stringify(
            row
          ).toLowerCase();


        if(
          search &&
          !text.includes(search)
        ){

          return false;

        }


        let rowDate =
          getRowDate(row);


        if(
          from &&
          rowDate &&
          rowDate < from
        ){

          return false;

        }


        if(
          to &&
          rowDate &&
          rowDate > to
        ){

          return false;

        }


        return true;

      }
    );


  currentPage =
    1;


  renderData();

}


/* ============================================================
   GET ROW DATE
============================================================ */

function getRowDate(row){

  let date =
    row.Date ||
    row.date ||
    row["DATE"] ||
    row[3] ||
    "";


  if(
    date instanceof Date
  ){

    return formatDateInput(
      date
    );

  }


  if(
    typeof date === "string"
  ){

    if(
      date.includes("T")
    ){

      return date
        .split("T")[0];

    }


    if(
      /^\d{4}-\d{2}-\d{2}/.test(date)
    ){

      return date
        .substring(0,10);

    }


    const match =
      date.match(
        /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/
      );


    if(match){

      return (
        match[3] +
        "-" +
        String(match[2]).padStart(2,"0") +
        "-" +
        String(match[1]).padStart(2,"0")
      );

    }

  }


  return "";

}

/* ============================================================
   PAGINATION
============================================================ */

function renderPagination(){

  const pagination =
    document.getElementById(
      "pagination"
    );


  const totalPages =
    Math.ceil(
      filteredData.length /
      pageSize
    );


  if(
    totalPages <= 1
  ){

    pagination.innerHTML =
      "";

    return;

  }


  let html =
    "";


  if(
    currentPage > 1
  ){

    html += `

      <button
        class="page-btn"
        onclick="goPage(${currentPage - 1})"
      >
        ‹
      </button>

    `;

  }


  for(
    let i=1;
    i<=totalPages;
    i++
  ){

    html += `

      <button
        class="page-btn ${
          i === currentPage
            ? "active"
            : ""
        }"
        onclick="goPage(${i})"
      >
        ${i}
      </button>

    `;

  }


  if(
    currentPage < totalPages
  ){

    html += `

      <button
        class="page-btn"
        onclick="goPage(${currentPage + 1})"
      >
        ›
      </button>

    `;

  }


  pagination.innerHTML =
    html;

}


function goPage(page){

  currentPage =
    page;

  renderData();

}

/* ============================================================
   SAVE ENTRY
============================================================ */

async function saveEntry(){

  const ip =
    document
      .getElementById("entryIP")
      .value
      .trim();


  const work =
    document
      .getElementById("entryWork")
      .value
      .trim();


  const name =
    document
      .getElementById("entryName")
      .value
      .trim();


  const date =
    document
      .getElementById("entryDate")
      .value;


  if(!ip){

    showToast(
      "IP is required.",
      "error"
    );

    return;

  }


  if(!work){

    showToast(
      "Work is required.",
      "error"
    );

    return;

  }


  try{

    showToast(
      "Saving...",
      "info"
    );


    const payload = {

      action:
        "addData",

      name:
        name,

      ip:
        ip,

      work:
        work,

      date:
        date,

      username:
        localStorage.getItem(
          "username"
        ) ||
        "",

      user:
        localStorage.getItem(
          "username"
        ) ||
        ""

    };


    const response =
      await fetch(
        DATA_API_URL,
        {

          method:"POST",

          body:
            JSON.stringify(
              payload
            )

        }
      );


    const result =
      await response.json();


    if(
      !result.success
    ){

      throw new Error(
        result.message ||
        "Failed to save."
      );

    }


    closeModal(
      "entryModal"
    );


    dataCache =
      null;


    showToast(
      "Entry saved successfully.",
      "success"
    );


    loadData(
      true
    );


  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "Failed to save.",
      "error"
    );

  }

}

async function loadUsers(
  force=false
){

  try{

    if(
      usersCache &&
      !force
    ){

      renderUsers(
        usersCache
      );

      return;

    }


    document
      .getElementById(
        "usersTableBody"
      )
      .innerHTML = `

        <tr>

          <td
            colspan="5"
            class="loading"
          >
            Loading...
          </td>

        </tr>

      `;


    const requester =
      localStorage.getItem(
        "username"
      ) ||
      "";


    const response =
      await fetch(
        USER_API_URL +
        "?action=getUsers&requester=" +
        encodeURIComponent(
          requester
        )
      );


    const result =
      await response.json();


    if(
      !result.success &&
      !Array.isArray(result)
    ){

      throw new Error(
        result.message ||
        "Failed to load users."
      );

    }


    const users =
      Array.isArray(result)
        ? result
        : (
            result.data ||
            result.users ||
            []
          );


    usersCache =
      users;


    renderUsers(
      users
    );


  }catch(error){

    console.error(error);

    document
      .getElementById(
        "usersTableBody"
      )
      .innerHTML = `

        <tr>

          <td
            colspan="5"
            class="empty"
          >
            ${escapeHtml(
              error.message ||
              "Failed to load users."
            )}
          </td>

        </tr>

      `;

  }

}

      <tr>

        <td
          colspan="5"
          class="empty"
        >
          No users found.
        </td>

      </tr>

    `;

    return;

  }


  body.innerHTML =
    users.map(
      function(user){

        const username =
          user.Username ||
          user.username ||
          user[0] ||
          "";


        const password =
          user.Password ||
          user.password ||
          user[1] ||
          "";


        const name =
          user.Name ||
          user.name ||
          user[2] ||
          "";


        const role =
          user.Role ||
          user.role ||
          user[3] ||
          "";


        const status =

        return `

async function openItemsModal(){

  openModal(
    "itemsModal"
  );


  await loadItems(
    true
  );

}


async function loadItems(
  force=false
){

  try{

    if(
      itemsCache &&
      !force
    ){

      renderItems(
        itemsCache
      );

      populateItemSelects(
        itemsCache
      );

      return itemsCache;

    }


    const response =
      await fetch(
        ITEM_API_URL +
        "?action=getItems"
      );


    const result =
      await response.json();


    if(
      !result.success &&
      !Array.isArray(result)
    ){

      throw new Error(
        result.message ||
        "Failed to load items."
      );

    }


    let items =
      Array.isArray(result)
        ? result
        : (
            result.data ||
            result.items ||
            []
          );


    items =
      items.map(
        function(item){

          if(
            typeof item === "string"
          ){

            return item;

          }


          return (
            item.Item ||
            item.item ||
            item.name ||
            item.Name ||
            item[0] ||
            ""
          );

        }
      )
      .filter(Boolean);


    itemsCache =
      items;


    renderItems(
      items
    );


    populateItemSelects(
      items
    );


    return items;


  }catch(error){

    console.error(error);

    const list =
      document.getElementById(
        "itemsList"
      );


    if(list){

      list.innerHTML =
        `<div class="empty">
          ${escapeHtml(
            error.message ||
            "Failed to load items."
          )}
        </div>`;

    }

    return [];

  }

}

   RENDER ITEMS
============================================================ */

function renderItems(
  items
){

  const list =
    document.getElementById(
      "itemsList"
    );


  if(
    !items.length
  ){

    list.innerHTML =
      `<div class="empty">
        No items found.
      </div>`;

    return;

  }


  list.innerHTML =
    items.map(
      function(item){

        return `

          <div
            style="
              display:flex;
              justify-content:space-between;
              align-items:center;
              padding:10px 0;
              border-bottom:1px solid #e5e7eb;
            "
          >

            <span>
              ${escapeHtml(item)}
            </span>

            <button
              class="action-btn action-delete"
              onclick='deleteItem(${JSON.stringify(item)})'
            >
              Delete
            </button>

          </div>

        `;

      }
    )
    .join("");

}


/* ============================================================
   POPULATE ITEM SELECTS
============================================================ */

function populateItemSelects(
  items
){

  const selects = [

    document.getElementById(
      "sellItem"
    ),

    document.getElementById(
      "editSellItem"
    )

  ];


  selects.forEach(
    function(select){

      if(!select){
        return;
      }


      const current =
        select.value;


      select.innerHTML =
        `<option value="">
          Select Item
        </option>`;


      items.forEach(
        function(item){

          const option =
            document.createElement(
              "option"
            );


          option.value =
            item;


          option.textContent =
            item;


          select.appendChild(
            option
          );

        }
      );


      if(current){

        select.value =
          current;

      }

    }
  );

}

async function addItem(){

  if(!item){

  try{

    const payload = {

      action:
        "addItem",

      item:

    };


    const response =
      await fetch(
        ITEM_API_URL,
        {

          method:"POST",

          body:
            JSON.stringify(
              payload
            )

    const result =

    if(

/* ============================================================
   CHANGE PASSWORD
============================================================ */

async function changePassword(){

  const currentPassword =
    prompt(
      "Enter current password:"
    );


  if(
    currentPassword === null
  ){

    return;

  }


  const newPassword =
    prompt(
      "Enter new password:"
    );


  if(
    newPassword === null
  ){

    return;

  }


  if(!newPassword.trim()){

    showToast(
      "New password is required.",
      "error"
    );

    return;

  }


  const username =
    localStorage.getItem(
      "username"
    ) ||
    "";


  try{

    const payload = {

      action:
        "changePassword",

      username:
        username,

      currentPassword:
        currentPassword,

      newPassword:
        newPassword

    };


    const response =
      await fetch(
        USER_API_URL,
        {

          method:"POST",

          body:
            JSON.stringify(
              payload
            )

        }
      );


    const result =
      await response.json();


    if(
      !result.success
    ){

      throw new Error(
        result.message ||
        "Password change failed."
      );

    }


    showToast(
      "Password changed successfully.",
      "success"
    );


  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "Password change failed.",
      "error"
    );

  }

}

/* ============================================================
   TODAY
============================================================ */

function getToday(){

  const d =
    new Date();


  const y =
    d.getFullYear();


  const m =
    String(
      d.getMonth()+1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    y +
    "-" +
    m +
    "-" +
    day
  );

}


/* ============================================================
   DATE FORMAT
============================================================ */

function formatDateInput(
  date
){

  const d =
    new Date(date);


  if(
    isNaN(
      d.getTime()
    )
  ){

    return "";

  }


  return (
    d.getFullYear() +
    "-" +
    String(
      d.getMonth()+1
    ).padStart(
      2,
      "0"
    ) +
    "-" +
    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    )
  );

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(
  value
){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(
    value
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* ============================================================

document.addEventListener(

  function(e){

    document
      .querySelectorAll(
        ".modal"
      )
      .forEach(
        function(modal){

          if(
            e.target === modal
          ){

            modal.classList.remove(
              "show"
            );

          }

        }
      );

  }
);


/* ============================================================
   AUTO LOGOUT AFTER INACTIVITY
============================================================ */

let inactivityTimer =
  null;


function resetInactivityTimer(){

  clearTimeout(
    inactivityTimer
  );


  inactivityTimer =
    setTimeout(
      function(){

        logout();

      },
      5 * 60 * 1000
    );

}


[
  "click",
  "mousemove",
  "keydown",
  "scroll",
  "touchstart"
]
.forEach(
  function(event){

    document.addEventListener(
      event,
      resetInactivityTimer,
      {
        passive:true
      }
    );

  }
);


resetInactivityTimer();

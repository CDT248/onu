<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Dashboard</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }


    body {

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top left,
          rgba(0,255,140,0.10),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(255,0,60,0.08),
          transparent 35%
        ),
        #070a0e;

      color: #fff;
    }


    /* =========================
       HEADER
    ========================= */

    .header {

      height: 70px;

      padding: 0 30px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      background:
        rgba(13,17,22,0.94);

      border-bottom:
        1px solid rgba(255,255,255,0.07);

      backdrop-filter: blur(15px);

      position: sticky;

      top: 0;

      z-index: 100;
    }


    .brand {

      display: flex;

      align-items: center;

      gap: 11px;
    }


    .brand-icon {

      width: 40px;
      height: 40px;

      border-radius: 11px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #00d084,
          #00a86b
        );

      color: #04100a;

      font-size: 20px;
    }


    .brand-name {

      font-size: 18px;

      font-weight: 700;
    }


    .user-area {

      display: flex;

      align-items: center;

      gap: 14px;
    }


    .user-name {

      color: #b7c0ca;

      font-size: 13px;
    }


    .logout-btn {

      padding: 9px 15px;

      border-radius: 9px;

      border:
        1px solid
        rgba(255,255,255,0.08);

      background: #151a20;

      color: #ff657b;

      cursor: pointer;

      font-size: 12px;

      font-weight: 600;
    }


    .logout-btn:hover {

      background:
        rgba(255,60,85,0.10);
    }


    /* =========================
       MAIN
    ========================= */

    .main {

      max-width: 1200px;

      margin: auto;

      padding: 35px 25px;
    }


    .page-title {

      margin-bottom: 25px;
    }


    .page-title h1 {

      font-size: 28px;

      margin-bottom: 7px;
    }


    .page-title p {

      color: #7e8794;

      font-size: 13px;
    }


    /* =========================
       TOP BAR
    ========================= */

    .toolbar {

      display: flex;

      gap: 12px;

      margin-bottom: 20px;
    }


    .search-box {

      flex: 1;

      position: relative;
    }


    .search-box span {

      position: absolute;

      left: 15px;

      top: 50%;

      transform:
        translateY(-50%);

      color: #6f7884;

      font-size: 16px;
    }


    .search-box input {

      width: 100%;

      height: 48px;

      padding:
        0 15px 0 43px;

      background: #0d1116;

      border:
        1px solid #242b34;

      border-radius: 11px;

      color: white;

      outline: none;

      font-size: 13px;

      transition: 0.25s;
    }


    .search-box input:focus {

      border-color: #00d084;

      box-shadow:
        0 0 0 3px
        rgba(0,208,132,0.07);
    }


    .refresh-btn {

      height: 48px;

      padding:
        0 18px;

      border-radius: 11px;

      border:
        1px solid #242b34;

      background: #0d1116;

      color: #b9c1cb;

      cursor: pointer;

      font-size: 13px;
    }


    .refresh-btn:hover {

      border-color: #00d084;

      color: #00d084;
    }


    /* =========================
       LIST CONTAINER
    ========================= */

    .list-container {

      background:
        rgba(18,22,28,0.94);

      border:
        1px solid
        rgba(255,255,255,0.07);

      border-radius: 17px;

      overflow: hidden;

      box-shadow:
        0 20px 50px
        rgba(0,0,0,0.35);
    }


    /* =========================
       LIST HEADER
    ========================= */

    .list-header {

      display: grid;

      grid-template-columns:
        70px
        1.3fr
        1fr
        1fr
        120px;

      padding:
        16px 20px;

      background: #10151b;

      border-bottom:
        1px solid #202731;

      color: #788290;

      font-size: 11px;

      font-weight: 600;

      text-transform: uppercase;
    }


    /* =========================
       LIST ITEM
    ========================= */

    .list-item {

      display: grid;

      grid-template-columns:
        70px
        1.3fr
        1fr
        1fr
        120px;

      align-items: center;

      padding:
        17px 20px;

      border-bottom:
        1px solid #1b2128;

      transition: 0.2s;
    }


    .list-item:last-child {

      border-bottom: none;
    }


    .list-item:hover {

      background:
        rgba(0,208,132,0.035);
    }


    .serial {

      color: #65707d;

      font-size: 12px;
    }


    .name {

      font-size: 14px;

      font-weight: 600;
    }


    .username {

      color: #929ba7;

      font-size: 12px;
    }


    .role {

      color: #929ba7;

      font-size: 12px;
    }


    .status {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      width: 75px;

      padding: 6px 9px;

      border-radius: 20px;

      font-size: 10px;

      font-weight: 600;
    }


    .active {

      color: #00d084;

      background:
        rgba(0,208,132,0.08);
    }


    .inactive {

      color: #ff657b;

      background:
        rgba(255,60,85,0.08);
    }


    /* =========================
       EMPTY
    ========================= */

    .empty {

      text-align: center;

      padding: 50px 20px;

      color: #68727e;

      font-size: 13px;

      display: none;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {

      text-align: center;

      margin-top: 30px;

      color: #4f5863;

      font-size: 11px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media(max-width:700px) {

      .header {

        padding: 0 17px;
      }


      .user-name {

        display: none;
      }


      .main {

        padding:
          28px 15px;
      }


      .page-title h1 {

        font-size: 24px;
      }


      .toolbar {

        flex-direction: column;
      }


      .refresh-btn {

        width: 100%;
      }


      .list-container {

        overflow-x: auto;
      }


      .list-header,
      .list-item {

        min-width: 720px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">


    <div class="brand">

      <div class="brand-icon">
        ⚡
      </div>

      <div class="brand-name">
        Dashboard
      </div>

    </div>


    <div class="user-area">

      <div
        class="user-name"
        id="userName">

        User

      </div>


      <button
        class="logout-btn"
        onclick="logout()">

        Logout

      </button>

    </div>


  </header>



  <!-- =========================
       MAIN
  ========================== -->

  <main class="main">


    <div class="page-title">

      <h1>
        Data List
      </h1>

      <p>
        Search and manage your data
      </p>

    </div>



    <!-- =========================
         SEARCH
    ========================== -->

    <div class="toolbar">


      <div class="search-box">

        <span>
          🔍
        </span>

        <input
          type="text"
          id="search"
          placeholder="Search by name, username or role..."
          oninput="searchData()"
        >

      </div>


      <button
        class="refresh-btn"
        onclick="loadData()">

        🔄 Refresh

      </button>


    </div>



    <!-- =========================
         LIST
    ========================== -->

    <div class="list-container">


      <div class="list-header">

        <div>
          #
        </div>

        <div>
          Name
        </div>

        <div>
          Username
        </div>

        <div>
          Role
        </div>

        <div>
          Status
        </div>

      </div>


      <div id="dataList">

        <!-- Data will load here -->

      </div>


      <div
        class="empty"
        id="empty">

        No data found.

      </div>


    </div>



    <div class="footer">

      Dashboard System

    </div>


  </main>



<script>


/* =====================================================
   LOGIN PROTECTION
===================================================== */

if (
  localStorage.getItem("loggedIn")
  !== "true"
) {

  window.location.replace(
    "index.html"
  );

}



/* =====================================================
   USER NAME
===================================================== */

const loggedName =
  localStorage.getItem("name");


const loggedUsername =
  localStorage.getItem("username");


document.getElementById(
  "userName"
).textContent =
  loggedName ||
  loggedUsername ||
  "User";



/* =====================================================
   DEMO DATA
===================================================== */

let allData = [

  {
    name: "Admin",
    username: "admin",
    role: "Admin",
    status: "Active"
  },

  {
    name: "Fahim",
    username: "fahim",
    role: "User",
    status: "Active"
  },

  {
    name: "Support",
    username: "support",
    role: "Support",
    status: "Inactive"
  },

  {
    name: "Manager",
    username: "manager",
    role: "Manager",
    status: "Active"
  }

];



/* =====================================================
   LOAD DATA
===================================================== */

function loadData() {

  renderData(allData);

}



/* =====================================================
   RENDER DATA
===================================================== */

function renderData(data) {


  const list =
    document.getElementById(
      "dataList"
    );


  const empty =
    document.getElementById(
      "empty"
    );


  list.innerHTML = "";


  if (
    !data ||
    data.length === 0
  ) {

    empty.style.display =
      "block";

    return;

  }


  empty.style.display =
    "none";


  data.forEach(
    function(item, index) {


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "list-item";


      const statusClass =
        String(item.status)
          .toLowerCase()
          === "active"
          ? "active"
          : "inactive";


      row.innerHTML = `

        <div class="serial">
          ${index + 1}
        </div>

        <div class="name">
          ${item.name || "-"}
        </div>

        <div class="username">
          ${item.username || "-"}
        </div>

        <div class="role">
          ${item.role || "-"}
        </div>

        <div>
          <span class="status ${statusClass}">
            ${item.status || "-"}
          </span>
        </div>

      `;


      list.appendChild(row);

    }
  );

}



/* =====================================================
   SEARCH
===================================================== */

function searchData() {


  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  if (!search) {

    renderData(allData);

    return;

  }


  const filtered =
    allData.filter(
      function(item) {

        return (

          String(item.name || "")
            .toLowerCase()
            .includes(search)

          ||

          String(item.username || "")
            .toLowerCase()
            .includes(search)

          ||

          String(item.role || "")
            .toLowerCase()
            .includes(search)

          ||

          String(item.status || "")
            .toLowerCase()
            .includes(search)

        );

      }
    );


  renderData(filtered);

}



/* =====================================================
   LOGOUT
===================================================== */

function logout() {


  localStorage.clear();


  window.location.replace(
    "index.html"
  );

}



/* =====================================================
   START
===================================================== */

loadData();


</script>


</body>

</html>

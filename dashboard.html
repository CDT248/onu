<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Data Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f4f7f6;
      color: #1f2937;
    }

    /* =========================
       HEADER
    ========================== */

    .header {
      width: 100%;
      height: 70px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 25px;

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #087f5b;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }


    /* =========================
       MAIN
    ========================== */

    .container {
      width: 100%;
      max-width: 1500px;
      margin: auto;
      padding: 25px;
    }


    /* =========================
       TOP
    ========================== */

    .top-section {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 15px;
      margin-bottom: 20px;
    }

    .title h1 {
      font-size: 27px;
      margin-bottom: 5px;
    }

    .title p {
      color: #6b7280;
      font-size: 14px;
    }


    /* =========================
       BUTTON
    ========================== */

    button {
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .btn {
      padding: 11px 17px;
      border-radius: 8px;

      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: #087f5b;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #066b4d;
    }

    .btn-refresh {
      background: #eef2f7;
      color: #374151;
    }

    .btn-refresh:hover {
      background: #e2e8f0;
    }

    .btn-cancel {
      background: #f1f5f9;
      color: #374151;
    }


    /* =========================
       FILTER BOX
    ========================== */

    .filter-box {
      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      padding: 18px;
      margin-bottom: 20px;
    }

    .filters {
      display: grid;

      grid-template-columns:
        2fr
        1fr
        1fr
        auto;

      gap: 12px;

      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;

      gap: 6px;
    }

    .field label {
      font-size: 12px;

      font-weight: 600;

      color: #6b7280;
    }

    .field input {
      width: 100%;
      height: 42px;

      border: 1px solid #d1d5db;
      border-radius: 8px;

      padding: 0 12px;

      outline: none;

      background: #ffffff;

      font-size: 14px;
    }

    .field input:focus {
      border-color: #087f5b;
    }


    /* =========================
       TABLE
    ========================== */

    .table-box {
      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 12px;

      overflow: hidden;
    }

    .table-header {
      padding: 16px 18px;

      border-bottom: 1px solid #e5e7eb;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .table-header h2 {
      font-size: 17px;
    }

    .total-count {
      font-size: 13px;
      color: #6b7280;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;

      border-collapse: collapse;

      min-width: 750px;
    }

    th {
      background: #f8fafc;

      padding: 14px;

      text-align: left;

      font-size: 12px;

      color: #64748b;

      white-space: nowrap;

      border-bottom: 1px solid #e5e7eb;
    }

    td {
      padding: 14px;

      border-bottom: 1px solid #eef0f2;

      font-size: 13px;

      white-space: nowrap;
    }

    tr:hover td {
      background: #fafafa;
    }


    /* =========================
       ACTIONS
    ========================== */

    .actions {
      display: flex;
      gap: 7px;
    }

    .btn-edit {
      background: #e8f1ff;

      color: #2563eb;

      padding: 7px 11px;

      border-radius: 6px;
    }

    .btn-edit:hover {
      background: #dbeafe;
    }

    .btn-delete {
      background: #fee2e2;

      color: #dc2626;

      padding: 7px 11px;

      border-radius: 6px;
    }

    .btn-delete:hover {
      background: #fecaca;
    }


    /* =========================
       DATE
    ========================== */

    .date-cell {
      color: #475569;
      font-weight: 500;
    }


    /* =========================
       PAGINATION
    ========================== */

    .pagination-box {
      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 15px 18px;

      border-top: 1px solid #e5e7eb;
    }

    .page-info {
      font-size: 13px;

      color: #6b7280;
    }

    .pagination {
      display: flex;

      gap: 5px;

      flex-wrap: wrap;
    }

    .page-btn {
      min-width: 35px;

      height: 35px;

      border: 1px solid #d1d5db;

      background: #ffffff;

      border-radius: 6px;

      font-size: 13px;
    }

    .page-btn:hover {
      background: #f1f5f9;
    }

    .page-btn.active {
      background: #087f5b;

      color: #ffffff;

      border-color: #087f5b;
    }


    /* =========================
       MODAL
    ========================== */

    .modal {
      position: fixed;

      inset: 0;

      background: rgba(0, 0, 0, 0.45);

      display: none;

      justify-content: center;

      align-items: center;

      padding: 20px;

      z-index: 999;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;

      max-width: 600px;

      max-height: 90vh;

      overflow-y: auto;

      background: #ffffff;

      border-radius: 14px;

      box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      padding: 18px 20px;

      border-bottom:
        1px solid #e5e7eb;

      display: flex;

      justify-content: space-between;

      align-items: center;
    }

    .modal-header h2 {
      font-size: 19px;
    }

    .close-btn {
      width: 34px;

      height: 34px;

      border-radius: 50%;

      background: #f1f5f9;

      font-size: 20px;

      color: #475569;
    }

    .close-btn:hover {
      background: #e2e8f0;
    }


    /* =========================
       FORM
    ========================== */

    .form {
      padding: 20px;
    }

    .form-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 15px;
    }

    .form-group {
      display: flex;

      flex-direction: column;

      gap: 7px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 13px;

      font-weight: 600;

      color: #374151;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;

      border: 1px solid #d1d5db;

      border-radius: 8px;

      padding: 11px 12px;

      outline: none;

      font-size: 14px;
    }

    .form-group textarea {
      min-height: 90px;

      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #087f5b;
    }

    .form-footer {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      padding-top: 20px;
    }


    /* =========================
       LOADING
    ========================== */

    .loading {
      text-align: center;

      padding: 45px 20px;

      color: #6b7280;
    }

    .empty {
      text-align: center;

      padding: 55px 20px;

      color: #6b7280;
    }


    /* =========================
       TOAST
    ========================== */

    .toast {
      position: fixed;

      right: 25px;

      bottom: 25px;

      min-width: 260px;

      padding: 14px 17px;

      border-radius: 9px;

      color: #ffffff;

      background: #111827;

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.2);

      transform: translateY(100px);

      opacity: 0;

      transition: 0.3s;

      z-index: 2000;

      font-size: 14px;
    }

    .toast.show {
      transform: translateY(0);

      opacity: 1;
    }

    .toast.success {
      background: #087f5b;
    }

    .toast.error {
      background: #dc2626;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 900px) {

      .filters {
        grid-template-columns: 1fr 1fr;
      }

      .search-field {
        grid-column: 1 / -1;
      }

      .top-section {
        align-items: flex-start;

        flex-direction: column;
      }

    }


    @media (max-width: 600px) {

      .header {
        height: auto;

        min-height: 70px;

        padding: 12px 15px;

        gap: 10px;
      }

      .logo {
        font-size: 18px;
      }

      .header-right {
        gap: 6px;
      }

      .header-right .btn {
        padding: 9px 10px;

        font-size: 12px;
      }

      .container {
        padding: 15px;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .search-field {
        grid-column: auto;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .pagination-box {
        flex-direction: column;

        gap: 12px;
      }

      .toast {
        left: 15px;

        right: 15px;

        min-width: auto;
      }

    }

  </style>
</head>


<body>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">

    <div class="logo">
      DATA DASHBOARD
    </div>

    <div class="header-right">

      <button
        class="btn btn-refresh"
        id="refreshBtn"
        onclick="loadData()"
      >
        🔄 Refresh
      </button>

      <button
        class="btn btn-primary"
        onclick="openEntryModal()"
      >
        ➕ New Entry
      </button>

    </div>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="container">


    <div class="top-section">

      <div class="title">

        <h1>
          Data Dashboard
        </h1>

        <p>
          Manage your entries
        </p>

      </div>

    </div>


    <!-- ===================================================
         FILTERS
    ==================================================== -->

    <section class="filter-box">

      <div class="filters">


        <!-- SEARCH -->

        <div class="field search-field">

          <label>
            🔍 Search
          </label>

          <input
            type="text"
            id="searchInput"
            placeholder="Search Name, IP or Work..."
            oninput="applyFilters()"
          >

        </div>


        <!-- FROM DATE -->

        <div class="field">

          <label>
            📅 From Date
          </label>

          <input
            type="date"
            id="fromDate"
            onchange="applyFilters()"
          >

        </div>


        <!-- TO DATE -->

        <div class="field">

          <label>
            📅 To Date
          </label>

          <input
            type="date"
            id="toDate"
            onchange="applyFilters()"
          >

        </div>


        <!-- CLEAR -->

        <button
          class="btn btn-refresh"
          onclick="clearFilters()"
        >
          Clear
        </button>


      </div>

    </section>


    <!-- ===================================================
         TABLE
    ==================================================== -->

    <section class="table-box">


      <div class="table-header">

        <h2>
          All Entries
        </h2>

        <div class="total-count">

          Total:
          <strong id="totalCount">
            0
          </strong>

        </div>

      </div>


      <div class="table-wrapper">

        <table>

          <thead>

            <tr>

              <th>
                Name
              </th>

              <th>
                Ip
              </th>

              <th>
                Work
              </th>

              <th>
                Date
              </th>

              <th>
                Action
              </th>

            </tr>

          </thead>


          <tbody id="tableBody">

            <tr>

              <td colspan="5">

                <div class="loading">
                  Loading data...
                </div>

              </td>

            </tr>

          </tbody>

        </table>

      </div>


      <!-- =================================================
           PAGINATION
      ================================================== -->

      <div class="pagination-box">

        <div
          class="page-info"
          id="pageInfo"
        >
          Page 1
        </div>


        <div
          class="pagination"
          id="pagination"
        ></div>

      </div>


    </section>


  </main>


  <!-- =====================================================
       ENTRY MODAL
  ====================================================== -->

  <div
    class="modal"
    id="entryModal"
  >


    <div class="modal-box">


      <div class="modal-header">

        <h2 id="modalTitle">
          New Entry
        </h2>


        <button
          class="close-btn"
          onclick="closeEntryModal()"
        >
          ×
        </button>

      </div>


      <form
        class="form"
        id="entryForm"
        onsubmit="submitEntry(event)"
      >


        <div class="form-grid">


          <!-- NAME -->

          <div class="form-group">

            <label>
              Name
            </label>

            <input
              type="text"
              id="nameInput"
              name="Name"
              placeholder="Enter name"
              autocomplete="off"
              required
            >

          </div>


          <!-- IP -->

          <div class="form-group">

            <label>
              IP
            </label>

            <input
              type="text"
              id="ipInput"
              name="Ip"
              placeholder="Enter IP"
              autocomplete="off"
              required
            >

          </div>


          <!-- WORK -->

          <div class="form-group full">

            <label>
              Work
            </label>

            <textarea
              id="workInput"
              name="Work"
              placeholder="Enter work"
              required
            ></textarea>

          </div>


          <!-- DATE -->

          <div class="form-group">

            <label>
              Date
            </label>

            <input
              type="date"
              id="dateInput"
              name="Date"
            >

          </div>


        </div>


        <div class="form-footer">


          <button
            type="button"
            class="btn btn-cancel"
            onclick="closeEntryModal()"
          >
            Cancel
          </button>


          <button
            type="submit"
            class="btn btn-primary"
            id="submitBtn"
          >
            Save Entry
          </button>


        </div>


      </form>


    </div>


  </div>


  <!-- =====================================================
       TOAST
  ====================================================== -->

  <div
    class="toast"
    id="toast"
  ></div>



  <script>


    /* =====================================================
       GOOGLE APPS SCRIPT URL
    ====================================================== */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbx6fo2Nogf3ETCtS_B-o0HCFqEs3vYkJ9IT9uu_-3l1w8fNJw77mZipeyFm-zZcjUw-5Q/exec";


    /* =====================================================
       SETTINGS
    ====================================================== */

    const ROWS_PER_PAGE = 10;


    /* =====================================================
       GLOBAL DATA
    ====================================================== */

    let allData = [];

    let filteredData = [];

    let currentPage = 1;

    let editingRow = null;



    /* =====================================================
       PAGE LOAD
    ====================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        loadData();

      }
    );



    /* =====================================================
       LOAD DATA
    ====================================================== */

    async function loadData() {


      const refreshBtn =
        document.getElementById(
          "refreshBtn"
        );


      refreshBtn.disabled = true;

      refreshBtn.textContent =
        "⏳ Loading...";


      showLoading();


      try {


        const response =
          await fetch(
            API_URL +
            "?action=getData&_=" +
            Date.now(),
            {
              method: "GET",

              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Server error: " +
            response.status
          );

        }


        const result =
          await response.json();


        console.log(
          "API Response:",
          result
        );


        if (
          result.success === false
        ) {

          throw new Error(
            result.message ||
            "Failed to load data."
          );

        }


        if (
          !Array.isArray(
            result.data
          )
        ) {

          throw new Error(
            "Invalid data received from Google Sheet."
          );

        }


        allData =
          result.data;


        filteredData =
          [...allData];


        currentPage = 1;


        renderTable();

        updateTotal();


        showToast(
          "Data loaded successfully.",
          "success"
        );


      } catch (error) {


        console.error(
          "Load Error:",
          error
        );


        showError(
          error.message ||
          "Failed to load data."
        );


        showToast(
          error.message ||
          "Data loading failed.",
          "error"
        );


      } finally {


        refreshBtn.disabled =
          false;


        refreshBtn.textContent =
          "🔄 Refresh";

      }

    }



    /* =====================================================
       RENDER TABLE
    ====================================================== */

    function renderTable() {


      const tbody =
        document.getElementById(
          "tableBody"
        );


      if (
        filteredData.length === 0
      ) {


        tbody.innerHTML = `

          <tr>

            <td colspan="5">

              <div class="empty">

                No data found.

              </div>

            </td>

          </tr>

        `;


        renderPagination();

        return;

      }


      const start =
        (
          currentPage - 1
        ) *
        ROWS_PER_PAGE;


      const end =
        start +
        ROWS_PER_PAGE;


      const pageData =
        filteredData.slice(
          start,
          end
        );


      let html = "";


      pageData.forEach(
        function (row) {


          html += `

            <tr>


              <td>
                ${escapeHTML(
                  row.Name || ""
                )}
              </td>


              <td>
                ${escapeHTML(
                  row.Ip || ""
                )}
              </td>


              <td>
                ${escapeHTML(
                  row.Work || ""
                )}
              </td>


              <td class="date-cell">
                ${escapeHTML(
                  row.Date || ""
                )}
              </td>


              <td>

                <div class="actions">


                  <button
                    class="btn-edit"
                    onclick="editEntryByRow(${Number(row._row)})"
                    title="Edit"
                  >
                    ✏️
                  </button>


                  <button
                    class="btn-delete"
                    onclick="deleteEntryByRow(${Number(row._row)})"
                    title="Delete"
                  >
                    🗑️
                  </button>


                </div>

              </td>


            </tr>

          `;

        }
      );


      tbody.innerHTML =
        html;


      renderPagination();

    }



    /* =====================================================
       SEARCH + DATE FILTER
    ====================================================== */

    function applyFilters() {


      const search =
        document
          .getElementById(
            "searchInput"
          )
          .value
          .toLowerCase()
          .trim();


      const fromDate =
        document
          .getElementById(
            "fromDate"
          )
          .value;


      const toDate =
        document
          .getElementById(
            "toDate"
          )
          .value;


      filteredData =
        allData.filter(
          function (row) {


            /* =====================
               SEARCH
            ====================== */

            if (search) {


              const searchText = (

                String(
                  row.Name || ""
                ) +

                " " +

                String(
                  row.Ip || ""
                ) +

                " " +

                String(
                  row.Work || ""
                ) +

                " " +

                String(
                  row.Date || ""
                )

              )
                .toLowerCase();


              if (
                !searchText.includes(
                  search
                )
              ) {

                return false;

              }

            }


            /* =====================
               DATE
            ====================== */

            if (
              fromDate ||
              toDate
            ) {


              const rowDate =
                convertToFilterDate(
                  row.Date
                );


              if (!rowDate) {

                return false;

              }


              if (
                fromDate &&
                rowDate < fromDate
              ) {

                return false;

              }


              if (
                toDate &&
                rowDate > toDate
              ) {

                return false;

              }

            }


            return true;

          }
        );


      currentPage = 1;


      renderTable();

      updateTotal();

    }



    /* =====================================================
       CLEAR FILTER
    ====================================================== */

    function clearFilters() {


      document
        .getElementById(
          "searchInput"
        )
        .value = "";


      document
        .getElementById(
          "fromDate"
        )
        .value = "";


      document
        .getElementById(
          "toDate"
        )
        .value = "";


      filteredData =
        [...allData];


      currentPage = 1;


      renderTable();

      updateTotal();

    }



    /* =====================================================
       DATE CONVERSION
    ====================================================== */

    function convertToFilterDate(
      value
    ) {


      if (!value) {

        return "";

      }


      const text =
        String(value)
          .trim();


      /*
        Expected:
        23 August 2026
      */

      const parsed =
        new Date(text);


      if (
        !isNaN(
          parsed.getTime()
        )
      ) {


        const year =
          parsed
            .getFullYear();


        const month =
          String(
            parsed.getMonth() + 1
          )
            .padStart(
              2,
              "0"
            );


        const day =
          String(
            parsed.getDate()
          )
            .padStart(
              2,
              "0"
            );


        return (
          year +
          "-" +
          month +
          "-" +
          day
        );

      }


      /*
        DD-MM-YYYY
      */

      const match =
        text.match(
          /^(\d{2})-(\d{2})-(\d{4})$/
        );


      if (match) {


        return (
          match[3] +
          "-" +
          match[2] +
          "-" +
          match[1]
        );

      }


      return "";

    }



    /* =====================================================
       PAGINATION
    ====================================================== */

    function renderPagination() {


      const pagination =
        document.getElementById(
          "pagination"
        );


      const pageInfo =
        document.getElementById(
          "pageInfo"
        );


      const totalPages =
        Math.ceil(
          filteredData.length /
          ROWS_PER_PAGE
        );


      if (
        totalPages <= 1
      ) {


        pagination.innerHTML =
          "";


        pageInfo.textContent =
          filteredData.length
            ? "Page 1"
            : "Page 0";


        return;

      }


      let html = "";


      /* PREVIOUS */

      html += `

        <button
          class="page-btn"
          onclick="changePage(${currentPage - 1})"
          ${currentPage === 1 ? "disabled" : ""}
        >
          ‹
        </button>

      `;


      let startPage =
        Math.max(
          1,
          currentPage - 2
        );


      let endPage =
        Math.min(
          totalPages,
          currentPage + 2
        );


      for (
        let i = startPage;
        i <= endPage;
        i++
      ) {


        html += `

          <button
            class="page-btn ${
              i === currentPage
                ? "active"
                : ""
            }"
            onclick="changePage(${i})"
          >
            ${i}
          </button>

        `;

      }


      /* NEXT */

      html += `

        <button
          class="page-btn"
          onclick="changePage(${currentPage + 1})"
          ${
            currentPage === totalPages
              ? "disabled"
              : ""
          }
        >
          ›
        </button>

      `;


      pagination.innerHTML =
        html;


      pageInfo.textContent =
        `Page ${currentPage} of ${totalPages}`;

    }



    function changePage(
      page
    ) {


      const totalPages =
        Math.ceil(
          filteredData.length /
          ROWS_PER_PAGE
        );


      if (
        page < 1 ||
        page > totalPages
      ) {

        return;

      }


      currentPage =
        page;


      renderTable();

    }



    /* =====================================================
       UPDATE TOTAL
    ====================================================== */

    function updateTotal() {


      document
        .getElementById(
          "totalCount"
        )
        .textContent =
        filteredData.length;

    }



    /* =====================================================
       OPEN NEW ENTRY
    ====================================================== */

    function openEntryModal() {


      editingRow =
        null;


      document
        .getElementById(
          "modalTitle"
        )
        .textContent =
        "New Entry";


      document
        .getElementById(
          "submitBtn"
        )
        .textContent =
        "Save Entry";


      document
        .getElementById(
          "entryForm"
        )
        .reset();


      /*
        Date automatically set to today
      */

      document
        .getElementById(
          "dateInput"
        )
        .value =
        getTodayInputDate();


      document
        .getElementById(
          "entryModal"
        )
        .classList
        .add("show");

    }



    /* =====================================================
       CLOSE MODAL
    ====================================================== */

    function closeEntryModal() {


      document
        .getElementById(
          "entryModal"
        )
        .classList
        .remove("show");


      editingRow =
        null;

    }



    /* =====================================================
       EDIT
    ====================================================== */

    function editEntryByRow(
      rowNumber
    ) {


      const row =
        allData.find(
          function (item) {

            return Number(
              item._row
            ) === Number(
              rowNumber
            );

          }
        );


      if (!row) {


        showToast(
          "Entry not found.",
          "error"
        );


        return;

      }


      editingRow =
        row;


      document
        .getElementById(
          "modalTitle"
        )
        .textContent =
        "Edit Entry";


      document
        .getElementById(
          "submitBtn"
        )
        .textContent =
        "Update Entry";


      document
        .getElementById(
          "nameInput"
        )
        .value =
        row.Name || "";


      document
        .getElementById(
          "ipInput"
        )
        .value =
        row.Ip || "";


      document
        .getElementById(
          "workInput"
        )
        .value =
        row.Work || "";


      document
        .getElementById(
          "dateInput"
        )
        .value =
        convertToFilterDate(
          row.Date
        );


      document
        .getElementById(
          "entryModal"
        )
        .classList
        .add("show");

    }



    /* =====================================================
       SUBMIT ENTRY
    ====================================================== */

    async function submitEntry(
      event
    ) {


      event.preventDefault();


      const submitBtn =
        document
          .getElementById(
            "submitBtn"
          );


      const name =
        document
          .getElementById(
            "nameInput"
          )
          .value
          .trim();


      const ip =
        document
          .getElementById(
            "ipInput"
          )
          .value
          .trim();


      const work =
        document
          .getElementById(
            "workInput"
          )
          .value
          .trim();


      const date =
        document
          .getElementById(
            "dateInput"
          )
          .value;


      if (!name) {


        showToast(
          "Please enter Name.",
          "error"
        );


        return;

      }


      if (!ip) {


        showToast(
          "Please enter IP.",
          "error"
        );


        return;

      }


      if (!work) {


        showToast(
          "Please enter Work.",
          "error"
        );


        return;

      }


      submitBtn.disabled =
        true;


      submitBtn.textContent =
        editingRow
          ? "Updating..."
          : "Saving...";


      try {


        const payload = {


          action:
            editingRow
              ? "update"
              : "create",


          data: {

            Name:
              name,

            Ip:
              ip,

            Work:
              work,

            Date:
              date

          },


          oldData:
            editingRow || null

        };


        const response =
          await fetch(
            API_URL,
            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify(
                  payload
                )

            }
          );


        if (!response.ok) {

          throw new Error(
            "Server error: " +
            response.status
          );

        }


        const result =
          await response.json();


        console.log(
          "Save Response:",
          result
        );


        if (
          result.success === false
        ) {

          throw new Error(
            result.message ||
            "Save failed."
          );

        }


        const wasEditing =
          Boolean(
            editingRow
          );


        closeEntryModal();


        showToast(
          wasEditing
            ? "Entry updated successfully."
            : "Entry added successfully.",
          "success"
        );


        await loadData();


      } catch (error) {


        console.error(
          "Save Error:",
          error
        );


        showToast(
          error.message ||
          "Failed to save entry.",
          "error"
        );


      } finally {


        submitBtn.disabled =
          false;


        submitBtn.textContent =
          editingRow
            ? "Update Entry"
            : "Save Entry";

      }

    }



    /* =====================================================
       DELETE
    ====================================================== */

    async function deleteEntryByRow(
      rowNumber
    ) {


      const row =
        allData.find(
          function (item) {

            return Number(
              item._row
            ) === Number(
              rowNumber
            );

          }
        );


      if (!row) {


        showToast(
          "Entry not found.",
          "error"
        );


        return;

      }


      const confirmed =
        confirm(
          "Are you sure you want to delete this entry?\n\n" +
          "Name: " +
          (row.Name || "") +
          "\nIP: " +
          (row.Ip || "")
        );


      if (!confirmed) {

        return;

      }


      try {


        const payload = {


          action:
            "delete",


          data:
            row

        };


        const response =
          await fetch(
            API_URL,
            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "text/plain;charset=utf-8"

              },

              body:
                JSON.stringify(
                  payload
                )

            }
          );


        if (!response.ok) {

          throw new Error(
            "Server error: " +
            response.status
          );

        }


        const result =
          await response.json();


        console.log(
          "Delete Response:",
          result
        );


        if (
          result.success === false
        ) {

          throw new Error(
            result.message ||
            "Delete failed."
          );

        }


        showToast(
          "Entry deleted successfully.",
          "success"
        );


        await loadData();


      } catch (error) {


        console.error(
          "Delete Error:",
          error
        );


        showToast(
          error.message ||
          "Failed to delete entry.",
          "error"
        );

      }

    }



    /* =====================================================
       TODAY
    ====================================================== */

    function getTodayInputDate() {


      const now =
        new Date();


      const year =
        now.getFullYear();


      const month =
        String(
          now.getMonth() + 1
        )
        .padStart(
          2,
          "0"
        );


      const day =
        String(
          now.getDate()
        )
        .padStart(
          2,
          "0"
        );


      return (
        year +
        "-" +
        month +
        "-" +
        day
      );

    }



    /* =====================================================
       LOADING
    ====================================================== */

    function showLoading() {


      document
        .getElementById(
          "tableBody"
        )
        .innerHTML = `

          <tr>

            <td colspan="5">

              <div class="loading">

                ⏳ Loading data...

              </div>

            </td>

          </tr>

        `;

    }



    /* =====================================================
       ERROR
    ====================================================== */

    function showError(
      message
    ) {


      document
        .getElementById(
          "tableBody"
        )
        .innerHTML = `

          <tr>

            <td colspan="5">

              <div class="empty">

                ❌
                ${escapeHTML(
                  message
                )}

              </div>

            </td>

          </tr>

        `;

    }



    /* =====================================================
       TOAST
    ====================================================== */

    function showToast(
      message,
      type
    ) {


      const toast =
        document
          .getElementById(
            "toast"
          );


      toast.textContent =
        message;


      toast.className =
        "toast show " +
        (
          type || ""
        );


      setTimeout(
        function () {

          toast.className =
            "toast";

        },
        3000
      );

    }



    /* =====================================================
       HTML SECURITY
    ====================================================== */

    function escapeHTML(
      value
    ) {


      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }



    /* =====================================================
       CLOSE MODAL OUTSIDE CLICK
    ====================================================== */

    document
      .getElementById(
        "entryModal"
      )
      .addEventListener(
        "click",
        function (event) {


          if (
            event.target === this
          ) {

            closeEntryModal();

          }

        }
      );



    /* =====================================================
       ESCAPE KEY CLOSE MODAL
    ====================================================== */

    document.addEventListener(
      "keydown",
      function (event) {


        if (
          event.key === "Escape"
        ) {

          closeEntryModal();

        }

      }
    );

  </script>

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Dashboard</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }


    body {

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top left,
          rgba(0, 255, 140, 0.10),
          transparent 35%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(255, 0, 60, 0.08),
          transparent 35%
        ),
        #070a0e;

      color: white;
    }


    /* =========================
       HEADER
    ========================= */

    .header {

      height: 72px;

      padding: 0 35px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      background:
        rgba(13,17,22,0.92);

      border-bottom:
        1px solid rgba(255,255,255,0.07);

      backdrop-filter: blur(15px);

      position: sticky;

      top: 0;

      z-index: 100;
    }


    .brand {

      display: flex;

      align-items: center;

      gap: 12px;
    }


    .brand-icon {

      width: 40px;
      height: 40px;

      border-radius: 11px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #00d084,
          #00a86b
        );

      font-size: 20px;

      color: #04100a;
    }


    .brand-name {

      font-size: 18px;

      font-weight: 700;
    }


    .user-area {

      display: flex;

      align-items: center;

      gap: 15px;
    }


    .user-name {

      color: #b9c1cc;

      font-size: 13px;
    }


    .logout-btn {

      border: 1px solid
        rgba(255,255,255,0.08);

      background: #151a20;

      color: #ff667d;

      padding: 10px 16px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 13px;

      font-weight: 600;

      transition: 0.25s;
    }


    .logout-btn:hover {

      background:
        rgba(255,60,85,0.10);

      border-color:
        rgba(255,60,85,0.25);
    }


    /* =========================
       MAIN
    ========================= */

    .main {

      max-width: 1100px;

      margin: auto;

      padding: 55px 25px;
    }


    .welcome {

      margin-bottom: 40px;
    }


    .welcome h1 {

      font-size: 32px;

      margin-bottom: 8px;
    }


    .welcome p {

      color: #7f8996;

      font-size: 14px;
    }


    /* =========================
       CARDS
    ========================= */

    .cards {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 25px;
    }


    .card {

      min-height: 260px;

      padding: 30px;

      border-radius: 22px;

      background:
        rgba(18,22,28,0.94);

      border:
        1px solid
        rgba(255,255,255,0.07);

      box-shadow:
        0 20px 50px
        rgba(0,0,0,0.35);

      cursor: pointer;

      position: relative;

      overflow: hidden;

      transition:
        transform 0.3s,
        border-color 0.3s,
        box-shadow 0.3s;
    }


    .card:hover {

      transform:
        translateY(-7px);

      border-color:
        rgba(0,208,132,0.30);

      box-shadow:
        0 25px 60px
        rgba(0,0,0,0.50);
    }


    .card::before {

      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      right: -70px;
      bottom: -70px;

      border-radius: 50%;

      background:
        rgba(0,208,132,0.08);
    }


    .card-icon {

      width: 65px;
      height: 65px;

      border-radius: 17px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 31px;

      background:
        rgba(0,208,132,0.09);

      border:
        1px solid
        rgba(0,208,132,0.12);

      margin-bottom: 25px;
    }


    .card h2 {

      font-size: 24px;

      margin-bottom: 10px;
    }


    .card p {

      color: #7e8794;

      font-size: 13px;

      line-height: 1.6;

      max-width: 400px;
    }


    .open-text {

      position: absolute;

      left: 30px;

      bottom: 25px;

      color: #00d084;

      font-size: 13px;

      font-weight: 600;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {

      text-align: center;

      margin-top: 55px;

      color: #4f5863;

      font-size: 11px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media(max-width:700px) {

      .header {

        padding: 0 18px;
      }


      .brand-name {

        font-size: 16px;
      }


      .user-name {

        display: none;
      }


      .main {

        padding:
          35px 18px;
      }


      .welcome h1 {

        font-size: 27px;
      }


      .cards {

        grid-template-columns:
          1fr;
      }


      .card {

        min-height: 230px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">


    <div class="brand">

      <div class="brand-icon">
        ⚡
      </div>

      <div class="brand-name">
        Dashboard
      </div>

    </div>


    <div class="user-area">

      <div
        class="user-name"
        id="userName">

        User

      </div>


      <button
        class="logout-btn"
        onclick="logout()">

        Logout

      </button>

    </div>


  </header>



  <!-- =========================
       MAIN
  ========================== -->

  <main class="main">


    <div class="welcome">

      <h1>
        Welcome 👋
      </h1>

      <p>
        Choose an option to continue.
      </p>

    </div>



    <!-- =========================
         CARDS
    ========================== -->

    <div class="cards">


      <!-- ANTI ONU -->

      <div
        class="card"
        onclick="openAntiONU()">


        <div class="card-icon">
          🛡️
        </div>


        <h2>
          ANTI ONU
        </h2>


        <p>
          Manage and access the
          ANTI ONU system.
        </p>


        <div class="open-text">
          Open →
        </div>


      </div>



      <!-- USER -->

      <div
        class="card"
        onclick="openUser()">


        <div class="card-icon">
          👤
        </div>


        <h2>
          USER
        </h2>


        <p>
          Manage users and access
          user related information.
        </p>


        <div class="open-text">
          Open →
        </div>


      </div>


    </div>



    <div class="footer">

      Secure Dashboard System

    </div>


  </main>



<script>


/* =====================================================
   LOGIN PROTECTION
===================================================== */

const loggedIn =
  localStorage.getItem(
    "loggedIn"
  );


if (loggedIn !== "true") {

  window.location.href =
    "index.html";

}



/* =====================================================
   SHOW USER NAME
===================================================== */

const name =
  localStorage.getItem(
    "name"
  );


const username =
  localStorage.getItem(
    "username"
  );


document.getElementById(
  "userName"
).textContent =
  name ||
  username ||
  "User";



/* =====================================================
   ANTI ONU
===================================================== */

function openAntiONU() {

  /*
    এখানে তোমার ANTI ONU page-এর নাম দাও।

    Example:
    window.location.href = "anti-onu.html";
  */

  window.location.href =
    "anti-onu.html";

}



/* =====================================================
   USER
===================================================== */

function openUser() {

  /*
    এখানে তোমার User page-এর নাম দাও।

    Example:
    window.location.href = "user.html";
  */

  window.location.href =
    "user.html";

}



/* =====================================================
   LOGOUT
===================================================== */

function logout() {


  localStorage.removeItem(
    "loggedIn"
  );


  localStorage.removeItem(
    "username"
  );


  localStorage.removeItem(
    "name"
  );


  localStorage.removeItem(
    "role"
  );


  localStorage.removeItem(
    "status"
  );


  localStorage.removeItem(
    "photo"
  );


  window.location.replace(
    "index.html"
  );

}


</script>


</body>

</html>

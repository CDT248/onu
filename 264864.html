<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Support Dashboard</title>

<link
  rel="icon"
  href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
>

<style>

/* ============================================================
   ROOT
============================================================ */

:root{
  --bg:#f4f7f6;
  --card:#ffffff;
  --text:#17221e;
  --muted:#718079;
  --border:#dfe7e3;
  --green:#16a34a;
  --green-dark:#15803d;
  --green-light:#dcfce7;
  --danger:#dc2626;
  --warning:#d97706;
  --shadow:0 10px 30px rgba(0,0,0,.07);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.25s;
}

body.dark{
  --bg:#0d1411;
  --card:#151e1a;
  --text:#edf7f1;
  --muted:#93a59c;
  --border:#27352e;
  --green:#22c55e;
  --green-dark:#16a34a;
  --green-light:#173a25;
  --shadow:0 10px 30px rgba(0,0,0,.25);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

/* ============================================================
   HEADER
============================================================ */

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:var(--card);
  border-bottom:1px solid var(--border);
  box-shadow:0 2px 12px rgba(0,0,0,.04);
}

.header-inner{
  width:100%;
  max-width:1600px;
  margin:auto;
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:210px;
}

.logo-icon{
  width:42px;
  height:42px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--green);
  color:#fff;
  font-size:21px;
  font-weight:800;
}

.logo-text{
  font-size:18px;
  font-weight:800;
}

.logo-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.header-actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:9px;
  padding:9px 13px;
  font-weight:650;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  transition:.2s;
  white-space:nowrap;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:var(--green);
}

.btn-green{
  color:#fff;
  background:var(--green);
  border-color:var(--green);
}

.btn-green:hover{
  background:var(--green-dark);
  border-color:var(--green-dark);
}

.btn-danger{
  color:#fff;
  background:var(--danger);
  border-color:var(--danger);
}

.btn-warning{
  color:#fff;
  background:var(--warning);
  border-color:var(--warning);
}

.btn-small{
  padding:6px 9px;
  font-size:12px;
  border-radius:7px;
}

.profile-wrap{
  position:relative;
}

.profile-btn{
  border:1px solid var(--border);
  background:var(--card);
  padding:3px;
  border-radius:50%;
  width:40px;
  height:40px;
}

.profile-btn img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
}

.profile-menu{
  position:absolute;
  right:0;
  top:48px;
  width:190px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:var(--shadow);
  padding:7px;
  display:none;
}

.profile-menu.show{
  display:block;
}

.profile-menu button{
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  text-align:left;
  padding:10px;
  border-radius:8px;
}

.profile-menu button:hover{
  background:var(--green-light);
}

/* ============================================================
   MAIN
============================================================ */

.container{
  width:100%;
  max-width:1600px;
  margin:auto;
  padding:22px;
}

.page-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:17px;
}

.page-title{
  font-size:25px;
  font-weight:850;
}

.page-subtitle{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.toolbar-actions{
  display:flex;
  gap:8px;
}

/* ============================================================
   FILTER
============================================================ */

.filter-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.filter-grid{
  display:grid;
  grid-template-columns:
    minmax(200px,1.8fr)
    minmax(120px,.7fr)
    minmax(120px,.7fr)
    minmax(120px,.7fr)
    minmax(120px,.7fr)
    auto;
  gap:9px;
  align-items:center;
}

.input,
.select{
  width:100%;
  min-height:40px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:9px;
  outline:none;
  padding:9px 11px;
}

.input:focus,
.select:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(34,197,94,.1);
}

.filter-counts{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.count-box{
  padding:8px 11px;
  border-radius:8px;
  background:var(--green-light);
  color:var(--green-dark);
  font-size:12px;
  font-weight:750;
}

/* ============================================================
   TABLE
============================================================ */

.table-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.table-wrap{
  width:100%;
  overflow:auto;
}

table{
  width:100%;
  min-width:850px;
  border-collapse:collapse;
}

thead{
  background:var(--green-light);
}

th{
  text-align:left;
  padding:12px 13px;
  font-size:12px;
  font-weight:800;
  color:var(--green-dark);
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}

td{
  padding:11px 13px;
  border-bottom:1px solid var(--border);
  font-size:13px;
  vertical-align:middle;
}

tbody tr:hover{
  background:rgba(34,197,94,.035);
}

tbody tr:last-child td{
  border-bottom:0;
}

.action-cell{
  white-space:nowrap;
}

.action-group{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:750;
  background:var(--green-light);
  color:var(--green-dark);
}

.badge-danger{
  background:#fee2e2;
  color:#b91c1c;
}

.badge-warning{
  background:#fef3c7;
  color:#92400e;
}

body.dark .badge-danger{
  background:#431b1b;
  color:#fca5a5;
}

body.dark .badge-warning{
  background:#423313;
  color:#fcd34d;
}

.empty{
  padding:50px 20px;
  text-align:center;
  color:var(--muted);
}

.empty-icon{
  font-size:35px;
  margin-bottom:8px;
}

/* ============================================================
   PAGINATION
============================================================ */

.pagination{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 14px;
  border-top:1px solid var(--border);
}

.page-info{
  font-size:12px;
  color:var(--muted);
}

.page-buttons{
  display:flex;
  gap:5px;
}

.page-btn{
  min-width:34px;
  height:34px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:7px;
}

.page-btn.active{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}

/* ============================================================
   MODAL
============================================================ */

.modal-overlay{
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal-overlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:600px;
  max-height:92vh;
  overflow:auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modal-lg{
  max-width:900px;
}

.modal-header{
  position:sticky;
  top:0;
  z-index:2;
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:15px 17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.modal-title{
  font-size:17px;
  font-weight:800;
}

.close-btn{
  width:34px;
  height:34px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
  font-size:19px;
}

.modal-body{
  padding:17px;
}

.modal-footer{
  position:sticky;
  bottom:0;
  background:var(--card);
  border-top:1px solid var(--border);
  padding:12px 17px;
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-label{
  font-size:12px;
  font-weight:750;
  color:var(--muted);
}

.password-wrap{
  position:relative;
}

.password-wrap .input{
  padding-right:42px;
}

.password-toggle{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  color:var(--muted);
}

/* ============================================================
   MODAL TABLE
============================================================ */

.modal-table-wrap{
  overflow:auto;
  border:1px solid var(--border);
  border-radius:10px;
}

.modal-table{
  min-width:700px;
}

.modal-table th,
.modal-table td{
  padding:9px 10px;
}

.user-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

/* ============================================================
   LOADER
============================================================ */

.loader-overlay{
  position:fixed;
  inset:0;
  z-index:3000;
  background:rgba(0,0,0,.35);
  display:none;
  align-items:center;
  justify-content:center;
}

.loader-overlay.show{
  display:flex;
}

.loader-box{
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:13px;
  padding:20px 25px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:var(--shadow);
}

.spinner{
  width:25px;
  height:25px;
  border:3px solid var(--border);
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* ============================================================
   TOAST
============================================================ */

.toast-container{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:5000;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.toast{
  min-width:240px;
  max-width:360px;
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
  border-left:4px solid var(--green);
  border-radius:10px;
  padding:12px 14px;
  box-shadow:var(--shadow);
  animation:toastIn .2s ease;
  font-size:13px;
}

.toast.error{
  border-left-color:var(--danger);
}

.toast.warning{
  border-left-color:var(--warning);
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ============================================================
   MOBILE
============================================================ */

@media(max-width:1000px){

  .filter-grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:700px){

  .header-inner{
    padding:11px 13px;
    align-items:flex-start;
  }

  .logo-area{
    min-width:auto;
  }

  .logo-text{
    font-size:15px;
  }

  .logo-sub{
    display:none;
  }

  .header-actions{
    gap:5px;
  }

  .header-actions .btn{
    padding:8px 9px;
    font-size:12px;
  }

  .container{
    padding:13px;
  }

  .page-top{
    align-items:flex-start;
    flex-direction:column;
  }

  .filter-grid{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .pagination{
    align-items:flex-start;
    flex-direction:column;
  }

}

/* ============================================================
   HIDDEN
============================================================ */

.hidden{
  display:none !important;
}

</style>
</head>

<body>

<!-- ============================================================
     HEADER
============================================================ -->

<header class="header">

  <div class="header-inner">

    <div class="logo-area">

      <div class="logo-icon">
        S
      </div>

      <div>
        <div class="logo-text">
          Support Dashboard
        </div>

        <div class="logo-sub">
          Data management system
        </div>
      </div>

    </div>


    <div class="header-actions">

      <button
        class="btn"
        onclick="loadData(true)"
      >
        ↻ Reload
      </button>


      <button
        class="btn"
        onclick="openUsersModal()"
      >
        👥 Users
      </button>


      <button
        class="btn"
        onclick="openItemsModal()"
      >
        📦 Items
      </button>


      <button
        class="btn btn-green"
        onclick="openEntryModal()"
      >
        ＋ New Entry
      </button>


      <button
        class="btn"
        onclick="toggleTheme()"
      >
        🌙 Dark Mode
      </button>


      <div class="profile-wrap">

        <button
          class="profile-btn"
          onclick="toggleProfileMenu(event)"
        >
          <img
            id="profileImage"
            src="https://cdn-icons-png.flaticon.com/128/149/149071.png"
            alt="Profile"
          >
        </button>


        <div
          class="profile-menu"
          id="profileMenu"
        >

          <button onclick="openPasswordModal()">
            🔑 Change Password
          </button>

          <button onclick="logout()">
            🚪 Logout
          </button>

        </div>

      </div>

    </div>

  </div>

</header>


<!-- ============================================================
     MAIN
============================================================ -->

<main class="container">

  <div class="page-top">

    <div>

      <div
        class="page-title"
        id="dataTitle"
      >
        Data
      </div>

      <div
        class="page-subtitle"
        id="dataSubtitle"
      >
        Manage support entries
      </div>

    </div>


    <div class="toolbar-actions">

      <button
        class="btn"
        onclick="loadData(true)"
      >
        ↻ Refresh Data
      </button>

    </div>

  </div>


  <!-- ==========================================================
       FILTER
  =========================================================== -->

  <div class="filter-card">

    <div class="filter-grid">

      <input
        type="text"
        id="searchInput"
        class="input"
        placeholder="🔎 Search Name, IP, Work, Item..."
        oninput="applyFilters()"
      >


      <input
        type="date"
        id="fromDate"
        class="input"
        onchange="applyFilters()"
        title="From Date"
      >


      <input
        type="date"
        id="toDate"
        class="input"
        onchange="applyFilters()"
        title="To Date"
      >


      <select
        id="dataType"
        class="select"
        onchange="changeDataType()"
      >

        <option value="data">
          Data
        </option>

        <option value="sell">
          Sell
        </option>

        <option value="paid">
          Paid
        </option>

        <option value="delete">
          Delete
        </option>

      </select>


      <div class="filter-counts">

        <div class="count-box">
          Total:
          <span id="totalCount">0</span>
        </div>

        <div class="count-box">
          Result:
          <span id="resultCount">0</span>
        </div>

      </div>


      <button
        class="btn"
        onclick="clearFilters()"
      >
        Clear
      </button>

    </div>

  </div>


  <!-- ==========================================================
       TABLE
  =========================================================== -->

  <div class="table-card">

    <div class="table-wrap">

      <table>

        <thead id="tableHead"></thead>

        <tbody id="tableBody"></tbody>

      </table>

      <div
        id="emptyState"
        class="empty hidden"
      >

        <div class="empty-icon">
          📭
        </div>

        <div>
          No data found
        </div>

      </div>

    </div>


    <div
      class="pagination"
      id="pagination"
    ></div>

  </div>

</main>


<!-- ============================================================
     ENTRY MODAL
============================================================ -->

<div
  class="modal-overlay"
  id="entryModal"
  onclick="overlayClose(event,'entryModal')"
>

  <div class="modal">

    <div class="modal-header">

      <div
        class="modal-title"
        id="entryModalTitle"
      >
        New Entry
      </div>

      <button
        class="close-btn"
        onclick="closeModal('entryModal')"
      >
        ×
      </button>

    </div>


    <div class="modal-body">

      <div class="form-grid">

        <div class="form-group">

          <label class="form-label">
            Name
          </label>

          <input
            type="text"
            id="entryName"
            class="input"
            placeholder="Name"
          >

        </div>


        <div class="form-group">

          <label class="form-label">
            IP
          </label>

          <input
            type="text"
            id="entryIp"
            class="input"
            placeholder="IP address"
          >

        </div>


        <div class="form-group">

          <label class="form-label">
            Work
          </label>

          <input
            type="text"
            id="entryWork"
            class="input"
            placeholder="Work"
          >

        </div>


        <div class="form-group">

          <label class="form-label">
            Date
          </label>

          <input
            type="date"
            id="entryDate"
            class="input"
          >

        </div>


        <div class="form-group full">

          <label class="form-label">
            Item
          </label>

          <select
            id="entryItem"
            class="select"
          >

            <option value="">
              Select Item
            </option>

          </select>

        </div>

      </div>

    </div>


    <div class="modal-footer">

      <button
        class="btn"
        onclick="closeModal('entryModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-green"
        onclick="saveEntry()"
      >
        Save
      </button>

    </div>

  </div>

</div>


<!-- ============================================================
     USERS MODAL
============================================================ -->

<div
  class="modal-overlay"
  id="usersModal"
  onclick="overlayClose(event,'usersModal')"
>

  <div class="modal modal-lg">

    <div class="modal-header">

      <div class="modal-title">
        User Management
      </div>

      <button
        class="close-btn"
        onclick="closeModal('usersModal')"
      >
        ×
      </button>

    </div>


    <div class="modal-body">

      <div
        style="
          display:flex;
          justify-content:flex-end;
          margin-bottom:12px;
        "
      >

        <button
          class="btn btn-green"
          onclick="openAddUserModal()"
        >
          ＋ Add User
        </button>

      </div>


      <div class="modal-table-wrap">

        <table class="modal-table">

          <thead>

            <tr>

              <th>
                Username
              </th>

              <th>
                Name
              </th>

              <th>
                Role
              </th>

              <th>
                Status
              </th>

              <th>
                Action
              </th>

            </tr>

          </thead>

          <tbody id="usersBody"></tbody>

        </table>

      </div>

    </div>

  </div>

</div>


<!-- ============================================================
     ADD / EDIT USER MODAL
============================================================ -->

<div
  class="modal-overlay"
  id="userFormModal"
  onclick="overlayClose(event,'userFormModal')"
>

  <div class="modal">

    <div class="modal-header">

      <div
        class="modal-title"
        id="userFormTitle"
      >
        Add User
      </div>

      <button
        class="close-btn"
        onclick="closeModal('userFormModal')"
      >
        ×
      </button>

    </div>


    <div class="modal-body">

      <div class="form-grid">

        <div class="form-group">

          <label class="form-label">
            Username
          </label>

          <input
            type="text"
            id="userUsername"
            class="input"
            placeholder="Username"
          >

        </div>


        <div class="form-group">

          <label class="form-label">
            Password
          </label>

          <div class="password-wrap">

            <input
              type="text"
              id="userPassword"
              class="input"
              placeholder="Password"
            >

/* ============================================================

  if(!localAuth && !sessionAuth){

  return true;
}


/* ============================================================

============================================================ */

async function loadUser(){

  if(!currentUsername){
    return;
  }

  try{

    const response =
      await fetch(
        USER_API_URL +
        "?action=getUser&username=" +
        encodeURIComponent(currentUsername) +
        "&_=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );

    const result =
      await response.json();

    if(
      result &&
      result.success &&
      result.user
    ){

      const user =
        result.user;

      const name =
        String(
          user.Name ||
          user.name ||
          ""
        ).trim();

      const role =
        String(
          user.Role ||
          user.role ||
          ""
        ).trim();

      const status =
        String(
          user.Status ||
          user.status ||
          ""
        ).trim();

      if(name){
        localStorage.setItem(
          "name",
          name
        );
      }

      if(role){
        localStorage.setItem(
          "role",
          role
        );
      }

      if(status){
        localStorage.setItem(
          "status",
          status
        );
      }

      if(user.Picture){

        document.getElementById(
          "profileImage"
        ).src =
          user.Picture;

      }

      const statusLower =
        status.toLowerCase();

      if(
        statusLower === "block" ||
        statusLower === "blocked"

        return;

    }

/* ============================================================

async function loadData(
  force = false
){

  let cached = null;

  if(
    currentDataType === "data"

    cached = dataCache;
  }
  else if(
    currentDataType === "sell"
  ){
    cached = sellCache;
  }
  else if(
    currentDataType === "paid"
  ){
    cached = paidCache;
  }
  else if(
    currentDataType === "delete"
  ){
    cached = deleteCache;
  }


  if(
    cached &&
    !force
  ){

    allData =
      attachSheetRowNumbers(
        cached
      );

    applyFilters();

    return;
  }


  showLoader();


  try{

    let api =
      DATA_API_URL;

    let action =
      "getData";


    if(currentDataType === "sell"){

      api =
        SELL_API_URL;

      action =
        "getSellData";

    }
    else if(
      currentDataType === "paid"
    ){

      api =
        PAID_API_URL;

      action =
        "getPaidData";

    }
    else if(
      currentDataType === "delete"
    ){

      api =
        DELETE_API_URL;

      action =
        "getDeletedData";

    }


    const separator =
      api.includes("?")
        ? "&"
        : "?";


    const response =
      await fetch(
        api +
        separator +
        "action=" +
        encodeURIComponent(action) +
        "&_=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    if(
      !result ||
      result.success !== true
    ){

      throw new Error(
        result?.message ||
        "Failed to load data"
      );

    }


    allData =
      attachSheetRowNumbers(
        Array.isArray(result.data)
          ? result.data
          : []
      );


    if(currentDataType === "data"){
      dataCache = allData;
    }
    else if(currentDataType === "sell"){
      sellCache = allData;
    }
    else if(currentDataType === "paid"){
      paidCache = allData;
    }
    else if(currentDataType === "delete"){
      deleteCache = allData;
    }


    applyFilters();


  }catch(error){

    console.error(
      "loadData error:",
      error
    );

    allData = [];

    applyFilters();

    showToast(
      error.message ||
      "Unable to load data",
      "error"
    );

  }
  finally{

    hideLoader();

  }

}


/* ============================================================
   ATTACH SHEET ROW NUMBERS
============================================================ */

function attachSheetRowNumbers(
  data
){

  return data.map(
    (
      row,
      index
    ) => {

      if(!row){
        return row;
      }

      const existing =
        getRealRowNumber(row);

      if(
        existing &&
        existing >= 2
      ){

        return row;

      }


      if(
        typeof row === "object" &&
        !Array.isArray(row)
      ){

        return {
          ...row,
          _sheetRow:
            index + 2
        };

      }


      return row;

    }
  );

}


/* ============================================================
   GET REAL ROW NUMBER
============================================================ */

function getRealRowNumber(
  row
){

  if(!row){
    return null;
  }


  const keys = [
    "_sheetRow",
    "sheetRow",
    "SheetRow",
    "row",
    "rowNumber",
    "sourceRow",
    "originalRow",
    "originalRowNumber",
    "sellRow",
    "SellRow"
  ];


  if(
    typeof row === "object"
  ){

    for(
      const key of keys
    ){

      const value =
        Number(
          row[key]
        );

      if(
        Number.isFinite(value) &&
        value >= 2
      ){

        return value;

      }

    }

  }


  if(Array.isArray(row)){

    for(
      let i =
        row.length - 1;
      i >= 9;
      i--
    ){

      const value =
        Number(
          row[i]
        );

      if(
        Number.isFinite(value) &&
        value >= 2
      ){

        return value;

      }

    }

  }


  return null;

}

/* ============================================================
   APPLY FILTERS
============================================================ */

function applyFilters(){

  const search =
    String(
      document.getElementById(
        "searchInput"
      ).value ||
      ""
    )
    .trim()
    .toLowerCase();


  const fromDate =
    document.getElementById(
      "fromDate"
    ).value;


  const toDate =
    document.getElementById(
      "toDate"
    ).value;


  filteredData =
    allData.filter(
      row => {

        if(search){

          const searchable =
            JSON.stringify(
              row
            ).toLowerCase();

          if(
            !searchable.includes(
              search
            )
          ){

            return false;

          }

        }


        const rowDate =
          normalizeDate(
            getField(
              row,
              [
                "Date",
                "date",
                3
              ]
            )
          );


        if(fromDate){

          if(
            rowDate &&
            rowDate < fromDate
          ){

            return false;

          }

        }


        if(toDate){

          if(
            rowDate &&
            rowDate > toDate
          ){

            return false;

          }

        }


        return true;

      }
    );


  document.getElementById(
    "totalCount"
  ).textContent =
    allData.length;


  document.getElementById(
    "resultCount"
  ).textContent =
    filteredData.length;


  const totalPages =
    Math.max(
      1,
      Math.ceil(
        filteredData.length /
        pageSize
      )
    );


  if(
    currentPage >
    totalPages
  ){

    currentPage =
      totalPages;

  }


  renderData(
    filteredData
  );

}

   CLEAR FILTERS
============================================================ */

function clearFilters(){

  clearFilterInputs();

  currentPage = 1;

  applyFilters();

}


/* ============================================================
   PAGINATION
============================================================ */

function renderPagination(
  total
){

  const container =
    document.getElementById(
      "pagination"
    );


  container.innerHTML = "";


  if(total <= pageSize){

    if(total > 0){

      container.innerHTML = `
        <div class="page-info">
          Showing ${total} result(s)
        </div>
      `;

    }

    return;

  }


  const pages =
    Math.ceil(
      total /
      pageSize
    );


  const info =
    document.createElement(
      "div"
    );

  info.className =
    "page-info";

  const start =
    ((currentPage - 1) * pageSize) + 1;

  const end =
    Math.min(
      currentPage * pageSize,
      total
    );

  info.textContent =
    `Showing ${start}-${end} of ${total}`;


  const buttons =
    document.createElement(
      "div"
    );

  buttons.className =
    "page-buttons";


  const previous =
    document.createElement(
      "button"
    );

  previous.className =
    "page-btn";

  previous.textContent =
    "‹";

  previous.disabled =
    currentPage === 1;

  previous.onclick =
    () => {

      if(
        currentPage > 1
      ){

        currentPage--;

        renderData(
          filteredData
        );

      }

    };


  buttons.appendChild(
    previous
  );


  for(
    let i = 1;
    i <= pages;
    i++
  ){

    if(
      pages > 7 &&
      i > 2 &&
      i < pages - 1 &&
      Math.abs(
        i - currentPage
      ) > 1
    ){

      if(
        !buttons.querySelector(
          ".dots"
        )
      ){

        const dots =
          document.createElement(
            "span"
          );

        dots.className =
          "page-btn dots";

        dots.textContent =
          "...";

        dots.style.display =
          "inline-flex";

        dots.style.alignItems =
          "center";

        dots.style.justifyContent =
          "center";

        buttons.appendChild(
          dots
        );

      }

      continue;

    }


    const btn =
      document.createElement(
        "button"
      );

    btn.className =
      "page-btn" +
      (
        i === currentPage
          ? " active"
          : ""
      );

    btn.textContent =
      i;

    btn.onclick =
      () => {

        currentPage = i;

        renderData(
          filteredData
        );

      };


    buttons.appendChild(
      btn
    );

  }


  const next =
    document.createElement(
      "button"
    );

  next.className =
    "page-btn";

  next.textContent =
    "›";

  next.disabled =
    currentPage === pages;

  next.onclick =
    () => {

      if(
        currentPage < pages
      ){

        currentPage++;

        renderData(
          filteredData
        );

      }

    };


  buttons.appendChild(
    next
  );


  container.appendChild(
    info
  );

  container.appendChild(
    buttons
  );

}

async function saveEntry(){

  const name =
    document.getElementById(
      "entryName"
    ).value.trim();


  const ip =
    document.getElementById(
      "entryIp"
    ).value.trim();


  const work =
    document.getElementById(
      "entryWork"
    ).value.trim();


  const date =
    document.getElementById(
      "entryDate"
    ).value;


  const item =
    document.getElementById(
      "entryItem"
    ).value.trim();


  if(!name){

    showToast(
      "Name is required",
      "error"
    );

    return;

  }


  if(!ip){

    showToast(
      "IP is required",
      "error"
    );

    return;

  }


  if(!work){

    showToast(
      "Work is required",
      "error"
    );

    return;

  }


  if(!date){

    showToast(
      "Date is required",
      "error"
    );

    return;

  }


  if(!item){

    showToast(
      "Item is required",
      "error"
    );

    return;

  }


  showLoader();


  try{

    let result;


    if(editingSellRow){

      result =
        await postJson(
          SELL_API_URL,
          {
            action:"editSellData",

            row:
              editingSellRow,

            rowNumber:
              editingSellRow,

            sellRow:
              editingSellRow,

            SellRow:
              editingSellRow,

            name,
            ip,
            work,
            date,
            item,

            username:
              currentUsername,

            user:
              currentUsername
          }
        );

    }
    else if(editingDataRow){

      result =
        await postJson(
          DATA_API_URL,
          {
            action:"editData",

            row:
              editingDataRow,

            rowNumber:
              editingDataRow,

            name,
            ip,
            work,
            date,
            item
          }
        );

    }
    else{

      result =
        await postJson(
          DATA_API_URL,
          {
            action:"addData",

            name,
            ip,
            work,
            date,
            item
          }
        );

    }


    if(
      !result ||
      result.success !== true
    ){

      throw new Error(
        result?.message ||
        "Save failed"
      );

    }


    closeModal(
      "entryModal"
    );


    dataCache = null;
    sellCache = null;


    currentDataType =
      editingSellRow
        ? "sell"
        : "data";


    document.getElementById(
      "dataType"
    ).value =
      currentDataType;


    updateDataTitle();


    showToast(
      "Saved successfully",
      "success"
    );


    await loadData(true);


  }catch(error){

    console.error(
      "saveEntry error:",
      error
    );

    showToast(
      error.message ||
      "Unable to save",
      "error"
    );

  }
  finally{

    hideLoader();

  }

}

/* ============================================================
   LOAD USERS
============================================================ */

async function loadUsers(){

  const body =
    document.getElementById(
      "usersBody"
    );


  body.innerHTML = `
    <tr>
      <td colspan="5" style="text-align:center;padding:25px">
        Loading users...
      </td>
    </tr>
  `;


  try{

    const response =
      await fetch(
        USER_API_URL +
        "?action=getUsers&requester=" +
        encodeURIComponent(
          currentUsername
        ) +
        "&_=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    if(
      !result ||
      result.success !== true
    ){

      throw new Error(
        result?.message ||
        "Unable to load users"
      );

    }


    const users =
      Array.isArray(result.users)
        ? result.users
        : Array.isArray(result.data)
          ? result.data
          : [];


    renderUsers(
      users
    );


  }catch(error){

    console.error(
      "loadUsers error:",
      error
    );

    body.innerHTML = `
      <tr>
        <td
          colspan="5"
          style="
            text-align:center;
            padding:25px;
            color:var(--danger);
          "
        >
          ${escapeHtml(
            error.message ||
            "Unable to load users"
          )}
        </td>
      </tr>
    `;

  }

}


/* ============================================================
   RENDER USERS
============================================================ */

function renderUsers(
  users
){

  const body =
    document.getElementById(
      "usersBody"
    );


  body.innerHTML = "";


  if(
    !users ||
    users.length === 0
  ){

    body.innerHTML = `
      <tr>
        <td
          colspan="5"
          style="
            text-align:center;
            padding:25px;
            color:var(--muted);
          "
        >
          No users found
        </td>
      </tr>
    `;

    return;

  }


  users.forEach(
    (
      user,
      index
    ) => {

      const username =
        String(
          user.Username ||
          user.username ||
          ""
        );

      const name =
        String(
          user.Name ||
          user.name ||
          ""
        );

      const role =
        String(
          user.Role ||
          user.role ||
          ""
        );

      const status =
        String(
          user.Status ||
          user.status ||
          ""
        );


      const statusLower =
        status.toLowerCase();


      const statusClass =
        statusLower === "active"
          ? "badge"
          : statusLower === "blocked" ||
            statusLower === "block"
            ? "badge badge-danger"
            : "badge badge-warning";


      const blockText =
        statusLower === "blocked" ||
        statusLower === "block"
          ? "Unblock"
          : "Block";


      body.insertAdjacentHTML(
        "beforeend",
        `
        <tr>

          <td>
            ${escapeHtml(username)}
          </td>

          <td>
            ${escapeHtml(name)}
          </td>

          <td>
            ${escapeHtml(role)}
          </td>

          <td>
            <span class="${statusClass}">
              ${escapeHtml(status)}
            </span>
          </td>

          <td>

            <div class="user-actions">

              <button
                class="btn btn-small"
                onclick="editUserByIndex(${index})"
              >
                Edit
              </button>

              <button
                class="btn btn-small ${
                  blockText === "Block"
                    ? "btn-danger"
                    : "btn-green"
                }"
                onclick="changeUserStatusByIndex(${index}, '${escapeJs(username)}', '${escapeJs(status)}')"
              >
                ${blockText}
              </button>

            </div>

          </td>

        </tr>
        `
      );

    }
  );


  window.loadedUsers =
    users;

}

/* ============================================================
   LOAD ITEMS
============================================================ */

async function loadItems(
  force = false
){

  if(
    itemCache &&
    !force
  ){

    itemList =
      itemCache;

    populateItemSelect();

    renderItems();

    return;

  }


  try{

    const response =
      await fetch(
        ITEM_API_URL +
        "?action=getItems&_=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    if(
      !result ||
      result.success !== true
    ){

      throw new Error(
        result?.message ||
        "Unable to load items"
      );

    }


    itemList =
      Array.isArray(result.items)
        ? result.items
        : Array.isArray(result.data)
          ? result.data
          : [];


    itemCache =
      itemList;


    populateItemSelect();

    renderItems();


  }catch(error){

    console.error(
      "loadItems error:",
      error
    );

    itemList = [];

    populateItemSelect();

    renderItems();

  }

}


/* ============================================================
   RENDER ITEMS
============================================================ */

function renderItems(){

  const body =
    document.getElementById(
      "itemsBody"
    );


  if(!body){
    return;
  }


  body.innerHTML = "";


  if(
    !itemList ||
    itemList.length === 0
  ){

    body.innerHTML = `
      <tr>
        <td
          colspan="4"
          style="
            text-align:center;
            padding:25px;
            color:var(--muted);
          "
        >
          No items found
        </td>
      </tr>
    `;

    return;

  }


  itemList.forEach(
    (
      item,
      index
    ) => {

      const itemName =
        getField(
          item,
          [
            "Item",
            "item",
            "Name",
            "name",
            0
          ]
        );

      const date =
        getField(
          item,
          [
            "Date",
            "date",
            1
          ]
        );

      const user =
        getField(
          item,
          [
            "User",
            "user",
            "Username",
            "username",
            2
          ]
        );


      body.insertAdjacentHTML(
        "beforeend",
        `
        <tr>

          <td>
            ${escapeHtml(itemName)}
          </td>

          <td>
            ${escapeHtml(formatDateTime(date))}
          </td>

          <td>
            ${escapeHtml(user)}
          </td>

          <td>

            <button
              class="btn btn-small btn-danger"
              onclick="deleteItem(${index})"
            >
              Delete
            </button>

          </td>

        </tr>
        `
      );

    }
  );

}

    item => {

        getField(
          item,

            "Name",
            "name",

        );


      if(!value){

      const option =
        document.createElement(
          "option"
        );

      option.value =

    }

/* ============================================================
   POST JSON
============================================================ */

async function postJson(
  url,
  data
){

  const response =
    await fetch(
      url,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(data)
      }
    );


  const text =
    await response.text();


  if(!response.ok){

    throw new Error(
      "Server error: " +
      response.status
    );

  }


  try{

    return JSON.parse(
      text
    );

  }catch(error){

    console.error(
      "Invalid server response:",
      text
    );

    throw new Error(
      "Invalid server response"
    );

  }

}


/* ============================================================
   FIELD HELPER
============================================================ */

function getField(
  row,
  keys
){

  if(row == null){
    return "";
  }


  for(
    const key of keys
  ){

    if(
      typeof key === "number"
    ){

      if(
        Array.isArray(row) &&
        row[key] !== undefined &&
        row[key] !== null
      ){

        return String(
          row[key]
        );

      }

    }
    else{

      if(
        typeof row === "object" &&
        row[key] !== undefined &&
        row[key] !== null
      ){

        return String(
          row[key]
        );

      }

    }

  }


  return "";

}


/* ============================================================
   NORMALIZE DATE
============================================================ */

function normalizeDate(
  value
){

  if(!value){
    return "";
  }


  const text =
    String(value)
      .trim();


  if(
    /^\d{4}-\d{2}-\d{2}$/.test(
      text
    )
  ){

    return text;

  }


  const date =
    new Date(text);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }


  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );


  return `${year}-${month}-${day}`;

}

   TODAY INPUT VALUE

/* ============================================================
   FORMAT DATE TIME
============================================================ */

function formatDateTime(
  value
){

  if(!value){
    return "";
  }


  const text =
    String(value)
      .trim();


  if(
    /^\d{4}-\d{2}-\d{2}$/.test(
      text
    )
  ){

    return text;

  }


  const date =
    new Date(text);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return text;

  }


  return date.toLocaleString(
    undefined,
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* ============================================================
   ESCAPE JS
============================================================ */

function escapeJs(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /"/g,
    '\\"'
  )
  .replace(
    /\n/g,
    "\\n"
  )
  .replace(
    /\r/g,
    "\\r"
  );

}

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Support Dashboard</title>

<link
  rel="icon"
  href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f3f7f5;
  --card:#ffffff;
  --text:#17231d;
  --muted:#718078;
  --border:#dce7e1;
  --green:#16a36b;
  --green-dark:#0b8052;
  --green-light:#e8f8f0;
  --danger:#dc3545;
  --warning:#f59e0b;
  --blue:#2563eb;
  --shadow:0 8px 28px rgba(24,55,42,.08);
}

body.dark{
  --bg:#0d1511;
  --card:#142019;
  --text:#ecf7f0;
  --muted:#9aaca1;
  --border:#293a31;
  --green-light:#163528;
  --shadow:0 8px 28px rgba(0,0,0,.28);
}

body{
  font-family:
    Inter,
    Arial,
    Helvetica,
    sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  transition:.2s;
}

/* =========================================================
HEADER
========================================================= */

.header{
  position:sticky;
  top:0;
  z-index:100;
  height:72px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  box-shadow:0 3px 15px rgba(0,0,0,.04);
}

.logoArea{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:20px;
  font-weight:800;
}

.logoText h2{
  font-size:18px;
  font-weight:800;
}

.logoText span{
  color:var(--muted);
  font-size:11px;
}

.headerActions{
  display:flex;
  align-items:center;
  gap:8px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
  transition:.18s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}

.btn:hover{
  transform:translateY(-1px);
}

.btnGreen{
  background:var(--green);
  color:white;
}

.btnGreen:hover{
  background:var(--green-dark);
}

.btnLight{
  background:var(--green-light);
  color:var(--green-dark);
}

body.dark .btnLight{
  color:#7ce1b2;
}

.btnDanger{
  background:#ffe8eb;
  color:var(--danger);
}

body.dark .btnDanger{
  background:#3a1d22;
}

.btnBlue{
  background:#e8efff;
  color:var(--blue);
}

body.dark .btnBlue{
  background:#1d2d4b;
}

.btnGray{
  background:var(--border);
  color:var(--text);
}

.profileWrap{
  position:relative;
  margin-left:4px;
}

.profileBtn{
  border:2px solid var(--green);
  background:none;
  padding:0;
  border-radius:50%;
  width:42px;
  height:42px;
  overflow:hidden;
  cursor:pointer;
}

.profileBtn img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profileMenu{
  position:absolute;
  right:0;
  top:50px;
  width:180px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:var(--shadow);
  padding:7px;
  display:none;
}

.profileMenu.show{
  display:block;
}

.profileMenu button{
  width:100%;
  border:0;
  background:none;
  color:var(--text);
  text-align:left;
  padding:11px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
}

.profileMenu button:hover{
  background:var(--green-light);
}

/* =========================================================
MAIN
========================================================= */

.container{
  width:min(1500px,96%);
  margin:22px auto;
}

.topTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}

.topTitle h1{
  font-size:24px;
  font-weight:800;
}

.topTitle p{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.filterCard{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:14px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.filterRow{
  display:grid;
  grid-template-columns:
    minmax(220px,1.6fr)
    110px
    110px
    145px
    145px
    130px
    90px;
  gap:9px;
  align-items:center;
}

.input,
.select{
  width:100%;
  height:40px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--card);
  color:var(--text);
  padding:0 11px;
  outline:none;
  font-size:13px;
}

.input:focus,
.select:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(22,163,107,.10);
}

.counter{
  height:40px;
  border:1px solid var(--border);
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
  background:var(--green-light);
  color:var(--green-dark);
}

body.dark .counter{
  color:#8be8bc;
}

/* =========================================================
TABLE
========================================================= */

.tableCard{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.tableWrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

thead{
  background:var(--green-light);
}

th{
  color:var(--green-dark);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.3px;
  padding:13px 12px;
  text-align:left;
  white-space:nowrap;
}

body.dark th{
  color:#8be8bc;
}

td{
  padding:12px;
  border-top:1px solid var(--border);
  font-size:13px;
  vertical-align:middle;
}

tbody tr:hover{
  background:rgba(22,163,107,.035);
}

.actionCell{
  white-space:nowrap;
}

.smallBtn{
  border:0;
  border-radius:7px;
  padding:7px 9px;
  margin:2px;
  cursor:pointer;
  font-size:11px;
  font-weight:700;
}

.editBtn{
  background:#e8efff;
  color:#2563eb;
}

.sellBtn{
  background:#e7f8ef;
  color:#0b8052;
}

.deleteBtn{
  background:#ffe8eb;
  color:#dc3545;
}

.paidBtn{
  background:#fff4dc;
  color:#b66b00;
}

.empty{
  padding:50px 20px;
  text-align:center;
  color:var(--muted);
}

.pagination{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  padding:14px;
  border-top:1px solid var(--border);
}

.pageBtn{
  min-width:34px;
  height:34px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
  font-weight:700;
}

.pageBtn.active{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

/* =========================================================
LOADER
========================================================= */

.loaderOverlay{
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(3px);
  display:none;
  align-items:center;
  justify-content:center;
}

.loaderOverlay.show{
  display:flex;
}

.loaderBox{
  background:var(--card);
  border-radius:15px;
  padding:25px 30px;
  box-shadow:var(--shadow);
  text-align:center;
}

.spinner{
  width:38px;
  height:38px;
  border:4px solid var(--border);
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 12px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.loaderBox span{
  font-size:13px;
  color:var(--muted);
}

/* =========================================================
MODAL
========================================================= */

.modalOverlay{
  position:fixed;
  inset:0;
  z-index:5000;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modalOverlay.show{
  display:flex;
}

.modal{
  width:min(600px,100%);
  max-height:92vh;
  overflow:auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  box-shadow:0 20px 70px rgba(0,0,0,.22);
}

.modal.large{
  width:min(950px,100%);
}

.modalHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:17px 20px;
  border-bottom:1px solid var(--border);
}

.modalHeader h3{
  font-size:17px;
}

.closeBtn{
  width:32px;
  height:32px;
  border:0;
  border-radius:8px;
  background:var(--border);
  color:var(--text);
  cursor:pointer;
  font-size:18px;
}

.modalBody{
  padding:20px;
}

.modalFooter{
  padding:14px 20px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.formGroup{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.formGroup.full{
  grid-column:1/-1;
}

.formGroup label{
  font-size:12px;
  font-weight:700;
  color:var(--muted);
}

.textarea{
  min-height:90px;
  resize:vertical;
  padding:10px;
}

/* =========================================================
USERS
========================================================= */

.userToolbar,
.itemToolbar{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:13px;
}

.statusBadge{
  display:inline-flex;
  padding:5px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:800;
}

.statusActive{
  background:#e5f8ee;
  color:#08794d;
}

.statusBlocked{
  background:#ffe7ea;
  color:#c52d3d;
}

.statusInactive{
  background:#fff1d6;
  color:#a86600;
}

body.dark .statusActive{
  background:#163b2b;
  color:#75dfad;
}

body.dark .statusBlocked{
  background:#401d24;
  color:#ff9ba6;
}

body.dark .statusInactive{
  background:#42321b;
  color:#f7c66b;
}

/* =========================================================
TOAST
========================================================= */

.toastContainer{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:10000;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.toast{
  min-width:250px;
  max-width:380px;
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
  border-left:4px solid var(--green);
  padding:12px 14px;
  border-radius:10px;
  box-shadow:var(--shadow);
  font-size:13px;
  animation:toastIn .2s ease;
}

.toast.error{
  border-left-color:var(--danger);
}

.toast.warning{
  border-left-color:var(--warning);
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* =========================================================
RESPONSIVE
========================================================= */

@media(max-width:1100px){

  .filterRow{
    grid-template-columns:
      1fr 1fr 1fr;
  }

}

@media(max-width:700px){

  .header{
    height:auto;
    min-height:68px;
    padding:10px 12px;
    gap:8px;
  }

  .logoText{
    display:none;
  }

  .headerActions{
    flex-wrap:wrap;
    justify-content:flex-end;
  }

  .headerActions .btn{
    padding:8px 9px;
    font-size:11px;
  }

  .container{
    width:96%;
    margin:14px auto;
  }

  .topTitle{
    align-items:flex-start;
    flex-direction:column;
  }

  .topTitle h1{
    font-size:20px;
  }

  .filterRow{
    grid-template-columns:1fr 1fr;
  }

  .filterRow > :first-child{
    grid-column:1/-1;
  }

  .formGrid{
    grid-template-columns:1fr;
  }

  .formGroup.full{
    grid-column:auto;
  }

}

@media(max-width:450px){

  .filterRow{
    grid-template-columns:1fr;
  }

  .filterRow > :first-child{
    grid-column:auto;
  }

  .profileBtn{
    width:36px;
    height:36px;
  }

}

/* =========================================================
HIDDEN
========================================================= */

.hidden{
  display:none !important;
}

</style>

</head>

<body>

<!-- ========================================================
HEADER
========================================================= -->

<header class="header">

  <div class="logoArea">

    <div class="logo">
      S
    </div>

    <div class="logoText">
      <h2>Support Dashboard</h2>
      <span id="headerUser">Loading...</span>
    </div>

  </div>

  <div class="headerActions">

    <button
      class="btn btnLight"
      onclick="loadData(true)"
    >
      ↻ Reload
    </button>

    <button
      class="btn btnLight"
      onclick="openUsersModal()"
    >
      👥 Users
    </button>

    <button
      class="btn btnLight"
      onclick="openItemsModal()"
    >
      📦 Items
    </button>

    <button
      class="btn btnGreen"
      onclick="openEntryModal()"
    >
      ＋ New Entry
    </button>

    <button
      class="btn btnLight"
      onclick="toggleTheme()"
      id="themeBtn"
    >
      🌙 Dark
    </button>

    <div class="profileWrap">

      <button
        class="profileBtn"
        onclick="toggleProfileMenu()"
      >
        <img
          id="profileImage"
          src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
          alt="Profile"
        >
      </button>

      <div
        class="profileMenu"
        id="profileMenu"
      >

        <button onclick="openPasswordModal()">
          🔑 Change Password
        </button>

        <button onclick="logout()">
          🚪 Logout
        </button>

      </div>

    </div>

  </div>

</header>


<!-- ========================================================
MAIN
========================================================= -->

<main class="container">

  <div class="topTitle">

    <div>
      <h1 id="dataTitle">Data</h1>
      <p id="dataSubtitle">
        Manage and monitor your support entries.
      </p>
    </div>

    <button
      class="btn btnLight"
      onclick="loadData(true)"
    >
      ↻ Refresh Data
    </button>

  </div>


  <!-- FILTER -->

  <section class="filterCard">

    <div class="filterRow">

      <input
        class="input"
        id="searchInput"
        type="search"
        placeholder="Search Name, IP, Work, Item..."
        oninput="applyFilters()"
      >

      <div
        class="counter"
        id="totalCount"
      >
        Total: 0
      </div>

      <div
        class="counter"
        id="resultCount"
      >
        Result: 0
      </div>

      <input
        class="input"
        id="fromDate"
        type="date"
        onchange="applyFilters()"
      >

      <input
        class="input"
        id="toDate"
        type="date"
        onchange="applyFilters()"
      >

      <select
        class="select"
        id="dataType"
        onchange="changeDataType()"
      >

        <option value="data">Data</option>
        <option value="sell">Sell</option>
        <option value="paid">Paid</option>
        <option value="delete">Delete</option>

      </select>

      <button
        class="btn btnGray"
        onclick="clearFilters()"
      >
        Clear
      </button>

    </div>

  </section>


  <!-- TABLE -->

  <section class="tableCard">

    <div class="tableWrap">

      <table>

        <thead id="tableHead"></thead>

        <tbody id="tableBody"></tbody>

      </table>

    </div>

    <div
      class="pagination"
      id="pagination"
    ></div>

  </section>

</main>


<!-- ========================================================
LOADER
========================================================= -->

<div
  class="loaderOverlay"
  id="loader"
>

  <div class="loaderBox">

    <div class="spinner"></div>

    <span id="loaderText">
      Loading...
    </span>

  </div>

</div>


<!-- ========================================================
ENTRY MODAL
========================================================= -->

<div
  class="modalOverlay"
  id="entryModal"
>

  <div class="modal">

    <div class="modalHeader">

      <h3 id="entryModalTitle">
        New Entry
      </h3>

      <button
        class="closeBtn"
        onclick="closeModal('entryModal')"
      >
        ×
      </button>

    </div>


    <div class="modalBody">

      <div class="formGrid">

        <div class="formGroup">

          <label>Name</label>

          <input
            class="input"
            id="entryName"
            type="text"
            placeholder="Name"
          >

        </div>


        <div class="formGroup">

          <label>IP</label>

          <input
            class="input"
            id="entryIP"
            type="text"
            placeholder="IP Address"
          >

        </div>


        <div class="formGroup">

          <label>Work</label>

          <input
            class="input"
            id="entryWork"
            type="text"
            placeholder="Work"
          >

        </div>


        <div class="formGroup">

          <label>Date</label>

          <input
            class="input"
            id="entryDate"
            type="date"
          >

        </div>


        <div class="formGroup full">

          <label>Item</label>

          <select
            class="select"
            id="entryItem"
          >

            <option value="">
              Select Item
            </option>

          </select>

        </div>

      </div>

    </div>


    <div class="modalFooter">

      <button
        class="btn btnGray"
        onclick="closeModal('entryModal')"
      >
        Cancel
      </button>

      <button
        class="btn btnGreen"
        onclick="saveEntry()"
        id="saveEntryBtn"
      >
        Save
      </button>

    </div>

  </div>

</div>


<!-- ========================================================
USERS MODAL
========================================================= -->

<div
  class="modalOverlay"
  id="usersModal"
>

  <div class="modal large">

    <div class="modalHeader">

      <h3>User Management</h3>

      <button
        class="closeBtn"
        onclick="closeModal('usersModal')"
      >
        ×
      </button>

    </div>


    <div class="modalBody">

      <div class="userToolbar">

        <input
          class="input"
          id="userSearch"
          placeholder="Search users..."
          oninput="filterUsersView()"
        >

        <button
          class="btn btnGreen"
          onclick="openAddUserModal()"
        >
          ＋ Add User
        </button>

      </div>


      <div class="tableWrap">

        <table>

          <thead>

            <tr>
              <th>Username</th>
              <th>Name</th>
              <th>Role</th>
              <th>Status</th>
              <th>Action</th>
            </tr>

          </thead>

          <tbody id="usersBody"></tbody>

        </table>

      </div>

    </div>

  </div>

</div>


<!-- ========================================================
ADD / EDIT USER MODAL
========================================================= -->

<div
  class="modalOverlay"
  id="userEditModal"
>

  <div class="modal">

    <div class="modalHeader">

      <h3 id="userModalTitle">
        Add User
      </h3>

      <button
        class="closeBtn"
        onclick="closeModal('userEditModal')"
      >
        ×
      </button>

    </div>


    <div class="modalBody">

      <div class="formGrid">

        <div class="formGroup">

          <label>Username</label>

          <input
            class="input"
            id="userUsername"
            type="text"
          >

        </div>


        <div class="formGroup">

          <label>Password</label>

          <input
            class="input"
            id="userPassword"
            type="text"
          >

        </div>


        <div class="formGroup">

          <label>Name</label>

          <input
            class="input"
            id="userName"
            type="text"
          >

        </div>


        <div class="formGroup">

          <label>Role</label>

          <select
            class="select"
            id="userRole"
          >

            <option value="admin">admin</option>
            <option value="manager">manager</option>
            <option value="support">support</option>
            <option value="call">call</option>
            <option value="guest">guest</option>

          </select>

        </div>


        <div class="formGroup full">

          <label>Status</label>

          <select
            class="select"
            id="userStatus"
          >

            <option value="Active">
              Active
            </option>

            <option value="Blocked">
              Blocked
            </option>

            <option value="Inactive">
              Inactive
            </option>

          </select>

        </div>

      </div>

    </div>


    <div class="modalFooter">

      <button
        class="btn btnGray"
        onclick="closeModal('userEditModal')"
      >
        Cancel
      </button>

      <button
        class="btn btnGreen"
        onclick="saveUser()"
      >
        Save User
      </button>

    </div>

  </div>

</div>


<!-- ========================================================
ITEM MODAL
========================================================= -->

<div
  class="modalOverlay"
  id="itemsModal"
>

  <div class="modal large">

    <div class="modalHeader">

      <h3>Item Management</h3>

      <button
        class="closeBtn"
        onclick="closeModal('itemsModal')"
      >
        ×
      </button>

    </div>


    <div class="modalBody">

      <div class="itemToolbar">

        <input
          class="input"
          id="newItemName"
          placeholder="Enter new item"
        >

        <button
          class="btn btnGreen"
          onclick="addNewItem()"
        >
          ＋ Add Item
        </button>

      </div>


      <div class="tableWrap">

/* ============================================================
ROW NUMBER
============================================================ */

function attachSheetRowNumbers(data){

  return data.map(
    (row,index) => {

      const realRow =
        getRealRowNumber(row);

      if(
        Number.isFinite(realRow) &&
        realRow >= 2
      ){

        return row;

      }

      if(
        row &&
        typeof row === "object"
      ){

        return {
          ...row,
          _sheetRow:index + 2
        };

      }

      return row;

    }
  );

}


function getRealRowNumber(row){

  if(!row){
    return null;
  }


  const keys = [

    "_sheetRow",

    "sheetRow",

    "SheetRow",

    "row",

    "rowNumber",

    "sourceRow",

    "originalRow",

    "originalRowNumber",

    "sellRow",

    "SellRow"

  ];


  if(
    typeof row === "object"
  ){

    for(
      const key of keys
    ){

      const value =
        Number(row[key]);

      if(
        Number.isFinite(value) &&
        value >= 2
      ){

        return value;

      }

    }

  }


  if(Array.isArray(row)){

    for(
      let i =
        row.length - 1;
      i >= 9;
      i--
    ){

      const value =
        Number(row[i]);

      if(
        Number.isFinite(value) &&
        value >= 2
      ){

        return value;

      }

    }

  }


  return null;

}


/* ============================================================
GET FIELD
============================================================ */

function getField(
  row,
  keys,
  index = null
){

  if(
    row &&
    typeof row === "object" &&
    !Array.isArray(row)
  ){

    for(
      const key of keys
    ){

      if(
        row[key] !== undefined &&
        row[key] !== null
      ){

        return row[key];

      }

    }

  }


  if(
    Array.isArray(row) &&
    index !== null
  ){

    return row[index] ?? "";

  }


  return "";

}

/* ============================================================
FILTER
============================================================ */

function applyFilters(){

  const search =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();


  const from =
    document.getElementById(
      "fromDate"
    ).value;


  const to =
    document.getElementById(
      "toDate"
    ).value;


  filteredData =
    allData.filter(
      row => {

        const searchable =
          JSON.stringify(
            row
          ).toLowerCase();


        if(
          search &&
          !searchable.includes(search)
        ){

          return false;

        }


        const rawDate =
          getField(
            row,
            ["Date","date"],
            3
          );


        const rowDate =
          normalizeDate(
            rawDate
          );


        if(
          from &&
          rowDate &&
          rowDate < from
        ){

          return false;

        }


        if(
          to &&
          rowDate &&
          rowDate > to
        ){

          return false;

        }


        return true;

      }
    );


  currentPage = Math.min(
    currentPage,
    Math.max(
      1,
      Math.ceil(
        filteredData.length /
        pageSize
      )
    )
  );


  document.getElementById(
    "totalCount"
  ).textContent =
    "Total: " +
    allData.length;


  document.getElementById(
    "resultCount"
  ).textContent =
    "Result: " +
    filteredData.length;


  renderData(
    filteredData
  );

}


/* ============================================================
PAGINATION
============================================================ */

function renderPagination(){

  const pagination =
    document.getElementById(
      "pagination"
    );


  const totalPages =
    Math.ceil(
      filteredData.length /
      pageSize
    );


  if(totalPages <= 1){

    pagination.innerHTML = "";

    return;

  }


  let html = "";


  if(currentPage > 1){

    html +=
      `<button
        class="pageBtn"
        onclick="goToPage(${currentPage - 1})"
      >‹</button>`;

  }


  for(
    let i=1;
    i<=totalPages;
    i++
  ){

    if(
      i === 1 ||
      i === totalPages ||
      Math.abs(i-currentPage) <= 2
    ){

      html +=
        `<button
          class="pageBtn ${
            i === currentPage
              ? "active"
              : ""
          }"
          onclick="goToPage(${i})"
        >${i}</button>`;

    }

  }


  if(currentPage < totalPages){

    html +=
      `<button
        class="pageBtn"
        onclick="goToPage(${currentPage + 1})"
      >›</button>`;

  }


  pagination.innerHTML =
    html;

}


function goToPage(page){

  currentPage = page;

  renderData(
    filteredData
  );

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

async function saveEntry(){

  const name =
    document.getElementById(
      "entryName"
    ).value.trim();


  const ip =
    document.getElementById(
      "entryIP"
    ).value.trim();


  const work =
    document.getElementById(
      "entryWork"
    ).value.trim();


  const date =
    document.getElementById(
      "entryDate"
    ).value;


  const item =
    document.getElementById(
      "entryItem"
    ).value.trim();


  if(!name){

    showToast(
      "Name is required.",
      "warning"
    );

    return;

  }


  if(!date){

    showToast(
      "Date is required.",
      "warning"
    );

    return;

  }


  const button =
    document.getElementById(
      "saveEntryBtn"
    );


  button.disabled = true;

  showLoader(
    "Saving entry..."
  );


  try{

    let result;


    if(editingSellRow){

      result =
        await postJson(
          SELL_API_URL,
          {
            action:"editSellData",

            row:editingSellRow,

            rowNumber:editingSellRow,

            sellRow:editingSellRow,

            SellRow:editingSellRow,

            name:name,

            ip:ip,

            work:work,

            date:date,

            item:item,

            username:currentUsername,

            user:currentUsername
          }
        );

    }

    else if(editingDataRow){

      result =
        await postJson(
          DATA_API_URL,
          {
            action:"editData",

            row:editingDataRow,

            rowNumber:editingDataRow,

            name:name,

            ip:ip,

            work:work,

            date:date,

            item:item
          }
        );

    }

    else{

      result =
        await postJson(
          DATA_API_URL,
          {
            action:"addData",

            name:name,

            ip:ip,

            work:work,

            date:date,

            item:item
          }
        );

    }


    if(
      !result ||
      result.success !== true
    ){

      throw new Error(
        result?.message ||
        "Save failed."
      );

    }


    closeModal(
      "entryModal"
    );


    dataCache = null;
    sellCache = null;

    await loadData(true);


    showToast(
      editingSellRow ||
      editingDataRow
        ? "Entry updated successfully."
        : "Entry added successfully."
    );


    editingDataRow = null;
    editingSellRow = null;


  }catch(error){

    console.error(
      "saveEntry:",
      error
    );

    showToast(
      error.message ||
      "Failed to save entry.",
      "error"
    );

  }finally{

    button.disabled = false;

    hideLoader();

  }

}

      );

    }


    allUsers =
      Array.isArray(result.users)
        ? result.users
        : Array.isArray(result.data)
          ? result.data
          : [];


    renderUsers(
      allUsers
    );


  }catch(error){

    console.error(
      "loadUsers:",
      error
    );


    body.innerHTML =
      `<tr>
        <td colspan="5">
          <div class="empty">
            ${escapeHtml(
              error.message ||
              "Failed to load users."
            )}
          </div>

      </tr>`;

      error.message ||
      "Failed to load users.",
      "error"
    );

function renderUsers(users){

  const body =
    document.getElementById(
      "usersBody"
    );


  if(!users.length){

    body.innerHTML =
      `<tr>
        <td colspan="5">
          <div class="empty">
            No users found.
          </div>
        </td>
      </tr>`;

    return;

  }


  body.innerHTML =
    users
      .map(
        (user,index) => {

          const username =
            user.Username ||
            user.username ||
            "";

          const name =
            user.Name ||
            user.name ||
            "";

          const role =
            user.Role ||
            user.role ||
            "";

          const status =
            user.Status ||
            user.status ||
            "";


          const normalized =
            String(status)
              .trim()
              .toLowerCase();


          let badgeClass =
            "statusActive";


          if(
            normalized ===
            "blocked" ||
            normalized ===
            "block"
          ){

            badgeClass =
              "statusBlocked";

          }
          else if(
            normalized ===
            "inactive"
          ){

            badgeClass =
              "statusInactive";

          }


          const nextStatus =
            (
              normalized ===
              "blocked" ||
              normalized ===
              "block"
            )
              ? "Active"
              : "Blocked";


          return `
            <tr>

              <td>
                ${escapeHtml(username)}
              </td>

              <td>
                ${escapeHtml(name)}
              </td>

              <td>
                ${escapeHtml(role)}
              </td>

              <td>
                <span
                  class="statusBadge ${badgeClass}"
                >
                  ${escapeHtml(status)}
                </span>
              </td>

              <td>

                <button
                  class="smallBtn editBtn"
                  onclick="editUser(${index})"
                >
                  Edit
                </button>

                <button
                  class="smallBtn ${
                    nextStatus === "Blocked"
                      ? "deleteBtn"
                      : "sellBtn"
                  }"
                  onclick="changeUserStatus(${index}, '${nextStatus}')"
                >
                  ${
                    nextStatus === "Blocked"
                      ? "Block"
                      : "Unblock"
                  }
                </button>

              </td>

            </tr>
          `;

        }
      )
      .join("");

}


function filterUsersView(){

  const search =
    document.getElementById(
      "userSearch"
    ).value
      .trim()
      .toLowerCase();


  if(!search){

    renderUsers(
      allUsers
    );

    return;

  }


  const filtered =
    allUsers.filter(
      user =>
        JSON.stringify(
          user
        )
          .toLowerCase()
          .includes(search)
    );


  renderUsers(
    filtered
  );

}

            name:name,

            status:status
          }
        );

    }


    if(
      !result ||
      result.success !== true
    ){

      throw new Error(
        result?.message ||
        "User save failed."
      );

    }


    closeModal(
      "userEditModal"
    );


    await loadUsers();


    showToast(
      editingUser
        ? "User updated successfully."
        : "User added successfully."
    );


    editingUser = null;


  }catch(error){

    console.error(
      "saveUser:",
      error
    );

    showToast(
      error.message ||
      "Failed to save user.",
      "error"
    );

  }finally{

    hideLoader();

  }

}

/* ============================================================
POST JSON
============================================================ */

async function postJson(
  url,
  data
){

  const response =
    await fetch(
      url,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(data)
      }
    );


  const text =
    await response.text();


  if(!response.ok){

    throw new Error(
      "Server error: " +
      response.status
    );

  }


  try{

    return JSON.parse(
      text
    );

  }catch(error){

    console.error(
      "Invalid server response:",
      text
    );

    throw new Error(
      "Invalid server response"
    );

  }

}

/* ============================================================

============================================================ */

function showToast(
  message,
  type="success"
){

  const container =
    document.getElementById(
      "toastContainer"
    );


  const toast =
    document.createElement(
      "div"
    );


  toast.className =
    "toast " +
    (
      type === "error"
        ? "error"
        : type === "warning"
          ? "warning"
          : ""
    );


  toast.textContent =
    message;


  container.appendChild(
    toast
  );


  setTimeout(
    () => {

      toast.remove();

    },
    3500
  );

}


/* ============================================================
DATE HELPERS
============================================================ */

function getTodayInputValue(){

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth()+1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


function normalizeDate(value){

  if(!value){
    return "";
  }


  const stringValue =
    String(value).trim();


  const directMatch =
    stringValue.match(
      /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/
    );


  if(directMatch){

    return (
      directMatch[1] +
      "-" +
      String(
        directMatch[2]
      ).padStart(2,"0") +
      "-" +
      String(
        directMatch[3]
      ).padStart(2,"0")
    );

  }


  const date =
    new Date(
      stringValue
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "";

  }


  return (
    date.getFullYear() +
    "-" +
    String(
      date.getMonth()+1
    ).padStart(2,"0") +
    "-" +
    String(
      date.getDate()
    ).padStart(2,"0")
  );

}


function formatDateTime(value){

  if(!value){
    return "";
  }


  const stringValue =
    String(value).trim();


  if(
    /^\d{4}-\d{2}-\d{2}$/
      .test(stringValue)
  ){

    return stringValue;

  }


  return stringValue;

}


/* ============================================================
HTML ESCAPE
============================================================ */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeJs(value){

  return String(value || "")
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /"/g,
      '\\"'
    )
    .replace(
      /\n/g,
      "\\n"
    )
    .replace(
      /\r/g,
      "\\r"
    );

}


function createActionButton(
  text,

){

  return `
    <button
      class="smallBtn ${className}"
      onclick="${functionName}(${index})"

/* ============================================================
BACK NAVIGATION PROTECTION
============================================================ */

function setupBackProtection(){

  try{

    history.pushState(
      null,
      "",
      location.href
    );


    window.addEventListener(
      "popstate",
      () => {

        if(
          localStorage.getItem(
            "dashboardAuth"
          ) === "true" ||
          sessionStorage.getItem(
            "dashboardAuth"
          ) === "true"
        ){

          history.pushState(
            null,
            "",
            location.href
          );

        }
        else{

          window.location.replace(
            "index.html"
          );

        }

      }
    );


    window.addEventListener(
      "pageshow",
      event => {

        if(
          event.persisted &&
          !checkLogin()
        ){

          window.location.replace(
            "index.html"
          );

        }

      }
    );

  }catch(error){

    console.error(
      "Back protection:",
      error
    );

  }

}

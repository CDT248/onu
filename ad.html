<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>L4SM Dashboard</title>

<link
  rel="icon"
  type="image/png"
  sizes="128x128"
  href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
  min-height:100vh;
}

/* =========================================================
   DARK MODE
========================================================= */

body.dark{
  background:#101522;
  color:#f2f5fa;
}

body.dark .topbar,
body.dark .card,
body.dark .modal-box,
body.dark .profile-menu{
  background:#182033;
  color:#f2f5fa;
}

body.dark .table-wrap{
  background:#182033;
}

body.dark table th{
  background:#202b42;
  color:#fff;
}

body.dark table td{
  border-color:#303b52;
}

body.dark input,
body.dark select,
body.dark textarea{
  background:#111827;
  color:#fff;
  border-color:#364158;
}

body.dark .empty{
  color:#aeb8ca;
}

/* =========================================================
   TOPBAR
========================================================= */

.topbar{
  width:100%;
  height:68px;
  background:#fff;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:21px;
  font-weight:800;
  color:#2563eb;
}

.logo span{
  color:#111827;
}

.right-tools{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:none;
  border-radius:12px;
  background:#eef3ff;
  cursor:pointer;
  font-size:18px;
}

.profile{
  position:relative;
}

.profile-btn{
  border:none;
  background:transparent;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:700;
}

.profile-circle{
  width:38px;
  height:38px;
  border-radius:50%;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.profile-menu{
  position:absolute;
  right:0;
  top:50px;
  width:190px;
  background:#fff;
  border-radius:14px;
  box-shadow:0 12px 35px rgba(0,0,0,.18);
  padding:8px;
  display:none;
  z-index:500;
}

.profile-menu.show{
  display:block;
}

.profile-menu button{
  width:100%;
  padding:11px;
  border:none;
  background:transparent;
  text-align:left;
  border-radius:9px;
  cursor:pointer;
  font-size:14px;
}

.profile-menu button:hover{
  background:#eef3ff;
}

/* =========================================================
   CONTAINER
========================================================= */

.container{
  max-width:1400px;
  margin:auto;
  padding:25px;
}

/* =========================================================
   HEADER
========================================================= */

.page-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.page-title h1{
  font-size:28px;
  margin-bottom:5px;
}

.page-title p{
  color:#718096;
  font-size:14px;
}

body.dark .page-title p{
  color:#aeb8ca;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  border-radius:10px;
  padding:11px 17px;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.btn-success{
  background:#16a34a;
  color:#fff;
}

.btn-danger{
  background:#dc2626;
  color:#fff;
}

.btn-warning{
  background:#f59e0b;
  color:#fff;
}

.btn-secondary{
  background:#64748b;
  color:#fff;
}

.btn-light{
  background:#e9eef7;
  color:#1f2937;
}

/* =========================================================
   CARD
========================================================= */

.card{
  background:#fff;
  border-radius:16px;
  box-shadow:0 6px 25px rgba(0,0,0,.07);
  padding:18px;
  margin-bottom:20px;
}

/* =========================================================
   FILTER
========================================================= */

.filter-row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.filter-row input,
.filter-row select{
  min-width:180px;
  flex:1;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #d9e0ea;
  border-radius:10px;
  padding:11px 12px;
  outline:none;
  font-size:14px;
  background:#fff;
  color:#172033;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

/* =========================================================
   TABLE
========================================================= */

.table-wrap{
  width:100%;
  overflow-x:auto;
  border-radius:14px;
  background:#fff;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th,
td{
  padding:13px 12px;
  text-align:left;
  border-bottom:1px solid #e6eaf0;
  font-size:14px;
}

th{
  background:#f2f5fa;
  color:#1e293b;
  font-weight:800;
  white-space:nowrap;
}

td{
  vertical-align:middle;
}

.action-cell{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.small-btn{
  border:none;
  border-radius:7px;
  padding:7px 10px;
  color:#fff;
  cursor:pointer;
  font-size:12px;
  font-weight:700;
}

.edit-btn{
  background:#2563eb;
}

.sell-btn{
  background:#16a34a;
}

.delete-btn{
  background:#dc2626;
}

.empty{
  text-align:center;
  padding:40px 15px;
  color:#7b8798;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:500px;
  background:#fff;
  border-radius:18px;
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  max-height:90vh;
  overflow-y:auto;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.modal-head h2{
  font-size:21px;
}

.close-btn{
  width:35px;
  height:35px;
  border:none;
  border-radius:9px;
  background:#eef2f7;
  cursor:pointer;
  font-size:20px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:700;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:18px;
}

/* =========================================================
   USER MODAL
========================================================= */

.user-table{
  width:100%;
  overflow-x:auto;
}

.user-table table{
  min-width:700px;
}

/* =========================================================
   LOADER
========================================================= */

.loader{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.72);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

body.dark .loader{
  background:rgba(0,0,0,.65);
}

.loader.show{
  display:flex;
}

.loader-box{
  background:#fff;
  padding:22px 28px;
  border-radius:16px;
  box-shadow:0 15px 50px rgba(0,0,0,.2);
  text-align:center;
}

body.dark .loader-box{
  background:#182033;
  color:#fff;
}

.spinner{
  width:38px;
  height:38px;
  border:4px solid #dbe4ff;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 12px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  min-width:250px;
  max-width:380px;
  padding:14px 17px;
  border-radius:12px;
  color:#fff;
  background:#1e293b;
  box-shadow:0 10px 35px rgba(0,0,0,.2);
  transform:translateY(120px);
  opacity:0;
  transition:.3s;
  z-index:3000;
  font-size:14px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.toast.success{
  background:#16a34a;
}

.toast.error{
  background:#dc2626;
}

.toast.warning{
  background:#f59e0b;
}

/* =========================================================
   STATUS
========================================================= */

.status-badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
}

.status-active{
  background:#dcfce7;
  color:#15803d;
}

.status-block{
  background:#fee2e2;
  color:#b91c1c;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

  .topbar{
    padding:0 12px;
  }

  .logo{
    font-size:17px;
  }

  .profile-name{
    display:none;
  }

  .container{
    padding:14px;
  }

  .page-head{
    flex-direction:column;
    align-items:flex-start;
  }

  .actions{
    width:100%;
  }

  .actions .btn{
    flex:1;
  }

}

</style>

</head>

<body>


<!-- =======================================================
     TOPBAR
======================================================= -->

<header class="topbar">

  <div class="logo">
    <span>eSS</span>
    <span>Dashboard</span>
  </div>

  <div class="right-tools">

    <button
      class="icon-btn"
      onclick="toggleTheme()"
      title="Theme"
    >
      🌙
    </button>

    <div class="profile">

      <button
        class="profile-btn"
        onclick="toggleProfile()"
      >

        <div
          class="profile-circle"
          id="profileCircle"
        >
          U
        </div>

        <span
          class="profile-name"
          id="profileName"
        >
          User
        </span>

        <span>⌄</span>

      </button>

      <div
        class="profile-menu"
        id="profileMenu"
      >

        <button onclick="openUsersModal()">
          👥 Users
        </button>

        <button onclick="logout()">
          🚪 Logout
        </button>

      </div>

    </div>

  </div>

</header>


<!-- =======================================================
     MAIN
======================================================= -->

<main class="container">


  <div class="page-head">

    <div class="page-title">

      <h1>Data Dashboard</h1>

      <p>
        Manage New Entry data
      </p>

    </div>


    <div class="actions">

      <button
        class="btn btn-primary"
        onclick="openEntryModal()"
      >
        ＋ New Entry
      </button>

      <button
        class="btn btn-light"
        onclick="loadData()"
      >
        ↻ Refresh
      </button>

    </div>

  </div>


  <!-- =====================================================
       FILTER
  ====================================================== -->

  <div class="card">

    <div class="filter-row">

      <input
        type="text"
        id="searchInput"
        placeholder="Search Name, IP, Work..."
        oninput="renderTable()"
      >

      <input
        type="date"
        id="dateFilter"
        onchange="renderTable()"
      >

      <button
        class="btn btn-secondary"
        onclick="clearFilters()"
      >
        Clear
      </button>

    </div>

  </div>


  <!-- =====================================================
       DATA TABLE
  ====================================================== -->

  <div class="card">

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>SI</th>

            <th>Name</th>

            <th>IP</th>

            <th>Work</th>

            <th>Date</th>

            <th>Action</th>

          </tr>

        </thead>

        <tbody id="dataBody">

          <tr>

            <td
              colspan="6"
              class="empty"
            >
              Loading data...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>


</main>


<!-- =======================================================
     NEW ENTRY MODAL
======================================================= -->

<div
  class="modal"
  id="entryModal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="entryModalTitle">
        New Entry
      </h2>

      <button
        class="close-btn"
        onclick="closeModal('entryModal')"
      >
        ×
      </button>

    </div>


    <input
      type="hidden"
      id="editRow"
    >


    <div class="form-group">

      <label>Name</label>

      <input
        type="text"
        id="entryName"
        placeholder="Enter name"
      >

    </div>


    <div class="form-group">

      <label>IP</label>

      <input
        type="text"
        id="entryIp"
        placeholder="Enter IP"
      >

    </div>


    <div class="form-group">

      <label>Work</label>

      <textarea
        id="entryWork"
        rows="3"
        placeholder="Enter work"
      ></textarea>

    </div>


    <div class="form-group">

      <label>Date</label>

      <input
        type="date"
        id="entryDate"
      >

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-light"
        onclick="closeModal('entryModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-primary"
        id="saveEntryBtn"
        onclick="saveEntry()"
      >
        Save Entry
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     USERS MODAL
======================================================= -->

<div
  class="modal"
  id="usersModal"
>

  <div
    class="modal-box"
    style="max-width:900px"
  >

    <div class="modal-head">

      <h2>Users</h2>

      <button
        class="close-btn"
        onclick="closeModal('usersModal')"
      >
        ×
      </button>

    </div>


    <div
      class="actions"
      style="margin-bottom:15px"
    >

      <button
        class="btn btn-primary"
        onclick="openUserForm()"
      >
        ＋ Add User
      </button>

      <button
        class="btn btn-light"
        onclick="loadUsers()"
      >
        ↻ Refresh
      </button>

    </div>


    <div class="user-table">

      <table>

        <thead>

          <tr>

            <th>Username</th>
            <th>Name</th>
            <th>Role</th>
            <th>Status</th>
            <th>Action</th>

          </tr>

        </thead>

        <tbody id="usersBody">

          <tr>

            <td
              colspan="5"
              class="empty"
            >
              Loading...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>


<!-- =======================================================
     USER FORM
======================================================= -->

<div
  class="modal"
  id="userFormModal"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="userFormTitle">
        Add User
      </h2>

      <button
        class="close-btn"
        onclick="closeModal('userFormModal')"
      >
        ×
      </button>

    </div>


    <input
      type="hidden"
      id="userEditMode"
    >


    <div class="form-group">

      <label>Username</label>

      <input
        id="userUsername"
        type="text"
        placeholder="Username"
      >

    </div>


    <div class="form-group">

      <label>Password</label>

      <input
        id="userPassword"
        type="password"
        placeholder="Password"
      >

    </div>


    <div class="form-group">

      <label>Name</label>

      <input
        id="userName"
        type="text"
        placeholder="Name"
      >

    </div>


    <div class="form-group">

      <label>Role</label>

      <select id="userRole">

        <option value="admin">
          Admin
        </option>

        <option value="manager">
          Manager
        </option>

        <option value="support">
          Support
        </option>

        <option value="call">
          Call
        </option>

        <option value="guest">
          Guest
        </option>

      </select>

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-light"
        onclick="closeModal('userFormModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-primary"
        onclick="saveUser()"
      >
        Save User
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     LOADER
======================================================= -->

<div
  class="loader"
  id="loader"
>

  <div class="loader-box">

    <div class="spinner"></div>

    <div id="loaderText">
      Loading...
    </div>

  </div>

</div>


<!-- =======================================================
     TOAST
======================================================= -->

<div
  class="toast"
  id="toast"
></div>


<script>

/* =========================================================
   API URLS
========================================================= */

const USER_API_URL =
"https://script.google.com/macros/s/AKfycbw00GHHheuvtdQtgPURjs4PtsM48-4yaFx-_ms0ZBV5FHhnmcdbJ5DHr3Aix8JPF0kQzA/exec";


const DATA_API_URL =
"https://script.google.com/macros/s/AKfycbz59T-4CKQDbHJB_ql6OYZf18eN7XUmttp0d2FaOM5pm27yCBOWrEilqA_zMOnFq_rz/exec";


/* =========================================================
   GLOBAL DATA
========================================================= */

let allData = [];

let allUsers = [];


/* =========================================================
   LOGIN CHECK
========================================================= */

function checkLogin(){

  const logged =
    localStorage.getItem("dashboardAuth") ||
    localStorage.getItem("isLogin") ||
    sessionStorage.getItem("dashboardAuth");


  if(
    logged !== "true" &&
    logged !== "1"
  ){

    window.location.href = "index.html";

    return false;

  }


  return true;

}


/* =========================================================
   CURRENT USER
========================================================= */

function getCurrentUser(){

  let user = null;

  try{

    user =
      JSON.parse(
        localStorage.getItem("userData") ||
        localStorage.getItem("userInfo") ||
        localStorage.getItem("loginData") ||
        "{}"
      );

  }catch(e){

    user = {};

  }


  const username =
    localStorage.getItem("username") ||
    localStorage.getItem("loggedUser") ||
    user.username ||
    "";

  const name =
    localStorage.getItem("name") ||
    user.name ||
    username ||
    "User";


  return {
    username:username,
    name:name,
    role:user.role || localStorage.getItem("role") || ""
  };

}


/* =========================================================
   PROFILE
========================================================= */

function loadProfile(){

  const user = getCurrentUser();

  document.getElementById("profileName").textContent =
    user.name || "User";

  const letter =
    (user.name || "U").charAt(0).toUpperCase();

  document.getElementById("profileCircle").textContent =
    letter;

}


/* =========================================================
   PROFILE MENU
========================================================= */

function toggleProfile(){

  document
    .getElementById("profileMenu")
    .classList.toggle("show");

}


/* =========================================================
   CLOSE PROFILE MENU
========================================================= */

document.addEventListener(
  "click",
  function(e){

    const profile =
      document.querySelector(".profile");

    if(
      profile &&
      !profile.contains(e.target)
    ){

      document
        .getElementById("profileMenu")
        .classList.remove("show");

    }

  }
);


/* =========================================================
   LOADER
========================================================= */

function showLoader(text){

  document.getElementById("loaderText")
    .textContent =
      text || "Loading...";

  document.getElementById("loader")
    .classList.add("show");

}


function hideLoader(){

  document.getElementById("loader")
    .classList.remove("show");

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function toast(
  message,
  type="success"
){

  const box =
    document.getElementById("toast");

  box.textContent = message;

  box.className =
    "toast show " + type;


  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(function(){

      box.classList.remove("show");

    },3000);

}


/* =========================================================
   THEME
========================================================= */

function toggleTheme(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "dashboardTheme",
    document.body.classList.contains("dark")
      ? "dark"
      : "light"
  );

}


function loadTheme(){

  if(
    localStorage.getItem(
      "dashboardTheme"
    ) === "dark"
  ){

    document.body.classList.add("dark");

  }

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

  showLoader("Loading data...");


  try{

    const response =
      await fetch(
        DATA_API_URL +
        "?action=getData&_=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    if(
      result &&
      result.success === false
    ){

      throw new Error(
        result.error ||
        "Failed to load data"
      );

    }


    allData =
      Array.isArray(result.data)
        ? result.data
        : Array.isArray(result.users)
          ? result.users
          : [];


    renderTable();


  }catch(error){

    console.error(error);

    allData = [];

    renderTable();

    toast(
      error.message ||
      "Failed to load data",
      "error"
    );

  }finally{

    hideLoader();

  }

}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable(){

  const body =
    document.getElementById("dataBody");


  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  const dateFilter =
    document
      .getElementById("dateFilter")
      .value
      .trim();


  let filtered =
    allData.filter(function(item){

      const name =
        String(item.name || "")
          .toLowerCase();

      const ip =
        String(item.ip || "")
          .toLowerCase();

      const work =
        String(item.work || "")
          .toLowerCase();

      const date =
        normalizeDate(item.date);


      const matchSearch =
        !search ||
        name.includes(search) ||
        ip.includes(search) ||
        work.includes(search) ||
        date.toLowerCase().includes(search);


      const matchDate =
        !dateFilter ||
        date === dateFilter ||
        date.includes(dateFilter);


      return (
        matchSearch &&
        matchDate
      );

    });


  if(filtered.length === 0){

    body.innerHTML = `
      <tr>
        <td colspan="6" class="empty">
          No data found
        </td>
      </tr>
    `;

    return;

  }


  body.innerHTML =
    filtered.map(function(item,index){

      const row =
        Number(item.row) || 0;


      return `
        <tr>

          <td>${index + 1}</td>

          <td>${escapeHtml(item.name)}</td>

          <td>${escapeHtml(item.ip)}</td>

          <td>${escapeHtml(item.work)}</td>

          <td>${escapeHtml(
            displayDate(item.date)
          )}</td>

          <td>

            <div class="action-cell">

              <button
                class="small-btn edit-btn"
                onclick="openEditModal(${row})"
              >
                Edit
              </button>

              <button
                class="small-btn sell-btn"
                onclick="sellEntry(${row})"
              >
                Sell
              </button>

              <button
                class="small-btn delete-btn"
                onclick="deleteEntry(${row})"
              >
                Delete
              </button>

            </div>

          </td>

        </tr>
      `;

    }).join("");

}


/* =========================================================
   NORMALIZE DATE
========================================================= */

function normalizeDate(value){

  if(!value){
    return "";
  }


  const text =
    String(value);


  if(
    /^\d{4}-\d{2}-\d{2}$/.test(text)
  ){

    return text;

  }


  const d =
    new Date(value);


  if(
    !isNaN(d.getTime())
  ){

    const y =
      d.getFullYear();

    const m =
      String(
        d.getMonth()+1
      ).padStart(2,"0");

    const day =
      String(
        d.getDate()
      ).padStart(2,"0");


    return `${y}-${m}-${day}`;

  }


  return text;

}


/* =========================================================
   DISPLAY DATE
========================================================= */

function displayDate(value){

  if(!value){
    return "";
  }


  const normalized =
    normalizeDate(value);


  if(
    /^\d{4}-\d{2}-\d{2}$/
      .test(normalized)
  ){

    const parts =
      normalized.split("-");

    return (
      parts[2] +
      "/" +
      parts[1] +
      "/" +
      parts[0]
    );

  }


  return String(value);

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =========================================================
   TODAY
========================================================= */

function todayLocal(){

  const d =
    new Date();

  const y =
    d.getFullYear();

  const m =
    String(
      d.getMonth()+1
    ).padStart(2,"0");

  const day =
    String(
      d.getDate()
    ).padStart(2,"0");


  return `${y}-${m}-${day}`;

}

/* =========================================================
   SAVE / UPDATE ENTRY
========================================================= */

async function saveEntry(){

  const row =
    document.getElementById(
      "editRow"
    ).value;


  const name =
    document.getElementById(
      "entryName"
    ).value.trim();


  const ip =
    document.getElementById(
      "entryIp"
    ).value.trim();


  const work =
    document.getElementById(
      "entryWork"
    ).value.trim();


  const date =
    document.getElementById(
      "entryDate"
    ).value;


  if(!name){

    toast(
      "Name is required",
      "warning"
    );

    return;

  }


  if(!work){

    toast(
      "Work is required",
      "warning"
    );

    return;

  }


  if(!date){

    toast(
      "Date is required",
      "warning"
    );

    return;

  }


  const isEdit =
    !!row;


  showLoader(
    isEdit
      ? "Updating..."
      : "Saving..."
  );


  try{

    const payload = {

      action:
        isEdit
          ? "editData"
          : "addData",

      name:name,

      ip:ip,

      work:work,

      date:date

    };


    if(isEdit){

      payload.row =
        Number(row);

    }


    const response =
      await fetch(
        DATA_API_URL,
        {
          method:"POST",
          body:JSON.stringify(payload)
        }
      );


    const result =
      await response.json();


    if(
      !result ||
      result.success === false
    ){

      throw new Error(
        result.error ||
        "Operation failed"
      );

    }


    closeModal(
      "entryModal"
    );


    toast(
      isEdit
        ? "Data updated successfully"
        : "New Entry saved successfully",
      "success"
    );


    await loadData();


  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Operation failed",
      "error"
    );

  }finally{

    hideLoader();

  }

}

async function loadUsers(){

        Loading...
      </td>
    </tr>
  `;


  try{

    const response =
      await fetch(
        USER_API_URL +
        "?action=getUsers&_=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    allUsers =
      Array.isArray(result.users)
        ? result.users
        : Array.isArray(result.data)
          ? result.data
          : [];


    renderUsers();


  }catch(error){

    console.error(error);

    body.innerHTML = `
      <tr>

          Failed to load users
        </td>
      </tr>
    `;

    toast(

/* =========================================================
   RENDER USERS
========================================================= */

function renderUsers(){

  const body =
    document.getElementById(
      "usersBody"
    );


  if(!allUsers.length){

    body.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          No users found
        </td>
      </tr>
    `;

    return;

  }


  const current =
    getCurrentUser();


  body.innerHTML =
    allUsers.map(function(user){

      const username =
        user.username ||
        user.Username ||
        "";


      const name =
        user.name ||
        user.Name ||
        "";


      const role =
        user.role ||
        user.Role ||
        "";


      const status =
        user.status ||
        user.Status ||
        "Active";


      const normalized =
        String(status)
          .toLowerCase();


      const isBlock =
        normalized === "block" ||
        normalized === "blocked";


      const isSelf =
        username.toLowerCase() ===
        String(
          current.username
        ).toLowerCase();


      return `
        <tr>

          <td>${escapeHtml(username)}</td>

          <td>${escapeHtml(name)}</td>

          <td>${escapeHtml(role)}</td>

          <td>

            <span class="status-badge ${
              isBlock
                ? "status-block"
                : "status-active"
            }">

              ${
                isBlock
                  ? "Block"
                  : "Active"
              }

            </span>

          </td>

          <td>

            <div class="action-cell">

              <button
                class="small-btn edit-btn"
                onclick="editUser(
                  '${escapeJs(username)}'
                )"
              >
                Edit
              </button>

              ${
                isSelf
                  ? ""
                  : `
                    <button
                      class="small-btn ${
                        isBlock
                          ? "sell-btn"
                          : "delete-btn"
                      }"
                      onclick="toggleUser(
                        '${escapeJs(username)}'
                      )"
                    >
                      ${
                        isBlock
                          ? "Unblock"
                          : "Block"
                      }
                    </button>
                  `
              }

            </div>

          </td>

        </tr>
      `;

    }).join("");

}

/* =========================================================
   SAVE USER
========================================================= */

async function saveUser(){

  const editUsername =
    document.getElementById(
      "userEditMode"
    ).value;


  const username =
    document.getElementById(
      "userUsername"
    ).value.trim();


  const password =
    document.getElementById(
      "userPassword"
    ).value;


  const name =
    document.getElementById(
      "userName"
    ).value.trim();


  const role =
    document.getElementById(
      "userRole"
    ).value;


  if(!username){

    toast(
      "Username is required",
      "warning"
    );

    return;

  }


  if(!name){

    toast(
      "Name is required",
      "warning"
    );

    return;

  }


  if(!editUsername && !password){

    toast(
      "Password is required",
      "warning"
    );

    return;

  }


  showLoader(
    editUsername
      ? "Updating user..."
      : "Adding user..."
  );


  try{

    const payload = {

      action:
        editUsername
          ? "editUser"
          : "addUser",

      username:username,

      name:name,

      role:role

    };


    if(editUsername){

      payload.oldUsername =
        editUsername;

      if(password){

        payload.password =
          password;

      }

    }else{

      payload.password =
        password;

    }


    const response =
      await fetch(
        USER_API_URL,
        {
          method:"POST",
          body:JSON.stringify(payload)
        }
      );


    const result =
      await response.json();


    if(
      !result ||
      result.success === false
    ){

      throw new Error(
        result.error ||
        "User operation failed"
      );

    }


    closeModal(
      "userFormModal"
    );


    toast(
      editUsername
        ? "User updated successfully"
        : "User added successfully",
      "success"
    );


    await loadUsers();


  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "User operation failed",
      "error"
    );

  }finally{

    hideLoader();

  }

}


/* =========================================================
   TOGGLE USER
========================================================= */

async function toggleUser(username){

  const current =
    getCurrentUser();


  if(
    String(username).toLowerCase() ===
    String(current.username).toLowerCase()
  ){

    toast(
      "You cannot block your own account",
      "warning"
    );

    return;

  }


  const user =
    allUsers.find(function(u){

      return String(
        u.username ||
        u.Username ||
        ""
      ).toLowerCase() ===
      String(username).toLowerCase();

    });


  if(!user){
    return;
  }


  const oldStatus =
    user.status ||
    user.Status ||
    "Active";


  const blocked =
    String(oldStatus)
      .toLowerCase() === "block" ||
    String(oldStatus)
      .toLowerCase() === "blocked";


  const newStatus =
    blocked
      ? "Active"
      : "Block";


  const ok =
    window.confirm(
      `Change ${username} status to ${newStatus}?`
    );


  if(!ok){
    return;
  }


  showLoader(
    "Updating status..."
  );


  try{

    const response =
      await fetch(
        USER_API_URL,
        {
          method:"POST",
          body:JSON.stringify({

            action:
              "toggleUserStatus",

            username:
              username,

            status:
              newStatus

          })
        }
      );


    const result =
      await response.json();


    if(
      !result ||
      result.success === false
    ){

      throw new Error(
        result.error ||
        "Status update failed"
      );

    }


    toast(
      "User status updated",
      "success"
    );


    await loadUsers();


  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Status update failed",
      "error"
    );

  }finally{

    hideLoader();

  }

}


/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJs(value){

  return String(
    value ?? ""
  )
  .replace(/\\/g,"\\\\")
  .replace(/'/g,"\\'")
  .replace(/"/g,"&quot;")
  .replace(/\n/g,"\\n")
  .replace(/\r/g,"\\r");

}

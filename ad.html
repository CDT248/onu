<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Data Dashboard</title>

<link rel="icon"
      type="image/png"
      href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #f4f7fb,
            #eef2f7
        );

    color:#172033;
    min-height:100vh;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    width:100%;
    height:72px;

    background:#ffffff;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 25px;

    border-bottom:1px solid #e6eaf0;

    position:sticky;
    top:0;
    z-index:100;
}

.logoArea{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:42px;
    height:42px;

    border-radius:12px;

    object-fit:cover;

    box-shadow:
        0 5px 15px rgba(0,0,0,.12);
}

.logoText{
    font-size:19px;
    font-weight:800;
    color:#152238;
}

.logoText span{
    color:#0c8f52;
}


/* =========================================================
   HEADER RIGHT
========================================================= */

.headerRight{
    display:flex;
    align-items:center;
    gap:10px;
}

.userBadge{
    background:#f0fdf6;

    color:#087443;

    border:1px solid #ccefdc;

    padding:9px 13px;

    border-radius:10px;

    font-size:13px;
    font-weight:700;
}

.logoutBtn{
    border:none;

    background:#172033;
    color:#ffffff;

    padding:10px 15px;

    border-radius:10px;

    cursor:pointer;

    font-weight:700;

    transition:.2s;
}

.logoutBtn:hover{
    background:#0b8f52;
}


/* =========================================================
   MAIN
========================================================= */

.main{
    width:100%;
    max-width:1500px;

    margin:auto;

    padding:24px;
}


/* =========================================================
   TITLE
========================================================= */

.pageTitle{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:20px;
}

.pageTitle h1{
    font-size:27px;
    font-weight:850;
}

.pageTitle p{
    color:#758096;
    margin-top:5px;
    font-size:14px;
}


/* =========================================================
   STATS
========================================================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;

    margin-bottom:20px;
}

.statCard{
    background:#ffffff;

    border:1px solid #e8ecf2;

    border-radius:16px;

    padding:18px;

    box-shadow:
        0 8px 25px rgba(25,35,55,.06);

    position:relative;

    overflow:hidden;
}

.statCard::after{
    content:"";

    position:absolute;

    right:-30px;
    bottom:-30px;

    width:90px;
    height:90px;

    border-radius:50%;

    background:#eef8f3;
}

.statIcon{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:#eef8f3;

    color:#07894d;

    font-size:18px;

    margin-bottom:10px;
}

.statTitle{
    font-size:13px;
    color:#778195;
    font-weight:600;
}

.statNumber{
    font-size:25px;
    font-weight:850;

    margin-top:4px;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
    background:#ffffff;

    border:1px solid #e7ebf1;

    border-radius:16px;

    padding:15px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    margin-bottom:18px;

    box-shadow:
        0 7px 25px rgba(25,35,55,.05);
}

.tabs{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.tab{
    border:none;

    background:#f3f5f8;

    color:#5d687c;

    padding:10px 16px;

    border-radius:10px;

    font-weight:750;

    cursor:pointer;

    transition:.2s;
}

.tab:hover{
    background:#e7ecef;
}

.tab.active{
    background:#0b8f52;
    color:#ffffff;
}


.searchBox{
    position:relative;

    min-width:260px;
}

.searchBox input{
    width:100%;

    padding:11px 14px 11px 40px;

    border:1px solid #dfe4eb;

    border-radius:10px;

    outline:none;

    font-size:14px;

    transition:.2s;
}

.searchBox input:focus{
    border-color:#0b8f52;

    box-shadow:
        0 0 0 3px rgba(11,143,82,.10);
}

.searchIcon{
    position:absolute;

    left:14px;
    top:50%;

    transform:translateY(-50%);

    color:#8791a1;
}


/* =========================================================
   TABLE CARD
========================================================= */

.tableCard{
    background:#ffffff;

    border:1px solid #e7ebf1;

    border-radius:17px;

    overflow:hidden;

    box-shadow:
        0 8px 30px rgba(25,35,55,.06);
}

.tableTop{
    padding:17px 19px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #edf0f4;
}

.tableTitle{
    font-size:16px;
    font-weight:800;
}

.tableInfo{
    font-size:12px;
    color:#7b8596;
}


/* =========================================================
   TABLE
========================================================= */

.tableWrap{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;

    min-width:900px;
}

thead{
    background:#f8fafc;
}

th{
    text-align:left;

    padding:14px 16px;

    font-size:12px;

    color:#687388;

    text-transform:uppercase;

    letter-spacing:.4px;

    font-weight:800;

    border-bottom:1px solid #e8ecf1;
}

td{
    padding:14px 16px;

    border-bottom:1px solid #eef1f4;

    font-size:14px;

    color:#263248;

    vertical-align:middle;
}

tbody tr{
    transition:.18s;
}

tbody tr:hover{
    background:#fbfdfc;
}

tbody tr:last-child td{
    border-bottom:none;
}


/* =========================================================
   IP
========================================================= */

.ipText{
    font-family:
        Consolas,
        monospace;

    font-size:13px;

    background:#f3f6f9;

    padding:5px 8px;

    border-radius:7px;

    display:inline-block;
}


/* =========================================================
   WORK
========================================================= */

.workBadge{
    display:inline-flex;

    padding:6px 9px;

    border-radius:8px;

    background:#eef7ff;

    color:#2770a7;

    font-size:12px;

    font-weight:700;
}


/* =========================================================
   ACTIONS
========================================================= */

.actions{
    display:flex;

    align-items:center;

    gap:7px;

    flex-wrap:wrap;
}

.actionBtn{
    border:none;

    padding:8px 11px;

    border-radius:8px;

    cursor:pointer;

    font-size:12px;

    font-weight:800;

    display:inline-flex;

    align-items:center;

    gap:5px;

    transition:.2s;
}

.editBtn{
    background:#eef5ff;
    color:#1767c0;
}

.editBtn:hover{
    background:#dceaff;
}

.deleteBtn{
    background:#fff0f0;
    color:#d32f2f;
}

.deleteBtn:hover{
    background:#ffe0e0;
}

.sellBtn{
    background:#fff8e8;
    color:#bd7800;
}

.sellBtn:hover{
    background:#ffefc5;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
    text-align:center;

    padding:60px 20px;

    color:#8892a3;
}

.emptyIcon{
    font-size:42px;
    margin-bottom:10px;
}

.emptyTitle{
    font-size:17px;
    font-weight:800;
    color:#566174;
}

.emptyText{
    margin-top:5px;
    font-size:13px;
}


/* =========================================================
   LOADER
========================================================= */

.loader{
    display:flex;

    justify-content:center;
    align-items:center;

    gap:10px;

    padding:60px;

    color:#6d7788;
}

.spinner{
    width:22px;
    height:22px;

    border:3px solid #e4e9ef;

    border-top-color:#0b8f52;

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   MODAL
========================================================= */

.modalOverlay{
    position:fixed;

    inset:0;

    background:
        rgba(12,20,33,.52);

    backdrop-filter:
        blur(5px);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:500;

    padding:20px;
}

.modalOverlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:520px;

    background:#ffffff;

    border-radius:18px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.25);

    overflow:hidden;

    animation:
        modalIn .2s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(15px) scale(.98);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.modalHeader{
    padding:19px 20px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #edf0f4;
}

.modalHeader h3{
    font-size:18px;
}

.closeBtn{
    width:34px;
    height:34px;

    border:none;

    background:#f1f3f6;

    border-radius:9px;

    cursor:pointer;

    font-size:18px;

    color:#596476;
}

.closeBtn:hover{
    background:#e7eaee;
}

.modalBody{
    padding:20px;
}

.formGrid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:14px;
}

.formGroup{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.formGroup.full{
    grid-column:1 / -1;
}

.formGroup label{
    font-size:12px;

    font-weight:800;

    color:#647085;
}

.formGroup input{
    width:100%;

    border:1px solid #dfe4eb;

    padding:11px 12px;

    border-radius:9px;

    outline:none;

    font-size:14px;
}

.formGroup input:focus{
    border-color:#0b8f52;

    box-shadow:
        0 0 0 3px rgba(11,143,82,.08);
}

.modalFooter{
    padding:15px 20px;

    display:flex;

    justify-content:flex-end;

    gap:9px;

    border-top:1px solid #edf0f4;
}

.cancelBtn,
.saveBtn{
    border:none;

    padding:10px 17px;

    border-radius:9px;

    cursor:pointer;

    font-weight:800;
}

.cancelBtn{
    background:#f0f2f5;
    color:#596476;
}

.saveBtn{
    background:#0b8f52;
    color:#ffffff;
}

.saveBtn:hover{
    background:#087743;
}


/* =========================================================
   CONFIRM MODAL
========================================================= */

.confirmIcon{
    width:55px;
    height:55px;

    margin:5px auto 15px;

    border-radius:50%;

    background:#fff0f0;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#d83232;

    font-size:24px;
}

.confirmText{
    text-align:center;

    color:#687388;

    line-height:1.6;

    font-size:14px;
}

.confirmText strong{
    color:#202b3d;
}

.confirmActions{
    display:flex;

    justify-content:center;

    gap:10px;

    margin-top:20px;
}

.confirmDelete{
    background:#d93636;

    color:#ffffff;

    border:none;

    padding:10px 20px;

    border-radius:9px;

    font-weight:800;

    cursor:pointer;
}

.confirmDelete:hover{
    background:#b92323;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    right:22px;
    bottom:22px;

    min-width:280px;

    max-width:380px;

    background:#172033;

    color:#ffffff;

    padding:14px 16px;

    border-radius:12px;

    box-shadow:
        0 15px 35px rgba(0,0,0,.2);

    display:flex;

    align-items:center;

    gap:10px;

    opacity:0;

    pointer-events:none;

    transform:
        translateY(15px);

    transition:.25s;

    z-index:1000;

    font-size:13px;

    font-weight:650;
}

.toast.show{
    opacity:1;

    pointer-events:auto;

    transform:
        translateY(0);
}

.toast.success{
    background:#087b47;
}

.toast.error{
    background:#c62828;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1000px){

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:700px){

    .header{
        height:auto;

        min-height:70px;

        padding:12px 15px;
    }

    .logoText{
        font-size:16px;
    }

    .userBadge{
        display:none;
    }

    .main{
        padding:15px;
    }

    .pageTitle{
        align-items:flex-start;
    }

    .pageTitle h1{
        font-size:22px;
    }

    .toolbar{
        flex-direction:column;
        align-items:stretch;
    }

    .tabs{
        width:100%;
    }

    .tab{
        flex:1;
    }

    .searchBox{
        width:100%;
        min-width:0;
    }

    .stats{
        grid-template-columns:
            1fr 1fr;

        gap:10px;
    }

    .statCard{
        padding:14px;
    }

    .statNumber{
        font-size:21px;
    }

    .formGrid{
        grid-template-columns:1fr;
    }

    .formGroup.full{
        grid-column:auto;
    }

}

@media(max-width:450px){

    .stats{
        grid-template-columns:1fr;
    }

    .logoutBtn{
        padding:9px 11px;
    }

    .pageTitle{
        flex-direction:column;
        gap:5px;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

    <div class="logoArea">

        <img
            class="logo"
            src="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
            alt="Admin"
        >

        <div class="logoText">
            Data <span>Dashboard</span>
        </div>

    </div>


    <div class="headerRight">

        <div
            class="userBadge"
            id="usernameBadge"
        >
            Admin
        </div>

        <button
            class="logoutBtn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">


    <div class="pageTitle">

        <div>

            <h1>Admin Dashboard</h1>

            <p>
                Manage User, Deleted and Sell records
            </p>

        </div>

    </div>



    <!-- ===================================================
         STATS
    =================================================== -->

    <section class="stats">


        <div class="statCard">

            <div class="statIcon">
                👥
            </div>

            <div class="statTitle">
                Active Users
            </div>

            <div
                class="statNumber"
                id="userCount"
            >
                0
            </div>

        </div>


        <div class="statCard">

            <div class="statIcon">
                🗑️
            </div>

            <div class="statTitle">
                Deleted Records
            </div>

            <div
                class="statNumber"
                id="deletedCount"
            >
                0
            </div>

        </div>


        <div class="statCard">

            <div class="statIcon">
                💰
            </div>

            <div class="statTitle">
                Sold Records
            </div>

            <div
                class="statNumber"
                id="sellCount"
            >
                0
            </div>

        </div>


        <div class="statCard">

            <div class="statIcon">
                📊
            </div>

            <div class="statTitle">
                Total Records
            </div>

            <div
                class="statNumber"
                id="totalCount"
            >
                0
            </div>

        </div>


    </section>



    <!-- ===================================================
         TOOLBAR
    =================================================== -->

    <section class="toolbar">


        <div class="tabs">

            <button
                class="tab active"
                data-sheet="User"
                onclick="changeSheet('User',this)"
            >
                👥 User
            </button>


            <button
                class="tab"
                data-sheet="Deleted"
                onclick="changeSheet('Deleted',this)"
            >
                🗑️ Deleted
            </button>


            <button
                class="tab"
                data-sheet="Sell"
                onclick="changeSheet('Sell',this)"
            >
                💰 Sell
            </button>

        </div>


        <div class="searchBox">

            <span class="searchIcon">
                🔎
            </span>

            <input
                type="text"
                id="searchInput"
                placeholder="Search name, IP or work..."
                oninput="renderTable()"
            >

        </div>


    </section>



    <!-- ===================================================
         TABLE
    =================================================== -->

    <section class="tableCard">


        <div class="tableTop">

            <div
                class="tableTitle"
                id="tableTitle"
            >
                User Records
            </div>

            <div
                class="tableInfo"
                id="tableInfo"
            >
                Loading...
            </div>

        </div>


        <div
            class="tableWrap"
            id="tableContainer"
        >

            <div class="loader">

                <div class="spinner"></div>

                Loading records...

            </div>

        </div>


    </section>


</main>



<!-- =======================================================
     EDIT MODAL
======================================================= -->

<div
    class="modalOverlay"
    id="editModal"
>

    <div class="modal">


        <div class="modalHeader">

            <h3>
                ✏️ Edit Record
            </h3>

            <button
                class="closeBtn"
                onclick="closeEditModal()"
            >
                ×
            </button>

        </div>


        <div class="modalBody">

            <div class="formGrid">


                <div class="formGroup">

                    <label>
                        Name
                    </label>

                    <input
                        type="text"
                        id="editName"
                    >

                </div>


                <div class="formGroup">

                    <label>
                        IP
                    </label>

                    <input
                        type="text"
                        id="editIp"
                    >

                </div>


                <div class="formGroup full">

                    <label>
                        Work
                    </label>

                    <input
                        type="text"
                        id="editWork"
                    >

                </div>


                <div class="formGroup full">

                    <label>
                        Date
                    </label>

                    <input
                        type="text"
                        id="editDate"
                    >

                </div>


            </div>

        </div>


        <div class="modalFooter">

            <button
                class="cancelBtn"
                onclick="closeEditModal()"
            >
                Cancel
            </button>

            <button
                class="saveBtn"
                onclick="saveEdit()"
            >
                Save Changes
            </button>

        </div>


    </div>

</div>



<!-- =======================================================
     DELETE CONFIRM MODAL
======================================================= -->

<div
    class="modalOverlay"
    id="deleteModal"
>

    <div class="modal">


        <div class="modalBody">

            <div class="confirmIcon">
                🗑️
            </div>


            <div
                class="confirmText"
                id="deleteConfirmText"
            >
                Are you sure?
            </div>


            <div class="confirmActions">

                <button
                    class="cancelBtn"
                    onclick="closeDeleteModal()"
                >
                    Cancel
                </button>

                <button
                    class="confirmDelete"
                    onclick="confirmDelete()"
                >
                    Delete
                </button>

            </div>

        </div>


    </div>

</div>



<!-- =======================================================
     SELL CONFIRM MODAL
======================================================= -->

<div
    class="modalOverlay"
    id="sellModal"
>

    <div class="modal">


        <div class="modalBody">

            <div
                class="confirmIcon"
                style="
                    background:#fff8e7;
                    color:#bd7800;
                "
            >
                💰
            </div>


            <div
                class="confirmText"
                id="sellConfirmText"
            >
                Are you sure you want to sell this record?
            </div>


            <div class="confirmActions">

                <button
                    class="cancelBtn"
                    onclick="closeSellModal()"
                >
                    Cancel
                </button>

                <button
                    class="confirmDelete"
                    style="
                        background:#c58a17;
                    "
                    onclick="confirmSell()"
                >
                    💰 Sell
                </button>

            </div>

        </div>


    </div>

</div>



<!-- =======================================================
     TOAST
======================================================= -->

<div
    class="toast"
    id="toast"
>
    <span id="toastIcon">✓</span>

    <span id="toastMessage">
        Done
    </span>
</div>



<script>


/* =========================================================
   CONFIG
========================================================= */

/*
   IMPORTANT:
   এখানে তোমার Apps Script Web App URL বসাও।

   Example:
   https://script.google.com/macros/s/XXXXXXXX/exec
*/

const API_URL =
    "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";



/* =========================================================
   STATE
========================================================= */

let currentSheet =
    "User";


let currentData =
    [];


let editRow =
    null;


let editData =
    null;


let deleteRow =
    null;


let deleteData =
    null;


let sellRow =
    null;


let sellData =
    null;



/* =========================================================
   USERNAME
========================================================= */

function getUsername(){

    return (
        localStorage.getItem("username") ||
        localStorage.getItem("Username") ||
        sessionStorage.getItem("username") ||
        sessionStorage.getItem("Username") ||
        "Admin"
    );

}


document.getElementById(
    "usernameBadge"
).textContent =
    getUsername();



/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadAllCounts();

        loadData("User");

    }
);



/* =========================================================
   CHANGE SHEET
========================================================= */

function changeSheet(
    sheet,
    button
){

    currentSheet =
        sheet;


    document
        .querySelectorAll(".tab")
        .forEach(
            function(btn){

                btn.classList.remove(
                    "active"
                );

            }
        );


    button.classList.add(
        "active"
    );


    const titles = {

        User:
            "User Records",

        Deleted:
            "Deleted Records",

        Sell:
            "Sold Records"

    };


    document.getElementById(
        "tableTitle"
    ).textContent =
        titles[sheet] ||
        sheet + " Records";


    loadData(sheet);

}



/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(
    sheet
){

    currentData = [];


    document.getElementById(
        "tableContainer"
    ).innerHTML = `

        <div class="loader">

            <div class="spinner"></div>

            Loading records...

        </div>

    `;


    try{

        const url =
            API_URL +
            "?action=getData&sheet=" +
            encodeURIComponent(sheet) +
            "&t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        const result =
            await response.json();


        if(
            !result.success
        ){

            throw new Error(
                result.message ||
                "Failed to load data."
            );

        }


        currentData =
            Array.isArray(
                result.data
            )
                ? result.data
                : [];


        renderTable();


        document.getElementById(
            "tableInfo"
        ).textContent =
            currentData.length +
            " record" +
            (
                currentData.length === 1
                    ? ""
                    : "s"
            );


    }catch(error){

        console.error(
            error
        );


        document.getElementById(
            "tableContainer"
        ).innerHTML = `

            <div class="empty">

                <div class="emptyIcon">
                    ⚠️
                </div>

                <div class="emptyTitle">
                    Failed to load data
                </div>

                <div class="emptyText">
                    ${escapeHtml(
                        error.message
                    )}
                </div>

            </div>

        `;

        showToast(
            error.message,
            "error"
        );

    }

}



/* =========================================================
   LOAD COUNTS
========================================================= */

async function loadAllCounts(){

    try{

        const sheets = [
            "User",
            "Deleted",
            "Sell"
        ];


        const results =
            await Promise.all(

                sheets.map(
                    function(sheet){

                        return fetch(
                            API_URL +
                            "?action=getData&sheet=" +
                            encodeURIComponent(sheet) +
                            "&t=" +
                            Date.now()
                        )
                        .then(
                            response =>
                                response.json()
                        );

                    }
                )

            );


        const userData =
            results[0].success
                ? results[0].data || []
                : [];


        const deletedData =
            results[1].success
                ? results[1].data || []
                : [];


        const sellData =
            results[2].success
                ? results[2].data || []
                : [];


        document.getElementById(
            "userCount"
        ).textContent =
            userData.length;


        document.getElementById(
            "deletedCount"
        ).textContent =
            deletedData.length;


        document.getElementById(
            "sellCount"
        ).textContent =
            sellData.length;


        document.getElementById(
            "totalCount"
        ).textContent =
            userData.length +
            deletedData.length +
            sellData.length;


    }catch(error){

        console.error(
            "Count error:",
            error
        );

    }

}



/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable(){

    const container =
        document.getElementById(
            "tableContainer"
        );


    const search =
        String(
            document.getElementById(
                "searchInput"
            ).value ||
            ""
        )
        .trim()
        .toLowerCase();


    let data =
        currentData.filter(
            function(row){

                if(!search){

                    return true;

                }


                const text =
                    [
                        row.Name,
                        row.Ip,
                        row.Work,
                        row.Date,
                        row.Username,
                        row["Source Sheet"]
                    ]
                    .join(" ")
                    .toLowerCase();


                return text.includes(
                    search
                );

            }
        );


    if(!data.length){

        container.innerHTML = `

            <div class="empty">

                <div class="emptyIcon">
                    📭
                </div>

                <div class="emptyTitle">
                    No records found
                </div>

                <div class="emptyText">
                    There are no records to display.
                </div>

            </div>

        `;

        return;

    }



    let html = `

        <table>

            <thead>

                <tr>

                    <th>#</th>

                    <th>Name</th>

                    <th>IP</th>

                    <th>Work</th>

                    <th>Date</th>
    `;


    if(
        currentSheet ===
        "Deleted" ||
        currentSheet ===
        "Sell"
    ){

        html += `

                    <th>Username</th>

        `;

    }


    html += `

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>

    `;



    data.forEach(
        function(row,index){

            html += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        <strong>
                            ${escapeHtml(
                                row.Name || "-"
                            )}
                        </strong>
                    </td>

                    <td>

                        <span class="ipText">
                            ${escapeHtml(
                                row.Ip || "-"
                            )}
                        </span>

                    </td>

                    <td>

                        <span class="workBadge">
                            ${escapeHtml(
                                row.Work || "-"
                            )}
                        </span>

                    </td>

                    <td>
                        ${escapeHtml(
                            row.Date || "-"
                        )}
                    </td>
            `;


            if(
                currentSheet ===
                "Deleted" ||
                currentSheet ===
                "Sell"
            ){

                html += `

                    <td>
                        ${escapeHtml(
                            row.Username || "-"
                        )}
                    </td>

                `;

            }


            html += `

                    <td>

                        <div class="actions">

                            <button
                                class="actionBtn editBtn"
                                onclick="openEditModal(${index})"
                            >
                                ✏️ Edit
                            </button>

                            <button
                                class="actionBtn deleteBtn"
                                onclick="openDeleteModal(${index})"
                            >
                                🗑️ Delete
                            </button>
            `;


            if(
                currentSheet ===
                "User"
            ){

                html += `

                            <button
                                class="actionBtn sellBtn"
                                onclick="openSellModal(${index})"
                            >
                                💰 Sell
                            </button>

                `;

            }


            html += `

                        </div>

                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    container.innerHTML =
        html;

}

/* =========================================================
   SAVE EDIT
========================================================= */

async function saveEdit(){

    if(
        !editRow ||
        !editData
    ){

        showToast(
            "Record not selected.",
            "error"
        );

        return;

    }


    const name =
        document.getElementById(
            "editName"
        ).value.trim();


    const ip =
        document.getElementById(
            "editIp"
        ).value.trim();


    const work =
        document.getElementById(
            "editWork"
        ).value.trim();


    const date =
        document.getElementById(
            "editDate"
        ).value.trim();


    if(!name){

        showToast(
            "Name is required.",
            "error"
        );

        return;

    }


    if(!ip){

        showToast(
            "IP is required.",
            "error"
        );

        return;

    }


    if(!work){

        showToast(
            "Work is required.",
            "error"
        );

        return;

    }


    const payload = {

        action:
            "update",

        sheet:
            currentSheet,

        row:
            editRow,

        data:{

            Name:
                name,

            Ip:
                ip,

            Work:
                work,

            Date:
                date

        }

    };


    try{

        showToast(
            "Updating record...",
            "normal"
        );


        const result =
            await postData(
                payload
            );


        if(
            !result.success
        ){

            throw new Error(
                result.message ||
                "Update failed."
            );

        }


        closeEditModal();


        showToast(
            "Record updated successfully.",
            "success"
        );


        await loadData(
            currentSheet
        );


        await loadAllCounts();


    }catch(error){

        console.error(
            error
        );


        showToast(
            error.message,
            "error"
        );

    }

}



/* =========================================================
   DELETE MODAL
========================================================= */

){

    let message = "";


    if(
        currentSheet ===
        "User"

                ${escapeHtml(
                    row.Name || "this record"
                )}

/* =========================================================
   GET FILTERED ROW
========================================================= */

function getFilteredRow(
    index
){

    const search =
        String(
            document.getElementById(
                "searchInput"
            ).value ||
            ""
        )
        .trim()
        .toLowerCase();


    const filtered =
        currentData.filter(
            function(row){

                if(!search){

                    return true;

                }


                const text =
                    [
                        row.Name,
                        row.Ip,
                        row.Work,
                        row.Date,
                        row.Username,
                        row["Source Sheet"]
                    ]
                    .join(" ")
                    .toLowerCase();


                return text.includes(
                    search
                );

            }
        );


    return filtered[index];

}



/* =========================================================
   POST DATA
========================================================= */

async function postData(
    payload
){

    const response =
        await fetch(
            API_URL,
            {
                method:
                    "POST",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );


    const text =
        await response.text();


    let result;


    try{

        result =
            JSON.parse(
                text
            );

    }catch(error){

        console.error(
            "Server response:",
            text
        );

        throw new Error(
            "Server returned invalid response."
        );

    }


    return result;

}

/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(
    message,
    type="normal"
){

    const toast =
        document.getElementById(
            "toast"
        );


    const icon =
        document.getElementById(
            "toastIcon"
        );


    const messageBox =
        document.getElementById(
            "toastMessage"
        );


    messageBox.textContent =
        message;


    toast.classList.remove(
        "success",
        "error",
        "show"
    );


    if(
        type ===
        "success"
    ){

        toast.classList.add(
            "success"
        );

        icon.textContent =
            "✓";

    }else if(
        type ===
        "error"
    ){

        toast.classList.add(
            "error"
        );

        icon.textContent =
            "✕";

    }else{

        icon.textContent =
            "•";

    }


    void toast.offsetWidth;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            3000
        );

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ??
        ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

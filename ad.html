<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Support Dashboard</title>

<link
  rel="icon"
  type="image/png"
  sizes="128x128"
  href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#687386;
  --border:#e4e9f1;
  --primary:#2563eb;
  --primary2:#1d4ed8;
  --danger:#ef4444;
  --success:#16a34a;
  --warning:#f59e0b;
  --shadow:0 10px 30px rgba(15,23,42,.08);
}

body.dark{
  --bg:#0f172a;
  --card:#182235;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --border:#2b3850;
  --shadow:0 10px 30px rgba(0,0,0,.25);
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  height:70px;
  background:var(--card);
  border-bottom:1px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 22px;

  position:sticky;
  top:0;
  z-index:100;
}

.header-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;

  border-radius:12px;

  background:linear-gradient(
    135deg,
    #2563eb,
    #7c3aed
  );

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
  font-weight:800;

  box-shadow:
    0 7px 20px rgba(37,99,235,.25);
}

.brand h1{
  font-size:18px;
  font-weight:700;
}

.brand p{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:8px;
}


/* =========================================================
   BUTTON
========================================================= */

.btn{
  border:none;
  outline:none;

  padding:10px 15px;

  border-radius:9px;

  cursor:pointer;

  font-size:13px;
  font-weight:600;

  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{
  background:var(--primary2);
}

.btn-success{
  background:var(--success);
  color:#fff;
}

.btn-danger{
  background:var(--danger);
  color:#fff;
}

.btn-warning{
  background:var(--warning);
  color:#fff;
}

.btn-secondary{
  background:#64748b;
  color:#fff;
}

.icon-btn{
  width:38px;
  height:38px;

  padding:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:transparent;

  color:var(--text);

  border:1px solid var(--border);

  border-radius:9px;

  cursor:pointer;

  font-size:17px;
}


/* =========================================================
   PROFILE
========================================================= */

.profile-wrap{
  position:relative;
}

.profile-btn{
  display:flex;
  align-items:center;
  gap:8px;

  border:1px solid var(--border);

  background:var(--card);

  color:var(--text);

  padding:5px 9px;

  border-radius:10px;

  cursor:pointer;
}

.profile-img{
  width:34px;
  height:34px;

  border-radius:50%;

  object-fit:cover;

  background:#e2e8f0;
}

.profile-text{
  text-align:left;
}

.profile-name{
  font-size:12px;
  font-weight:700;
}

.profile-role{
  font-size:10px;
  color:var(--muted);
}

.profile-menu{
  position:absolute;

  right:0;
  top:48px;

  width:190px;

  background:var(--card);

  border:1px solid var(--border);

  border-radius:12px;

  box-shadow:var(--shadow);

  padding:7px;

  display:none;
}

.profile-menu.show{
  display:block;
}

.profile-menu button{
  width:100%;

  border:none;

  background:transparent;

  color:var(--text);

  padding:11px;

  border-radius:8px;

  text-align:left;

  cursor:pointer;

  font-size:13px;
}

.profile-menu button:hover{
  background:rgba(100,116,139,.10);
}


/* =========================================================
   MAIN
========================================================= */

.main{
  max-width:1400px;
  margin:auto;
  padding:25px;
}

.page-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:20px;
}

.page-title h2{
  font-size:25px;
}

.page-title p{
  margin-top:5px;
  color:var(--muted);
  font-size:13px;
}


/* =========================================================
   FILTER
========================================================= */

.filter-card{
  background:var(--card);

  border:1px solid var(--border);

  border-radius:14px;

  padding:16px;

  box-shadow:var(--shadow);

  margin-bottom:18px;
}

.filters{
  display:grid;

  grid-template-columns:
    1.6fr
    1fr
    1fr
    auto;

  gap:10px;

  align-items:end;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-size:11px;
  font-weight:700;
  color:var(--muted);
}

input,
select{
  width:100%;

  height:40px;

  border:1px solid var(--border);

  background:var(--card);

  color:var(--text);

  border-radius:8px;

  padding:0 11px;

  outline:none;

  font-size:13px;
}

input:focus,
select:focus{
  border-color:var(--primary);

  box-shadow:
    0 0 0 3px rgba(37,99,235,.10);
}

.filter-buttons{
  display:flex;
  align-items:center;
  gap:7px;
}


/* =========================================================
   TOTAL
========================================================= */

.total-box{
  height:40px;

  display:flex;
  align-items:center;

  padding:0 12px;

  border-radius:8px;

  border:1px solid var(--border);

  background:rgba(37,99,235,.07);

  color:var(--primary);

  font-size:13px;

  font-weight:700;

  white-space:nowrap;
}


/* =========================================================
   TABLE CARD
========================================================= */

.table-card{
  background:var(--card);

  border:1px solid var(--border);

  border-radius:14px;

  box-shadow:var(--shadow);

  overflow:hidden;
}

.table-top{
  padding:15px 18px;

  border-bottom:1px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.table-title{
  font-size:15px;
  font-weight:700;
}

.table-count{
  font-size:12px;
  color:var(--muted);
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

thead{
  background:rgba(100,116,139,.07);
}

th{
  padding:13px 14px;

  text-align:left;

  font-size:11px;

  color:var(--muted);

  text-transform:uppercase;

  letter-spacing:.3px;

  border-bottom:1px solid var(--border);

  white-space:nowrap;
}

td{
  padding:13px 14px;

  font-size:13px;

  border-bottom:1px solid var(--border);

  vertical-align:middle;
}

tbody tr:hover{
  background:rgba(37,99,235,.035);
}

.empty{
  text-align:center;
  padding:40px !important;
  color:var(--muted);
}

.table-loading{
  text-align:center;
  padding:35px !important;
  color:var(--muted);
}

.small-spinner{
  display:inline-block;

  width:16px;
  height:16px;

  border:2px solid var(--border);

  border-top-color:var(--primary);

  border-radius:50%;

  animation:spin .7s linear infinite;

  vertical-align:middle;

  margin-right:7px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================================================
   PAGINATION
========================================================= */

.pagination{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:5px;

  padding:15px;

  border-top:1px solid var(--border);

  flex-wrap:wrap;
}

.page-btn{
  min-width:35px;
  height:35px;

  padding:0 10px;

  border:1px solid var(--border);

  background:var(--card);

  color:var(--text);

  border-radius:8px;

  cursor:pointer;

  font-size:12px;

  font-weight:600;

  transition:.2s;
}

.page-btn:hover{
  border-color:var(--primary);
  color:var(--primary);
}

.page-btn.active{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
}

.page-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.page-info{
  font-size:12px;
  color:var(--muted);

  margin:0 5px;
}


/* =========================================================
   ACTION BUTTONS
========================================================= */

.actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.action-btn{
  border:none;

  border-radius:7px;

  padding:7px 9px;

  color:#fff;

  cursor:pointer;

  font-size:11px;

  font-weight:700;
}

.action-edit{
  background:#2563eb;
}

.action-sell{
  background:#16a34a;
}

.action-delete{
  background:#ef4444;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;

  inset:0;

  background:rgba(15,23,42,.55);

  backdrop-filter:blur(4px);

  display:none;

  align-items:center;
  justify-content:center;

  padding:15px;

  z-index:500;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:520px;

  max-height:90vh;

  overflow:auto;

  background:var(--card);

  border:1px solid var(--border);

  border-radius:15px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.25);
}

.modal-header{
  display:flex;

  align-items:center;
  justify-content:space-between;

  padding:17px 18px;

  border-bottom:1px solid var(--border);
}

.modal-header h3{
  font-size:16px;
}

.close-btn{
  border:none;

  background:transparent;

  color:var(--muted);

  cursor:pointer;

  font-size:21px;
}

.modal-body{
  padding:18px;
}

.modal-footer{
  display:flex;

  justify-content:flex-end;

  gap:8px;

  padding:15px 18px;

  border-top:1px solid var(--border);
}


/* =========================================================
   FORM
========================================================= */

.form-grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;
}

.full{
  grid-column:1 / -1;
}


/* =========================================================
   USERS
========================================================= */

.users-table{
  width:100%;
  min-width:650px;
  border-collapse:collapse;
}

.users-wrap{
  overflow:auto;
}

.user-status{
  display:inline-block;

  padding:5px 8px;

  border-radius:20px;

  font-size:10px;

  font-weight:700;
}

.status-active{
  background:rgba(22,163,74,.12);
  color:#16a34a;
}

.status-block{
  background:rgba(239,68,68,.12);
  color:#ef4444;
}

.role-badge{
  display:inline-block;

  padding:5px 8px;

  background:rgba(37,99,235,.10);

  color:var(--primary);

  border-radius:20px;

  font-size:10px;

  font-weight:700;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  right:20px;
  bottom:20px;

  background:#172033;

  color:#fff;

  padding:12px 16px;

  border-radius:9px;

  font-size:13px;

  box-shadow:0 10px 30px rgba(0,0,0,.2);

  transform:translateY(100px);

  opacity:0;

  pointer-events:none;

  transition:.25s;

  z-index:1000;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){

  .header{
    padding:0 12px;
  }

  .brand p{
    display:none;
  }

  .header-right{
    gap:5px;
  }

  .header-right > .btn{
    padding:9px;
    font-size:11px;
  }

  .profile-text{
    display:none;
  }

  .main{
    padding:15px;
  }

  .page-head{
    align-items:flex-start;
    gap:10px;
  }

  .page-title h2{
    font-size:21px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .filter-buttons{
    width:100%;
  }

  .filter-buttons .btn{
    flex:1;
  }

  .total-box{
    justify-content:center;
    flex:1;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media(max-width:500px){

  .header{
    height:auto;
    min-height:65px;
    padding:10px;
  }

  .logo{
    width:36px;
    height:36px;
  }

  .brand h1{
    font-size:14px;
  }

  .header-right > .btn{
    display:none;
  }

  .icon-btn{
    width:34px;
    height:34px;
  }

  .profile-btn{
    padding:3px;
  }

  .profile-btn > span{
    display:none;
  }

  .page-head{
    flex-direction:column;
  }

  .page-head > .btn{
    width:100%;
  }

  .filter-buttons{
    flex-wrap:wrap;
  }

  .total-box{
    width:100%;
  }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

  <div class="header-left">

    <div class="logo">
      S
    </div>

    <div class="brand">

      <h1>
        Support Dashboard
      </h1>

      <p>
        Admin Management System
      </p>

    </div>

  </div>


  <div class="header-right">

    <button
      class="icon-btn"
      onclick="loadData()"
      title="Reload"
    >
      ↻
    </button>


    <button
      class="btn btn-primary"
      onclick="openUsersModal()"
    >
      Users
    </button>


    <button
      class="btn btn-primary"
      onclick="openNewEntryModal()"
    >
      + New Entry
    </button>


    <button
      class="icon-btn"
      onclick="toggleTheme()"
      title="Theme"
    >
      ◐
    </button>


    <div class="profile-wrap">

      <button
        class="profile-btn"
        onclick="toggleProfileMenu()"
      >

        <img
          id="profileImage"
          class="profile-img"
          src="https://cdn-icons-png.flaticon.com/128/149/149071.png"
        >

        <div class="profile-text">

          <div
            id="profileName"
            class="profile-name"
          >
            User
          </div>

          <div
            id="profileRole"
            class="profile-role"
          >
            Support
          </div>

        </div>

        <span>⌄</span>

      </button>


      <div
        id="profileMenu"
        class="profile-menu"
      >

        <button onclick="openChangePasswordModal()">
          🔑 Change Password
        </button>

        <button onclick="logout()">
          🚪 Logout
        </button>

      </div>

    </div>

  </div>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="main">


  <div class="page-head">

    <div class="page-title">

      <h2>
        Support Data
      </h2>

      <p>
        Manage support entries quickly and easily.
      </p>

    </div>


    <button
      class="btn btn-primary"
      onclick="loadData()"
    >
      Refresh Data
    </button>

  </div>


  <!-- =======================================================
       FILTER
  ======================================================== -->

  <div class="filter-card">

    <div class="filters">


      <div class="field">

        <label>
          Search
        </label>

        <input
          id="searchInput"
          type="text"
          placeholder="Search Name, IP or Work..."
          oninput="applyFilters()"
        >

      </div>


      <div class="field">

        <label>
          From Date
        </label>

        <input
          id="fromDate"
          type="date"
          onchange="applyFilters()"
        >

      </div>


      <div class="field">

        <label>
          To Date
        </label>

        <input
          id="toDate"
          type="date"
          onchange="applyFilters()"
        >

      </div>


      <div class="filter-buttons">


        <!-- TOTAL BEFORE CLEAR -->

        <div
          id="totalBox"
          class="total-box"
        >
          Total: 0
        </div>


        <button
          class="btn btn-secondary"
          onclick="clearFilters()"
        >
          Clear
        </button>


      </div>

    </div>

  </div>


  <!-- =======================================================
       TABLE
  ======================================================== -->

  <div class="table-card">


    <div class="table-top">

      <div class="table-title">
        New Entries
      </div>

      <div
        id="tableCount"
        class="table-count"
      >
        0 entries
      </div>

    </div>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>
              Name
            </th>

            <th>
              IP
            </th>

            <th>
              Work
            </th>

            <th>
              Date
            </th>

            <th>
              Action
            </th>

          </tr>

        </thead>


        <tbody id="dataBody">

          <tr>

            <td
              colspan="5"
              class="table-loading"
            >

              <span class="small-spinner"></span>

              Loading data...

            </td>

          </tr>

        </tbody>

      </table>

    </div>


    <!-- =====================================================
         PAGINATION
    ====================================================== -->

    <div
      id="pagination"
      class="pagination"
    >
    </div>


  </div>

</main>


<!-- =========================================================
     NEW ENTRY MODAL
========================================================= -->

<div
  id="newEntryModal"
  class="modal"
>

  <div class="modal-box">


    <div class="modal-header">

      <h3>
        New Entry
      </h3>

      <button
        class="close-btn"
        onclick="closeModal('newEntryModal')"
      >
        ×
      </button>

    </div>


    <div class="modal-body">

      <div class="form-grid">


        <div class="field">

          <label>
            Name
          </label>

          <input
            id="entryName"
            type="text"
            placeholder="Enter name"
          >

        </div>


        <div class="field">

          <label>
            IP
          </label>

          <input
            id="entryIp"
            type="text"
            placeholder="Enter IP"
          >

        </div>


        <div class="field full">

          <label>
            Work
          </label>

          <input
            id="entryWork"
            type="text"
            placeholder="Enter work"
          >

        </div>


        <div class="field">

          <label>
            Date
          </label>

          <input
            id="entryDate"
            type="date"
          >

        </div>


      </div>

    </div>


    <div class="modal-footer">

      <button
        class="btn btn-secondary"
        onclick="closeModal('newEntryModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-primary"
        onclick="saveNewEntry()"
      >
        Save Entry
      </button>

    </div>


  </div>

</div>


<!-- =========================================================
     EDIT MODAL
========================================================= -->

<div
  id="editModal"
  class="modal"
>

  <div class="modal-box">


    <div class="modal-header">

      <h3>
        Edit Entry
      </h3>

      <button
        class="close-btn"
        onclick="closeModal('editModal')"
      >
        ×
      </button>

    </div>


    <div class="modal-body">

      <div class="form-grid">


        <div class="field">

          <label>
            Name
          </label>

          <input
            id="editName"
            type="text"
          >

        </div>


        <div class="field">

          <label>
            IP
          </label>

          <input
            id="editIp"
            type="text"
          >

        </div>


        <div class="field full">

          <label>
            Work
          </label>

          <input
            id="editWork"
            type="text"
          >

        </div>


        <div class="field">

          <label>
            Date
          </label>

          <input
            id="editDate"
            type="date"
          >

        </div>


      </div>

    </div>


    <div class="modal-footer">

      <button
        class="btn btn-secondary"
        onclick="closeModal('editModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-primary"
        onclick="saveEdit()"
      >
        Update
      </button>

    </div>


  </div>

</div>


<!-- =========================================================
     USERS MODAL
========================================================= -->

<div
  id="usersModal"
  class="modal"
>

  <div
    class="modal-box"
    style="max-width:850px;"
  >


    <div class="modal-header">

      <h3>
        Users
      </h3>

      <button
        class="close-btn"
        onclick="closeModal('usersModal')"
      >
        ×
      </button>

    </div>


    <div class="modal-body">


      <div
        style="
          display:flex;
          justify-content:flex-end;
          margin-bottom:12px;
        "
      >

        <button
          class="btn btn-primary"
          onclick="openAddUserModal()"
        >
          + Add User
        </button>

      </div>


      <div class="users-wrap">

        <table class="users-table">

          <thead>

            <tr>

              <th>
                Username
              </th>

              <th>
                Name
              </th>

              <th>
                Role
              </th>

              <th>
                Status
              </th>

              <th>
                Action
              </th>

            </tr>

          </thead>


          <tbody id="usersBody">

            <tr>

              <td
                colspan="5"
                class="empty"
              >

<script>


// ============================================================
// API URL
// ============================================================

const USER_API_URL =
  "https://script.google.com/macros/s/AKfycbw00GHHheuvtdQtgPURjs4PtsM48-4yaFx-_ms0ZBV5FHhnmcdbJ5DHr3Aix8JPF0kQzA/exec";


const DATA_API_URL =
  "https://script.google.com/macros/s/AKfycbz59T-4CKQDbHJB_ql6OYZf18eN7XUmttp0d2FaOM5pm27yCBOWrEilqA_zMOnFq_rz/exec";


// ============================================================
// SETTINGS
// ============================================================

const ITEMS_PER_PAGE = 10;


// ============================================================
// GLOBAL
// ============================================================

let allData = [];

let filteredData = [];

let currentPage = 1;

let editingRow = null;

let editingUser = false;

let currentUsername =
  localStorage.getItem("username") ||
  localStorage.getItem("loggedUser") ||
  "";


// ============================================================
// PAGE LOAD
// ============================================================

document.addEventListener(
  "DOMContentLoaded",
  function(){

    checkLogin();

    loadTheme();

    loadUser();

    loadData();

  }
);


// ============================================================
// LOGIN CHECK
// ============================================================

function checkLogin(){

  const logged =
    localStorage.getItem(
      "dashboardAuth"
    ) === "true" ||
    sessionStorage.getItem(
      "dashboardAuth"
    ) === "true";


  if(!logged){

    window.location.href =
      "index.html";

  }

}


// ============================================================
// LOAD USER
// ============================================================

async function loadUser(){

  if(!currentUsername){
    return;
  }


  try{

    const response =
      await fetch(
        USER_API_URL +
        "?action=getUser&username=" +
        encodeURIComponent(
          currentUsername
        ) +
        "&_=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    const user =
      result.user ||
      result.data ||
      (
        Array.isArray(result)
          ? result[0]
          : null
      );


    if(!user){
      return;
    }


    const name =
      user.Name ||
      user.name ||
      user.Username ||
      user.username ||
      currentUsername;


    const role =
      user.Role ||
      user.role ||
      "support";


    const status =
      user.Status ||
      user.status ||
      "Active";


    if(
      String(status)
        .toLowerCase() ===
      "block"
    ){

      logout();

      return;

    }


    document.getElementById(
      "profileName"
    ).textContent = name;


    document.getElementById(
      "profileRole"
    ).textContent = role;


    if(
      user.Picture ||
      user.picture
    ){

      document.getElementById(
        "profileImage"
      ).src =
        user.Picture ||
        user.picture;

    }


    localStorage.setItem(
      "name",
      name
    );


    localStorage.setItem(
      "role",
      role
    );


  }catch(error){

    console.error(
      "User load error:",
      error
    );

  }

}


// ============================================================
// LOAD DATA
// ============================================================

async function loadData(){

  const body =
    document.getElementById(
      "dataBody"
    );


  body.innerHTML = `
    <tr>
      <td
        colspan="5"
        class="table-loading"
      >
        <span class="small-spinner"></span>
        Loading data...
      </td>
    </tr>
  `;


  try{

    const response =
      await fetch(
        DATA_API_URL +
        "?action=getData&_=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "DATA API RESPONSE:",
      result
    );


    let data = [];


    if(
      Array.isArray(result)
    ){

      data = result;

    }else if(
      result &&
      Array.isArray(result.data)
    ){

      data = result.data;

    }else if(
      result &&
      Array.isArray(result.users)
    ){

      data = result.users;

    }


    if(
      result &&
      result.success === false
    ){

      throw new Error(
        result.message ||
        "Failed to load data"
      );

    }


    allData =
      Array.isArray(data)
        ? data
        : [];


    filteredData =
      [...allData];


    /*
      Always start from page 1
    */

    currentPage = 1;


    updateTotal();

    renderPage();


  }catch(error){

    console.error(
      "Data load error:",
      error
    );


    body.innerHTML = `
      <tr>
        <td
          colspan="5"
          class="empty"
        >
          Failed to load data
          <br>
          <small>
            ${escapeHtml(
              error.message || ""
            )}
          </small>
        </td>
      </tr>
    `;


    document.getElementById(
      "pagination"
    ).innerHTML = "";


    showToast(
      "Data load failed"
    );

  }

}


// ============================================================
// TOTAL
// ============================================================

function updateTotal(){

  document.getElementById(
    "totalBox"
  ).textContent =
    "Total: " +
    allData.length;

}


// ============================================================
// RENDER PAGE
// ============================================================

function renderPage(){

  const body =
    document.getElementById(
      "dataBody"
    );


  const total =
    filteredData.length;


  const totalPages =
    Math.max(
      1,
      Math.ceil(
        total /
        ITEMS_PER_PAGE
      )
    );


  /*
    If current page is greater
    than available pages
  */

  if(
    currentPage >
    totalPages
  ){

    currentPage =
      totalPages;

  }


  /*
    No data
  */

  if(total === 0){

    body.innerHTML = `
      <tr>
        <td
          colspan="5"
          class="empty"
        >
          No data found
        </td>
      </tr>
    `;


    document.getElementById(
      "tableCount"
    ).textContent =
      "0 entries";


    renderPagination(
      0
    );

    return;

  }


  /*
    Calculate start/end
  */

  const start =
    (
      currentPage - 1
    ) *
    ITEMS_PER_PAGE;


  const end =
    start +
    ITEMS_PER_PAGE;


  const pageData =
    filteredData.slice(
      start,
      end
    );


  /*
    Table count
  */

  document.getElementById(
    "tableCount"
  ).textContent =
    (
      start + 1
    ) +
    " - " +
    Math.min(
      end,
      total
    ) +
    " of " +
    total;


  /*
    Render only 10
  */

  body.innerHTML =
    pageData
      .map(
        function(row,index){

          const name =
            row.Name ??
            row.name ??
            row[0] ??
            "";


          const ip =
            row.Ip ??
            row.IP ??
            row.ip ??
            row[1] ??
            "";


          const work =
            row.Work ??
            row.work ??
            row[2] ??
            "";


          const date =
            row.Date ??
            row.date ??
            row[3] ??
            "";


          /*
            Backend gives actual sheet row.
            Fallback calculated row.
          */

          const rowNumber =
            row.row ??
            row._row ??
            row.rowNumber ??
            (
              start +
              index +
              2
            );


          return `
            <tr>

              <td>
                ${escapeHtml(name)}
              </td>

              <td>
                ${escapeHtml(ip)}
              </td>

              <td>
                ${escapeHtml(work)}
              </td>

              <td>
                ${escapeHtml(
                  formatDate(date)
                )}
              </td>

              <td>

                <div class="actions">

                  <button
                    class="action-btn action-edit"
                    onclick='openEditModal(${JSON.stringify({
                      row:rowNumber,
                      Name:name,
                      Ip:ip,
                      Work:work,
                      Date:date
                    })})'
                  >
                    Edit
                  </button>


                  <button
                    class="action-btn action-sell"
                    onclick="sellEntry(${Number(rowNumber)})"
                  >
                    Sell
                  </button>


                  <button
                    class="action-btn action-delete"
                    onclick="deleteEntry(${Number(rowNumber)})"
                  >
                    Delete
                  </button>

                </div>

              </td>

            </tr>
          `;

        }
      )
      .join("");


  renderPagination(
    totalPages
  );

}


// ============================================================
// PAGINATION
// ============================================================

function renderPagination(totalPages){

  const pagination =
    document.getElementById(
      "pagination"
    );


  /*
    No pagination needed
  */

  if(
    filteredData.length <=
    ITEMS_PER_PAGE
  ){

    pagination.innerHTML = "";

    return;

  }


  let html = "";


  /*
    Previous
  */

  html += `
    <button
      class="page-btn"
      onclick="changePage(${currentPage - 1})"
      ${currentPage === 1 ? "disabled" : ""}
    >
      ‹
    </button>
  `;


  /*
    Page numbers
  */

  const maxButtons = 7;


  let startPage =
    Math.max(
      1,
      currentPage -
      Math.floor(
        maxButtons / 2
      )
    );


  let endPage =
    Math.min(
      totalPages,
      startPage +
      maxButtons -
      1
    );


  if(
    endPage - startPage + 1 <
    maxButtons
  ){

    startPage =
      Math.max(
        1,
        endPage -
        maxButtons +
        1
      );

  }


  if(startPage > 1){

    html += `
      <button
        class="page-btn"
        onclick="changePage(1)"
      >
        1
      </button>
    `;


    if(startPage > 2){

      html += `
        <span class="page-info">
          ...
        </span>
      `;

    }

  }


  for(
    let i = startPage;
    i <= endPage;
    i++
  ){

    html += `
      <button
        class="page-btn ${
          i === currentPage
            ? "active"
            : ""
        }"
        onclick="changePage(${i})"
      >
        ${i}
      </button>
    `;

  }


  if(
    endPage <
    totalPages
  ){

    if(
      endPage <
      totalPages - 1
    ){

      html += `
        <span class="page-info">
          ...
        </span>
      `;

    }


    html += `
      <button
        class="page-btn"
        onclick="changePage(${totalPages})"
      >
        ${totalPages}
      </button>
    `;

  }


  /*
    Next
  */

  html += `
    <button
      class="page-btn"
      onclick="changePage(${currentPage + 1})"
      ${
        currentPage === totalPages
          ? "disabled"
          : ""
      }
    >
      ›
    </button>
  `;


  pagination.innerHTML =
    html;

}


// ============================================================
// CHANGE PAGE
// ============================================================

function changePage(page){

  const totalPages =
    Math.max(
      1,
      Math.ceil(
        filteredData.length /
        ITEMS_PER_PAGE
      )
    );


  if(
    page < 1 ||
    page > totalPages
  ){

    return;

  }


  currentPage =
    page;


  renderPage();


  /*
    Scroll to table
  */

  document.querySelector(
    ".table-card"
  ).scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


// ============================================================
// FORMAT DATE
// ============================================================

function formatDate(value){

  if(!value){
    return "";
  }


  const text =
    String(value);


  if(
    /^\d{4}-\d{2}-\d{2}$/.test(text)
  ){

    const parts =
      text.split("-");


    return (
      parts[2] +
      "/" +
      parts[1] +
      "/" +
      parts[0]
    );

  }


  const date =
    new Date(value);


  if(
    !isNaN(
      date.getTime()
    )
  ){

    const day =
      String(
        date.getDate()
      ).padStart(
        2,
        "0"
      );


    const month =
      String(
        date.getMonth() + 1
      ).padStart(
        2,
        "0"
      );


    const year =
      date.getFullYear();


    return (
      day +
      "/" +
      month +
      "/" +
      year
    );

  }


  return text;

}


// ============================================================
// NORMALIZE DATE
// ============================================================

function normalizeDate(value){

  if(!value){
    return "";
  }


  const text =
    String(value);


  if(
    /^\d{4}-\d{2}-\d{2}$/.test(text)
  ){

    return text;

  }


  const date =
    new Date(value);


  if(
    isNaN(
      date.getTime()
    )
  ){

    return "";

  }


  return (
    date.getFullYear() +
    "-" +
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    ) +
    "-" +
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    )
  );

}


// ============================================================
// FILTER
// ============================================================

function applyFilters(){

  const search =
    document.getElementById(
      "searchInput"
    ).value
    .trim()
    .toLowerCase();


  const from =
    document.getElementById(
      "fromDate"
    ).value;


  const to =
    document.getElementById(
      "toDate"
    ).value;


  filteredData =
    allData.filter(
      function(row){

        const name =
          String(
            row.Name ??
            row.name ??
            row[0] ??
            ""
          )
          .toLowerCase();


        const ip =
          String(
            row.Ip ??
            row.IP ??
            row.ip ??
            row[1] ??
            ""
          )
          .toLowerCase();


        const work =
          String(
            row.Work ??
            row.work ??
            row[2] ??
            ""
          )
          .toLowerCase();


        const date =
          normalizeDate(
            row.Date ??
            row.date ??
            row[3] ??
            ""
          );


        const searchMatch =
          !search ||
          name.includes(search) ||
          ip.includes(search) ||
          work.includes(search);


        const fromMatch =
          !from ||
          (
            date &&
            date >= from
          );


        const toMatch =
          !to ||
          (
            date &&
            date <= to
          );


        return (
          searchMatch &&
          fromMatch &&
          toMatch
        );

      }
    );


  /*
    Go back to page 1
    whenever filter changes.
  */

  currentPage = 1;


  renderPage();

}


// ============================================================
// CLEAR FILTERS
// ============================================================

function clearFilters(){

  document.getElementById(
    "searchInput"
  ).value = "";


  document.getElementById(
    "fromDate"
  ).value = "";


  document.getElementById(
    "toDate"
  ).value = "";


  filteredData =
    [...allData];


  currentPage = 1;


  renderPage();

}

      "Delete failed"
    );

  }

}


// ============================================================
// POST DATA
// ============================================================

async function postData(data){

  const response =
    await fetch(
      DATA_API_URL,
      {

        method:"POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(data)

      }
    );


  if(!response.ok){

    throw new Error(
      "HTTP Error " +
      response.status
    );

  }


  const text =
    await response.text();


  let result;


  try{

    result =
      JSON.parse(text);

  }catch(error){

    throw new Error(
      "Invalid server response"
    );

  }


  return result;

}

// ============================================================
// LOAD USERS
// ============================================================

async function loadUsers(){

  const body =
    document.getElementById(
      "usersBody"
    );


  body.innerHTML = `
    <tr>
      <td
        colspan="5"
        class="empty"
      >
        Loading users...
      </td>
    </tr>
  `;


  try{

    const response =
      await fetch(
        USER_API_URL +
        "?action=getUsers&requester=" +
        encodeURIComponent(
          currentUsername
        ) +
        "&_=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    if(
      result.success === false
    ){

      throw new Error(
        result.message ||
        "Failed to load users"
      );

    }


    const users =
      result.users ||
      result.data ||
      (
        Array.isArray(result)
          ? result
          : []
      );


    renderUsers(
      users
    );


  }catch(error){

    console.error(error);

    body.innerHTML = `
      <tr>
        <td
          colspan="5"
          class="empty"
        >
          Failed to load users
        </td>
      </tr>
    `;


    showToast(
      "User loading failed"
    );

  }

}


// ============================================================
// RENDER USERS
// ============================================================

function renderUsers(users){

  const body =
    document.getElementById(
      "usersBody"
    );


  if(
    !users ||
    !users.length
  ){

    body.innerHTML = `
      <tr>
        <td
          colspan="5"
          class="empty"
        >
          No users found
        </td>
      </tr>
    `;

    return;

  }


  body.innerHTML =
    users
      .map(
        function(user){

          const username =
            user.Username ||
            user.username ||
            user[0] ||
            "";


          const name =
            user.Name ||
            user.name ||
            user[2] ||
            "";


          const role =
            user.Role ||
            user.role ||
            user[3] ||
            "";


          const status =
            user.Status ||
            user.status ||
            user[4] ||
            "Active";


          const statusClass =
            String(status)
              .toLowerCase()
              === "active"
                ? "status-active"
                : "status-block";


          return `
            <tr>

              <td>
                ${escapeHtml(username)}
              </td>

              <td>
                ${escapeHtml(name)}
              </td>

              <td>
                <span class="role-badge">
                  ${escapeHtml(role)}
                </span>
              </td>

              <td>

                <span
                  class="user-status ${statusClass}"
                >
                  ${escapeHtml(status)}
                </span>

              </td>

              <td>

                <div class="actions">

                  <button
                    class="action-btn action-edit"
                    onclick='editUser(${JSON.stringify(user)})'
                  >
                    Edit
                  </button>


                  <button
                    class="action-btn ${
                      String(status)
                        .toLowerCase()
                        === "active"
                        ? "action-delete"
                        : "action-sell"
                    }"
                    onclick="changeUserStatus(
                      '${escapeJs(username)}',
                      '${
                        String(status)
                          .toLowerCase()
                          === "active"
                          ? "Block"
                          : "Active"
                      }'
                    )"
                  >

                    ${
                      String(status)
                        .toLowerCase()
                        === "active"
                        ? "Block"
                        : "Activate"
                    }

                  </button>

                </div>

              </td>

            </tr>
          `;

        }
      )
      .join("");

}

// ============================================================
// SAVE USER
// ============================================================

async function saveUser(){

  const username =
    document.getElementById(
      "userUsername"
    ).value.trim();


  const name =
    document.getElementById(
      "userName"
    ).value.trim();


  const password =
    document.getElementById(
      "userPassword"
    ).value;


  const role =
    document.getElementById(
      "userRole"
    ).value;


  const status =
    document.getElementById(
      "userStatus"
    ).value;


  const originalUsername =
    document.getElementById(
      "originalUsername"
    ).value;


  if(
    !username ||
    !name ||
    !password
  ){

    showToast(
      "Please fill all fields"
    );

    return;

  }


  try{

    const action =
      editingUser
        ? "editUser"
        : "addUser";


    const payload = {

      action:action,

      username:username,

      name:name,

      password:password,

      role:role,

      status:status,

      requester:
        currentUsername

    };


    if(editingUser){

      payload.originalUsername =
        originalUsername;

    }


    const response =
      await fetch(
        USER_API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    const result =
      await response.json();


    if(
      result.success === false
    ){

      throw new Error(
        result.message ||
        "User save failed"
      );

    }


    closeModal(
      "userFormModal"
    );


    showToast(
      editingUser
        ? "User updated successfully"
        : "User added successfully"
    );


    loadUsers();


  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "User save failed"
    );

  }

}

      "Status update failed"
    );

  }

}

// ============================================================
// SAVE PASSWORD
// ============================================================

async function changePassword(){

  const current =
    document.getElementById(
      "currentPassword"
    ).value;


  const newPassword =
    document.getElementById(
      "newPassword"
    ).value;


  const confirm =
    document.getElementById(
      "confirmPassword"
    ).value;


  if(
    !current ||
    !newPassword ||
    !confirm
  ){

    showToast(
      "Please fill all fields"
    );

    return;

  }


  if(
    newPassword !==
    confirm
  ){

    showToast(
      "New passwords do not match"
    );

    return;

  }


  try{

    const response =
      await fetch(
        USER_API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({

              action:
                "changePassword",

              username:
                currentUsername,

              currentPassword:
                current,

              newPassword:
                newPassword

            })

        }
      );


    const result =
      await response.json();


    if(
      result.success === false
    ){

      throw new Error(
        result.message ||
        "Password change failed"
      );

    }


    closeModal(
      "passwordModal"
    );


    showToast(
      "Password changed successfully"
    );


  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "Password change failed"
    );

  }

}

function toggleTheme(){

    );

// ============================================================
// TOAST
// ============================================================

let toastTimer;


function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function(){

        toast.classList.remove(
          "show"
        );

      },
      2500
    );

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


// ============================================================
// ESCAPE JS
// ============================================================

function escapeJs(value){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /"/g,
    '\\"'
  );

}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Support Dashboard</title>

<link
  rel="icon"
  type="image/png"
  href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
  min-height:100vh;
}

body.dark{
  background:#101522;
  color:#f5f7fb;
}


/* HEADER */

.header{
  height:70px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:100;
}

.dark .header{
  background:#171d2b;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;
  font-size:22px;
  font-weight:bold;
}

.logo-text h2{
  font-size:19px;
}

.logo-text p{
  font-size:12px;
  color:#7b8496;
  margin-top:3px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#f0f3f8;
  font-size:18px;
}

.dark .icon-btn{
  background:#252d3d;
  color:#fff;
}

.btn{
  border:none;
  border-radius:10px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
}

.btn-primary{
  background:#2563eb;
  color:#fff;
}

.btn-secondary{
  background:#eef2f7;
  color:#253047;
}

.btn-success{
  background:#16a34a;
  color:#fff;
}

.btn-danger{
  background:#dc2626;
  color:#fff;
}


/* PROFILE */

.profile{
  position:relative;
}

.profile-btn{
  border:none;
  background:transparent;
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}

.profile-avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.profile-name strong{
  display:block;
  font-size:13px;
}

.profile-name span{
  display:block;
  color:#8a93a5;
  font-size:11px;
  margin-top:2px;
}

.profile-menu{
  position:absolute;
  right:0;
  top:52px;
  width:190px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 12px 35px rgba(0,0,0,.15);
  padding:7px;
  display:none;
}

.profile-menu.show{
  display:block;
}

.dark .profile-menu{
  background:#1d2534;
}

.profile-menu button{
  width:100%;
  border:none;
  background:transparent;
  text-align:left;
  padding:11px;
  border-radius:8px;
  cursor:pointer;
  color:inherit;
}

.profile-menu button:hover{
  background:#f1f4f9;
}

.dark .profile-menu button:hover{
  background:#293244;
}


/* MAIN */

.container{
  max-width:1450px;
  margin:auto;
  padding:25px;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:15px;
  flex-wrap:wrap;
}

.page-title h1{
  font-size:25px;
}

.page-title p{
  color:#7b8496;
  margin-top:5px;
  font-size:13px;
}


/* TOTAL */

.data-info{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:10px;
}

.total-box,
.showing-box{
  display:flex;
  align-items:center;
  gap:5px;
  background:#fff;
  border:1px solid #e7ebf2;
  border-radius:7px;
  padding:5px 9px;
  font-size:10px;
  color:#7b8496;
}

.total-box strong,
.showing-box strong{
  color:#172033;
  font-size:12px;
}

.dark .total-box,
.dark .showing-box{
  background:#171d2b;
  border-color:#293243;
  color:#aeb6c6;
}

.dark .total-box strong,
.dark .showing-box strong{
  color:#fff;
}


/* FILTER */

.filter-card{
  background:#fff;
  border-radius:14px;
  padding:13px;
  box-shadow:0 4px 20px rgba(0,0,0,.06);
  margin-bottom:14px;
}

.dark .filter-card{
  background:#171d2b;
}

.filters{
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto auto;
  gap:8px;
}

.input,
.select{
  width:100%;
  border:1px solid #dce2eb;
  background:#fff;
  color:#172033;
  border-radius:8px;
  padding:9px 11px;
  outline:none;
  font-size:13px;
}

.dark .input,
.dark .select{
  background:#202838;
  color:#fff;
  border-color:#343e51;
}

.data-type-select{
  min-width:110px;
  cursor:pointer;
  font-weight:600;
}


/* TABLE */

.table-card{
  background:#fff;
  border-radius:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.06);
  overflow:hidden;
}

.dark .table-card{
  background:#171d2b;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:800px;
}

thead{
  background:#f7f9fc;
}

.dark thead{
  background:#202838;
}

th{
  text-align:left;
  padding:13px;
  font-size:12px;
  color:#687286;
  white-space:nowrap;
}

td{
  padding:13px;
  border-top:1px solid #edf0f5;
  font-size:13px;
  white-space:nowrap;
}

.dark td{
  border-color:#293243;
}

.dark th{
  color:#aeb6c6;
}

.empty{
  text-align:center;
  padding:42px;
  color:#8a93a5;
}


/* ONLY TABLE LOADING */

.table-loading{
  text-align:center;
  padding:45px 20px !important;
  color:#7b8496;
}

.table-spinner{
  width:28px;
  height:28px;
  border:3px solid #e5e9f0;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto 10px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.dark .table-spinner{
  border-color:#30394a;
  border-top-color:#3b82f6;
}


/* PAGINATION */

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:5px;
  padding:13px;
  border-top:1px solid #edf0f5;
  flex-wrap:wrap;
}

.dark .pagination{
  border-color:#293243;
}

.page-btn{
  min-width:32px;
  height:32px;
  padding:0 8px;
  border:none;
  border-radius:7px;
  background:#eef2f7;
  color:#253047;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
}

.page-btn.active{
  background:#2563eb;
  color:#fff;
}

.page-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.dark .page-btn{
  background:#252d3d;
  color:#fff;
}

.dark .page-btn.active{
  background:#2563eb;
}


/* ACTION */

.row-actions{
  display:flex;
  gap:5px;
}

.action-btn{
  border:none;
  border-radius:6px;
  padding:6px 9px;
  cursor:pointer;
  font-size:11px;
  font-weight:bold;
}

.edit-btn{
  background:#dbeafe;
  color:#1d4ed8;
}

.sell-btn{
  background:#dcfce7;
  color:#15803d;
}

.delete-btn{
  background:#fee2e2;
  color:#b91c1c;
}


/* MODAL */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(10,16,28,.62);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:500;
  padding:20px;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:560px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:17px;
  padding:22px;
}

.dark .modal{
  background:#171d2b;
}

.modal.large{
  max-width:900px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.close{
  width:34px;
  height:34px;
  border:none;
  border-radius:9px;
  background:#eef1f6;
  cursor:pointer;
  font-size:18px;
}

.dark .close{
  background:#273041;
  color:#fff;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.form-group{
  margin-bottom:13px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  display:block;
  font-size:12px;
  font-weight:600;
  margin-bottom:6px;
}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:18px;
}


/* TOAST */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  min-width:260px;
  max-width:400px;
  padding:13px 16px;
  border-radius:11px;
  background:#172033;
  color:#fff;
  transform:translateY(100px);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:1000;
  font-size:13px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.toast.success{
  background:#15803d;
}

.toast.error{
  background:#b91c1c;
}


/* USER */

.user-table-wrap{
  overflow:auto;
}

.user-table{
  width:100%;
  min-width:700px;
}

.status{
  display:inline-flex;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.status-active{
  background:#dcfce7;
  color:#15803d;
}

.status-block{
  background:#fee2e2;
  color:#b91c1c;
}

.role{
  display:inline-flex;
  padding:5px 9px;
  border-radius:20px;
  background:#e0e7ff;
  color:#4338ca;
  font-size:11px;
  font-weight:bold;
}

.small-btn{
  border:none;
  padding:7px 10px;
  border-radius:7px;
  cursor:pointer;
  font-size:11px;
  font-weight:bold;
}

.small-edit{
  background:#dbeafe;
  color:#1d4ed8;
}

.small-block{
  background:#fee2e2;
  color:#b91c1c;
}

.small-unblock{
  background:#dcfce7;
  color:#15803d;
}


/* MOBILE */

@media(max-width:800px){

  .header{
    padding:0 12px;
  }

  .profile-name{
    display:none;
  }

  .container{
    padding:14px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .page-title h1{
    font-size:21px;
  }

}

</style>

</head>


<body>


<header class="header">

  <div class="logo-area">

    <div class="logo">S</div>

    <div class="logo-text">

      <h2>Support Dashboard</h2>

      <p>Admin Management System</p>

    </div>

  </div>


  <div class="header-actions">

    <button
      class="icon-btn"
      onclick="loadData(true)"
      title="Reload"
    >
      ↻
    </button>

    <button
      class="btn btn-primary"
      onclick="openUsersModal()"
    >
      Users
    </button>

    <button
      class="btn btn-success"
      onclick="openEntryModal()"
    >
      + New Entry
    </button>

    <button
      class="icon-btn"
      onclick="toggleTheme()"
      id="themeBtn"
    >
      🌙
    </button>


    <div class="profile">

      <button
        class="profile-btn"
        onclick="toggleProfileMenu()"
      >

        <div
          class="profile-avatar"
          id="profileAvatar"
        >
          U
        </div>

        <div class="profile-name">

          <strong id="profileName">
            User
          </strong>

          <span id="profileRole">
            User
          </span>

        </div>

      </button>


      <div
        class="profile-menu"
        id="profileMenu"
      >

        <button onclick="openPasswordModal()">
          🔑 Change Password
        </button>

        <button onclick="logout()">
          🚪 Logout
        </button>

      </div>

    </div>

  </div>

</header>


<main class="container">


  <div class="top-bar">

    <div class="page-title">

      <h1>Dashboard</h1>

      <p>
        Manage support data and users
      </p>

    </div>


    <button
      class="btn btn-primary"
      onclick="loadData(true)"
    >
      Refresh Data
    </button>

  </div>


  <!-- SMALL TOTAL -->

  <div class="data-info">

    <div class="total-box">

      <span>Total Data</span>

      <strong id="totalData">
        0
      </strong>

    </div>


    <div class="showing-box">

      <span>Showing:</span>

      <strong id="showingData">
        0-0
      </strong>

    </div>

  </div>


  <!-- FILTER -->

  <div class="filter-card">

    <div class="filters">

      <input
        type="text"
        class="input"
        id="searchInput"
        placeholder="Search..."
        oninput="applyFilters()"
      >


      <input
        type="date"
        class="input"
        id="fromDate"
        onchange="applyFilters()"
      >


      <input
        type="date"
        class="input"
        id="toDate"
        onchange="applyFilters()"
      >


      <select
        class="select data-type-select"
        id="dataType"
        onchange="changeDataType()"
      >

        <option value="data">
          Data
        </option>

        <option value="sell">
          Sell
        </option>

        <option value="delete">
          Delete
        </option>

      </select>


      <button
        class="btn btn-secondary"
        onclick="clearFilters()"
      >
        Clear
      </button>

    </div>

  </div>


  <!-- TABLE -->

  <div class="table-card">

    <div class="table-wrap">

      <table>

        <thead id="tableHead">

          <tr>

            <th>Name</th>

            <th>IP</th>

            <th>Work</th>

            <th>Date</th>

            <th>Action</th>

          </tr>

        </thead>


        <tbody id="dataBody">

          <tr>

            <td
              colspan="5"
              class="table-loading"
            >

              <div class="table-spinner"></div>

              Loading data...

            </td>

          </tr>

        </tbody>

      </table>

    </div>


    <div
      class="pagination"
      id="pagination"
    ></div>

  </div>

</main>


<!-- ENTRY MODAL -->

<div
  class="modal-bg"
  id="entryModal"
>

  <div class="modal">

    <div class="modal-head">

      <h3>New Entry</h3>

      <button
        class="close"
        onclick="closeModal('entryModal')"
      >
        ×
      </button>

    </div>


    <div class="form-grid">

      <div class="form-group">

        <label>Name</label>

        <input
          class="input"
          id="entryName"
        >

      </div>


      <div class="form-group">

        <label>IP</label>

        <input
          class="input"
          id="entryIp"
        >

      </div>


      <div class="form-group full">

        <label>Work</label>

        <input
          class="input"
          id="entryWork"
        >

      </div>


      <div class="form-group full">

        <label>Date</label>

        <input
          class="input"
          id="entryDate"
          type="date"
        >

      </div>

    </div>


    <div class="modal-footer">

      <button
        class="btn btn-secondary"
        onclick="closeModal('entryModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-primary"
        onclick="saveEntry()"
      >
        Save
      </button>

    </div>

  </div>

</div>


<!-- USERS MODAL -->

<div
  class="modal-bg"
  id="usersModal"
>

  <div class="modal large">

    <div class="modal-head">

      <h3>User Management</h3>

      <button
        class="close"
        onclick="closeModal('usersModal')"
      >
        ×
      </button>

    </div>


    <button
      class="btn btn-success"
      onclick="openAddUserModal()"
    >
      + Add User
    </button>


    <div
      class="user-table-wrap"
      style="margin-top:15px;"
    >

      <table class="user-table">

        <thead>

          <tr>

            <th>Username</th>

            <th>Name</th>

            <th>Role</th>

            <th>Status</th>

            <th>Action</th>

          </tr>

        </thead>

        <tbody id="usersBody">

          <tr>

            <td
              colspan="5"
              class="empty"
            >
              Loading users...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>


<!-- USER FORM -->

<div
  class="modal-bg"
  id="userFormModal"
>

  <div class="modal">

    <div class="modal-head">

      <h3 id="userFormTitle">
        Add User
      </h3>

      <button
        class="close"
        onclick="closeModal('userFormModal')"
      >
        ×
      </button>

    </div>


    <input
      type="hidden"
      id="originalUsername"
    >


    <div class="form-grid">

      <div class="form-group">

        <label>Username</label>

        <input
          class="input"
          id="userUsername"
        >

      </div>


      <div class="form-group">

        <label>Name</label>

        <input
          class="input"
          id="userName"
        >

      </div>


      <div class="form-group">

        <label>Password</label>

        <input
          class="input"
          id="userPassword"
          type="password"
        >

      </div>


      <div class="form-group">

        <label>Role</label>

        <select
          class="select"
          id="userRole"
        >

          <option value="admin">Admin</option>
          <option value="manager">Manager</option>
          <option value="support">Support</option>
          <option value="call">Call</option>
          <option value="guest">Guest</option>

        </select>

      </div>


      <div class="form-group full">

        <label>Status</label>

        <select
          class="select"
          id="userStatus"
        >

          <option value="Active">Active</option>
          <option value="Block">Block</option>

        </select>

      </div>

    </div>


    <div class="modal-footer">

      <button
        class="btn btn-secondary"
        onclick="closeModal('userFormModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-primary"
        onclick="saveUser()"
      >
        Save User
      </button>

    </div>

  </div>

</div>


<!-- PASSWORD -->

<div
  class="modal-bg"
  id="passwordModal"
>

  <div class="modal">

    <div class="modal-head">

      <h3>Change Password</h3>

      <button
        class="close"
        onclick="closeModal('passwordModal')"
      >
        ×
      </button>

    </div>


    <div class="form-group">

      <label>Current Password</label>

      <input
        class="input"
        id="currentPassword"
        type="password"
      >

    </div>


    <div class="form-group">

      <label>New Password</label>

      <input
        class="input"
        id="newPassword"
        type="password"
      >

    </div>


    <div class="modal-footer">

      <button
        class="btn btn-secondary"
        onclick="closeModal('passwordModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-primary"
        onclick="changePassword()"
      >
        Change Password
      </button>

    </div>

  </div>

</div>


<div
  class="toast"
  id="toast"
></div>


<script>


/* =========================================================
   API
========================================================= */

const USER_API_URL =
"https://script.google.com/macros/s/AKfycbw00GHHheuvtdQtgPURjs4PtsM48-4yaFx-_ms0ZBV5FHhnmcdbJ5DHr3Aix8JPF0kQzA/exec";


const DATA_API_URL =
"https://script.google.com/macros/s/AKfycbz59T-4CKQDbHJB_ql6OYZf18eN7XUmttp0d2FaOM5pm27yCBOWrEilqA_zMOnFq_rz/exec";


const DELETE_API_URL =
"https://script.google.com/macros/s/AKfycbwDL1JIV7QYc84VGiWxhUoT-wN9UfuGn0t9boYrs_FaG_ZfcVGjNmaTqSTC6ev0Ig9Kg/exec";


/* =========================================================
   SETTINGS
========================================================= */

const ITEMS_PER_PAGE = 10;

const REQUEST_TIMEOUT = 15000;


/* =========================================================
   GLOBAL
========================================================= */

let allData = [];

let filteredData = [];

let currentPage = 1;

let currentDataType = "data";

let dataLoaded = false;

let loadingRequest = null;

let currentUsername =
  localStorage.getItem("username") ||
  localStorage.getItem("loggedUser") ||
  "";


/* =========================================================
   START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    if(!checkLogin()) return;

    loadTheme();

    loadUser();

    loadData();

  }
);


/* =========================================================
   LOGIN
========================================================= */

function checkLogin(){

  const auth =
    localStorage.getItem("dashboardAuth") ||
    sessionStorage.getItem("dashboardAuth");


  if(auth !== "true"){

/* =========================================================
   FAST FETCH WITH TIMEOUT
========================================================= */

async function fastFetch(
  url,
  options={}
){

  const controller =
    new AbortController();


  const timer =
    setTimeout(
      function(){

        controller.abort();

      },
      REQUEST_TIMEOUT
    );


  try{

    const response =
      await fetch(
        url,
        {
          ...options,
          signal:
            controller.signal,
          cache:"no-store"
        }
      );


    clearTimeout(timer);


    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    return await response.json();

  }
  catch(error){

    clearTimeout(timer);

    if(
      error.name ===
      "AbortError"
    ){

      throw new Error(
        "Data loading is taking too long."
      );

    }

    throw error;

  }

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(force=false){

  if(!checkLogin()) return;


  if(
    loadingRequest &&
    !force
  ){

    return loadingRequest;

  }


  showTableLoading();


  currentDataType =
    document.getElementById(
      "dataType"
    ).value;


  let url = "";


  if(
    currentDataType ===
    "delete"
  ){

    url =
      DELETE_API_URL +
      "?action=getDeletedData&_=" +
      Date.now();

  }

  else if(
    currentDataType ===
    "sell"
  ){

    url =
      DATA_API_URL +
      "?action=getSellData&_=" +
      Date.now();

  }

  else{

    url =
      DATA_API_URL +
      "?action=getData&_=" +
      Date.now();

  }


  loadingRequest =
    (async function(){

      try{

        const result =
          await fastFetch(url);


        if(
          result.success === false
        ){

          throw new Error(
            result.message ||
            "Unable to load data."
          );

        }


        allData =
          result.data ||
          result.users ||
          [];


        dataLoaded = true;

        currentPage = 1;

        applyFilters();


      }
      catch(error){

        console.error(
          error
        );


        allData = [];

        filteredData = [];


        document.getElementById(
          "dataBody"
        ).innerHTML = `

          <tr>

            <td
              colspan="5"
              class="empty"
            >
              ${escapeHtml(
                error.message ||
                "Unable to load data."
              )}
            </td>

          </tr>

        `;


        updateDataInfo();


        document.getElementById(
          "pagination"
        ).innerHTML = "";


        showToast(
          error.message ||
          "Data loading failed.",
          "error"
        );

      }
      finally{

        loadingRequest =
          null;

      }

    })();


  return loadingRequest;

}

/* =========================================================
   PAGINATION
========================================================= */

function renderPagination(){

  const pagination =
    document.getElementById(
      "pagination"
    );


  const totalPages =
    Math.ceil(
      filteredData.length /
      ITEMS_PER_PAGE
    );


  if(
    totalPages <= 1
  ){

    pagination.innerHTML =
      "";

    return;

  }


  let html = "";


  html += `

    <button
      class="page-btn"
      ${
        currentPage === 1
          ? "disabled"
          : ""
      }
      onclick="goToPage(
        ${currentPage - 1}
      )"
    >
      ‹
    </button>

  `;


  for(
    let i=1;
    i<=totalPages;
    i++
  ){

    if(
      totalPages > 7 &&
      i > 3 &&
      i < totalPages - 2 &&
      Math.abs(
        i-currentPage
      ) > 1
    ){

      if(
        i === 4 ||
        i === totalPages - 3
      ){

        html += `
          <span>...</span>
        `;

      }

      continue;

    }


    html += `

      <button
        class="page-btn ${
          i === currentPage
            ? "active"
            : ""
        }"
        onclick="goToPage(${i})"
      >
        ${i}
      </button>

    `;

  }


  html += `

    <button
      class="page-btn"
      ${
        currentPage === totalPages
          ? "disabled"
          : ""
      }
      onclick="goToPage(
        ${currentPage + 1}
      )"
    >
      ›
    </button>

  `;


  pagination.innerHTML =
    html;

}


function goToPage(page){

  const totalPages =
    Math.ceil(
      filteredData.length /
      ITEMS_PER_PAGE
    );


  if(
    page < 1 ||
    page > totalPages
  ){

    return;

  }


  currentPage =
    page;


  renderData(
    filteredData
  );

}


/* =========================================================
   FILTER
========================================================= */

function applyFilters(){

  const search =
    document.getElementById(
      "searchInput"
    ).value
    .trim()
    .toLowerCase();


  const from =
    document.getElementById(
      "fromDate"
    ).value;


  const to =
    document.getElementById(
      "toDate"
    ).value;


  filteredData =
    allData.filter(
      function(row){

        if(search){

          const text =
            (
              row.Name ??
              row.name ??
              ""
            ) +
            " " +
            (
              row.Ip ??
              row.IP ??
              row.ip ??
              ""
            ) +
            " " +
            (
              row.Work ??
              row.work ??
              ""
            ) +
            " " +
            (
              row.User ??
              row.user ??
              ""
            );


          if(
            !text
              .toLowerCase()
              .includes(search)
          ){

            return false;

          }

        }


        const rawDate =
          row.Date ??
          row.date ??
          "";


        const date =
          normalizeDate(
            rawDate
          );


        if(
          from &&
          date &&
          date < from
        ){

          return false;

        }


        if(
          to &&
          date &&
          date > to
        ){

          return false;

        }


        return true;

      }
    );


  currentPage = 1;

  renderData(
    filteredData
  );

}

/* =========================================================
   DATE
========================================================= */

function normalizeDate(value){

  if(!value) return "";


  const d =
    new Date(value);


  if(
    isNaN(
      d.getTime()
    )
  ){

    return "";

  }


  return (
    d.getFullYear() +
    "-" +
    String(
      d.getMonth()+1
    ).padStart(2,"0") +
    "-" +
    String(
      d.getDate()
    ).padStart(2,"0")
  );

}


function formatDate(value){

  if(!value) return "";


  const d =
    new Date(value);


  if(
    isNaN(
      d.getTime()
    )
  ){

    return String(value);

  }


  return d.toLocaleString(
    "en-GB",
    {
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

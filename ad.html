<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Support Dashboard</title>

<link
  rel="icon"
  type="image/png"
  href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6f9;
  color:#1f2937;
  min-height:100vh;
  transition:.25s;
}

body.dark{
  background:#111827;
  color:#f3f4f6;
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.header{
  width:100%;
  background:#ffffff;
  border-bottom:1px solid #e5e7eb;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  position:sticky;
  top:0;
  z-index:100;
}

.dark .header{
  background:#1f2937;
  border-color:#374151;
}

.logo{
  font-size:20px;
  font-weight:800;
  color:#16a34a;
}

.header-left,
.header-right{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  padding:9px 13px;
  border-radius:9px;
  font-size:13px;
  font-weight:700;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-green{
  background:#16a34a;
  color:#fff;
}

.btn-blue{
  background:#2563eb;
  color:#fff;
}

.btn-orange{
  background:#f59e0b;
  color:#fff;
}

.btn-red{
  background:#dc2626;
  color:#fff;
}

.btn-gray{
  background:#e5e7eb;
  color:#111827;
}

.dark .btn-gray{
  background:#374151;
  color:#fff;
}

.profile{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#16a34a;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:800;
  cursor:pointer;
}

.profile-menu{
  display:none;
  position:absolute;
  right:18px;
  top:63px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  width:190px;
  box-shadow:0 10px 35px rgba(0,0,0,.15);
  overflow:hidden;
  z-index:500;
}

.dark .profile-menu{
  background:#1f2937;
  border-color:#374151;
}

.profile-menu button{
  width:100%;
  padding:12px 14px;
  background:transparent;
  text-align:left;
  color:inherit;
}

.profile-menu button:hover{
  background:#f3f4f6;
}

.dark .profile-menu button:hover{
  background:#374151;
}

.container{
  max-width:1500px;
  margin:auto;
  padding:18px;
}

.filter-bar{
  background:#fff;
  border-radius:13px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  box-shadow:0 2px 12px rgba(0,0,0,.05);
  margin-bottom:14px;
}

.dark .filter-bar{
  background:#1f2937;
}

.search{
  flex:1;
  min-width:220px;
  padding:10px 12px;
  border:1px solid #d1d5db;
  border-radius:9px;
  outline:none;
  background:#fff;
  color:#111827;
}

.dark .search,
.dark input,
.dark select{
  background:#111827;
  color:#fff;
  border-color:#4b5563;
}

.date-input{
  padding:10px;
  border:1px solid #d1d5db;
  border-radius:9px;
  outline:none;
}

.select{
  padding:10px 12px;
  border:1px solid #d1d5db;
  border-radius:9px;
  outline:none;
  background:#fff;
}

.stats{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.stat{
  background:#fff;
  padding:13px 17px;
  border-radius:11px;
  box-shadow:0 2px 12px rgba(0,0,0,.05);
  min-width:130px;
}

.dark .stat{
  background:#1f2937;
}

.stat-title{
  font-size:12px;
  color:#6b7280;
}

.stat-value{
  font-size:20px;
  font-weight:800;
  margin-top:4px;
}

.table-wrap{
  background:#fff;
  border-radius:13px;
  overflow:auto;
  box-shadow:0 2px 12px rgba(0,0,0,.05);
}

.dark .table-wrap{
  background:#1f2937;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th{
  background:#16a34a;
  color:#fff;
  padding:12px;
  font-size:13px;
  text-align:center;
  position:sticky;
  top:0;
}

td{
  padding:10px;
  border-bottom:1px solid #e5e7eb;
  text-align:center;
  font-size:13px;
}

.dark td{
  border-color:#374151;
}

tr:hover td{
  background:#f9fafb;
}

.dark tr:hover td{
  background:#111827;
}

.action-wrap{
  display:flex;
  justify-content:center;
  gap:5px;
  flex-wrap:wrap;
}

.action-btn{
  padding:6px 9px;
  border-radius:7px;
  color:#fff;
  font-size:11px;
  font-weight:700;
}

.edit-btn{
  background:#2563eb;
}

.sell-btn{
  background:#16a34a;
}

.delete-btn{
  background:#dc2626;
}

.paid-btn{
  background:#7c3aed;
}

.empty{
  padding:35px;
  text-align:center;
  color:#6b7280;
}

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:14px;
}

.page-btn{
  padding:8px 12px;
  border-radius:8px;
  background:#fff;
  border:1px solid #d1d5db;
}

.dark .page-btn{
  background:#1f2937;
  color:#fff;
  border-color:#4b5563;
}

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:15px;
}

.modal{
  width:100%;
  max-width:520px;
  background:#fff;
  border-radius:15px;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.dark .modal{
  background:#1f2937;
}

.modal h2{
  margin-bottom:16px;
}

.form-group{
  margin-bottom:12px;
}

.form-group label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
}

.form-group input,
.form-group select{
  width:100%;
  padding:10px;
  border:1px solid #d1d5db;
  border-radius:8px;
  outline:none;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:16px;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111827;
  color:#fff;
  padding:12px 16px;
  border-radius:10px;
  display:none;
  z-index:2000;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.toast.success{
  background:#16a34a;
}

.toast.error{
  background:#dc2626;
}

.loading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:3000;
}

.dark .loading{
  background:rgba(0,0,0,.65);
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid #d1d5db;
  border-top-color:#16a34a;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@media(max-width:700px){

  .header{
    align-items:flex-start;
    flex-direction:column;
  }

  .header-right{
    width:100%;
  }

  .filter-bar{
    flex-direction:column;
    align-items:stretch;
  }

  .search{
    width:100%;
  }

  .date-input,
  .select{
    width:100%;
  }

}

</style>

</head>

<body>


<!-- =========================================================
HEADER
========================================================= -->

<header class="header">

  <div class="header-left">

    <div class="logo">
      Support Dashboard
    </div>

  </div>


  <div class="header-right">

    <button
      class="btn btn-gray"
      onclick="loadData()"
    >
      Reload
    </button>


    <button
      class="btn btn-blue"
      onclick="openUsers()"
    >
      Users
    </button>


    <button
      class="btn btn-orange"
      onclick="openItems()"
    >
      Items
    </button>


    <button
      class="btn btn-green"
      onclick="openEntryModal()"
    >
      + New Entry
    </button>


    <button
      class="btn btn-gray"
      onclick="toggleTheme()"
    >
      Dark Mode
    </button>


    <div
      class="profile"
      onclick="toggleProfile()"
      id="profileButton"
    >
      U
    </div>

  </div>


  <div
    class="profile-menu"
    id="profileMenu"
  >

    <button onclick="changePassword()">
      Change Password
    </button>

    <button onclick="logout()">
      Logout
    </button>

  </div>

</header>



<!-- =========================================================
MAIN
========================================================= -->

<div class="container">


  <div class="filter-bar">

    <input
      id="searchInput"
      class="search"
      placeholder="Search Name / IP / Work / Item..."
      oninput="applyFilters()"
    >


    <input
      id="fromDate"
      type="date"
      class="date-input"
      onchange="applyFilters()"
    >


    <input
      id="toDate"
      type="date"
      class="date-input"
      onchange="applyFilters()"
    >


    <select
      id="viewSelect"
      class="select"
      onchange="changeView()"
    >

      <option value="data">
        Data
      </option>

      <option value="sell">
        Sell
      </option>

      <option value="delete">
        Delete
      </option>

    </select>


    <button
      class="btn btn-gray"
      onclick="clearSearch()"
    >
      Clear
    </button>

  </div>



  <div class="stats">

    <div class="stat">

      <div class="stat-title">
        Total
      </div>

      <div
        class="stat-value"
        id="totalCount"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-title">
        Current User
      </div>

      <div
        class="stat-value"
        id="currentUsername"
      >
        -
      </div>

    </div>

  </div>



  <div class="table-wrap">

    <table>

      <thead id="tableHead"></thead>

      <tbody id="tableBody">

      </tbody>

    </table>

  </div>



  <div
    class="pagination"
    id="pagination"
  ></div>

</div>



<!-- =========================================================
ENTRY MODAL
========================================================= -->

<div
  class="modal-bg"
  id="entryModal"
>

  <div class="modal">

    <h2>
      New Entry
    </h2>


    <div class="form-group">

      <label>
        Name
      </label>

      <input
        id="entryName"
        readonly
      >

    </div>


    <div class="form-group">

      <label>
        IP
      </label>

      <input
        id="entryIP"
        placeholder="Enter IP"
      >

    </div>


    <div class="form-group">

      <label>
        Work
      </label>

      <input
        id="entryWork"
        placeholder="Enter Work"
      >

    </div>


    <div class="form-group">

      <label>
        Date
      </label>

      <input
        id="entryDate"
        type="date"
        readonly
      >

    </div>


    <div class="form-group">

      <label>
        Item
      </label>

      <select
        id="entryItem"
      >

        <option value="">
          Select Item
        </option>

      </select>

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-gray"
        onclick="closeModal('entryModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-green"
        onclick="submitEntry()"
      >
        Save
      </button>

    </div>

  </div>

</div>



<!-- =========================================================
SELL EDIT MODAL
========================================================= -->

<div
  class="modal-bg"
  id="sellEditModal"
>

  <div class="modal">

    <h2>
      Edit Sell
    </h2>


    <input
      type="hidden"
      id="sellEditRow"
    >


    <div class="form-group">

      <label>
        Name
      </label>

      <input
        id="sellEditName"
      >

    </div>


    <div class="form-group">

      <label>
        IP
      </label>

      <input
        id="sellEditIP"
      >

    </div>


    <div class="form-group">

      <label>
        Work
      </label>

      <input
        id="sellEditWork"
      >

    </div>


    <div class="form-group">

      <label>
        Date
      </label>

      <input
        id="sellEditDate"
      >

    </div>


    <div class="form-group">

      <label>
        Item
      </label>

      <input
        id="sellEditItem"
      >

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-gray"
        onclick="closeModal('sellEditModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-blue"
        onclick="saveSellEdit()"
      >
        Save Changes
      </button>

    </div>

  </div>

</div>



<!-- =========================================================
CHANGE PASSWORD MODAL
========================================================= -->

<div
  class="modal-bg"
  id="passwordModal"
>

  <div class="modal">

    <h2>
      Change Password
    </h2>


    <div class="form-group">

      <label>
        Current Password
      </label>

      <input
        id="currentPassword"
        type="password"
      >

    </div>


    <div class="form-group">

      <label>
        New Password
      </label>

      <input
        id="newPassword"
        type="password"
      >

    </div>


    <div class="form-group">

      <label>
        Confirm Password
      </label>

      <input
        id="confirmPassword"
        type="password"
      >

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-gray"
        onclick="closeModal('passwordModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-green"
        onclick="savePassword()"
      >
        Change
      </button>

    </div>

  </div>

</div>



<!-- =========================================================
TOAST
========================================================= -->

<div
  id="toast"
  class="toast"
></div>


<!-- =========================================================
LOADING
========================================================= -->

<div
  id="loading"
  class="loading"
>

  <div class="spinner"></div>

</div>



<script>

// ============================================================
// API URLS
// ============================================================

const DATA_API =
  "https://script.google.com/macros/s/AKfycbz59T-4CKQDbHJB_ql6OYZf18eN7XUmttp0d2FaOM5pm27yCBOWrEilqA_zMOnFq_rz/exec";


const USER_API =
  "https://script.google.com/macros/s/AKfycbw00GHHheuvtdQtgPURjs4PtsM48-4yaFx-_ms0ZBV5FHhnmcdbJ5DHr3Aix8JPF0kQzA/exec";


const SELL_API =
  "https://script.google.com/macros/s/AKfycbyiKn1MH1ZQvebSIo83bZzbbfJimmfRf9PjlPI4w1q1UliuF27gKViYM24oXakpkHuP/exec";


const DELETE_API =
  "https://script.google.com/macros/s/AKfycbwDL1JIV7QYcH84VGiWxhUoT-wN9UfuGn0t9boYrs_FaG_ZfcVGjNmaTqSTC6ev0Ig9Kg/exec";


const ITEM_API =
  "https://script.google.com/macros/s/AKfycby2e7dzGE5vkS0Q-Eyl9MKLAbkkkD8f37eIVj7VuV8bPytWGOH7cwJ3w25efP7MLGshOw/exec";



// ============================================================
// GLOBAL
// ============================================================

let allData = [];

let filteredData = [];

let sellCache = [];

let deleteCache = [];

let itemCache = [];

let currentView = "data";

let currentPage = 1;

const PAGE_SIZE = 20;

let inactivityTimer;



// ============================================================
// INIT
// ============================================================

document.addEventListener(
  "DOMContentLoaded",
  function(){

    checkLogin();

    loadTheme();

    setupActivity();

    loadItems();

    loadData();

  }
);



// ============================================================
// LOGIN
// ============================================================

function checkLogin(){

  const username =
    localStorage.getItem("username") ||
    localStorage.getItem("loggedUser") ||
    "";


  if(!username){

    window.location.href =
      "index.html";

    return;

  }


  document.getElementById(
    "currentUsername"
  ).textContent =
    username;


  document.getElementById(
    "profileButton"
  ).textContent =
    username
      .charAt(0)
      .toUpperCase();

}



// ============================================================
// LOGOUT
// ============================================================

function logout(){

  localStorage.removeItem(
    "dashboardAuth"
  );

  localStorage.removeItem(
    "username"
  );

  localStorage.removeItem(
    "loggedUser"
  );

  localStorage.removeItem(
    "userData"
  );

  localStorage.removeItem(
    "loginData"
  );

  localStorage.removeItem(
    "currentUser"
  );

  localStorage.removeItem(
    "userInfo"
  );

  sessionStorage.clear();


  window.location.href =
    "index.html";

}



// ============================================================
// ACTIVITY
// ============================================================

function setupActivity(){

  const events = [
    "mousemove",
    "mousedown",
    "keydown",
    "touchstart",
    "scroll"
  ];


  events.forEach(
    function(event){

      document.addEventListener(
        event,
        resetActivityTimer
      );

    }
  );


  resetActivityTimer();

}



function resetActivityTimer(){

  clearTimeout(
    inactivityTimer
  );


  inactivityTimer =
    setTimeout(
      function(){

        logout();

      },
      5 * 60 * 1000
    );

}



// ============================================================
// THEME
// ============================================================

function loadTheme(){

  const theme =
    localStorage.getItem(
      "dashboardTheme"
    );


  if(theme === "dark"){

    document.body.classList.add(
      "dark"
    );

  }

}



function toggleTheme(){

  document.body.classList.toggle(
    "dark"
  );


  localStorage.setItem(

    "dashboardTheme",

    document.body.classList.contains(
      "dark"
    )
      ? "dark"
      : "light"

  );

}



// ============================================================
// PROFILE
// ============================================================

function toggleProfile(){

  const menu =
    document.getElementById(
      "profileMenu"
    );


  menu.style.display =
    menu.style.display === "block"
      ? "none"
      : "block";

}



document.addEventListener(
  "click",
  function(e){

    const menu =
      document.getElementById(
        "profileMenu"
      );

    const button =
      document.getElementById(
        "profileButton"
      );


    if(
      !menu.contains(e.target) &&
      !button.contains(e.target)
    ){

      menu.style.display =
        "none";

    }

  }
);



// ============================================================
// LOAD DATA
// ============================================================

async function loadData(){

  showLoading(true);


  try{

    if(
      currentView ===
      "sell"
    ){

      await loadSellData();

    }

    else if(
      currentView ===
      "delete"
    ){

      await loadDeleteData();

    }

    else{

      const response =
        await fetch(
          DATA_API +
          "?action=getData"
        );


      const result =
        await response.json();


      if(
        result.success === false
      ){

        throw new Error(
          result.message ||
          "Unable to load data."
        );

      }


      allData =
        Array.isArray(
          result.data
        )
          ? result.data
          : [];


      currentPage = 1;

      applyFilters();

    }

  }

  catch(error){

    console.error(error);

    showError(
      error.message ||
      "Data loading failed."
    );

  }

  finally{

    showLoading(false);

  }

}



// ============================================================
// SELL LOAD
// ============================================================

async function loadSellData(){

  const response =
    await fetch(
      SELL_API +
      "?action=getSellData"
    );


  const result =
    await response.json();


  if(
    result.success === false
  ){

    throw new Error(
      result.message ||
      "Sell data loading failed."
    );

  }


  sellCache =
    Array.isArray(
      result.data
    )
      ? result.data
      : [];


  allData =
    sellCache;


  currentPage = 1;

  applyFilters();

}



// ============================================================
// DELETE LOAD
// ============================================================

async function loadDeleteData(){

  const response =
    await fetch(
      DELETE_API +
      "?action=getDeleteData"
    );


  const result =
    await response.json();


  if(
    result.success === false
  ){

    throw new Error(
      result.message ||
      "Delete data loading failed."
    );

  }


  deleteCache =
    Array.isArray(
      result.data
    )
      ? result.data
      : [];


  allData =
    deleteCache;


  currentPage = 1;

  applyFilters();

}



// ============================================================
// VIEW
// ============================================================

function changeView(){

  currentView =
    document.getElementById(
      "viewSelect"
    ).value;


  document.getElementById(
    "searchInput"
  ).value = "";

  document.getElementById(
    "fromDate"
  ).value = "";

  document.getElementById(
    "toDate"
  ).value = "";


  loadData();

}



// ============================================================
// FILTER
// ============================================================

function applyFilters(){

  const search =
    document.getElementById(
      "searchInput"
    )
    .value
    .toLowerCase()
    .trim();


  const from =
    document.getElementById(
      "fromDate"
    ).value;


  const to =
    document.getElementById(
      "toDate"
    ).value;



  filteredData =
    allData.filter(
      function(row){

        const text =
          [

            row.Name,
            row.name,

            row.IP,
            row.Ip,
            row.ip,

            row.Work,
            row.work,

            row.Date,
            row.date,

            row.Item,
            row.item,

            row.User,
            row.username,

            row["Paid User"],
            row.PaidUser

          ]

          .join(" ")
          .toLowerCase();



        if(
          search &&
          !text.includes(search)
        ){

          return false;

        }



        const rowDate =
          String(
            row.Date ||
            row.date ||
            ""
          )
          .substring(
            0,
            10
          );



        if(
          from &&
          rowDate &&
          rowDate < from
        ){

          return false;

        }


        if(
          to &&
          rowDate &&
          rowDate > to
        ){

          return false;

        }


        return true;

      }
    );


  currentPage = 1;

  renderTable();

}

// ============================================================
// PAGINATION
// ============================================================

function renderPagination(){

  const container =
    document.getElementById(
      "pagination"
    );


  container.innerHTML = "";


  const pages =
    Math.ceil(
      filteredData.length /
      PAGE_SIZE
    );


  if(pages <= 1)
    return;



  const prev =
    document.createElement(
      "button"
    );


  prev.className =
    "page-btn";


  prev.textContent =
    "Previous";


  prev.disabled =
    currentPage <= 1;


  prev.onclick =
    function(){

      if(
        currentPage > 1
      ){

        currentPage--;

        renderTable();

      }

    };


  container.appendChild(prev);



  const label =
    document.createElement(
      "span"
    );


  label.textContent =
    currentPage +
    " / " +
    pages;


  container.appendChild(label);



  const next =
    document.createElement(
      "button"
    );


  next.className =
    "page-btn";


  next.textContent =
    "Next";


  next.disabled =
    currentPage >= pages;


  next.onclick =
    function(){

      if(
        currentPage < pages
      ){

        currentPage++;

        renderTable();

      }

    };


  container.appendChild(next);

}

// ============================================================
// GET ROW NUMBER
// ============================================================

function getRowNumber(row){

  const direct =
    Number(
      row.row ??
      row.Row ??
      row.rowNumber ??
      row.rowIndex ??
      0
    );


  if(
    direct >= 2
  ){

    return direct;

  }


  const found =
    allData.indexOf(row);


  if(
    found >= 0
  ){

    return found + 2;

  }


  return 0;

}



// ============================================================
// REMOVE LOCAL DATA
// ============================================================

function removeLocalDataRow(
  rowNumber
){

  const index =
    allData.findIndex(
      function(row){

        return (
          Number(
            row.row ??
            row.rowNumber ??
            row.Row ??
            0
          ) ===
          Number(rowNumber)
        );

      }
    );


  if(index >= 0){

    allData.splice(
      index,
      1
    );

  }

  else{

    const fallback =
      Number(rowNumber) - 2;


    if(
      fallback >= 0 &&
      fallback < allData.length
    ){

      allData.splice(
        fallback,
        1
      );

    }

  }

}

  if(!select)
    return;


  select.innerHTML = `

    <option value="">
      Select Item
    </option>

  `;


  itemCache.forEach(
    function(item){

      let value = "";


      if(
        typeof item ===
        "string"
      ){

        value = item;

      }

      else{

        value =
          item.Item ||
          item.item ||
          item.Name ||
          item.name ||
          item.value ||
          "";

      }


      if(value){

        const option =
          document.createElement(
            "option"
          );


        option.value =
          value;


        option.textContent =
          value;


        select.appendChild(
          option
        );

      }

    }
  );

}

// ============================================================
// PASSWORD
// ============================================================

function changePassword(){

  document.getElementById(
    "profileMenu"
  ).style.display =
    "none";


  document.getElementById(
    "passwordModal"
  ).style.display =
    "flex";

}



async function savePassword(){

  const username =
    localStorage.getItem(
      "username"
    ) ||
    localStorage.getItem(
      "loggedUser"
    ) ||
    "";


  const currentPassword =
    document.getElementById(
      "currentPassword"
    ).value;


  const newPassword =
    document.getElementById(
      "newPassword"
    ).value;


  const confirmPassword =
    document.getElementById(
      "confirmPassword"
    ).value;



  if(
    !currentPassword ||
    !newPassword ||
    !confirmPassword
  ){

    showError(
      "Please fill all password fields."
    );

    return;

  }


  if(
    newPassword !==
    confirmPassword
  ){

    showError(
      "New passwords do not match."
    );

    return;

  }



  showLoading(true);


  try{

    const response =
      await fetch(
        USER_API,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:JSON.stringify({

            action:
              "changePassword",

            username:
              username,

            currentPassword:
              currentPassword,

            newPassword:
              newPassword

          })

        }
      );


    const result =
      await response.json();


    if(
      result.success === false
    ){

      throw new Error(
        result.message ||
        "Password change failed."
      );

    }


    closeModal(
      "passwordModal"
    );


    document.getElementById(
      "currentPassword"
    ).value = "";

    document.getElementById(
      "newPassword"
    ).value = "";

    document.getElementById(
      "confirmPassword"
    ).value = "";


    showToast(
      "Password changed successfully.",
      "success"
    );

  }

  catch(error){

    showError(
      error.message ||
      "Password change failed."
    );

  }

  finally{

    showLoading(false);

  }

}



// ============================================================
// MODAL
// ============================================================

function closeModal(id){

  const modal =
    document.getElementById(
      id
    );


  if(modal){

    modal.style.display =
      "none";

  }

}



window.addEventListener(
  "click",
  function(e){

    if(
      e.target.classList.contains(
        "modal-bg"
      )
    ){

      e.target.style.display =
        "none";

    }

  }
);



// ============================================================
// LOADING
// ============================================================

function showLoading(show){

  document.getElementById(
    "loading"
  ).style.display =
    show
      ? "flex"
      : "none";

}



// ============================================================
// TOAST
// ============================================================

function showToast(
  message,
  type = ""
){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.className =
    "toast " +
    type;


  toast.style.display =
    "block";


  setTimeout(
    function(){

      toast.style.display =
        "none";

    },
    3000
  );

}



function showError(message){

  showToast(
    message,
    "error"
  );

}



// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHTML(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

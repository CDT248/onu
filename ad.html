<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Support Dashboard</title>

<link
  rel="icon"
  type="image/png"
  sizes="128x128"
  href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#1f2937;
  min-height:100vh;
  transition:.3s;
}

body.dark{
  background:#111827;
  color:#f3f4f6;
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
  border:none;
}

.header{
  height:72px;
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.header-left{
  display:flex;
  align-items:center;
  gap:13px;
}

.logo{
  width:43px;
  height:43px;
  border-radius:12px;
  background:rgba(255,255,255,.2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
}

.header-title{
  font-size:20px;
  font-weight:bold;
}

.header-subtitle{
  font-size:12px;
  opacity:.8;
  margin-top:2px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:9px;
}

.btn{
  padding:10px 15px;
  border-radius:9px;
  font-size:13px;
  font-weight:bold;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:white;
  color:#2563eb;
}

.btn-success{
  background:#10b981;
  color:white;
}

.btn-danger{
  background:#ef4444;
  color:white;
}

.btn-warning{
  background:#f59e0b;
  color:white;
}

.btn-secondary{
  background:#6b7280;
  color:white;
}

.icon-btn{
  width:39px;
  height:39px;
  border-radius:9px;
  background:rgba(255,255,255,.15);
  color:white;
  font-size:17px;
}

.profile{
  position:relative;
}

.profile-btn{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(255,255,255,.15);
  color:white;
  padding:5px 10px 5px 5px;
  border-radius:25px;
}

.profile-img{
  width:34px;
  height:34px;
  border-radius:50%;
  object-fit:cover;
  background:white;
}

.profile-menu{
  display:none;
  position:absolute;
  right:0;
  top:48px;
  width:180px;
  background:white;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  padding:8px;
  z-index:1000;
}

body.dark .profile-menu{
  background:#1f2937;
}

.profile-menu.show{
  display:block;
}

.profile-menu button{
  width:100%;
  padding:11px;
  text-align:left;
  background:transparent;
  border-radius:8px;
  color:#374151;
}

body.dark .profile-menu button{
  color:#f3f4f6;
}

.profile-menu button:hover{
  background:#f1f5f9;
}

body.dark .profile-menu button:hover{
  background:#374151;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:25px;
}

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.page-title{
  font-size:25px;
  font-weight:bold;
}

.page-subtitle{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
}

body.dark .page-subtitle{
  color:#9ca3af;
}

.card{
  background:white;
  border-radius:15px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
  margin-bottom:20px;
}

body.dark .card{
  background:#1f2937;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.filter-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto;
  gap:12px;
  align-items:end;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.form-group label{
  font-size:12px;
  font-weight:bold;
  color:#6b7280;
}

body.dark .form-group label{
  color:#d1d5db;
}

input,
select{
  width:100%;
  padding:11px 12px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  outline:none;
  background:white;
  color:#1f2937;
}

input:focus,
select:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

body.dark input,
body.dark select{
  background:#111827;
  color:white;
  border-color:#374151;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:950px;
}

th{
  background:#f8fafc;
  color:#475569;
  font-size:12px;
  padding:13px;
  text-align:left;
  white-space:nowrap;
}

body.dark th{
  background:#111827;
  color:#cbd5e1;
}

td{
  padding:13px;
  border-bottom:1px solid #edf0f4;
  font-size:13px;
  vertical-align:middle;
}

body.dark td{
  border-color:#374151;
}

tbody tr:hover{
  background:#f8fafc;
}

body.dark tbody tr:hover{
  background:#273449;
}

.empty{
  text-align:center;
  padding:35px;
  color:#9ca3af;
}

.row-actions{
  display:flex;
  gap:6px;
  flex-wrap:nowrap;
}

.action-btn{
  padding:7px 10px;
  border-radius:7px;
  font-size:11px;
  font-weight:bold;
  color:white;
  white-space:nowrap;
  transition:.2s;
}

.action-btn:hover{
  transform:translateY(-1px);
}

.action-edit{
  background:#2563eb;
}

.action-sell{
  background:#10b981;
}

.action-delete{
  background:#ef4444;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:500px;
  background:white;
  border-radius:16px;
  padding:22px;
  max-height:90vh;
  overflow-y:auto;
}

body.dark .modal-box{
  background:#1f2937;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-title{
  font-size:19px;
  font-weight:bold;
}

.close{
  width:34px;
  height:34px;
  border-radius:8px;
  background:#f1f5f9;
  color:#374151;
  font-size:20px;
}

body.dark .close{
  background:#374151;
  color:white;
}

.modal-form{
  display:grid;
  gap:13px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:18px;
}

.users-table{
  overflow-x:auto;
}

.users-table table{
  min-width:650px;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.status-active{
  background:#dcfce7;
  color:#15803d;
}

.status-block{
  background:#fee2e2;
  color:#dc2626;
}

/* LOADER */

.loader{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.7);
  z-index:5000;
  align-items:center;
  justify-content:center;
}

body.dark .loader{
  background:rgba(0,0,0,.65);
}

.loader.show{
  display:flex;
}

.loader-box{
  background:white;
  padding:25px 35px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  text-align:center;
}

body.dark .loader-box{
  background:#1f2937;
}

.spinner{
  width:35px;
  height:35px;
  border:4px solid #e5e7eb;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:auto auto 12px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* TOAST */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111827;
  color:white;
  padding:13px 17px;
  border-radius:10px;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
  transform:translateY(100px);
  opacity:0;
  transition:.3s;
  z-index:6000;
  font-size:13px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

/* MOBILE */

@media(max-width:850px){

  .header{
    padding:0 12px;
  }

  .header-subtitle{
    display:none;
  }

  .header-title{
    font-size:16px;
  }

  .header-right .btn{
    padding:8px 10px;
    font-size:11px;
  }

  .container{
    padding:15px;
  }

  .page-header{
    align-items:flex-start;
    gap:10px;
  }

  .page-title{
    font-size:20px;
  }

  .filter-grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:550px){

  .header{
    height:auto;
    min-height:65px;
    gap:8px;
  }

  .logo{
    width:36px;
    height:36px;
  }

  .header-right .btn-primary{
    display:none;
  }

  .profile-btn span{
    display:none;
  }

  .page-header{
    flex-direction:column;
  }

  .page-header > .btn{
    width:100%;
  }

}

</style>

</head>

<body>

<!-- HEADER -->

<header class="header">

  <div class="header-left">

    <div class="logo">S</div>

    <div>
      <div class="header-title">Support Dashboard</div>
      <div class="header-subtitle">Admin Management System</div>
    </div>

  </div>

  <div class="header-right">

    <button class="icon-btn" onclick="loadData()" title="Reload">
      ↻
    </button>

    <!-- USERS BUTTON - আগের মতোই রাখা হয়েছে -->

    <button
      class="btn btn-primary"
      onclick="openUsersModal()"
    >
      Users
    </button>

    <button
      class="btn btn-success"
      onclick="openEntryModal()"
    >
      + New Entry
    </button>

    <button
      class="icon-btn"
      onclick="toggleTheme()"
      title="Theme"
    >
      ☀
    </button>

    <div class="profile">

      <button
        class="profile-btn"
        onclick="toggleProfileMenu()"
      >

        <img
          id="profileImage"
          class="profile-img"
          src="https://cdn-icons-png.flaticon.com/128/149/149071.png"
        >

        <span id="profileName">User</span>
        ▾

      </button>

      <div
        class="profile-menu"
        id="profileMenu"
      >

        <button onclick="openChangePasswordModal()">
          🔑 Change Password
        </button>

        <button onclick="logout()">
          🚪 Logout
        </button>

      </div>

    </div>

  </div>

</header>


<!-- MAIN -->

<main class="container">

  <div class="page-header">

    <div>
      <div class="page-title">
        Support Data
      </div>

      <div class="page-subtitle">
        Manage support entries
      </div>
    </div>

    <button
      class="btn btn-primary"
      onclick="loadData()"
    >
      Refresh Data
    </button>

  </div>


  <!-- FILTER -->

  <div class="card">

    <div class="filter-grid">

      <div class="form-group">

        <label>Search</label>

        <input
          type="text"
          id="searchInput"
          placeholder="Search name, IP, work..."
          oninput="applyFilters()"
        >

      </div>


      <div class="form-group">

        <label>From Date</label>

        <input
          type="date"
          id="fromDate"
          onchange="applyFilters()"
        >

      </div>


      <div class="form-group">

        <label>To Date</label>

        <input
          type="date"
          id="toDate"
          onchange="applyFilters()"
        >

      </div>


      <button
        class="btn btn-secondary"
        onclick="clearFilters()"
      >
        Clear
      </button>

    </div>

  </div>


  <!-- DATA TABLE -->

  <div class="card">

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>Name</th>
            <th>IP</th>
            <th>Work</th>
            <th>Date</th>
            <th>Action</th>

          </tr>

        </thead>

        <tbody id="dataBody">

          <tr>
            <td colspan="5" class="empty">
              Loading...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</main>


<!-- NEW ENTRY MODAL -->

<div
  class="modal"
  id="entryModal"
>

  <div class="modal-box">

    <div class="modal-header">

      <div class="modal-title">
        New Entry
      </div>

      <button
        class="close"
        onclick="closeModal('entryModal')"
      >
        ×
      </button>

    </div>


    <div class="modal-form">

      <div class="form-group">

        <label>Name</label>

        <input
          type="text"
          id="entryName"
          placeholder="Enter name"
        >

      </div>


      <div class="form-group">

        <label>IP</label>

        <input
          type="text"
          id="entryIp"
          placeholder="Enter IP"
        >

      </div>


      <div class="form-group">

        <label>Work</label>

        <input
          type="text"
          id="entryWork"
          placeholder="Enter work"
        >

      </div>


      <div class="form-group">

        <label>Date</label>

        <input
          type="date"
          id="entryDate"
        >

      </div>

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-secondary"
        onclick="closeModal('entryModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-success"
        onclick="saveEntry()"
      >
        Save Entry
      </button>

    </div>

  </div>

</div>


<!-- EDIT ENTRY MODAL -->

<div
  class="modal"
  id="editEntryModal"
>

  <div class="modal-box">

    <div class="modal-header">

      <div class="modal-title">
        Edit Entry
      </div>

      <button
        class="close"
        onclick="closeModal('editEntryModal')"
      >
        ×
      </button>

    </div>


    <div class="modal-form">

      <div class="form-group">

        <label>Name</label>

        <input
          type="text"
          id="editName"
          placeholder="Enter name"
        >

      </div>


      <div class="form-group">

        <label>IP</label>

        <input
          type="text"
          id="editIp"
          placeholder="Enter IP"
        >

      </div>


      <div class="form-group">

        <label>Work</label>

        <input
          type="text"
          id="editWork"
          placeholder="Enter work"
        >

      </div>


      <div class="form-group">

        <label>Date</label>

        <input
          type="date"
          id="editDate"
        >

      </div>

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-secondary"
        onclick="closeModal('editEntryModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-primary"
        onclick="saveEdit()"
      >
        Update
      </button>

    </div>

  </div>

</div>


<!-- USERS MODAL -->

<div
  class="modal"
  id="usersModal"
>

  <div
    class="modal-box"
    style="max-width:850px;"
  >

    <div class="modal-header">

      <div class="modal-title">
        User Management
      </div>

      <button
        class="close"
        onclick="closeModal('usersModal')"
      >
        ×
      </button>

    </div>


    <div style="margin-bottom:15px;">

      <button
        class="btn btn-success"
        onclick="openAddUserModal()"
      >
        + Add User
      </button>

    </div>


    <div class="users-table">

      <table>

        <thead>

          <tr>

            <th>Username</th>
            <th>Name</th>
            <th>Role</th>
            <th>Status</th>
            <th>Action</th>

          </tr>

        </thead>

        <tbody id="usersBody">

          <tr>
            <td colspan="5" class="empty">
              Loading...
            </td>
          </tr>

        </tbody>

      </table>

</div>


<!-- ADD / EDIT USER MODAL -->

<div
  class="modal"
  id="userModal"
>

  <div class="modal-box">

    <div class="modal-header">

      <div
        class="modal-title"
        id="userModalTitle"
      >
        Add User
      </div>

      <button

        onclick="closeModal('userModal')"

    </div>

      <div class="form-group">

        <label>Name</label>

        <input
          type="text"
          id="userName"
          placeholder="Name"
        >

      </div>


      <div class="form-group">

        <label>Password</label>

        <input

      </div>


      <div class="form-group">

        <label>Role</label>

        <select id="userRole">

          <option value="admin">Admin</option>
          <option value="manager">Manager</option>

      <div class="form-group">

        <label>Status</label>

        <select id="userStatus">

          <option value="Block">Block</option>

    <div class="modal-actions">

      <button
        class="btn btn-secondary"
        onclick="closeModal('userModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-success"
        onclick="saveUser()"
      >
        Save User
      </button>

    </div>

  </div>

</div>


<!-- CHANGE PASSWORD -->

<div
  class="modal"
  id="passwordModal"
>

  <div class="modal-box">

    <div class="modal-header">

      <div class="modal-title">
        Change Password
      </div>

      <button
        class="close"
        onclick="closeModal('passwordModal')"
      >
        ×
      </button>

    </div>


    <div class="modal-form">

      <div class="form-group">

        <label>Current Password</label>

        <input
          type="password"
          id="currentPassword"
        >

      </div>


      <div class="form-group">

        <label>New Password</label>

        <input
          type="password"
          id="newPassword"
        >

      </div>


      <div class="form-group">

        <label>Confirm New Password</label>

        <input
          type="password"
          id="confirmPassword"
        >

      </div>

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-secondary"
        onclick="closeModal('passwordModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-primary"
        onclick="changePassword()"
      >
        Change Password
      </button>

    </div>

  </div>

</div>


<!-- LOADER -->

<div
  class="loader"
  id="loader"
>

  <div class="loader-box">

    <div class="spinner"></div>

    <div id="loaderText">
      Loading...
    </div>

  </div>

</div>


<!-- TOAST -->

<div
  class="toast"
  id="toast"
></div>


<script>

/* =========================================================
   API URL
========================================================= */

const USER_API_URL =
  "https://script.google.com/macros/s/AKfycbw00GHHheuvtdQtgPURjs4PtsM48-4yaFx-_ms0ZBV5FHhnmcdbJ5DHr3Aix8JPF0kQzA/exec";


const DATA_API_URL =
  "https://script.google.com/macros/s/AKfycbz59T-4CKQDbHJB_ql6OYZf18eN7XUmttp0d2FaOM5pm27yCBOWrEilqA_zMOnFq_rz/exec";


/* =========================================================
   GLOBAL
========================================================= */

let allData = [];

let editingUser = false;

let editingRow = null;

let currentUsername =
  localStorage.getItem("username") ||
  localStorage.getItem("loggedUser") ||
  "";


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    checkLogin();

    loadTheme();

    loadUser();

    loadData();

  }
);


/* =========================================================
   LOGIN CHECK
========================================================= */

function checkLogin(){

  const logged =
    localStorage.getItem("dashboardAuth") === "true" ||
    sessionStorage.getItem("dashboardAuth") === "true";

  if(!logged){

    window.location.href = "index.html";

  }

}


/* =========================================================
   USER PROFILE
========================================================= */

async function loadUser(){

  if(!currentUsername) return;

  try{

    const response = await fetch(
      USER_API_URL +
      "?action=getUser&username=" +
      encodeURIComponent(currentUsername)
    );

    const result = await response.json();

    if(!result.success || !result.user){

      return;

    }

    const user = result.user;

    document.getElementById("profileName").textContent =
      user.name || user.username || "User";


    if(user.picture){

      document.getElementById("profileImage").src =
        user.picture;

    }


    localStorage.setItem(
      "name",
      user.name || ""
    );

    localStorage.setItem(
      "role",
      user.role || ""
    );

    localStorage.setItem(
      "status",
      user.status || ""
    );


    if(

/* =========================================================
   RENDER DATA
========================================================= */

function renderData(data){

  const body =
    document.getElementById("dataBody");


  if(!data || !data.length){

    body.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          No data found
        </td>
      </tr>
    `;

    return;

  }


  body.innerHTML = data.map(function(row){

    const rowNumber =
      Number(
        row.row ||
        row._row ||
        row.rowNumber ||
        0
      );


    const name =
      row.Name ??
      row.name ??
      row[0] ??
      "";


    const ip =
      row.Ip ??
      row.IP ??
      row.ip ??
      row[1] ??
      "";


    const work =
      row.Work ??
      row.work ??
      row[2] ??
      "";


    const date =
      row.Date ??
      row.date ??
      row[3] ??
      "";


    const safeRow =
      JSON.stringify({
        row:rowNumber,
        Name:name,
        Ip:ip,
        Work:work,
        Date:date
      })
      .replace(/'/g,"&#39;");


    return `

      <tr>

        <td>${escapeHtml(name)}</td>

        <td>${escapeHtml(ip)}</td>

        <td>${escapeHtml(work)}</td>

        <td>${formatDate(date)}</td>

        <td>

          <div class="row-actions">

            <button
              class="action-btn action-edit"
              onclick='openEditModal(${safeRow})'
            >
              Edit
            </button>

            <button
              class="action-btn action-sell"
              onclick="sellEntry(${rowNumber})"
            >
              Sell
            </button>

            <button
              class="action-btn action-delete"
              onclick="deleteEntry(${rowNumber})"
            >
              Delete
            </button>

          </div>

        </td>

      </tr>

    `;

  }).join("");

}

/* =========================================================
   FILTER
========================================================= */

function applyFilters(){

  const search =
    document.getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();


  const from =
    document.getElementById("fromDate")
    .value;


  const to =
    document.getElementById("toDate")
    .value;


  const filtered =
    allData.filter(function(row){

      const text =
        JSON.stringify(row)
        .toLowerCase();


      if(
        search &&
        !text.includes(search)
      ){

        return false;

      }


      const date =
        normalizeDate(
          row.Date ??
          row.date ??
          row[3] ??
          ""
        );


      if(from && date < from){

        return false;

      }


      if(to && date > to){

        return false;

      }


      return true;

    });


  renderData(filtered);

}


function clearFilters(){

  document.getElementById("searchInput").value = "";

  document.getElementById("fromDate").value = "";

  document.getElementById("toDate").value = "";

  renderData(allData);

}

    );

        </td>

function renderUsers(users){

  const body =
    document.getElementById("usersBody");


  if(!users.length){

    body.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          No users found
        </td>
      </tr>
    `;

    return;

  }


  body.innerHTML =
    users.map(function(user){

      const username =
        user.username ||
        user.Username ||
        "";


      const name =
        user.name ||
        user.Name ||
        "";


      const role =
        user.role ||
        user.Role ||
        "";


      const status =
        user.status ||
        user.Status ||
        "";


      const isCurrent =
        username.toLowerCase() ===
        currentUsername.toLowerCase();


      const statusClass =
        String(status).toLowerCase() === "active"
          ? "status-active"
          : "status-block";


      return `

        <tr>

          <td>
            ${escapeHtml(username)}
          </td>

          <td>
            ${escapeHtml(name)}
          </td>

          <td>
            ${escapeHtml(role)}
          </td>

          <td>

            <span class="status ${statusClass}">
              ${escapeHtml(status)}
            </span>

          </td>

          <td>

            <div class="row-actions">

              <button
                class="action-btn action-edit"
                onclick='editUser(${JSON.stringify(user)})'
              >
                Edit
              </button>

              ${
                !isCurrent
                ? `
                  <button
                    class="action-btn ${
                      String(status).toLowerCase() === "active"
                      ? "action-delete"
                      : "action-sell"
                    }"
                    onclick="changeUserStatus(
                      '${escapeJs(username)}',
                      '${String(status).toLowerCase() === "active" ? "Block" : "Active"}'
                    )"
                  >
                    ${
                      String(status).toLowerCase() === "active"
                      ? "Block"
                      : "Unblock"
                    }
                  </button>
                `
                : ""
              }

            </div>

          </td>

        </tr>

      `;

    }).join("");

}

/* =========================================================
   DATE
========================================================= */

function getTodayDate(){

  const d = new Date();

  const year =
    d.getFullYear();


  const month =
    String(
      d.getMonth() + 1
    ).padStart(2,"0");


  const day =
    String(
      d.getDate()
    ).padStart(2,"0");


  return `${year}-${month}-${day}`;

}


function normalizeDate(value){

  if(!value) return "";


  if(
    typeof value === "string" &&
    /^\d{4}-\d{2}-\d{2}$/.test(value)
  ){

    return value;

  }


  const d =
    new Date(value);


  if(isNaN(d.getTime())){

    return "";

  }


  return [
    d.getFullYear(),

    String(
      d.getMonth() + 1
    ).padStart(2,"0"),

    String(
      d.getDate()
    ).padStart(2,"0")

  ].join("-");

}


function formatDate(value){

  if(!value) return "";


  const normalized =
    normalizeDate(value);


  if(!normalized){

    return escapeHtml(value);

  }


  const parts =
    normalized.split("-");


  return (
    parts[2] +
    "/" +
    parts[1] +
    "/" +
    parts[0]
  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJs(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"')
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");

}

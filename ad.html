<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Support Dashboard</title>

<link
  rel="icon"
  type="image/png"
  sizes="128x128"
  href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#172033;
  --muted:#687386;
  --border:#e5e9f2;
  --primary:#2563eb;
  --primary2:#1d4ed8;
  --danger:#ef4444;
  --success:#16a34a;
  --warning:#f59e0b;
  --shadow:0 10px 30px rgba(15,23,42,.08);
}

body.dark{
  --bg:#0f172a;
  --card:#172033;
  --text:#f8fafc;
  --muted:#aab4c5;
  --border:#293449;
  --shadow:0 10px 30px rgba(0,0,0,.25);
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* =========================================================
   HEADER
========================================================= */

.header{
  width:100%;
  height:70px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:100;
}

.header-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:12px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:20px;
  font-weight:bold;
}

.title-box h2{
  font-size:18px;
}

.title-box span{
  font-size:12px;
  color:var(--muted);
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

/* =========================================================
   BUTTONS
========================================================= */

.icon-btn{
  width:40px;
  height:40px;
  border:none;
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
  cursor:pointer;
  font-size:18px;
  transition:.2s;
}

.icon-btn:hover{
  transform:translateY(-1px);
}

.profile{
  height:40px;
  padding:0 12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}

.profile-avatar{
  width:28px;
  height:28px;
  border-radius:50%;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
}

/* =========================================================
   MAIN
========================================================= */

.container{
  width:min(1400px,94%);
  margin:25px auto;
}

/* =========================================================
   TOP ACTIONS
========================================================= */

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.left-actions,
.right-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  border-radius:10px;
  padding:11px 16px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-primary:hover{
  background:var(--primary2);
}

.btn-danger{
  background:var(--danger);
  color:white;
}

.btn-success{
  background:var(--success);
  color:white;
}

.btn-warning{
  background:var(--warning);
  color:white;
}

.btn-light{
  background:var(--card);
  color:var(--text);
  border:1px solid var(--border);
}

/* =========================================================
   TOTAL
========================================================= */

.total-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px 20px;
  box-shadow:var(--shadow);
  margin-bottom:15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.total-label{
  color:var(--muted);
  font-size:14px;
}

.total-number{
  font-size:25px;
  font-weight:700;
  color:var(--primary);
}

/* =========================================================
   FILTER
========================================================= */

.filter-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.filter-grid{
  display:grid;
  grid-template-columns:2fr 1fr auto;
  gap:10px;
}

.input{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
}

.input:focus{
  border-color:var(--primary);
}

/* =========================================================
   TABLE
========================================================= */

.table-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

thead{
  background:var(--bg);
}

th{
  padding:14px 12px;
  text-align:left;
  font-size:13px;
  color:var(--muted);
  font-weight:700;
  border-bottom:1px solid var(--border);
}

td{
  padding:13px 12px;
  border-bottom:1px solid var(--border);
  font-size:14px;
}

tbody tr:hover{
  background:rgba(37,99,235,.03);
}

.action-box{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.small-btn{
  border:none;
  border-radius:7px;
  padding:7px 9px;
  cursor:pointer;
  color:white;
  font-size:12px;
  font-weight:600;
}

.edit-btn{
  background:#2563eb;
}

.sell-btn{
  background:#16a34a;
}

.delete-btn{
  background:#ef4444;
}

/* =========================================================
   TABLE LOADING
========================================================= */

.loading-row{
  text-align:center;
  padding:45px 20px !important;
  color:var(--muted);
}

.spinner{
  width:28px;
  height:28px;
  border:3px solid var(--border);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 10px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================================================
   PAGINATION
========================================================= */

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  padding:18px;
  flex-wrap:wrap;
}

.page-btn{
  min-width:36px;
  height:36px;
  padding:0 10px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
}

.page-btn:hover{
  border-color:var(--primary);
}

.page-btn.active{
  background:var(--primary);
  color:white;
  border-color:var(--primary);
}

.page-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:500;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(520px,100%);
  background:var(--card);
  border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  padding:22px;
  animation:modalIn .2s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(15px) scale(.98);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-header h3{
  font-size:18px;
}

.close-btn{
  width:34px;
  height:34px;
  border:none;
  border-radius:8px;
  background:var(--bg);
  color:var(--text);
  cursor:pointer;
  font-size:18px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:6px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  min-width:260px;
  max-width:380px;
  background:#111827;
  color:white;
  padding:13px 16px;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  transform:translateY(100px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:1000;
  font-size:14px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.toast.success{
  background:#15803d;
}

.toast.error{
  background:#dc2626;
}

/* =========================================================
   PROFILE MENU
========================================================= */

.profile-menu{
  position:fixed;
  top:78px;
  right:24px;
  width:220px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:8px;
  display:none;
  z-index:300;
}

.profile-menu.show{
  display:block;
}

.profile-info{
  padding:10px;
  border-bottom:1px solid var(--border);
  margin-bottom:6px;
}

.profile-info strong{
  display:block;
  margin-bottom:3px;
}

.profile-info span{
  color:var(--muted);
  font-size:12px;
}

.menu-item{
  width:100%;
  padding:11px;
  border:none;
  background:transparent;
  color:var(--text);
  border-radius:8px;
  text-align:left;
  cursor:pointer;
}

.menu-item:hover{
  background:var(--bg);
}

.menu-item.logout{
  color:var(--danger);
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

  .header{
    padding:0 12px;
  }

  .title-box h2{
    font-size:15px;
  }

  .title-box span{
    display:none;
  }

  .container{
    width:96%;
    margin:15px auto;
  }

  .filter-grid{
    grid-template-columns:1fr;
  }

  .profile{
    padding:0 8px;
  }

  .profile-name{
    display:none;
  }

  .total-box{
    padding:14px;
  }

  .total-number{
    font-size:22px;
  }

  .top-bar{
    align-items:stretch;
  }

  .left-actions,
  .right-actions{
    width:100%;
  }

  .left-actions .btn,
  .right-actions .btn{
    flex:1;
  }

}

</style>

</head>


<body>

<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

  <div class="header-left">

    <div class="logo">
      S
    </div>

    <div class="title-box">
      <h2>Support Dashboard</h2>
      <span>Support Management System</span>
    </div>

  </div>


  <div class="header-right">

    <button
      class="icon-btn"
      id="themeBtn"
      onclick="toggleTheme()"
      title="Theme"
    >
      🌙
    </button>


    <button
      class="profile"
      onclick="toggleProfileMenu()"
    >

      <span
        class="profile-avatar"
        id="profileAvatar"
      >
        U
      </span>

      <span
        class="profile-name"
        id="profileName"
      >
        User
      </span>

    </button>

  </div>

</header>


<!-- =======================================================
     PROFILE MENU
======================================================= -->

<div
  class="profile-menu"
  id="profileMenu"
>

  <div class="profile-info">

    <strong id="menuUserName">
      User
    </strong>

    <span id="menuUserRole">
      Support
    </span>

  </div>


  <button
    class="menu-item"
    onclick="goUsers()"
  >
    👥 Users
  </button>


  <button
    class="menu-item"
    onclick="openNewEntry()"
  >
    ➕ New Entry
  </button>


  <button
    class="menu-item logout"
    onclick="logout()"
  >
    🚪 Logout
  </button>

</div>


<!-- =======================================================
     MAIN
======================================================= -->

<main class="container">


  <!-- TOP BAR -->

  <div class="top-bar">

    <div class="left-actions">

      <button
        class="btn btn-primary"
        onclick="openNewEntry()"
      >
        ➕ New Entry
      </button>


      <button
        class="btn btn-light"
        onclick="goUsers()"
      >
        👥 Users
      </button>

    </div>


    <div class="right-actions">

      <button
        class="btn btn-light"
        onclick="loadData()"
      >
        🔄 Refresh
      </button>

    </div>

  </div>


  <!-- TOTAL -->

  <div class="total-box">

    <div>

      <div class="total-label">
        Total Data
      </div>

      <div class="total-number">
        <span id="totalCount">
          0
        </span>
      </div>

    </div>

    <div>
      📊
    </div>

  </div>


  <!-- FILTER -->

  <div class="filter-box">

    <div class="filter-grid">

      <input
        type="text"
        id="searchInput"
        class="input"
        placeholder="Search Name, IP or Work..."
        oninput="applyFilters()"
      >


      <input
        type="date"
        id="dateFilter"
        class="input"
        onchange="applyFilters()"
      >


      <button
        class="btn btn-danger"
        onclick="clearFilters()"
      >
        Clear
      </button>

    </div>

  </div>


  <!-- TABLE -->

  <div class="table-card">

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>SI</th>
            <th>Name</th>
            <th>IP</th>
            <th>Work</th>
            <th>Date</th>
            <th>Action</th>

          </tr>

        </thead>


        <tbody id="dataBody">

          <tr>

            <td
              colspan="6"
              class="loading-row"
            >

              <div class="spinner"></div>

              Loading data...

            </td>

          </tr>

        </tbody>

      </table>

    </div>


    <!-- PAGINATION -->

    <div
      class="pagination"
      id="pagination"
    ></div>

  </div>

</main>


<!-- =======================================================
     EDIT MODAL
======================================================= -->

<div
  class="modal"
  id="editModal"
>

  <div class="modal-card">

    <div class="modal-header">

      <h3>Edit Entry</h3>

      <button
        class="close-btn"
        onclick="closeModal('editModal')"
      >
        ×
      </button>

    </div>


    <input
      type="hidden"
      id="editRow"
    >


    <div class="form-group">

      <label>Name</label>

      <input
        type="text"
        id="editName"
        class="input"
      >

    </div>


    <div class="form-group">

      <label>IP</label>

      <input
        type="text"
        id="editIp"
        class="input"
      >

    </div>


    <div class="form-group">

      <label>Work</label>

      <input
        type="text"
        id="editWork"
        class="input"
      >

    </div>


    <div class="form-group">

      <label>Date</label>

      <input
        type="date"
        id="editDate"
        class="input"
      >

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-light"
        onclick="closeModal('editModal')"
      >
        Cancel
      </button>


      <button
        class="btn btn-primary"
        onclick="saveEdit()"
      >
        Save Changes
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     NEW ENTRY MODAL
======================================================= -->

<div
  class="modal"
  id="newModal"
>

  <div class="modal-card">

    <div class="modal-header">

      <h3>New Entry</h3>

      <button
        class="close-btn"
        onclick="closeModal('newModal')"
      >
        ×
      </button>

    </div>


    <div class="form-group">

      <label>Name</label>

      <input
        type="text"
        id="newName"
        class="input"
        placeholder="Enter name"
      >

    </div>


    <div class="form-group">

      <label>IP</label>

      <input
        type="text"
        id="newIp"
        class="input"
        placeholder="Enter IP"
      >

    </div>


    <div class="form-group">

      <label>Work</label>

      <input
        type="text"
        id="newWork"
        class="input"
        placeholder="Enter work"
      >

    </div>


    <div class="form-group">

      <label>Date</label>

      <input
        type="date"
        id="newDate"
        class="input"
      >

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-light"
        onclick="closeModal('newModal')"
      >
        Cancel
      </button>


      <button
        class="btn btn-primary"
        onclick="saveNewEntry()"
      >
        Add Entry
      </button>

    </div>

  </div>

</div>


<!-- =======================================================
     TOAST
======================================================= -->

<div
  class="toast"
  id="toast"
></div>


<script>

/* =========================================================
   API URLS
========================================================= */


/*
 * MAIN DATA API
 *
 * New Entry
 * Edit
 * Sell
 * Get Data
 */

const DATA_API_URL =
"https://script.google.com/macros/s/AKfycbz59T-4CKQDbHJB_ql6OYZf18eN7XUmttp0d2FaOM5pm27yCBOWrEilqA_zMOnFq_rz/exec";


/*
 * USER API
 */

const USER_API_URL =
"https://script.google.com/macros/s/AKfycbw00GHHheuvtdQtgPURjs4PtsM48-4yaFx-_ms0ZBV5FHhnmcdbJ5DHr3Aix8JPF0kQzA/exec";


/*
 * NEW DELETE API
 *
 * Name
 * IP
 * Date
 * Dellet time
 * User
 */

const DELETE_API_URL =
"https://script.google.com/macros/s/AKfycbwDL1JIV7QYcH84VGiWxhUoT-wN9UfuGn0t9boYrs_FaG_ZfcVGjNmaTqSTC6ev0Ig9Kg/exec";


/* =========================================================
   PAGINATION
========================================================= */

const ITEMS_PER_PAGE = 10;

let allData = [];
let filteredData = [];

let currentPage = 1;


/* =========================================================
   USER
========================================================= */

let loggedUser = "Unknown";

let userData = null;


/* =========================================================
   INITIAL LOAD
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    checkLogin();

    loadTheme();

    loadData();

  }
);


/* =========================================================
   CHECK LOGIN
========================================================= */

function checkLogin(){

  const auth =
    localStorage.getItem("dashboardAuth") ||
    sessionStorage.getItem("dashboardAuth");


  if(
    auth !== "true" &&
    auth !== "1"
  ){

    window.location.href =
      "index.html";

    return;

  }


  try{

    const saved =
      localStorage.getItem("userData");

    if(saved){

      userData =
        JSON.parse(saved);

    }

  }catch(error){

    userData = null;

  }


  loggedUser =
    localStorage.getItem("username") ||
    localStorage.getItem("loggedUser") ||
    localStorage.getItem("currentUser") ||
    "Unknown";


  const name =
    localStorage.getItem("name") ||
    (userData && (
      userData.name ||
      userData.Name ||
      userData.username
    )) ||
    loggedUser;


  const role =
    (userData && (
      userData.role ||
      userData.Role
    )) ||
    localStorage.getItem("role") ||
    "Support";


  document.getElementById(
    "profileName"
  ).textContent = name;


  document.getElementById(
    "menuUserName"
  ).textContent = name;


  document.getElementById(
    "menuUserRole"
  ).textContent = role;


  document.getElementById(
    "profileAvatar"
  ).textContent =
    String(name)
      .charAt(0)
      .toUpperCase();

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

  const body =
    document.getElementById(
      "dataBody"
    );


  body.innerHTML = `

    <tr>

      <td
        colspan="6"
        class="loading-row"
      >

        <div class="spinner"></div>

        Loading data...

      </td>

    </tr>

  `;


  try{

    const response =
      await fetch(
        DATA_API_URL +
        "?action=getData&_=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    if(
      !result ||
      result.success === false
    ){

      throw new Error(
        result &&
        result.message
          ? result.message
          : "Unable to load data"
      );

    }


    allData =
      Array.isArray(result.data)
        ? result.data
        : Array.isArray(result.users)
          ? result.users
          : [];


    filteredData =
      [...allData];


    currentPage = 1;

    updateTotal();

    renderPage();

  }catch(error){

    console.error(error);


    body.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="empty"
        >

          ❌ Failed to load data

          <br><br>

          <button
            class="btn btn-primary"
            onclick="loadData()"
          >
            Try Again
          </button>

        </td>

      </tr>

    `;

    document.getElementById(
      "pagination"
    ).innerHTML = "";

  }

}


/* =========================================================
   TOTAL
========================================================= */

function updateTotal(){

  document.getElementById(
    "totalCount"

    filteredData.length;

}


/* =========================================================
   RENDER PAGE
========================================================= */

function renderPage(){

  const body =
    document.getElementById(
      "dataBody"
    );


  if(!filteredData.length){

    body.innerHTML = `

      <tr>

        <td
          colspan="6"
          class="empty"
        >

          No data found.

        </td>

      </tr>

    `;


    renderPagination();

    return;

  }


  const totalPages =
    Math.ceil(
      filteredData.length /
      ITEMS_PER_PAGE
    );


  if(
    currentPage > totalPages
  ){

    currentPage =
      totalPages;

  }


  const start =
    (currentPage - 1) *
    ITEMS_PER_PAGE;


  const end =
    start +
    ITEMS_PER_PAGE;


  const pageData =
    filteredData.slice(
      start,
      end
    );


  body.innerHTML =
    pageData
      .map(
        (item,index)=>{

          const rowNumber =
            item.row ||
            (
              start +
              index +
              2
            );


          const name =
            escapeHtml(
              item.Name ??
              item.name ??
              ""
            );


          const ip =
            escapeHtml(
              item.Ip ??
              item.IP ??
              item.ip ??
              ""
            );


          const work =
            escapeHtml(
              item.Work ??
              item.work ??
              ""
            );


          const date =
            escapeHtml(
              item.Date ??
              item.date ??
              ""
            );


          return `

            <tr>

              <td>
                ${start + index + 1}
              </td>

              <td>
                ${name}
              </td>

              <td>
                ${ip}
              </td>

              <td>
                ${work}
              </td>

              <td>
                ${formatDisplayDate(date)}
              </td>

              <td>

                <div class="action-box">

                  <button
                    class="small-btn edit-btn"
                    onclick="openEdit(${rowNumber})"
                  >
                    Edit
                  </button>


                  <button
                    class="small-btn sell-btn"
                    onclick="sellEntry(${rowNumber})"
                  >
                    Sell
                  </button>


                  <button
                    class="small-btn delete-btn"
                    onclick="deleteEntry(${rowNumber})"
                  >
                    Delete
                  </button>

                </div>

              </td>

            </tr>

          `;

        }
      )
      .join("");


  renderPagination();

}


/* =========================================================
   PAGINATION
========================================================= */

function renderPagination(){

  const box =
    document.getElementById(
      "pagination"
    );


  const totalPages =
    Math.ceil(
      filteredData.length /
      ITEMS_PER_PAGE
    );


  if(totalPages <= 1){

    box.innerHTML = "";

    return;

  }


  let html = "";


  html += `

    <button
      class="page-btn"
      onclick="changePage(${currentPage - 1})"
      ${currentPage === 1 ? "disabled" : ""}
    >
      ‹
    </button>

  `;


  for(
    let i = 1;
    i <= totalPages;
    i++
  ){

    html += `

      <button
        class="page-btn ${
          i === currentPage
            ? "active"
            : ""
        }"
        onclick="changePage(${i})"
      >
        ${i}
      </button>

    `;

  }


  html += `

    <button
      class="page-btn"
      onclick="changePage(${currentPage + 1})"
      ${
        currentPage === totalPages
          ? "disabled"
          : ""
      }
    >
      ›
    </button>

  `;


  box.innerHTML =
    html;

}


function changePage(page){

  const totalPages =
    Math.ceil(
      filteredData.length /
      ITEMS_PER_PAGE
    );


  if(
    page < 1 ||
    page > totalPages
  ){

    return;

  }


  currentPage =
    page;


  renderPage();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   FILTER
========================================================= */

function applyFilters(){

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const date =
    document
      .getElementById(
        "dateFilter"
      )
      .value
      .trim();


  filteredData =
    allData.filter(
      item => {

        const name =
          String(
            item.Name ??
            item.name ??
            ""
          ).toLowerCase();


        const ip =
          String(
            item.Ip ??
            item.IP ??
            item.ip ??
            ""
          ).toLowerCase();


        const work =
          String(
            item.Work ??
            item.work ??
            ""
          ).toLowerCase();


        const itemDate =
          String(
            item.Date ??
            item.date ??
            ""
          );


        const searchMatch =
          !search ||
          name.includes(search) ||
          ip.includes(search) ||
          work.includes(search);


        const dateMatch =
          !date ||
          normalizeDate(itemDate) ===
          normalizeDate(date);


        return (
          searchMatch &&
          dateMatch
        );

      }
    );


  currentPage = 1;

  updateTotal();

  renderPage();

}

  ).value = "";

  updateTotal();

  renderPage();

}

/* =========================================================
   DELETE
   ---------------------------------------------------------
   IMPORTANT:
   Delete is sent to separate DELETE API.
========================================================= */

async function deleteEntry(rowNumber){

  const item =
    allData.find(
      x =>
        Number(x.row) ===
        Number(rowNumber)
    );


  if(!item){

    showToast(
      "Data not found",
      "error"
    );

    return;

  }


  const name =
    item.Name ??
    item.name ??
    "";


  if(
    !confirm(
      "Are you sure you want to Delete this entry?\n\n" +
      name
    )
  ){

    return;

  }


  try{

    /*
     * STEP 1
     * Save data to separate Delete Sheet
     */

    const deleteResponse =
      await fetch(
        DELETE_API_URL,
        {
          method:"POST",
          body:JSON.stringify({

            action:"deleteData",

            name:
              item.Name ??
              item.name ??
              "",

            ip:
              item.Ip ??
              item.IP ??
              item.ip ??
              "",

            date:
              item.Date ??
              item.date ??
              "",

            user:
              loggedUser

          })
        }
      );


    const deleteResult =
      await deleteResponse.json();


    if(
      !deleteResult.success
    ){

      throw new Error(
        deleteResult.message ||
        "Delete archive failed"
      );

    }


    /*
     * STEP 2
     * Remove original data from
     * New Entry sheet.
     *
     * The main API performs the
     * actual row deletion.
     */

    const removeResponse =
      await fetch(
        DATA_API_URL,
        {
          method:"POST",
          body:JSON.stringify({

            action:"deleteData",

            row:rowNumber,

            user:loggedUser

          })
        }
      );


    const removeResult =
      await removeResponse.json();


    /*
     * If the old API doesn't support
     * deleteData anymore, the archive
     * was still saved. Show error.
     */

    if(
      !removeResult.success
    ){

      throw new Error(
        removeResult.message ||
        "Original data could not be removed"
      );

    }


    showToast(
      "Entry deleted successfully",
      "success"
    );


    loadData();


  }catch(error){

    console.error(error);


    showToast(
      error.message ||
      "Delete failed",
      "error"
    );

  }

}

/* =========================================================
   DATE
========================================================= */

function getToday(){

  const now =
    new Date();


  const y =
    now.getFullYear();


  const m =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const d =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    y +
    "-" +
    m +
    "-" +
    d
  );

}


function normalizeDate(value){

  if(!value){
    return "";
  }


  const text =
    String(value).trim();


  if(
    /^\d{4}-\d{2}-\d{2}$/.test(
      text
    )
  ){

    return text;

  }


  const match =
    text.match(
      /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
    );


  if(match){

    return (
      match[3] +
      "-" +
      String(
        match[2]
      ).padStart(2,"0") +
      "-" +
      String(
        match[1]
      ).padStart(2,"0")
    );

  }


  const parsed =
    new Date(text);


  if(
    !isNaN(
      parsed.getTime()
    )
  ){

    return (
      parsed.getFullYear() +
      "-" +
      String(
        parsed.getMonth()+1
      ).padStart(2,"0") +
      "-" +
      String(
        parsed.getDate()
      ).padStart(2,"0")
    );

  }


  return text;

}


function formatDisplayDate(value){

  const normalized =
    normalizeDate(value);


  if(
    /^\d{4}-\d{2}-\d{2}$/.test(
      normalized
    )
  ){

    const parts =
      normalized.split("-");


    return (
      parts[2] +
      "/" +
      parts[1] +
      "/" +
      parts[0]
    );

  }


  return value || "";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

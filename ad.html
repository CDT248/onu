<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Support Dashboard</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
:root{
--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b7280;
--border:#e5e7eb;--primary:#2563eb;--danger:#dc2626;--success:#16a34a;
--shadow:0 10px 30px rgba(0,0,0,.08)
}
body.dark{
--bg:#0f172a;--card:#111827;--text:#f8fafc;--muted:#94a3b8;
--border:#263244;--shadow:0 10px 30px rgba(0,0,0,.35)
}
body{background:var(--bg);color:var(--text);min-height:100vh}
.header{
height:70px;background:var(--card);border-bottom:1px solid var(--border);
display:flex;align-items:center;justify-content:space-between;
padding:0 22px;position:sticky;top:0;z-index:100
}
.logoArea{display:flex;align-items:center;gap:10px}
.logo{
width:42px;height:42px;border-radius:12px;
background:linear-gradient(135deg,#2563eb,#7c3aed);
color:#fff;display:flex;align-items:center;justify-content:center;
font-size:20px;font-weight:bold
}
.logoText h2{font-size:18px}.logoText span{color:var(--muted);font-size:11px}
.headerRight{display:flex;align-items:center;gap:8px}
.headerBtn{
height:40px;border:1px solid var(--border);background:var(--card);
color:var(--text);border-radius:10px;padding:0 13px;cursor:pointer;font-weight:bold
}
.headerBtn:hover{border-color:var(--primary);color:var(--primary)}
.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.profile{position:relative}
.profileBtn{
height:42px;border:1px solid var(--border);background:var(--card);
color:var(--text);border-radius:10px;padding:0 10px;display:flex;
align-items:center;gap:8px;cursor:pointer
}
.avatar{
width:30px;height:30px;border-radius:50%;
background:linear-gradient(135deg,#2563eb,#9333ea);
color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold
}
.profileMenu{
display:none;position:absolute;right:0;top:50px;width:230px;background:var(--card);
border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);
overflow:hidden;z-index:500
}
.profileMenu.show{display:block}
.profileInfo{padding:15px;border-bottom:1px solid var(--border)}
.profileInfo strong{display:block;margin-bottom:5px}
.profileInfo small{color:var(--muted)}
.menuItem{
width:100%;border:0;background:transparent;color:var(--text);
text-align:left;padding:13px 15px;cursor:pointer
}
.menuItem:hover{background:rgba(37,99,235,.08)}
.menuItem.danger{color:var(--danger)}
.container{width:94%;max-width:1400px;margin:25px auto}
.pageTitle{margin-bottom:18px}.pageTitle h1{font-size:25px;margin-bottom:5px}
.pageTitle p{color:var(--muted);font-size:14px}
.filterCard,.tableCard{
background:var(--card);border:1px solid var(--border);
border-radius:16px;box-shadow:var(--shadow)
}
.filterCard{padding:16px;margin-bottom:18px}
.filterGrid{display:grid;grid-template-columns:1.5fr 1fr 1fr auto auto;gap:10px}
.field,.formGroup{display:flex;flex-direction:column;gap:6px}
.field label,.formGroup label{color:var(--muted);font-size:12px;font-weight:bold}
input,select{
width:100%;height:42px;border:1px solid var(--border);border-radius:10px;
background:var(--card);color:var(--text);padding:0 12px;outline:none
}
input:focus,select:focus{border-color:var(--primary)}
.btn{
height:42px;border:0;border-radius:10px;padding:0 17px;cursor:pointer;font-weight:bold
}
.btnPrimary{background:var(--primary);color:#fff}
.btnSecondary{background:#e9eef5;color:#334155}
body.dark .btnSecondary{background:#1e293b;color:#e2e8f0}
.tableCard{overflow:hidden}
.tableHeader{
padding:16px 18px;border-bottom:1px solid var(--border);
display:flex;align-items:center;justify-content:space-between
}
.count{color:var(--muted);font-size:12px}
.tableWrap{width:100%;overflow:auto}
table{width:100%;min-width:700px;border-collapse:collapse}
th{
padding:13px 16px;text-align:left;background:rgba(100,116,139,.06);
color:var(--muted);font-size:12px
}
td{padding:14px 16px;border-top:1px solid var(--border);font-size:14px}
.empty{padding:45px 20px;text-align:center;color:var(--muted)}
.modal{
display:none;position:fixed;inset:0;background:rgba(15,23,42,.60);
backdrop-filter:blur(4px);z-index:1000;align-items:center;justify-content:center;padding:15px
}
.modal.show{display:flex}
.modalBox{
width:min(600px,100%);max-height:92vh;overflow:auto;background:var(--card);
border:1px solid var(--border);border-radius:18px;box-shadow:0 25px 70px rgba(0,0,0,.25)
}
.modalBox.large{width:min(1050px,100%)}
.modalHeader{
padding:17px 20px;border-bottom:1px solid var(--border);
display:flex;align-items:center;justify-content:space-between
}
.closeBtn{
width:34px;height:34px;border:0;border-radius:9px;
background:rgba(100,116,139,.1);color:var(--text);font-size:20px;cursor:pointer
}
.modalBody{padding:20px}
.modalFooter{
padding:14px 20px;border-top:1px solid var(--border);
display:flex;justify-content:flex-end;gap:8px
}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.formGroup.full{grid-column:1/-1}
.userToolbar{display:flex;gap:10px;margin-bottom:15px}
.userToolbar input{flex:1}
.editBtn,.statusBtn{
border:1px solid var(--border);background:var(--card);
padding:7px 10px;border-radius:8px;cursor:pointer;font-weight:bold
}
.editBtn{color:var(--primary)}.statusBtn.block{color:#dc2626}
.statusBtn.active{color:#16a34a}.statusBtn.inactive{color:#a16207}
.status{
display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:bold
}
.statusActive{color:#15803d;background:#dcfce7}
.statusBlocked{color:#b91c1c;background:#fee2e2}
.statusInactive{color:#a16207;background:#fef3c7}
.actionGroup{display:flex;gap:6px;flex-wrap:wrap}
.toast{
position:fixed;right:20px;bottom:20px;min-width:240px;max-width:380px;
padding:13px 17px;border-radius:11px;color:#fff;opacity:0;
transform:translateY(20px);pointer-events:none;transition:.25s;z-index:3000
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:#16a34a}.toast.error{background:#dc2626}.toast.info{background:#2563eb}
.loader{
display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);
z-index:4000;align-items:center;justify-content:center
}
.loader.show{display:flex}
.loaderBox{
background:var(--card);color:var(--text);padding:22px 28px;border-radius:15px;text-align:center
}
.spinner{
width:34px;height:34px;border:4px solid rgba(37,99,235,.2);
border-top-color:var(--primary);border-radius:50%;
animation:spin .8s linear infinite;margin:0 auto 12px
}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.filterGrid{grid-template-columns:1fr 1fr}.searchField{grid-column:1/-1}}
@media(max-width:650px){
.header{padding:0 10px}.logoText{display:none}.headerBtn{padding:0 8px;font-size:12px}
.profileName{display:none}.filterGrid{grid-template-columns:1fr}.searchField{grid-column:auto}
.formGrid{grid-template-columns:1fr}.formGroup.full{grid-column:auto}.userToolbar{flex-direction:column}
}
</style>
</head>

<body>

<header class="header">
<div class="logoArea">
<div class="logo">S</div>
<div class="logoText">
<h2>Support Dashboard</h2>
<span>Management System</span>
</div>
</div>

<div class="headerRight">
<button class="headerBtn" onclick="loadData()">↻</button>
<button class="headerBtn primary" onclick="openUsersModal()">👥 Users</button>
<button class="headerBtn primary" onclick="openEntryModal()">+ New Entry</button>
<button class="headerBtn" onclick="toggleTheme()" id="themeButton">☾</button>

<div class="profile">
<button class="profileBtn" onclick="toggleProfile()">
<div class="avatar" id="avatar">U</div>
<span class="profileName" id="profileName">User</span>
<span>⌄</span>
</button>

<div class="profileMenu" id="profileMenu">
<div class="profileInfo">
<strong id="menuName">User</strong>
<small id="menuUsername">@username</small><br>
<small id="menuRole">Role: User</small>
</div>
<button class="menuItem" onclick="openPasswordModal()">🔑 Change Password</button>
<button class="menuItem" onclick="loadData()">🔄 Reload Data</button>
<button class="menuItem danger" onclick="logout()">⎋ Logout</button>
</div>
</div>
</div>
</header>

<main class="container">

<div class="pageTitle">
<h1>Recent Entries</h1>
<p>View and manage your support entries</p>
</div>

<div class="filterCard">
<div class="filterGrid">

<div class="field searchField">
<label>Search</label>
<input id="searchInput" placeholder="Search name, IP or work..." oninput="applyFilter()">
</div>

<div class="field">
<label>From Date</label>
<input id="fromDate" type="date">
</div>

<div class="field">
<label>To Date</label>
<input id="toDate" type="date">
</div>

<button class="btn btnPrimary" onclick="applyFilter()">Filter</button>
<button class="btn btnSecondary" onclick="clearFilter()">Clear</button>

</div>
</div>

<div class="tableCard">
<div class="tableHeader">
<h3>Recent Entries</h3>
<span class="count" id="dataCount">0 entries</span>
</div>

<div class="tableWrap">
<table>
<thead>
<tr><th>Name</th><th>IP</th><th>Work</th><th>Date</th></tr>
</thead>
<tbody id="dataBody"></tbody>
</table>
</div>

<div class="empty" id="emptyData" style="display:none">No data found.</div>
</div>

</main>


<!-- USERS MODAL -->

<div class="modal" id="usersModal">
<div class="modalBox large">

<div class="modalHeader">
<h3>👥 User Management</h3>
<button class="closeBtn" onclick="closeModal('usersModal')">×</button>
</div>

<div class="modalBody">

<div class="userToolbar">
<input id="userSearch" placeholder="Search username, name, role..." oninput="renderUsers()">
<button class="btn btnPrimary" onclick="openAddUser()">+ Add User</button>
</div>

<div class="tableWrap">
<table>
<thead>
<tr>
<th>Username</th>
<th>Name</th>
<th>Role</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="usersBody"></tbody>
</table>
</div>

<div class="empty" id="emptyUsers" style="display:none">No users found.</div>

</div>
</div>
</div>


<!-- USER FORM -->

<div class="modal" id="userFormModal">
<div class="modalBox">

<div class="modalHeader">
<h3 id="userFormTitle">Add User</h3>
<button class="closeBtn" onclick="closeModal('userFormModal')">×</button>
</div>

<div class="modalBody">

<div class="formGrid">

<div class="formGroup">
<label>Username</label>
<input id="formUsername" placeholder="Username">
</div>

<div class="formGroup">
<label>Password</label>
<input id="formPassword" type="password" placeholder="Password">
</div>

<div class="formGroup">
<label>Name</label>
<input id="formName" placeholder="Full name">
</div>

<div class="formGroup">
<label>Role</label>
<select id="formRole">
<option value="support">Support</option>
<option value="call">Call</option>
<option value="guest">Guest</option>
<option value="manager">Manager</option>
<option value="admin">Admin</option>
</select>
</div>

<div class="formGroup">
<label>Status</label>
<select id="formStatus">
<option value="Active">Active</option>
<option value="Blocked">Blocked</option>
<option value="Inactive">Inactive</option>
</select>
</div>

</div>

<input type="hidden" id="originalUsername">

</div>

<div class="modalFooter">
<button class="btn btnSecondary" onclick="closeModal('userFormModal')">Cancel</button>
<button class="btn btnPrimary" onclick="saveUser()">Save User</button>
</div>

</div>
</div>


<!-- ENTRY MODAL -->

<div class="modal" id="entryModal">
<div class="modalBox">

<div class="modalHeader">
<h3>New Entry</h3>
<button class="closeBtn" onclick="closeModal('entryModal')">×</button>
</div>

<div class="modalBody">
<div class="formGrid">

<div class="formGroup">
<label>Name</label>
<input id="entryName" readonly>
</div>

<div class="formGroup">
<label>Date & Time</label>
<input id="entryDate" readonly>
</div>

<div class="formGroup">
<label>IP Address</label>
<input id="entryIP" placeholder="Enter IP address">
</div>

<div class="formGroup">
<label>Work</label>
<input id="entryWork" placeholder="Enter work">
</div>

</div>
</div>

<div class="modalFooter">
<button class="btn btnSecondary" onclick="closeModal('entryModal')">Cancel</button>
<button class="btn btnPrimary" onclick="saveEntry()">Save Entry</button>
</div>

</div>
</div>


<!-- PASSWORD -->

<div class="modal" id="passwordModal">
<div class="modalBox">

<div class="modalHeader">
<h3>Change Password</h3>
<button class="closeBtn" onclick="closeModal('passwordModal')">×</button>
</div>

<div class="modalBody">
<div class="formGrid">

<div class="formGroup full">
<label>Current Password</label>
<input id="currentPassword" type="password">
</div>

<div class="formGroup full">
<label>New Password</label>
<input id="newPassword" type="password">
</div>

<div class="formGroup full">
<label>Confirm Password</label>
<input id="confirmPassword" type="password">
</div>

</div>
</div>

<div class="modalFooter">
<button class="btn btnSecondary" onclick="closeModal('passwordModal')">Cancel</button>
<button class="btn btnPrimary" onclick="changePassword()">Change Password</button>
</div>

</div>
</div>


<div class="loader" id="loader">
<div class="loaderBox">
<div class="spinner"></div>
<div id="loaderText">Loading...</div>
</div>
</div>

<div class="toast" id="toast"></div>


<script>

const USER_API_URL =
"https://script.google.com/macros/s/AKfycbw00GHHheuvtdQtgPURjs4PtsM48-4yaFx-_ms0ZBV5FHhnmcdbJ5DHr3Aix8JPF0kQzA/exec";

const DATA_API_URL =
"https://script.google.com/macros/s/AKfycbz59T-4CKQDbHJB_ql6OYZf18eN7XUmttp0d2FaOM5pm27yCBOWrEilqA_zMOnFq_rz/exec";

let allData=[];
let filteredData=[];
let allUsers=[];
let editingUser=false;

let currentUsername=localStorage.getItem("username")||localStorage.getItem("loggedUser")||"";
let currentName=localStorage.getItem("name")||"";
let currentRole=localStorage.getItem("role")||"";
let currentStatus=localStorage.getItem("status")||"";


document.addEventListener("DOMContentLoaded",async function(){

checkLogin();
loadTheme();

await loadUser();

updateProfile();

loadData();

});


function checkLogin(){

const auth=
localStorage.getItem("dashboardAuth")||
sessionStorage.getItem("dashboardAuth");

if(auth!=="true"||!currentUsername){
window.location.replace("index.html");
}

}


async function loadUser(){

try{

const response=await fetch(
USER_API_URL+
"?action=getUser&username="+
encodeURIComponent(currentUsername)+
"&_="+Date.now(),
{cache:"no-store"}
);

const result=await response.json();

if(result.success&&result.user){

currentUsername=result.user.username||currentUsername;
currentName=result.user.name||"";
currentRole=result.user.role||"";
currentStatus=result.user.status||"";

localStorage.setItem("username",currentUsername);
localStorage.setItem("name",currentName);
localStorage.setItem("role",currentRole);
localStorage.setItem("status",currentStatus);
localStorage.setItem("userData",JSON.stringify(result.user));

/* If account was blocked/inactive while already logged in */
if(String(currentStatus).toLowerCase()!=="active"){
logout();
return;
}

}

}catch(e){
console.log(e);
}

}


function updateProfile(){

const name=currentName||currentUsername||"User";

document.getElementById("profileName").textContent=name;
document.getElementById("menuName").textContent=name;
document.getElementById("menuUsername").textContent="@"+currentUsername;
document.getElementById("menuRole").textContent="Role: "+(currentRole||"User");
document.getElementById("avatar").textContent=name.charAt(0).toUpperCase();

}


function toggleProfile(){
document.getElementById("profileMenu").classList.toggle("show");
}


document.addEventListener("click",function(e){

const p=document.querySelector(".profile");

if(p&&!p.contains(e.target)){
document.getElementById("profileMenu").classList.remove("show");
}

});


async function loadData(){

showLoader("Loading data...");

try{

const response=await fetch(
DATA_API_URL+"?action=getData&_="+Date.now(),
{cache:"no-store"}
);

const result=await response.json();

if(result.success){

allData=Array.isArray(result.data)?result.data:[];
filteredData=[...allData];
renderData();

}else{
showToast(result.message||"Could not load data.","error");
}

}catch(e){

showToast("Could not connect to Data Spreadsheet.","error");

}finally{
hideLoader();
}

}


function renderData(){

const body=document.getElementById("dataBody");
const empty=document.getElementById("emptyData");

body.innerHTML="";

document.getElementById("dataCount").textContent=
filteredData.length+(filteredData.length===1?" entry":" entries");

if(!filteredData.length){
empty.style.display="block";
return;
}

empty.style.display="none";

filteredData.forEach(function(item){

const row=document.createElement("tr");

row.innerHTML=
"<td>"+escapeHtml(item.name||"")+"</td>"+
"<td>"+escapeHtml(item.ip||"")+"</td>"+
"<td>"+escapeHtml(item.work||"")+"</td>"+
"<td>"+escapeHtml(formatDate(item.date||""))+"</td>";

body.appendChild(row);

});

}


function applyFilter(){

const search=document.getElementById("searchInput").value.trim().toLowerCase();
const from=document.getElementById("fromDate").value;
const to=document.getElementById("toDate").value;

filteredData=allData.filter(function(item){

const text=
String(item.name||"")+" "+
String(item.ip||"")+" "+
String(item.work||"");

if(search&&!text.toLowerCase().includes(search))return false;

if(from||to){

const d=parseDate(item.date);

if(!d)return false;

const value=getDateString(d);

if(from&&value<from)return false;
if(to&&value>to)return false;

}

return true;

});

renderData();

}


function clearFilter(){

document.getElementById("searchInput").value="";
document.getElementById("fromDate").value="";
document.getElementById("toDate").value="";

filteredData=[...allData];
renderData();

}


function openEntryModal(){

document.getElementById("entryName").value=currentName||currentUsername;
document.getElementById("entryDate").value=getNowDateTime();
document.getElementById("entryIP").value="";
document.getElementById("entryWork").value="";

document.getElementById("entryModal").classList.add("show");

}


async function saveEntry(){

const name=document.getElementById("entryName").value.trim();
const ip=document.getElementById("entryIP").value.trim();
const work=document.getElementById("entryWork").value.trim();

if(!ip)return showToast("Please enter IP address.","error");
if(!work)return showToast("Please enter work.","error");

showLoader("Saving entry...");

try{

const response=await fetch(DATA_API_URL,{
method:"POST",
headers:{"Content-Type":"text/plain;charset=utf-8"},
body:JSON.stringify({
action:"addEntry",
username:currentUsername,
name:name,
ip:ip,
work:work
})
});

const result=await response.json();

if(result.success){

closeModal("entryModal");
showToast("Entry saved successfully.","success");
await loadData();

}else{
showToast(result.message||"Could not save entry.","error");
}

}catch(e){
showToast("Could not save entry.","error");
}finally{
hideLoader();
}

}


// ============================================================
// USERS
// ============================================================

function openUsersModal(){

document.getElementById("usersModal").classList.add("show");
document.getElementById("userSearch").value="";
loadUsers();

}


async function loadUsers(){

showLoader("Loading users...");

try{

const response=await fetch(
USER_API_URL+
"?action=getUsers&requester="+
encodeURIComponent(currentUsername)+
"&_="+Date.now(),
{cache:"no-store"}
);

const result=await response.json();

if(result.success){

allUsers=Array.isArray(result.users)?result.users:[];
renderUsers();

}else{

allUsers=[];
renderUsers();

showToast(result.message||"Could not load users.","error");

}

}catch(e){

showToast("Could not load users.","error");

}finally{

hideLoader();

}

}


// ============================================================
// RENDER USERS
// ============================================================

function renderUsers(){

const body=document.getElementById("usersBody");
const empty=document.getElementById("emptyUsers");
const search=document.getElementById("userSearch").value.trim().toLowerCase();

body.innerHTML="";

const users=allUsers.filter(function(user){

if(!search)return true;

const text=
String(user.username||"")+" "+
String(user.name||"")+" "+
String(user.role||"")+" "+
String(user.status||"");

return text.toLowerCase().includes(search);

});

if(!users.length){

empty.style.display="block";
return;

}

empty.style.display="none";

users.forEach(function(user){

const index=allUsers.indexOf(user);
const status=String(user.status||"").toLowerCase();

let cls="statusInactive";

if(status==="active")cls="statusActive";
if(status==="blocked")cls="statusBlocked";

let statusButton="";
let statusText="";
let statusClass="";

if(status==="blocked"){

statusText="Unblock";
statusClass="active";

}else if(status==="active"){

statusText="Block";
statusClass="block";

}else{

statusText="Activate";
statusClass="active";

}

statusButton=
"<button class='statusBtn "+statusClass+
"' onclick='changeUserStatus("+index+")'>"+
statusText+
"</button>";

const row=document.createElement("tr");

row.innerHTML=
"<td>"+escapeHtml(user.username||"")+"</td>"+
"<td>"+escapeHtml(user.name||"")+"</td>"+
"<td>"+escapeHtml(user.role||"")+"</td>"+
"<td><span class='status "+cls+"'>"+
escapeHtml(user.status||"")+
"</span></td>"+
"<td><div class='actionGroup'>"+
"<button class='editBtn' onclick='editUser("+index+")'>Edit</button>"+
statusButton+
"</div></td>";

body.appendChild(row);

});

}


// ============================================================
// BLOCK / UNBLOCK
// ============================================================

async function changeUserStatus(index){

const user=allUsers[index];

if(!user)return;

const oldStatus=String(user.status||"").toLowerCase();

let newStatus="Active";

if(oldStatus==="active"){
newStatus="Blocked";
}else{
newStatus="Active";
}

showLoader(
newStatus==="Blocked"
?"Blocking user..."
:"Activating user..."
);

try{

const response=await fetch(USER_API_URL,{
method:"POST",
headers:{
"Content-Type":"text/plain;charset=utf-8"
},
body:JSON.stringify({

action:"toggleUserStatus",

requester:currentUsername,

username:user.username,

status:newStatus

})
});

const result=await response.json();

if(result.success){

showToast(
newStatus==="Blocked"
?"User blocked successfully."
:"User activated successfully.",
"success"
);

await loadUsers();

}else{

showToast(
result.message||"Could not change user status.",
"error"
);

}

}catch(e){

console.log(e);

showToast(
"Could not change user status.",
"error"
);

}finally{

hideLoader();

}

}

document.getElementById("userFormTitle").textContent="Add User";
document.getElementById("formUsername").value="";
document.getElementById("formPassword").value="";
document.getElementById("formName").value="";

// ============================================================
// EDIT USER
// ============================================================

function editUser(index){

const user=allUsers[index];

if(!user){
showToast("User not found.","error");
return;
}

editingUser=true;

document.getElementById("userFormTitle").textContent="Edit User";
document.getElementById("formUsername").value=user.username||"";
document.getElementById("formPassword").value="";
document.getElementById("formName").value=user.name||"";

document.getElementById("originalUsername").value=user.username||"";

// ============================================================
// SAVE USER
// ============================================================

async function saveUser(){

const username=document.getElementById("formUsername").value.trim();
const password=document.getElementById("formPassword").value;
const name=document.getElementById("formName").value.trim();
const role=document.getElementById("formRole").value;
const status=document.getElementById("formStatus").value;
const originalUsername=document.getElementById("originalUsername").value.trim();

if(!username)return showToast("Username is required.","error");
if(!name)return showToast("Name is required.","error");

if(!editingUser&&!password){
return showToast("Password is required.","error");
}

if(password&&password.length<4){
return showToast("Password must be at least 4 characters.","error");
}

showLoader(editingUser?"Updating user...":"Adding user...");

try{

const data={
action:editingUser?"editUser":"addUser",
requester:currentUsername,
username:username,
password:password,
name:name,
role:role,
status:status
};

if(editingUser){
data.originalUsername=originalUsername;
}

const response=await fetch(USER_API_URL,{
method:"POST",
headers:{"Content-Type":"text/plain;charset=utf-8"},
body:JSON.stringify(data)
});

const result=await response.json();

if(result.success){

closeModal("userFormModal");

showToast(
editingUser
?"User updated successfully."
:"User added successfully.",
"success"
);

await loadUsers();

if(
editingUser&&
originalUsername.toLowerCase()===currentUsername.toLowerCase()
){
await loadUser();
updateProfile();
}

}else{

showToast(result.message||"User operation failed.","error");

}

}catch(e){

showToast("User operation failed.","error");

}finally{

hideLoader();

}

}


// ============================================================
// PASSWORD
// ============================================================

function openPasswordModal(){

document.getElementById("profileMenu").classList.remove("show");

document.getElementById("currentPassword").value="";
document.getElementById("newPassword").value="";
document.getElementById("confirmPassword").value="";

document.getElementById("passwordModal").classList.add("show");

}


async function changePassword(){

const currentPassword=document.getElementById("currentPassword").value;
const newPassword=document.getElementById("newPassword").value;
const confirmPassword=document.getElementById("confirmPassword").value;

if(!currentPassword)return showToast("Enter current password.","error");
if(newPassword.length<4)return showToast("New password must be at least 4 characters.","error");
if(newPassword!==confirmPassword)return showToast("Passwords do not match.","error");

showLoader("Changing password...");

try{

const response=await fetch(USER_API_URL,{
method:"POST",
headers:{"Content-Type":"text/plain;charset=utf-8"},
body:JSON.stringify({
action:"changePassword",
username:currentUsername,
currentPassword:currentPassword,
newPassword:newPassword
})
});

const result=await response.json();

if(result.success){

closeModal("passwordModal");
showToast("Password changed successfully.","success");

}else{

showToast(result.message||"Password change failed.","error");

}

}catch(e){

showToast("Password change failed.","error");

}finally{

hideLoader();

}

}


// ============================================================
// LOGOUT
// ============================================================

function logout(){

[
"dashboardAuth","username","name","role","status",
"userData","loginData","loggedUser","currentUser","userInfo"
].forEach(function(key){
localStorage.removeItem(key);
});

sessionStorage.removeItem("dashboardAuth");

window.location.replace("index.html");

}


// ============================================================
// MODAL
// ============================================================

function closeModal(id){
document.getElementById(id).classList.remove("show");
}

document.addEventListener("click",function(e){

if(e.target.classList.contains("modal")){
e.target.classList.remove("show");
}

});

document.addEventListener("keydown",function(e){

if(e.key==="Escape"){
document.querySelectorAll(".modal.show").forEach(function(m){
m.classList.remove("show");
});
}

});


// ============================================================
// THEME
// ============================================================

function loadTheme(){

const theme=localStorage.getItem("dashboardTheme");

if(theme==="dark"){
document.body.classList.add("dark");
document.getElementById("themeButton").textContent="☀";
}else{
document.body.classList.remove("dark");
document.getElementById("themeButton").textContent="☾";
}

}


function toggleTheme(){

document.body.classList.toggle("dark");

const dark=document.body.classList.contains("dark");

localStorage.setItem(
"dashboardTheme",
dark?"dark":"light"
);

document.getElementById("themeButton").textContent=
dark?"☀":"☾";

}


// ============================================================
// LOADER / TOAST
// ============================================================

function showLoader(text){

document.getElementById("loaderText").textContent=text||"Loading...";
document.getElementById("loader").classList.add("show");

}

function hideLoader(){
document.getElementById("loader").classList.remove("show");
}

let toastTimer;

function showToast(message,type){

const toast=document.getElementById("toast");

toast.textContent=message;
toast.className="toast show "+(type||"info");

clearTimeout(toastTimer);

toastTimer=setTimeout(function(){
toast.classList.remove("show");
},3000);

}


// ============================================================
// DATE
// ============================================================

function getNowDateTime(){

const d=new Date();
const p=n=>String(n).padStart(2,"0");

return d.getFullYear()+"-"+
p(d.getMonth()+1)+"-"+
p(d.getDate())+" "+
p(d.getHours())+":"+
p(d.getMinutes())+":"+
p(d.getSeconds());

}


function parseDate(value){

if(!value)return null;

const d=new Date(value);

if(!isNaN(d.getTime()))return d;

return null;

}


function getDateString(date){

const p=n=>String(n).padStart(2,"0");

return date.getFullYear()+"-"+
p(date.getMonth()+1)+"-"+
p(date.getDate());

}


function formatDate(value){

const d=parseDate(value);

if(!d)return String(value||"");

const p=n=>String(n).padStart(2,"0");

return d.getFullYear()+"-"+
p(d.getMonth()+1)+"-"+
p(d.getDate())+" "+
p(d.getHours())+":"+
p(d.getMinutes())+":"+
p(d.getSeconds());

}


// ============================================================
// ESCAPE
// ============================================================

function escapeHtml(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

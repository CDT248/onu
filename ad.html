<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Data Dashboard</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

:root{
  --bg:#f4f7f6;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#e5e7eb;
  --input:#ffffff;
  --thead:#f8fafc;
  --hover:#fafafa;
  --green:#087f5b;
  --green-dark:#066b4d;
  --blue:#2563eb;
  --red:#dc2626;
  --orange:#d97706;
  --shadow:rgba(0,0,0,.20);
}

body.dark{
  --bg:#111827;
  --card:#1f2937;
  --text:#f9fafb;
  --muted:#9ca3af;
  --border:#374151;
  --input:#111827;
  --thead:#172033;
  --hover:#263244;
  --shadow:rgba(0,0,0,.50);
}

body{
  background:var(--bg);
  color:var(--text);
  transition:.25s;
}


/* =====================================================
HEADER
===================================================== */

.header{
  width:100%;
  min-height:70px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:22px;
  font-weight:700;
  color:var(--green);
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}


/* =====================================================
BUTTON
===================================================== */

button{
  border:none;
  cursor:pointer;
  transition:.2s;
}

button:disabled{
  cursor:not-allowed;
  opacity:.5;
}

.btn{
  padding:11px 17px;
  border-radius:8px;
  font-size:14px;
  font-weight:600;
}

.btn-primary{
  background:var(--green);
  color:#fff;
}

.btn-primary:hover{
  background:var(--green-dark);
}

.btn-refresh,
.theme-btn,
.btn-cancel{
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
}

.btn-refresh:hover,
.theme-btn:hover,
.btn-cancel:hover{
  background:var(--hover);
}

.theme-btn{
  height:42px;
  padding:0 14px;
  border-radius:8px;
  font-size:13px;
  font-weight:600;
}


/* =====================================================
USER BUTTON
===================================================== */

.btn-users{
  background:#eef2ff;
  color:#4f46e5;
  border:1px solid #c7d2fe;
}

.btn-users:hover{
  background:#e0e7ff;
}


/* =====================================================
MAIN
===================================================== */

.container{
  width:100%;
  max-width:1500px;
  margin:auto;
  padding:25px;
}

.top-section{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.title h1{
  font-size:27px;
  margin-bottom:5px;
}

.title p{
  color:var(--muted);
  font-size:14px;
}


/* =====================================================
FILTER
===================================================== */

.filter-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
  margin-bottom:20px;
}

.filters{
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto;
  gap:12px;
  align-items:end;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-size:12px;
  font-weight:600;
  color:var(--muted);
}

.field input{
  width:100%;
  height:42px;
  border:1px solid var(--border);
  border-radius:8px;
  padding:0 12px;
  outline:none;
  background:var(--input);
  color:var(--text);
  font-size:14px;
}

.field input:focus{
  border-color:var(--green);
}


/* =====================================================
TABLE
===================================================== */

.table-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.table-header{
  padding:16px 18px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.table-header h2{
  font-size:17px;
}

.total-count{
  font-size:13px;
  color:var(--muted);
}

.table-wrapper{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th{
  background:var(--thead);
  padding:14px;
  text-align:left;
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
  border-bottom:1px solid var(--border);
}

td{
  padding:14px;
  border-bottom:1px solid var(--border);
  font-size:13px;
  white-space:nowrap;
}

tr:hover td{
  background:var(--hover);
}

.date-cell{
  color:var(--muted);
  font-weight:500;
}


/* =====================================================
ACTIONS
===================================================== */

.actions{
  display:flex;
  gap:7px;
  align-items:center;
}

.btn-edit,
.btn-delete,
.btn-sell{
  padding:7px 11px;
  border-radius:6px;
  font-size:13px;
  font-weight:600;
}

.btn-edit{
  background:#e8f1ff;
  color:#2563eb;
}

.btn-edit:hover{
  background:#dbeafe;
}

.btn-delete{
  background:#fee2e2;
  color:#dc2626;
}

.btn-delete:hover{
  background:#fecaca;
}

.btn-sell{
  background:#fff7ed;
  color:#d97706;
}

.btn-sell:hover{
  background:#ffedd5;
}


/* =====================================================
PAGINATION
===================================================== */

.pagination-box{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 18px;
  border-top:1px solid var(--border);
}

.page-info{
  font-size:13px;
  color:var(--muted);
}

.pagination{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.page-btn{
  min-width:35px;
  height:35px;
  border:1px solid var(--border);
  background:var(--input);
  color:var(--text);
  border-radius:6px;
  font-size:13px;
}

.page-btn:hover{
  background:var(--hover);
}

.page-btn.active{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}


/* =====================================================
MODAL
===================================================== */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  justify-content:center;
  align-items:center;
  padding:20px;
  z-index:999;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:700px;
  max-height:95vh;
  overflow-y:auto;
  background:var(--card);
  color:var(--text);
  border-radius:16px;
  box-shadow:0 20px 60px var(--shadow);
}

.modal-header{
  padding:20px 24px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  background:var(--card);
  z-index:2;
}

.modal-header h2{
  font-size:20px;
}

.close-btn{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--input);
  border:1px solid var(--border);
  font-size:22px;
  color:var(--text);
}

.close-btn:hover{
  background:var(--hover);
}


/* =====================================================
FORM
===================================================== */

.form{
  padding:30px 25px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px 18px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.form-group.full{
  grid-column:1 / -1;
}

.form-group label{
  font-size:13px;
  font-weight:600;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid var(--border);
  border-radius:9px;
  padding:13px 14px;
  outline:none;
  font-size:14px;
  background:var(--input);
  color:var(--text);
}

.form-group input,
.form-group select{
  height:48px;
}

.form-group textarea{
  min-height:150px;
  resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
  border-color:var(--green);
}

.form-footer{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  padding-top:30px;
}


/* =====================================================
LOADING
===================================================== */

.loading{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

.empty{
  text-align:center;
  padding:55px 20px;
  color:var(--muted);
}


/* =====================================================
TOAST
===================================================== */

.toast{
  position:fixed;
  right:25px;
  bottom:25px;
  min-width:260px;
  padding:14px 17px;
  border-radius:9px;
  color:#fff;
  background:#111827;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  transform:translateY(100px);
  opacity:0;
  transition:.3s;
  z-index:2000;
  font-size:14px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.toast.success{
  background:#087f5b;
}

.toast.error{
  background:#dc2626;
}


/* =====================================================
USER MODAL
===================================================== */

.user-modal-box{
  max-width:1050px;
}

.user-toolbar{
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--border);
}

.user-search{
  flex:1;
  max-width:450px;
}

.user-search input{
  width:100%;
  height:42px;
  border:1px solid var(--border);
  border-radius:8px;
  padding:0 13px;
  outline:none;
  background:var(--input);
  color:var(--text);
}

.user-search input:focus{
  border-color:var(--green);
}

.user-table-wrapper{
  width:100%;
  overflow-x:auto;
  padding:0 24px 20px;
}

.user-table{
  min-width:700px;
}

.user-table th,
.user-table td{
  padding:13px 12px;
}

.user-status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
}

.user-status.active{
  background:#dcfce7;
  color:#15803d;
}

.user-status.blocked{
  background:#fee2e2;
  color:#dc2626;
}

.user-status.inactive{
  background:#fef3c7;
  color:#b45309;
}

.user-action{
  padding:7px 10px;
  border-radius:6px;
  font-size:12px;
  font-weight:700;
  margin-right:4px;
}

.user-edit-btn{
  background:#e8f1ff;
  color:#2563eb;
}

.user-toggle-btn{
  background:#fff7ed;
  color:#d97706;
}

.user-delete-btn{
  background:#fee2e2;
  color:#dc2626;
}

.user-edit-btn:hover{
  background:#dbeafe;
}

.user-toggle-btn:hover{
  background:#ffedd5;
}

.user-delete-btn:hover{
  background:#fecaca;
}

.user-empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}


/* =====================================================
USER FORM MODAL
===================================================== */

.user-form-modal{
  z-index:1200;
}

.user-form-box{
  max-width:650px;
}


/* =====================================================
MOBILE
===================================================== */

@media(max-width:900px){

  .filters{
    grid-template-columns:1fr 1fr;
  }

  .search-field{
    grid-column:1 / -1;
  }

  .top-section{
    align-items:flex-start;
    flex-direction:column;
  }

}

@media(max-width:600px){

  .header{
    min-height:70px;
    padding:12px 15px;
    gap:10px;
    flex-wrap:wrap;
  }

  .logo{
    font-size:18px;
  }

  .header-right{
    gap:6px;
    width:100%;
    justify-content:flex-end;
    flex-wrap:wrap;
  }

  .header-right .btn,
  .theme-btn{
    padding:9px 10px;
    font-size:12px;
    height:38px;
  }

  .container{
    padding:15px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .search-field{
    grid-column:auto;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .form{
    padding:25px 18px;
  }

  .modal{
    padding:10px;
  }

  .modal-box{
    max-height:96vh;
    border-radius:13px;
  }

  .pagination-box{
    flex-direction:column;
    gap:12px;
  }

  .toast{
    left:15px;
    right:15px;
    min-width:auto;
  }

  .user-toolbar{
    flex-direction:column;
    align-items:stretch;
    padding:15px;
  }

  .user-search{
    max-width:none;
  }

  .user-table-wrapper{
    padding:0 15px 15px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
HEADER
===================================================== -->

<header class="header">

  <div class="logo">
    DATA DASHBOARD
  </div>

  <div class="header-right">

    <button
      class="theme-btn"
      id="themeBtn"
      onclick="toggleTheme()"
    >
      🌙 Dark
    </button>

    <button
      class="btn btn-refresh"
      id="refreshBtn"
      onclick="loadData()"
    >
      🔄 Refresh
    </button>

    <!-- USER BUTTON -->
    <button
      class="btn btn-users"
      onclick="openUserModal()"
    >
      👤 Users
    </button>

    <button
      class="btn btn-primary"
      onclick="openEntryModal()"
    >
      ➕ New Entry
    </button>

  </div>

</header>


<!-- =====================================================
MAIN
===================================================== -->

<main class="container">

  <div class="top-section">

    <div class="title">

      <h1>
        Data Dashboard
      </h1>

      <p>
        Manage your entries
      </p>

    </div>

  </div>


  <!-- ===================================================
  FILTER
  ==================================================== -->

  <section class="filter-box">

    <div class="filters">

      <div class="field search-field">

        <label>
          🔍 Search
        </label>

        <input
          type="text"
          id="searchInput"
          placeholder="Search Name, IP or Work..."
          oninput="applyFilters()"
        >

      </div>


      <div class="field">

        <label>
          📅 From Date
        </label>

        <input
          type="date"
          id="fromDate"
          onchange="applyFilters()"
        >

      </div>


      <div class="field">

        <label>
          📅 To Date
        </label>

        <input
          type="date"
          id="toDate"
          onchange="applyFilters()"
        >

      </div>


      <button
        class="btn btn-refresh"
        onclick="clearFilters()"
      >
        Clear
      </button>

    </div>

  </section>


  <!-- ===================================================
  TABLE
  ==================================================== -->

  <section class="table-box">

    <div class="table-header">

      <h2>
        All Entries
      </h2>

      <div class="total-count">

        Total:
        <strong id="totalCount">
          0
        </strong>

      </div>

    </div>


    <div class="table-wrapper">

      <table>

        <thead>

          <tr>

            <th>Name</th>

            <th>IP</th>

            <th>Work</th>

            <th>Date</th>

            <th>Action</th>

          </tr>

        </thead>


        <tbody id="tableBody">

          <tr>

            <td colspan="5">

              <div class="loading">
                Loading data...
              </div>

            </td>

          </tr>

        </tbody>

      </table>

    </div>


    <div class="pagination-box">

      <div
        class="page-info"
        id="pageInfo"
      >
        Page 1
      </div>

      <div
        class="pagination"
        id="pagination"
      ></div>

    </div>

  </section>

</main>


<!-- =====================================================
ENTRY MODAL
===================================================== -->

<div
  class="modal"
  id="entryModal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2 id="modalTitle">
        New Entry
      </h2>

      <button
        class="close-btn"
        onclick="closeEntryModal()"
      >
        ×
      </button>

    </div>


    <form
      class="form"
      id="entryForm"
      onsubmit="submitEntry(event)"
    >

      <div class="form-grid">

        <div class="form-group">

          <label>
            Name
          </label>

          <input
            type="text"
            id="nameInput"
            placeholder="Enter name"
            autocomplete="off"
            required
          >

        </div>


        <div class="form-group">

          <label>
            IP
          </label>

          <input
            type="text"
            id="ipInput"
            placeholder="Enter IP"
            autocomplete="off"
            required
          >

        </div>


        <div class="form-group full">

          <label>
            Work
          </label>

          <textarea
            id="workInput"
            placeholder="Enter work"
            required
          ></textarea>

        </div>


        <div class="form-group">

          <label>
            Date
          </label>

          <input
            type="date"
            id="dateInput"
          >

        </div>

      </div>


      <div class="form-footer">

        <button
          type="button"
          class="btn btn-cancel"
          onclick="closeEntryModal()"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="btn btn-primary"
          id="submitBtn"
        >
          Save Entry
        </button>

      </div>

    </form>

  </div>

</div>


<!-- =====================================================
USER MANAGEMENT MODAL
===================================================== -->

<div
  class="modal"
  id="userModal"
>

  <div class="modal-box user-modal-box">

    <div class="modal-header">

      <div>

        <h2>
          👤 User Management
        </h2>

      </div>

      <button
        class="close-btn"
        onclick="closeUserModal()"
      >
        ×
      </button>

    </div>


    <div class="user-toolbar">

      <div class="user-search">

        <input
          type="text"
          id="userSearchInput"
          placeholder="🔍 Search username, name or role..."
          oninput="filterUsers()"
        >

      </div>


      <button
        class="btn btn-primary"
        onclick="openAddUserModal()"
      >
        ➕ Add User
      </button>

    </div>


    <div class="user-table-wrapper">

      <table class="user-table">

        <thead>

          <tr>

            <th>Username</th>

            <th>Password</th>

            <th>Name</th>

            <th>Role</th>

            <th>Status</th>

            <th>Action</th>

          </tr>

        </thead>


        <tbody id="userTableBody">

          <tr>

            <td colspan="6">

              <div class="loading">
                ⏳ Loading users...
              </div>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>


<!-- =====================================================
ADD / EDIT USER MODAL
===================================================== -->

<div
  class="modal user-form-modal"
  id="userFormModal"
>

  <div class="modal-box user-form-box">

    <div class="modal-header">

      <h2 id="userFormTitle">
        Add User
      </h2>

      <button
        class="close-btn"
        onclick="closeUserFormModal()"
      >
        ×
      </button>

    </div>


    <form
      class="form"
      id="userForm"
      onsubmit="submitUser(event)"
    >

      <div class="form-grid">

        <div class="form-group">

          <label>
            Username
          </label>

          <input
            type="text"
            id="userUsername"
            placeholder="Enter username"
            autocomplete="off"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Password
          </label>

          <input
            type="text"
            id="userPassword"
            placeholder="Enter password"
            autocomplete="off"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Name
          </label>

          <input
            type="text"
            id="userName"
            placeholder="Enter name"
            autocomplete="off"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Role
          </label>

          <select
            id="userRole"
            required
          >

            <option value="">
              Select Role
            </option>

            <option value="admin">
              Admin
            </option>

            <option value="support">
              Support
            </option>

            <option value="call">
              Call
            </option>

            <option value="guest">
              Guest
            </option>

            <option value="manager">
              Manager
            </option>

          </select>

        </div>


        <div class="form-group">

          <label>
            Status
          </label>

          <select
            id="userStatus"
            required
          >

            <option value="Active">
              Active
            </option>

            <option value="Blocked">
              Blocked
            </option>

            <option value="Inactive">
              Inactive
            </option>

          </select>

        </div>

      </div>


      <div class="form-footer">

        <button
          type="button"
          class="btn btn-cancel"
          onclick="closeUserFormModal()"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="btn btn-primary"
          id="userSubmitBtn"
        >
          Add User
        </button>

      </div>

    </form>

  </div>

</div>


<!-- =====================================================
TOAST
===================================================== -->

<div
  class="toast"
  id="toast"
></div>


<script>


/* =====================================================
DATA API
===================================================== */

/* =====================================================
GET LOGGED-IN USERNAME
===================================================== */

function getLoggedInUsername(){

  const possibleKeys = [

    "username",
    "Username",
    "user",
    "userData",
    "loginData",
    "loggedUser",
    "currentUser",
    "userInfo"

  ];


  for(
    let i = 0;
    i < possibleKeys.length;
    i++
  ){

    const key =
      possibleKeys[i];

    const value =
      localStorage.getItem(key);


    if(!value){
      continue;
    }


    try{

      const parsed =
        JSON.parse(value);


      if(
        typeof parsed === "object" &&
        parsed !== null
      ){

        const username =
          parsed.username ||
          parsed.Username ||
          parsed.userName ||
          parsed.name ||
          parsed.user;


        if(username){

          return String(
            username
          ).trim();

        }

      }

    }catch(error){

      return String(
        value
      ).trim();

    }

  }


  return "";

}

/* =====================================================
AUTO LOGOUT
===================================================== */

const INACTIVITY_LIMIT =
  5 * 60 * 1000;

let inactivityTimer = null;


function resetInactivityTimer(){

  clearTimeout(
    inactivityTimer
  );


  inactivityTimer =
    setTimeout(
      autoLogout,
      INACTIVITY_LIMIT
    );

}


function autoLogout(){

  clearTimeout(
    inactivityTimer
  );


  localStorage.removeItem("username");
  localStorage.removeItem("user");
  localStorage.removeItem("userData");
  localStorage.removeItem("loginData");
  localStorage.removeItem("token");
  localStorage.removeItem("authToken");
  localStorage.removeItem("session");
  localStorage.removeItem("loggedIn");


  sessionStorage.clear();


  window.location.replace(
    "index.html"
  );

}

/* =====================================================
LOAD DATA
===================================================== */

async function loadData(){

  const refreshBtn =
    document.getElementById(
      "refreshBtn"
    );


  refreshBtn.disabled =
    true;

  refreshBtn.textContent =
    "⏳ Loading...";


  showLoading();


  try{

    const response =
      await fetch(

        API_URL +
        "?action=getData&_=" +
        Date.now(),

        {
          method:"GET",
          cache:"no-store"
        }

      );


    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const result =
      await response.json();


    if(
      result.success === false
    ){

      throw new Error(
        result.message ||
        "Failed to load data."
      );

    }


    if(
      !Array.isArray(
        result.data
      )
    ){

      throw new Error(
        "Invalid data received."
      );

    }


    allData =
      result.data;


    filteredData =
      [...allData];


    currentPage =
      1;


    renderTable();

    updateTotal();


  }catch(error){

    console.error(
      "Load Error:",
      error
    );


    showError(
      error.message ||
      "Failed to load data."
    );


    showToast(
      error.message ||
      "Data loading failed.",
      "error"
    );


  }finally{

    refreshBtn.disabled =
      false;

    refreshBtn.textContent =
      "🔄 Refresh";

  }

}


/* =====================================================

===================================================== */

function renderTable(){

  const tbody =
    document.getElementById(
      "tableBody"
    );


  if(
    filteredData.length === 0
  ){

    tbody.innerHTML = `

      <tr>

        <td colspan="5">

          <div class="empty">
            No data found.
          </div>

        </td>

      </tr>

    `;


    renderPagination();

    return;

  }


  const start =
    (
      currentPage - 1
    ) *
    ROWS_PER_PAGE;


  const end =
    start +
    ROWS_PER_PAGE;


  const pageData =
    filteredData.slice(
      start,
      end
    );


  let html = "";


  pageData.forEach(
    function(row){

      const rowNumber =
        Number(
          row._row
        );


      html += `

        <tr>

          <td>
            ${escapeHTML(
              row.Name || ""
            )}
          </td>

          <td>
            ${escapeHTML(
              row.Ip || ""
            )}
          </td>

          <td>
            ${escapeHTML(
              row.Work || ""
            )}
          </td>

          <td class="date-cell">
            ${escapeHTML(
              row.Date || ""
            )}
          </td>

          <td>

            <div class="actions">

              <button
                class="btn-edit"
                onclick="editEntryByRow(${rowNumber})"
              >
                ✏️ Edit
              </button>


              <button
                class="btn-delete"
                onclick="deleteEntryByRow(${rowNumber})"
              >
                🗑️ Delete
              </button>


              <button
                class="btn-sell"
                onclick="sellEntryByRow(${rowNumber})"
              >
                💰 Sell
              </button>

            </div>

          </td>

        </tr>

      `;

    }
  );


  tbody.innerHTML =
    html;


  renderPagination();

}


/* =====================================================
FILTER
===================================================== */

function applyFilters(){

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  const fromDate =
    document.getElementById(
      "fromDate"
    ).value;


  const toDate =
    document.getElementById(
      "toDate"
    ).value;


  filteredData =
    allData.filter(
      function(row){

        if(search){

          const searchText = (

            String(row.Name || "") +
            " " +
            String(row.Ip || "") +
            " " +
            String(row.Work || "") +
            " " +
            String(row.Date || "")

          ).toLowerCase();


          if(
            !searchText.includes(
              search
            )
          ){

            return false;

          }

        }


        if(
          fromDate ||
          toDate
        ){

          const rowDate =
            convertToFilterDate(
              row.Date
            );


          if(!rowDate){
            return false;
          }


          if(
            fromDate &&
            rowDate < fromDate
          ){

            return false;

          }


          if(
            toDate &&
            rowDate > toDate
          ){

            return false;

          }

        }


        return true;

      }
    );


  currentPage =
    1;


  renderTable();

  updateTotal();

}

/* =====================================================
DATE
===================================================== */

function convertToFilterDate(value){

  if(!value){
    return "";
  }


  const text =
    String(value).trim();


  const parsed =
    new Date(text);


  if(
    !isNaN(
      parsed.getTime()
    )
  ){

    const year =
      parsed.getFullYear();

    const month =
      String(
        parsed.getMonth() + 1
      ).padStart(2,"0");

    const day =
      String(
        parsed.getDate()
      ).padStart(2,"0");


    return (
      year +
      "-" +
      month +
      "-" +
      day
    );

  }


  const match =
    text.match(
      /^(\d{2})-(\d{2})-(\d{4})$/
    );


  if(match){

    return (
      match[3] +
      "-" +
      match[2] +
      "-" +
      match[1]
    );

  }


  return "";

}


/* =====================================================
PAGINATION
===================================================== */

function renderPagination(){

  const pagination =
    document.getElementById(
      "pagination"
    );


  const pageInfo =
    document.getElementById(
      "pageInfo"
    );


  const totalPages =
    Math.ceil(
      filteredData.length /
      ROWS_PER_PAGE
    );


  if(
    totalPages <= 1
  ){

    pagination.innerHTML =
      "";

    pageInfo.textContent =
      filteredData.length
        ? "Page 1"
        : "Page 0";

    return;

  }


  let html = "";


  html += `

    <button
      class="page-btn"
      onclick="changePage(${currentPage - 1})"
      ${currentPage === 1 ? "disabled" : ""}
    >
      ‹
    </button>

  `;


  let startPage =
    Math.max(
      1,
      currentPage - 2
    );


  let endPage =
    Math.min(
      totalPages,
      currentPage + 2
    );


  for(
    let i = startPage;
    i <= endPage;
    i++
  ){

    html += `

      <button
        class="page-btn ${
          i === currentPage
            ? "active"
            : ""
        }"
        onclick="changePage(${i})"
      >
        ${i}
      </button>

    `;

  }


  html += `

    <button
      class="page-btn"
      onclick="changePage(${currentPage + 1})"
      ${currentPage === totalPages ? "disabled" : ""}
    >
      ›
    </button>

  `;


  pagination.innerHTML =
    html;


  pageInfo.textContent =
    `Page ${currentPage} of ${totalPages}`;

}


function changePage(page){

  const totalPages =
    Math.ceil(
      filteredData.length /
      ROWS_PER_PAGE
    );


  if(
    page < 1 ||
    page > totalPages
  ){

    return;

  }


  currentPage =
    page;


  renderTable();

}

/* =====================================================
CREATE / UPDATE ENTRY
===================================================== */

async function submitEntry(event){

  event.preventDefault();


  const submitBtn =
    document.getElementById(
      "submitBtn"
    );


  const name =
    document.getElementById(
      "nameInput"
    ).value.trim();


  const ip =
    document.getElementById(
      "ipInput"
    ).value.trim();


  const work =
    document.getElementById(
      "workInput"
    ).value.trim();


  const date =
    document.getElementById(
      "dateInput"
    ).value;


  if(!name){

    showToast(
      "Please enter Name.",
      "error"
    );

    return;

  }


  if(!ip){

    showToast(
      "Please enter IP.",
      "error"
    );

    return;

  }


  if(!work){

    showToast(
      "Please enter Work.",
      "error"
    );

    return;

  }


  const wasEditing =
    Boolean(
      editingRow
    );


  submitBtn.disabled =
    true;


  submitBtn.textContent =
    wasEditing
      ? "Updating..."
      : "Saving...";


  try{

    const payload = {

      action:
        wasEditing
          ? "update"
          : "create",

      data:{
        Name:name,
        Ip:ip,
        Work:work,
        Date:date
      },

      oldData:
        editingRow || null

    };


    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const result =
      await response.json();


    if(
      result.success === false
    ){

      throw new Error(
        result.message ||
        "Save failed."
      );

    }


    closeEntryModal();


    showToast(
      wasEditing
        ? "Entry updated successfully."
        : "Entry added successfully.",
      "success"
    );


    await loadData();


  }catch(error){

    console.error(
      "Save Error:",
      error
    );


    showToast(
      error.message ||
      "Failed to save entry.",
      "error"
    );

  }finally{

    submitBtn.disabled =
      false;


    submitBtn.textContent =
      wasEditing
        ? "Update Entry"
        : "Save Entry";

  }

}

/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}

RENDER USERS
===================================================== */

function renderUsers(){

  const tbody =
    document.getElementById(
      "userTableBody"
    );


  if(
    filteredUsers.length === 0
  ){

    tbody.innerHTML = `

      <tr>

        <td colspan="6">

          <div class="user-empty">
            No users found.
          </div>

        </td>

      </tr>

    `;

    return;

  }


  let html = "";


  filteredUsers.forEach(
    function(user){

      const username =
        user.Username ||
        user.username ||
        "";


      const password =
        user.Password ||
        user.password ||
        "";


      const name =
        user.Name ||
        user.name ||
        "";


      const role =
        user.Role ||
        user.role ||
        "";


      const status =
        user.Status ||
        user.status ||
        "Inactive";


      let statusClass =
        "inactive";


      const statusLower =
        String(
          status
        ).toLowerCase();


      if(
        statusLower === "active"
      ){

        statusClass =
          "active";

      }else if(
        statusLower === "blocked"
      ){

        statusClass =
          "blocked";

      }


      html += `

        <tr>

          <td>
            <strong>
              ${escapeHTML(username)}
            </strong>
          </td>

          <td>
            ${escapeHTML(password)}
          </td>

          <td>
            ${escapeHTML(name)}
          </td>

          <td>
            ${escapeHTML(role)}
          </td>

          <td>

            <span
              class="user-status ${statusClass}"
            >
              ${statusClass === "active" ? "●" : "●"}
              ${escapeHTML(status)}
            </span>

          </td>

          <td>

            <button
              class="user-action user-edit-btn"
              onclick='editUser(${JSON.stringify(user).replace(/'/g,"&#039;")})'
            >
              ✏️ Edit
            </button>


            <button
              class="user-action user-toggle-btn"
              onclick='toggleUserStatus(${JSON.stringify(user).replace(/'/g,"&#039;")})'
            >
              ${statusLower === "active"
                ? "🚫 Block"
                : "✅ Active"}
            </button>


            <button
              class="user-action user-delete-btn"
              onclick='deleteUser(${JSON.stringify(user).replace(/'/g,"&#039;")})'
            >
              🗑️ Delete
            </button>

          </td>

        </tr>

      `;

    }
  );


  tbody.innerHTML =
    html;

}


/* =====================================================
FILTER USERS
===================================================== */

function filterUsers(){

  const search =
    document.getElementById(
      "userSearchInput"
    ).value
    .toLowerCase()
    .trim();


  if(!search){

    filteredUsers =
      [...allUsers];

    renderUsers();

    return;

  }


  filteredUsers =
    allUsers.filter(
      function(user){

        const username =
          String(
            user.Username ||
            user.username ||
            ""
          );


        const name =
          String(
            user.Name ||
            user.name ||
            ""
          );


        const role =
          String(
            user.Role ||
            user.role ||
            ""
          );


        const status =
          String(
            user.Status ||
            user.status ||
            ""
          );


        const text =
          (
            username +
            " " +
            name +
            " " +
            role +
            " " +
            status
          ).toLowerCase();


        return text.includes(
          search
        );

      }
    );


  renderUsers();

}

/* =====================================================
EDIT USER
===================================================== */

CLOSE USER FORM
===================================================== */

function closeUserFormModal(){

  document.getElementById(
    "userFormModal"
  ).classList.remove("show");

}


/* =====================================================
SUBMIT USER
===================================================== */

async function submitUser(event){

  event.preventDefault();


  const submitBtn =
    document.getElementById(
      "userSubmitBtn"
    );


  const username =
    document.getElementById(
      "userUsername"
    ).value.trim();


  const password =
    document.getElementById(
      "userPassword"
    ).value.trim();


  const name =
    document.getElementById(
      "userName"
    ).value.trim();


  const role =
    document.getElementById(
      "userRole"
    ).value;


  const status =
    document.getElementById(
      "userStatus"
    ).value;


  if(!username){

    showToast(
      "Username is required.",
      "error"
    );

    return;

  }


  if(!password){

    showToast(
      "Password is required.",
      "error"
    );

    return;

  }


  if(!name){

    showToast(
      "Name is required.",
      "error"
    );

    return;

  }


  if(!role){

    showToast(
      "Please select Role.",
      "error"
    );

    return;

  }


  const isEdit =
    Boolean(
      editingUser
    );


  submitBtn.disabled =
    true;


  submitBtn.textContent =
    isEdit
      ? "Updating..."
      : "Adding...";


  try{

    const payload = {

      action:
        isEdit
          ? "updateUser"
          : "addUser",

      data:{

        Username:username,

        Password:password,

        Name:name,

        Role:role,

        Status:status

      },

      oldData:
        editingUser || null

    };


    const response =
      await fetch(
        USER_API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const result =
      await response.json();


    if(
      result.success === false
    ){

      throw new Error(
        result.message ||
        (
          isEdit
            ? "User update failed."
            : "User add failed."
        )
      );

    }


    closeUserFormModal();


    showToast(
      isEdit
        ? "User updated successfully."
        : "User added successfully.",
      "success"
    );


    await loadUsers();


  }catch(error){

    console.error(
      "User Save Error:",
      error
    );


    showToast(
      error.message ||
      "User operation failed.",
      "error"
    );

  }finally{

    submitBtn.disabled =
      false;


    submitBtn.textContent =
      isEdit
        ? "Update User"
        : "Add User";

  }

}


/* =====================================================
TOGGLE USER STATUS
===================================================== */

async function toggleUserStatus(user){

  const username =
    user.Username ||
    user.username ||
    "";


  const currentStatus =
    user.Status ||
    user.status ||
    "Inactive";


  const newStatus =
    String(
      currentStatus
    ).toLowerCase() === "active"
      ? "Blocked"
      : "Active";


  const confirmed =
    confirm(

      newStatus === "Blocked"

        ? "Block user \"" +
          username +
          "\"?"

        : "Activate user \"" +
          username +
          "\"?"

    );


  if(!confirmed){
    return;
  }


  try{

    const payload = {

      action:"updateUser",

      data:{

        Username:
          user.Username ||
          user.username ||
          "",

        Password:
          user.Password ||
          user.password ||
          "",

        Name:
          user.Name ||
          user.name ||
          "",

        Role:
          user.Role ||
          user.role ||
          "",

        Status:newStatus

      },

      oldData:user

    };


    const response =
      await fetch(
        USER_API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const result =
      await response.json();


    if(
      result.success === false
    ){

      throw new Error(
        result.message ||
        "Status update failed."
      );

    }


    showToast(
      newStatus === "Active"
        ? "User activated successfully."
        : "User blocked successfully.",
      "success"
    );


    await loadUsers();


  }catch(error){

    console.error(
      "Status Error:",
      error
    );


    showToast(
      error.message ||
      "Status update failed.",
      "error"
    );

  }

}


/* =====================================================
DELETE USER
===================================================== */

async function deleteUser(user){

  const username =
    user.Username ||
    user.username ||
    "";


  const confirmed =
    confirm(

      "Delete this user?\n\n" +

      "Username: " +
      username +

      "\nName: " +
      (
        user.Name ||
        user.name ||
        ""
      ) +

      "\n\nThis action cannot be undone."

    );


  if(!confirmed){
    return;
  }


  try{

    const payload = {

      action:"deleteUser",

      data:{

        ...user

      }

    };


    const response =
      await fetch(
        USER_API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const result =
      await response.json();


    if(
      result.success === false
    ){

      throw new Error(
        result.message ||
        "User delete failed."
      );

    }


    showToast(
      "User deleted successfully.",
      "success"
    );


    await loadUsers();


  }catch(error){

    console.error(
      "User Delete Error:",
      error
    );


    showToast(
      error.message ||
      "Failed to delete user.",
      "error"
    );

  }

}

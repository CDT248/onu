<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Support Dashboard</title>

<link
  rel="icon"
  type="image/png"
  sizes="128x128"
  href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f4f7fb;
  color:#1f2937;
  min-height:100vh;
  transition:.3s;
}

body.dark{
  background:#111827;
  color:#f3f4f6;
}

button,
input,
select{
  font-family:inherit;
}

.header{
  width:100%;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  position:sticky;
  top:0;
  z-index:100;
}

.dark .header{
  background:#1f2937;
  border-color:#374151;
}

.logo{
  font-size:21px;
  font-weight:700;
  color:#16a34a;
  white-space:nowrap;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-green{
  background:#16a34a;
  color:#fff;
}

.btn-blue{
  background:#2563eb;
  color:#fff;
}

.btn-red{
  background:#dc2626;
  color:#fff;
}

.btn-gray{
  background:#6b7280;
  color:#fff;
}

.btn-dark{
  background:#111827;
  color:#fff;
}

.dark .btn-dark{
  background:#f3f4f6;
  color:#111827;
}

.profile{
  position:relative;
}

.profile-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:none;
  background:#16a34a;
  color:#fff;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.profile-menu{
  display:none;
  position:absolute;
  right:0;
  top:50px;
  width:180px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 8px 30px rgba(0,0,0,.15);
  overflow:hidden;
  z-index:200;
}

.dark .profile-menu{
  background:#1f2937;
}

.profile-menu.show{
  display:block;
}

.profile-menu button{
  width:100%;
  padding:12px 15px;
  border:none;
  background:transparent;
  text-align:left;
  cursor:pointer;
  color:#374151;
  font-size:14px;
}

.dark .profile-menu button{
  color:#f3f4f6;
}

.profile-menu button:hover{
  background:#f3f4f6;
}

.dark .profile-menu button:hover{
  background:#374151;
}

.container{
  width:100%;
  max-width:1500px;
  margin:auto;
  padding:20px;
}

.filter-bar{
  background:#fff;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.dark .filter-bar{
  background:#1f2937;
}

.search-box{
  flex:1;
  min-width:200px;
}

.input,
.select{
  width:100%;
  padding:10px 12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  outline:none;
  background:#fff;
  color:#111827;
}

.dark .input,
.dark .select{
  background:#111827;
  color:#fff;
  border-color:#4b5563;
}

.filter-small{
  width:160px;
}

.table-wrap{
  background:#fff;
  border-radius:12px;
  overflow:auto;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.dark .table-wrap{
  background:#1f2937;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:800px;
}

th{
  background:#16a34a;
  color:#fff;
  padding:13px 10px;
  font-size:13px;
  white-space:nowrap;
}

td{
  padding:11px 10px;
  border-bottom:1px solid #e5e7eb;
  text-align:center;
  font-size:13px;
  white-space:nowrap;
}

.dark td{
  border-color:#374151;
}

tbody tr:hover{
  background:#f0fdf4;
}

.dark tbody tr:hover{
  background:#263244;
}

.action-btn{
  border:none;
  border-radius:6px;
  padding:6px 9px;
  margin:2px;
  color:#fff;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
}

.action-edit{
  background:#2563eb;
}

.action-sell{
  background:#16a34a;
}

.action-delete{
  background:#dc2626;
}

.action-paid{
  background:#9333ea;
}

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  padding:15px;
}

.page-btn{
  border:none;
  background:#e5e7eb;
  color:#111827;
  padding:8px 12px;
  border-radius:7px;
  cursor:pointer;
}

.dark .page-btn{
  background:#374151;
  color:#fff;
}

.page-btn.active{
  background:#16a34a;
  color:#fff;
}

.empty{
  padding:30px;
  text-align:center;
  color:#6b7280;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:500;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:550px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:14px;
  padding:22px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.dark .modal-box{
  background:#1f2937;
  color:#fff;
}

.modal-title{
  font-size:20px;
  font-weight:700;
  margin-bottom:18px;
}

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

.user-table{
  width:100%;
  overflow:auto;
}

.user-table table{
  min-width:700px;
}

.loader{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:1000;
  align-items:center;
  justify-content:center;
}

.loader.show{
  display:flex;
}

.spinner{
  width:45px;
  height:45px;
  border:4px solid #ddd;
  border-top-color:#16a34a;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  min-width:250px;
  max-width:350px;
  padding:13px 16px;
  background:#111827;
  color:#fff;
  border-radius:9px;
  z-index:2000;
  display:none;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.toast.show{
  display:block;
}

.toast.success{
  background:#16a34a;
}

.toast.error{
  background:#dc2626;
}

.readonly{
  background:#f3f4f6!important;
}

.dark .readonly{
  background:#374151!important;
}

@media(max-width:700px){
  .header{
    padding:12px;
  }

  .logo{
    font-size:17px;
  }

  .container{
    padding:10px;
  }

  .filter-small{
    width:100%;
  }

  .header-actions .btn{
    padding:8px 10px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    Support Dashboard
  </div>

  <div class="header-actions">

    <button class="btn btn-gray" onclick="loadData(true)">
      Reload
    </button>

    <button class="btn btn-blue" onclick="openUsersModal()">
      Users
    </button>

    <button class="btn btn-blue" onclick="openItemsModal()">
      Items
    </button>

    <button class="btn btn-green" onclick="openNewEntryModal()">
      + New Entry
    </button>

    <button class="btn btn-dark" onclick="toggleDarkMode()">
      Theme
    </button>

    <div class="profile">
      <button class="profile-btn" onclick="toggleProfileMenu()">
        U
      </button>

      <div class="profile-menu" id="profileMenu">
        <button onclick="openPasswordModal()">
          Change Password
        </button>

        <button onclick="logout()">
          Logout
        </button>
      </div>
    </div>

  </div>
</header>


<div class="container">

  <div class="filter-bar">

    <div class="search-box">
      <input
        id="searchInput"
        class="input"
        type="text"
        placeholder="Search..."
        oninput="applyFilters()"
      >
    </div>

    <div class="filter-small">
      <input
        id="fromDate"
        class="input"
        type="date"
        onchange="applyFilters()"
      >
    </div>

    <div class="filter-small">
      <input
        id="toDate"
        class="input"
        type="date"
        onchange="applyFilters()"
      >
    </div>

    <div class="filter-small">

      <select
        class="select"
        id="dataType"
        onchange="changeDataType()"
      >
        <option value="data">Data</option>
        <option value="sell">Sell</option>
        <option value="delete">Delete</option>
        <option value="paid">Paid</option>
      </select>

    </div>

    <button
      class="btn btn-gray"
      onclick="clearOnlyFilters()"
    >
      Clear
    </button>

  </div>


  <div class="table-wrap">

    <table>

      <thead>
        <tr id="tableHeader"></tr>
      </thead>

      <tbody id="tableBody">
      </tbody>

    </table>

    <div
      class="empty"
      id="emptyMessage"
      style="display:none"
    >
      No data found
    </div>

    <div
      class="pagination"
      id="pagination"
    ></div>

  </div>

</div>


<!-- NEW ENTRY MODAL -->

<div class="modal" id="newEntryModal">

  <div class="modal-box">

    <div class="modal-title">
      New Entry
    </div>

    <div class="form-group">
      <label>IP</label>
      <input
        id="newIP"
        class="input"
        type="text"
      >
    </div>

    <div class="form-group">
      <label>Work</label>
      <input
        id="newWork"
        class="input"
        type="text"
      >
    </div>

    <div class="form-group">
      <label>Name</label>
      <input
        id="newName"
        class="input readonly"
        type="text"
        readonly
      >
    </div>

    <div class="form-group">
      <label>Date</label>
      <input
        id="newDate"
        class="input readonly"
        type="date"
        readonly
      >
    </div>

    <div class="form-group">
      <label>Item</label>

      <select
        id="newItem"
        class="select"
      >
        <option value="">Select Item</option>
      </select>

    </div>

    <div class="modal-actions">

      <button
        class="btn btn-gray"
        onclick="closeModal('newEntryModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-green"
        onclick="saveNewEntry()"
      >
        Save
      </button>

    </div>

  </div>

</div>


<!-- USERS MODAL -->

<div class="modal" id="usersModal">

  <div class="modal-box" style="max-width:1000px">

    <div class="modal-title">
      Users
    </div>

    <div style="margin-bottom:12px">

      <button
        class="btn btn-green"
        onclick="openAddUserModal()"
      >
        + Add User
      </button>

    </div>

    <div class="user-table">

      <table>

        <thead>

          <tr>
            <th>Username</th>
            <th>Name</th>
            <th>Role</th>
            <th>Status</th>
            <th>Action</th>
          </tr>

        </thead>

        <tbody id="usersBody">
        </tbody>

      </table>

    </div>

    <div class="modal-actions">

      <button
        class="btn btn-gray"
        onclick="closeModal('usersModal')"
      >
        Close
      </button>

    </div>

  </div>

</div>


<!-- ADD / EDIT USER MODAL -->

<div class="modal" id="userFormModal">

  <div class="modal-box">

    <div class="modal-title" id="userFormTitle">
      Add User
    </div>

    <input
      id="originalUsername"
      type="hidden"
    >

    <div class="form-group">
      <label>Username</label>
      <input
        id="userUsername"
        class="input"
        type="text"
      >
    </div>

    <div class="form-group">
      <label>Password</label>
      <input
        id="userPassword"
        class="input"
        type="password"
      >
    </div>

    <div class="form-group">
      <label>Name</label>
      <input
        id="userName"
        class="input"
        type="text"
      >
    </div>

    <div class="form-group">
      <label>Role</label>

      <select
        id="userRole"
        class="select"
      >
        <option value="admin">Admin</option>
        <option value="manager">Manager</option>
        <option value="support">Support</option>
        <option value="call">Call</option>
        <option value="guest">Guest</option>
      </select>

    </div>

    <div class="form-group">
      <label>Status</label>

      <select
        id="userStatus"
        class="select"
      >
        <option value="Active">Active</option>
        <option value="Block">Block</option>
      </select>

    </div>

    <div class="modal-actions">

      <button
        class="btn btn-gray"
        onclick="closeModal('userFormModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-green"
        onclick="saveUser()"
      >
        Save
      </button>

    </div>

  </div>

</div>


<!-- ITEMS MODAL -->

<div class="modal" id="itemsModal">

  <div class="modal-box">

    <div class="modal-title">
      Items
    </div>

    <div style="display:flex;gap:8px;margin-bottom:15px">

      <input
        id="newItemName"
        class="input"
        placeholder="New item"
      >

      <button
        class="btn btn-green"
        onclick="addItem()"
      >
        Add
      </button>

    </div>

    <div id="itemsList"></div>

    <div class="modal-actions">

      <button
        class="btn btn-gray"
        onclick="closeModal('itemsModal')"
      >
        Close
      </button>

    </div>

  </div>

</div>


<!-- CHANGE PASSWORD -->

<div class="modal" id="passwordModal">

  <div class="modal-box">

    <div class="modal-title">
      Change Password
    </div>

    <div class="form-group">

      <label>Current Password</label>

      <input
        id="currentPassword"
        class="input"
        type="password"
      >

    </div>

    <div class="form-group">

      <label>New Password</label>

      <input
        id="newPassword"
        class="input"
        type="password"
      >

    </div>

    <div class="modal-actions">

      <button
        class="btn btn-gray"
        onclick="closeModal('passwordModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-green"
        onclick="changePassword()"
      >
        Change
      </button>

    </div>

  </div>

</div>


<!-- LOADER -->

<div class="loader" id="loader">

  <div class="spinner"></div>

</div>


<div class="toast" id="toast"></div>


<script>

/* ============================================================
   API URL
============================================================ */

const USER_API_URL =
"https://script.google.com/macros/s/AKfycbw00GHHheuvtdQtgPURjs4PtsM48-4yaFx-_ms0ZBV5FHhnmcdbJ5DHr3Aix8JPF0kQzA/exec";

const DATA_API_URL =
"https://script.google.com/macros/s/AKfycbz59T-4CKQDbHJB_ql6OYZf18eN7XUmttp0d2FaOM5pm27yCBOWrEilqA_zMOnFq_rz/exec";

const SELL_API_URL =
"https://script.google.com/macros/s/AKfycbyiKn1MH1ZQvebSIo83bZzbbfJimmfRf9PjlPI4w1q1UliuF27gKViYM24oXakpkHuP/exec";

const PAID_API_URL =
"https://script.google.com/macros/s/AKfycb_kDEHln_Dj_0YfB421POWa2XAuN6g2PDypQtyS2arrxgPVtyZZOwAp_TKLrUnRudKng/exec";

const DELETE_API_URL =
"https://script.google.com/macros/s/AKfycbwDL1JIV7QYcH84VGiWxhUoT-wN9UfuGn0t9boYrs_FaG_ZfcVGjNmaTqSTC6ev0Ig9Kg/exec";

const ITEM_API_URL =
"https://script.google.com/macros/s/AKfycby2e7dzGE5vkS0Q-Eyl9MKLAbkkkD8f37eIVj7VuV8bPytWGOH7cwJ3w25efP7MLGshOw/exec";


/* ============================================================
   GLOBAL
============================================================ */

let currentDataType = "data";

let dataCache = null;
let sellCache = null;
let deleteCache = null;
let paidCache = null;

let allData = [];
let filteredData = [];

let currentPage = 1;
const pageSize = 20;

let usersCache = [];
let itemsCache = [];


/* ============================================================
   USER
============================================================ */

function getLoggedUser(){

  try{

    const keys = [
      "userData",
      "loginData",
      "loggedUser",
      "currentUser",
      "userInfo"
    ];

    for(const key of keys){

      const value = localStorage.getItem(key);

      if(value){

        try{

          const obj = JSON.parse(value);

          if(obj){
            return obj;
          }

        }catch(e){}

      }

    }

  }catch(e){}

  return {};

}


const loggedUser = getLoggedUser();

const loggedUsername =
  loggedUser.username ||
  loggedUser.Username ||
  localStorage.getItem("username") ||
  "";

const loggedName =
  loggedUser.name ||
  loggedUser.Name ||
  "";

document.querySelector(".profile-btn").textContent =
  (loggedName || loggedUsername || "U")
  .charAt(0)
  .toUpperCase();


/* ============================================================
   INIT
============================================================ */

window.onload = function(){

  const auth =
    sessionStorage.getItem("dashboardAuth") ||
    localStorage.getItem("dashboardAuth");

  if(!auth){

    window.location.href = "index.html";
    return;

  }

  setToday();

  updateTableHeader();

  loadData();

  loadItems();

};


/* ============================================================
   LOADER
============================================================ */

function showLoader(){
  document.getElementById("loader").classList.add("show");
}

function hideLoader(){
  document.getElementById("loader").classList.remove("show");
}


/* ============================================================
   TOAST
============================================================ */

function showToast(message,type="success"){

  const toast = document.getElementById("toast");

  toast.textContent = message;

  toast.className = "toast show " + type;

  setTimeout(()=>{

    toast.className = "toast";

  },3000);

}


/* ============================================================
   DATE
============================================================ */

function setToday(){

  const d = new Date();

  const yyyy = d.getFullYear();

  const mm =
    String(d.getMonth()+1).padStart(2,"0");

  const dd =
    String(d.getDate()).padStart(2,"0");

  document.getElementById("newDate").value =
    `${yyyy}-${mm}-${dd}`;

}


/* ============================================================
   DATA TYPE
============================================================ */

function changeDataType(){

  currentDataType =
    document.getElementById("dataType").value;

  currentPage = 1;

  updateTableHeader();

  loadData();

}


/* ============================================================
   TABLE HEADER
============================================================ */

function updateTableHeader(){

  const header =
    document.getElementById("tableHeader");

  if(currentDataType === "sell"){

    header.innerHTML = `
      <th>Name</th>
      <th>IP</th>
      <th>Work</th>
      <th>Date</th>
      <th>Item</th>
      <th>Sell Date</th>
      <th>User</th>
      <th>Action</th>
    `;

    return;

  }


  if(currentDataType === "paid"){

    header.innerHTML = `
      <th>Name</th>
      <th>IP</th>
      <th>Work</th>
      <th>Date</th>
      <th>Item</th>
      <th>Sell time</th>
      <th>User</th>
      <th>Paid time</th>
      <th>Paid User</th>
    `;

    return;

  }


  if(currentDataType === "delete"){

    header.innerHTML = `
      <th>Name</th>
      <th>IP</th>
      <th>Work</th>
      <th>Date</th>
      <th>Item</th>
      <th>Delete Time</th>
      <th>User</th>
    `;

    return;

  }


  header.innerHTML = `
    <th>Name</th>
    <th>IP</th>
    <th>Work</th>
    <th>Date</th>
    <th>Item</th>
    <th>Action</th>
  `;

}


/* ============================================================
   LOAD DATA
============================================================ */

async function loadData(force=false){

  try{

    if(!force){

      if(currentDataType === "data" && dataCache){
        allData = dataCache;
        applyFilters();
        return;
      }

      if(currentDataType === "sell" && sellCache){
        allData = sellCache;
        applyFilters();
        return;
      }

      if(currentDataType === "delete" && deleteCache){
        allData = deleteCache;
        applyFilters();
        return;
      }

      if(currentDataType === "paid" && paidCache){
        allData = paidCache;
        applyFilters();
        return;
      }

    }


    showLoader();

    let url = DATA_API_URL;
    let action = "getData";

    if(currentDataType === "sell"){

      url = SELL_API_URL;
      action = "getSellData";

    }

    else if(currentDataType === "delete"){

      url = DELETE_API_URL;
      action = "getDeletedData";

    }

    else if(currentDataType === "paid"){

      url = PAID_API_URL;
      action = "getPaidData";

    }


    const response =
      await fetch(
        url +
        "?action=" +
        encodeURIComponent(action)
      );


    const result =
      await response.json();


    let rows = [];

    if(Array.isArray(result)){
      rows = result;
    }

    else if(Array.isArray(result.data)){
      rows = result.data;
    }

    else if(Array.isArray(result.rows)){
      rows = result.rows;
    }


    allData = rows;


    if(currentDataType === "data"){
      dataCache = rows;
    }

    else if(currentDataType === "sell"){
      sellCache = rows;
    }

    else if(currentDataType === "delete"){
      deleteCache = rows;
    }

    else if(currentDataType === "paid"){
      paidCache = rows;
    }


    currentPage = 1;

    applyFilters();

  }
  catch(error){

    console.error(error);

    showToast(
      "Data load failed",
      "error"
    );

    allData = [];

    applyFilters();

  }
  finally{

    hideLoader();

  }

}


/* ============================================================
   FILTER
============================================================ */

function applyFilters(){

  const search =
    document.getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

  const from =
    document.getElementById("fromDate").value;

  const to =
    document.getElementById("toDate").value;


  filteredData =
    allData.filter(row=>{

      const text =
        JSON.stringify(row)
        .toLowerCase();


      if(search && !text.includes(search)){
        return false;
      }


      const dateValue =
        row.Date ||
        row.date ||
        row[3] ||
        "";


      if(from){

        const d =
          normalizeDate(dateValue);

        if(d && d < from){
          return false;
        }

      }


      if(to){

        const d =
          normalizeDate(dateValue);

        if(d && d > to){
          return false;
        }

      }


      return true;

    });


  currentPage = 1;

  renderData();

}


function normalizeDate(value){

  if(!value) return "";

  const str =
    String(value).trim();

  if(/^\d{4}-\d{2}-\d{2}$/.test(str)){
    return str;
  }

  const d = new Date(str);

  if(isNaN(d.getTime())){
    return "";
  }

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");

}

/* ============================================================
   PAGINATION
============================================================ */

function renderPagination(){

  const pagination =
    document.getElementById("pagination");

  pagination.innerHTML = "";


  const totalPages =
    Math.ceil(
      filteredData.length / pageSize
    );


  if(totalPages <= 1){
    return;
  }


  for(let i=1;i<=totalPages;i++){

    const button =
      document.createElement("button");

    button.className =
      "page-btn" +
      (i === currentPage ? " active" : "");

    button.textContent = i;

    button.onclick = function(){

      currentPage = i;

      renderData();

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    };


    pagination.appendChild(button);

  }

}

      option.textContent = value;

      select.appendChild(option);

    }

  });

}


async function addItem(){

  const name =
    document.getElementById("newItemName")
    .value
    .trim();


  if(!name){

    showToast(
      "Enter item name",
      "error"
    );

    return;

  }


  try{

    showLoader();


    const response =
      await fetch(
        ITEM_API_URL,
        {
          method:"POST",
          body:JSON.stringify({
            action:"addItem",
            item:name,
            Item:name
          })
        }
      );


    const result =
      await response.json();


    if(
      result.success === false ||
      result.error
    ){

      throw new Error(
        result.error || "Item add failed"
      );

    }


    document.getElementById("newItemName")
      .value = "";


    await loadItems();


    showToast(
      "Item added successfully"
    );

  }
  catch(error){

    showToast(
      error.message || "Item add failed",
      "error"
    );

  }
  finally{

    hideLoader();

  }

}


async function deleteItem(index){

  const item =
    itemsCache[index];

  const name =
    typeof item === "object"
    ? (
        item.Item ||
        item.item ||
        item.name ||
        item[0] ||
        ""
      )
    : item;


  if(!name) return;


  try{

    showLoader();


    const response =
      await fetch(
        ITEM_API_URL,
        {
          method:"POST",
          body:JSON.stringify({
            action:"deleteItem",
            item:name,
            Item:name
          })
        }
      );


    const result =
      await response.json();


    if(
      result.success === false ||
      result.error
    ){

      throw new Error(
        result.error || "Item delete failed"
      );

    }


    await loadItems();


    showToast(
      "Item deleted successfully"
    );

  }
  catch(error){

    showToast(
      error.message || "Item delete failed",
      "error"
    );

  }
  finally{

    hideLoader();

  }

}


/* ============================================================
   CHANGE PASSWORD
============================================================ */

function openPasswordModal(){

  document.getElementById("profileMenu")
    .classList.remove("show");

  document.getElementById("passwordModal")
    .classList.add("show");

}


async function changePassword(){

  const currentPassword =
    document.getElementById("currentPassword")
    .value;

  const newPassword =
    document.getElementById("newPassword")
    .value;


  if(!currentPassword || !newPassword){

    showToast(
      "Please fill all fields",
      "error"
    );

    return;

  }


  try{

    showLoader();


    const response =
      await fetch(
        USER_API_URL,
        {
          method:"POST",
          body:JSON.stringify({

            action:"changePassword",

            username:loggedUsername,

            currentPassword:currentPassword,

            newPassword:newPassword

          })
        }
      );


    const result =
      await response.json();


    if(
      result.success === false ||
      result.error
    ){

      throw new Error(
        result.error || "Password change failed"
      );

    }


    document.getElementById("currentPassword")
      .value = "";

    document.getElementById("newPassword")
      .value = "";


    closeModal("passwordModal");


    showToast(
      "Password changed successfully"
    );

  }
  catch(error){

    showToast(
      error.message || "Password change failed",
      "error"
    );

  }
  finally{

    hideLoader();

  }

}

/* ============================================================
   LOGOUT
============================================================ */

function logout(){

  sessionStorage.removeItem("dashboardAuth");

  localStorage.removeItem("dashboardAuth");

  localStorage.removeItem("username");

  localStorage.removeItem("userData");

  localStorage.removeItem("loginData");

  localStorage.removeItem("loggedUser");

  localStorage.removeItem("currentUser");

  localStorage.removeItem("userInfo");


  window.location.href =
    "index.html";

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ============================================================
   BACK BUTTON PROTECTION
============================================================ */

history.pushState(null,"",location.href);

window.addEventListener("popstate",function(){

  history.pushState(
    null,
    "",
    location.href
  );

});


/* ============================================================
   INACTIVITY LOGOUT - 5 MINUTES
============================================================ */

let inactivityTimer;

function resetInactivityTimer(){

  clearTimeout(inactivityTimer);


  inactivityTimer =
    setTimeout(function(){

      logout();

    },5 * 60 * 1000);

}


[
  "mousemove",
  "keydown",
  "click",
  "scroll",
  "touchstart"
].forEach(event=>{

  document.addEventListener(
    event,
    resetInactivityTimer,
    true
  );

});


resetInactivityTimer();

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Data Dashboard</title>

<link
  rel="icon"
  type="image/png"
  sizes="128x128"
  href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

:root{
  --bg:#f4f7f6;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#e5e7eb;
  --input:#ffffff;
  --thead:#f8fafc;
  --hover:#fafafa;
  --green:#087f5b;
  --green-dark:#066b4d;
  --blue:#2563eb;
  --red:#dc2626;
  --orange:#d97706;
  --purple:#7c3aed;
  --shadow:rgba(0,0,0,.20);
}

body.dark{
  --bg:#111827;
  --card:#1f2937;
  --text:#f9fafb;
  --muted:#9ca3af;
  --border:#374151;
  --input:#111827;
  --thead:#172033;
  --hover:#263244;
  --shadow:rgba(0,0,0,.50);
}

body{
  background:var(--bg);
  color:var(--text);
  transition:.25s;
}

button{
  border:none;
  cursor:pointer;
  transition:.2s;
}

button:disabled{
  cursor:not-allowed;
  opacity:.5;
}

.header{
  width:100%;
  min-height:70px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:22px;
  font-weight:700;
  color:var(--green);
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.btn{
  padding:11px 17px;
  border-radius:8px;
  font-size:14px;
  font-weight:600;
}

.btn-primary{
  background:var(--green);
  color:#fff;
}

.btn-primary:hover{
  background:var(--green-dark);
}

.btn-refresh,
.theme-btn,
.btn-cancel{
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
}

.btn-refresh:hover,
.theme-btn:hover,
.btn-cancel:hover{
  background:var(--hover);
}

.theme-btn{
  height:42px;
  padding:0 14px;
  border-radius:8px;
  font-size:13px;
  font-weight:600;
}

.btn-users{
  background:#7c3aed;
  color:#fff;
}

.btn-users:hover{
  background:#6d28d9;
}

.btn-logout{
  background:#dc2626;
  color:#fff;
  padding:11px 17px;
  border-radius:8px;
  font-size:14px;
  font-weight:600;
}

.btn-logout:hover{
  background:#b91c1c;
}

.container{
  width:100%;
  max-width:1500px;
  margin:auto;
  padding:25px;
}

.top-section{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.title h1{
  font-size:27px;
  margin-bottom:5px;
}

.title p{
  color:var(--muted);
  font-size:14px;
}

.filter-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
  margin-bottom:20px;
}

.filters{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr auto;
  gap:12px;
  align-items:end;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-size:12px;
  font-weight:600;
  color:var(--muted);
}

.field input,
.field select{
  width:100%;
  height:42px;
  border:1px solid var(--border);
  border-radius:8px;
  padding:0 12px;
  outline:none;
  background:var(--input);
  color:var(--text);
  font-size:14px;
}

.field input:focus,
.field select:focus{
  border-color:var(--green);
}

.section-select{
  font-weight:600;
}

.section-select.user{
  border-color:#087f5b;
}

.section-select.deleted{
  border-color:#dc2626;
}

.section-select.sell{
  border-color:#d97706;
}

.table-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.table-header{
  padding:16px 18px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.table-header h2{
  font-size:17px;
}

.total-count{
  font-size:13px;
  color:var(--muted);
}

.table-wrapper{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th{
  background:var(--thead);
  padding:14px;
  text-align:left;
  font-size:12px;
  color:var(--muted);
  white-space:nowrap;
  border-bottom:1px solid var(--border);
}

td{
  padding:14px;
  border-bottom:1px solid var(--border);
  font-size:13px;
  white-space:nowrap;
}

tr:hover td{
  background:var(--hover);
}

.date-cell{
  color:var(--muted);
  font-weight:500;
}

.actions{
  display:flex;
  gap:7px;
  align-items:center;
}

.btn-edit,
.btn-delete,
.btn-sell{
  padding:7px 11px;
  border-radius:6px;
  font-size:13px;
  font-weight:600;
}

.btn-edit{
  background:#e8f1ff;
  color:#2563eb;
}

.btn-edit:hover{
  background:#dbeafe;
}

.btn-delete{
  background:#fee2e2;
  color:#dc2626;
}

.btn-delete:hover{
  background:#fecaca;
}

.btn-sell{
  background:#fff7ed;
  color:#d97706;
}

.btn-sell:hover{
  background:#ffedd5;
}

.pagination-box{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 18px;
  border-top:1px solid var(--border);
}

.page-info{
  font-size:13px;
  color:var(--muted);
}

.pagination{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.page-btn{
  min-width:35px;
  height:35px;
  border:1px solid var(--border);
  background:var(--input);
  color:var(--text);
  border-radius:6px;
  font-size:13px;
}

.page-btn:hover{
  background:var(--hover);
}

.page-btn.active{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  justify-content:center;
  align-items:center;
  padding:20px;
  z-index:999;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:700px;
  max-height:95vh;
  overflow-y:auto;
  background:var(--card);
  color:var(--text);
  border-radius:16px;
  box-shadow:0 20px 60px var(--shadow);
}

.modal-header{
  padding:20px 24px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  background:var(--card);
  z-index:2;
}

.modal-header h2{
  font-size:20px;
}

.close-btn{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--input);
  border:1px solid var(--border);
  font-size:22px;
  color:var(--text);
}

.close-btn:hover{
  background:var(--hover);
}

.form{
  padding:30px 25px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px 18px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.form-group.full{
  grid-column:1 / -1;
}

.form-group label{
  font-size:13px;
  font-weight:600;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  border:1px solid var(--border);
  border-radius:9px;
  padding:13px 14px;
  outline:none;
  font-size:14px;
  background:var(--input);
  color:var(--text);
}

.form-group input,
.form-group select{
  height:48px;
}

.form-group textarea{
  min-height:150px;
  resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
  border-color:var(--green);
}

.form-footer{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  padding-top:30px;
}

.user-modal-box{
  max-width:1100px;
}

.user-toolbar{
  padding:16px 24px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.user-total{
  font-size:13px;
  color:var(--muted);
}

.user-table-wrapper{
  width:100%;
  overflow-x:auto;
  padding:0 20px;
}

.user-table{
  min-width:800px;
}

.user-actions{
  display:flex;
  gap:6px;
}

.user-action{
  padding:7px 10px;
  border-radius:6px;
  font-size:12px;
  font-weight:600;
}

.user-action.edit{
  background:#e8f1ff;
  color:#2563eb;
}

.user-action.block{
  background:#fff7ed;
  color:#d97706;
}

.user-action.unblock{
  background:#dcfce7;
  color:#15803d;
}

.user-action.delete{
  background:#fee2e2;
  color:#dc2626;
}

.status-badge,
.role-badge{
  display:inline-flex;
  align-items:center;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}

.status-active{
  background:#dcfce7;
  color:#15803d;
}

.status-blocked{
  background:#fee2e2;
  color:#dc2626;
}

.status-inactive{
  background:#f3f4f6;
  color:#6b7280;
}

.role-badge{
  background:#ede9fe;
  color:#6d28d9;
}

.loading{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

.empty{
  text-align:center;
  padding:55px 20px;
  color:var(--muted);
}

.toast{
  position:fixed;
  right:25px;
  bottom:25px;
  min-width:260px;
  padding:14px 17px;
  border-radius:9px;
  color:#fff;
  background:#111827;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  transform:translateY(100px);
  opacity:0;
  transition:.3s;
  z-index:3000;
  font-size:14px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.toast.success{
  background:#087f5b;
}

.toast.error{
  background:#dc2626;
}

@media(max-width:900px){

  .filters{
    grid-template-columns:1fr 1fr;
  }

  .search-field{
    grid-column:1 / -1;
  }

  .top-section{
    align-items:flex-start;
    flex-direction:column;
  }

}

@media(max-width:600px){

  .header{
    min-height:70px;
    padding:12px 15px;
    gap:10px;
    flex-wrap:wrap;
  }

  .logo{
    font-size:18px;
  }

  .header-right{
    gap:6px;
    width:100%;
    justify-content:flex-end;
    flex-wrap:wrap;
  }

  .header-right .btn,
  .theme-btn{
    padding:9px 10px;
    font-size:12px;
    height:38px;
  }

  .btn-logout{
    padding:9px 10px;
    font-size:12px;
  }

  .container{
    padding:15px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .search-field{
    grid-column:auto;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .form{
    padding:25px 18px;
  }

  .modal{
    padding:10px;
  }

  .modal-box{
    max-height:96vh;
    border-radius:13px;
  }

  .pagination-box{
    flex-direction:column;
    gap:12px;
  }

  .toast{
    left:15px;
    right:15px;
    min-width:auto;
  }

}

</style>

</head>

    <input
      type="date"
      id="toDate"

  <div class="field">

    <select
      id="dataType"
      class="section-select user"
      onchange="changeDataType()"

  for(const key of keys){

    const value =
      localStorage.getItem(key);

    if(!value){
      continue;
    }

    try{

      const parsed =
        JSON.parse(value);

      if(
        parsed &&
        typeof parsed === "object"
      ){

        const username =
          parsed.username ||
          parsed.Username ||
          parsed.userName ||
          parsed.name ||
          parsed.user;

        if(username){

          return String(
            username
          ).trim();

        }

      }

    }catch(error){

      return String(
        value
      ).trim();

    }

  }

  return "";

}

function resetAutoLogoutTimer(){

    inactivityTimer

  inactivityTimer =
    setTimeout(
      function(){

        autoLogout();

      },
      AUTO_LOGOUT_TIME
    );

}


function setupActivityDetection(){

  const events = [
    "click",
    "mousemove",
    "mousedown",
    "keydown",
    "scroll",
    "touchstart",
    "touchmove",
    "input"
  ];

  events.forEach(
    function(eventName){

      document.addEventListener(
        eventName,
        resetAutoLogoutTimer,
        {
          passive:true
        }
      );

    }
  );

  resetAutoLogoutTimer();

}

/* ============================================================
   MAIN DATA LOADER
============================================================ */

async function loadData(){

  const btn =
    document.getElementById(
      "refreshBtn"
    );

  btn.disabled = true;

  btn.textContent =
    "⏳ Loading...";

  showLoading();

  try{

    let action = "getData";

    if(currentDataType === "deleted"){
      action = "getDeleted";
    }

    if(currentDataType === "sell"){
      action = "getSell";
    }

    const response =
      await fetch(
        API_URL +
        "?action=" +
        encodeURIComponent(action) +
        "&_=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }

    const result =
      await response.json();

    if(result.success === false){

      throw new Error(
        result.message ||
        "Failed to load data."
      );

    }

    let data = [];

    if(Array.isArray(result.data)){

      data =
        result.data;

    }

    else if(Array.isArray(result.rows)){

      data =
        result.rows;

    }

    else if(Array.isArray(result.deleted)){

      data =
        result.deleted;

    }

    else if(Array.isArray(result.sell)){

      data =
        result.sell;

    }

    allData =
      data;

    dataCache[currentDataType] =
      [...data];

    filteredData =
      [...allData];

    currentPage = 1;

    renderTable();

    updateTotal();

  }catch(error){

    console.error(
      "Load Error:",
      error
    );

    showError(
      error.message ||
      "Failed to load data."
    );

    showToast(
      error.message ||
      "Data loading failed.",
      "error"
    );

  }finally{

    btn.disabled = false;

    btn.textContent =
      "🔄 Refresh";

  }

}

/* ============================================================
   FILTER
============================================================ */

function applyFilters(){

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();

  const fromDate =
    document.getElementById(
      "fromDate"
    ).value;

  const toDate =
    document.getElementById(
      "toDate"
    ).value;

  filteredData =
    allData.filter(
      function(row){

        if(search){

          const text =
            (
              String(
                row.Name ||
                row.name ||
                ""
              ) +
              " " +
              String(
                row.Ip ||
                row.IP ||
                row.ip ||
                ""
              ) +
              " " +
              String(
                row.Work ||
                row.work ||
                ""
              ) +
              " " +
              String(
                row.Date ||
                row.date ||
                ""
              ) +
              " " +
              String(
                row.Username ||
                row.username ||
                ""
              )
            ).toLowerCase();

          if(
            !text.includes(search)
          ){

            return false;

          }

        }

        if(
          fromDate ||
          toDate
        ){

          const rowDate =
            convertToFilterDate(
              row.Date ||
              row.date
            );

          if(!rowDate){

            return false;

          }

          if(
            fromDate &&
            rowDate < fromDate
          ){

            return false;

          }

          if(
            toDate &&
            rowDate > toDate
          ){

            return false;

          }

        }

        return true;

      }
    );

  currentPage = 1;

  renderTable();

  updateTotal();

}


function clearFilters(){

  document.getElementById(
    "searchInput"
  ).value = "";

  document.getElementById(
    "fromDate"
  ).value = "";

  document.getElementById(
    "toDate"
  ).value = "";

  filteredData =
    [...allData];

  currentPage = 1;

  renderTable();

  updateTotal();

}


function convertToFilterDate(value){

  if(!value){
    return "";
  }

  const text =
    String(value).trim();

  const parsed =
    new Date(text);

  if(
    !isNaN(
      parsed.getTime()
    )
  ){

    return (
      parsed.getFullYear() +
      "-" +
      String(
        parsed.getMonth() + 1
      ).padStart(2,"0") +
      "-" +
      String(
        parsed.getDate()
      ).padStart(2,"0")
    );

  }

  const match =
    text.match(
      /^(\d{2})-(\d{2})-(\d{4})$/
    );

  if(match){

    return (
      match[3] +
      "-" +
      match[2] +
      "-" +
      match[1]
    );

  }

  return "";

}


/* ============================================================
   PAGINATION
============================================================ */

function renderPagination(){

  const pagination =
    document.getElementById(
      "pagination"
    );

  const pageInfo =
    document.getElementById(
      "pageInfo"
    );

  const totalPages =
    Math.ceil(
      filteredData.length /
      ROWS_PER_PAGE
    );

  if(totalPages <= 1){

    pagination.innerHTML =
      "";

    pageInfo.textContent =
      filteredData.length
        ? "Page 1"
        : "Page 0";

    return;

  }

  let html = `

    <button
      class="page-btn"
      onclick="changePage(${currentPage - 1})"
      ${currentPage === 1 ? "disabled" : ""}
    >
      ‹
    </button>

  `;

  const start =
    Math.max(
      1,
      currentPage - 2
    );

  const end =
    Math.min(
      totalPages,
      currentPage + 2
    );

  for(
    let i = start;
    i <= end;
    i++
  ){

    html += `
      <button
        class="page-btn ${
          i === currentPage
            ? "active"
            : ""
        }"
        onclick="changePage(${i})"
      >
        ${i}
      </button>
    `;

  }

  html += `

    <button
      class="page-btn"
      onclick="changePage(${currentPage + 1})"
      ${
        currentPage === totalPages
          ? "disabled"
          : ""
      }
    >
      ›
    </button>

  `;

  pagination.innerHTML =
    html;

  pageInfo.textContent =
    `Page ${currentPage} of ${totalPages}`;

}


function changePage(page){

  const totalPages =
    Math.ceil(
      filteredData.length /
      ROWS_PER_PAGE
    );

  if(
    page < 1 ||
    page > totalPages
  ){

    return;

  }

  currentPage =
    page;

  renderTable();

}


function updateTotal(){

  document.getElementById(
    "totalCount"
  ).textContent =
    filteredData.length;

}

async function submitEntry(event){

  event.preventDefault();

  const btn =
    document.getElementById(
      "submitBtn"
    );

  const name =
    document.getElementById(
      "nameInput"
    ).value.trim();

  const ip =
    document.getElementById(
      "ipInput"
    ).value.trim();

  const work =
    document.getElementById(
      "workInput"
    ).value.trim();

  const date =
    document.getElementById(
      "dateInput"
    ).value;

  if(!name){

    showToast(
      "Please enter Name.",
      "error"
    );

    return;

  }

  if(!ip){

    showToast(
      "Please enter IP.",
      "error"
    );

    return;

  }

  if(!work){

    showToast(
      "Please enter Work.",
      "error"
    );

    return;

  }

  const editing =
    Boolean(editingRow);

  btn.disabled =
    true;

  btn.textContent =
    editing
      ? "Updating..."
      : "Saving...";

  try{

    const payload = {

      action:
        editing
          ? "update"
          : "create",

      data:{
        Name:name,
        Ip:ip,
        Work:work,
        Date:date
      },

      oldData:
        editingRow || null

    };

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );

    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }

    const result =
      await response.json();

    if(result.success === false){

      throw new Error(
        result.message ||
        "Save failed."
      );

    }

    closeEntryModal();

    showToast(
      editing
        ? "Entry updated successfully."
        : "Entry added successfully.",
      "success"
    );

    await loadData();

  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "Failed to save entry.",
      "error"
    );

  }finally{

    btn.disabled =
      false;

    btn.textContent =
      editing
        ? "Update Entry"
        : "Save Entry";

  }

}

          </div>
        </td>
      </tr>
    `;

    showToast(
      error.message ||
      "Failed to load users.",
      "error"
    );

  }finally{

    btn.disabled =
      false;

    btn.textContent =
      "🔄 Refresh";

  }

}


function renderUsers(){

  const body =
    document.getElementById(
      "userTableBody"
    );

  if(!allUsers.length){

    body.innerHTML = `
      <tr>
        <td colspan="6">
          <div class="empty">
            No users found.
          </div>
        </td>
      </tr>
    `;

    return;

  }

  let html = "";

  allUsers.forEach(
    function(user){

      const username =
        user.username ||
        user.Username ||
        "";

      const password =
        user.password ||
        user.Password ||
        "";

      const name =
        user.name ||
        user.Name ||
        "";

      const role =
        user.role ||
        user.Role ||
        "";

      const status =
        user.status ||
        user.Status ||
        "Active";

      const row =
        Number(
          user._row ||
          user.row ||
          0
        );

      let statusClass =
        "status-inactive";

      if(
        String(
          status
        ).toLowerCase() ===
        "active"
      ){

        statusClass =
          "status-active";

      }

      if(
        String(
          status
        ).toLowerCase() ===
        "blocked"
      ){

        statusClass =
          "status-blocked";

      }

      const safe =
        encodeURIComponent(
          username
        );

      html += `
        <tr>

          <td>
            <strong>
              ${escapeHTML(
                username
              )}
            </strong>
          </td>

          <td>
            ${escapeHTML(
              password
            )}
          </td>

          <td>
            ${escapeHTML(
              name
            )}
          </td>

          <td>

            <span class="role-badge">
              ${escapeHTML(
                role || "—"
              )}
            </span>

          </td>

          <td>

            <span
              class="status-badge ${statusClass}"
            >
              ${escapeHTML(
                status
              )}
            </span>

          </td>

          <td>

            <div class="user-actions">

              <button
                class="user-action edit"
                onclick="editUser(${row},'${safe}')"
              >
                ✏️ Edit
              </button>

              ${
                String(status).toLowerCase() ===
                "blocked"
                ?
                `
                <button
                  class="user-action unblock"
                  onclick="unblockUser(${row},'${safe}')"
                >
                  🔓 Unblock
                </button>
                `
                :
                `
                <button
                  class="user-action block"
                  onclick="blockUser(${row},'${safe}')"
                >
                  🔒 Block
                </button>
                `
              }

              <button
                class="user-action delete"
                onclick="deleteUser(${row},'${safe}')"
              >
                🗑️ Delete
              </button>

            </div>

          </td>

        </tr>
      `;

    }
  );

  body.innerHTML =
    html;

}


function openAddUserModal(){

  if(!checkLogin()){
    return;
  }

  editingUser =
    null;

  document.getElementById(
    "userFormTitle"
  ).textContent =
    "Add User";

  document.getElementById(
    "userSubmitBtn"
  ).textContent =
    "Add User";

  document.getElementById(
    "userForm"
  ).reset();

  document.getElementById(
    "userStatus"
  ).value =
    "Active";

  document.getElementById(
    "userFormModal"
  ).classList.add(
    "show"
  );

}


function editUser(
  rowNumber,
  encodedUsername
){

  if(!checkLogin()){
    return;
  }

  const username =
    decodeURIComponent(
      encodedUsername
    );

  const user =
    allUsers.find(
      function(item){

        const row =
          Number(
            item._row ||
            item.row ||
            0
          );

        const name =
          String(
            item.username ||
            item.Username ||
            ""
          );

        return (
          row === Number(
            rowNumber
          ) ||
          name.toLowerCase() ===
          username.toLowerCase()
        );

      }
    );

  if(!user){

    showToast(
      "User not found.",
      "error"
    );

    return;

  }

  editingUser =
    user;

  document.getElementById(
    "userFormTitle"
  ).textContent =
    "Edit User";

  document.getElementById(
    "userSubmitBtn"
  ).textContent =
    "Update User";

  document.getElementById(
    "userUsername"
  ).value =
    user.username ||
    user.Username ||
    "";

  document.getElementById(
    "userPassword"
  ).value =
    user.password ||
    user.Password ||
    "";

  document.getElementById(
    "userName"
  ).value =
    user.name ||
    user.Name ||
    "";

  document.getElementById(
    "userRole"
  ).value =
    user.role ||
    user.Role ||
    "";

  document.getElementById(
    "userStatus"
  ).value =
    user.status ||
    user.Status ||
    "Active";

  document.getElementById(
    "userFormModal"
  ).classList.add(
    "show"
  );

}


function closeUserFormModal(){

  document.getElementById(
    "userFormModal"
  ).classList.remove(
    "show"
  );

  editingUser =
    null;

}


/* ============================================================
   USER SUBMIT
============================================================ */

async function submitUser(event){

  event.preventDefault();

  if(!checkLogin()){
    return;
  }

  const button =
    document.getElementById(
      "userSubmitBtn"
    );

  const username =
    document.getElementById(
      "userUsername"
    ).value.trim();

  const password =
    document.getElementById(
      "userPassword"
    ).value.trim();

  const name =
    document.getElementById(
      "userName"
    ).value.trim();

  const role =
    document.getElementById(
      "userRole"
    ).value;

  const status =
    document.getElementById(
      "userStatus"
    ).value;

  if(!username){

    showToast(
      "Username is required.",
      "error"
    );

    return;

  }

  if(!password){

    showToast(
      "Password is required.",
      "error"
    );

    return;

  }

  if(!name){

    showToast(
      "Name is required.",
      "error"
    );

    return;

  }

  if(!role){

    showToast(
      "Please select Role.",
      "error"
    );

    return;

  }

  if(!status){

    showToast(
      "Please select Status.",
      "error"
    );

    return;

  }

  const editing =
    Boolean(
      editingUser
    );

  button.disabled =
    true;

  button.textContent =
    editing
      ? "Updating..."
      : "Adding...";

  try{

    const payload = {

      action:
        editing
          ? "updateUser"
          : "addUser",

      username,
      password,
      name,
      role,
      status

    };

    if(editing){

      payload.row =
        Number(
          editingUser._row ||
          editingUser.row ||
          0
        );

      payload.oldUsername =
        editingUser.username ||
        editingUser.Username ||
        "";

    }

    const response =
      await fetch(
        USER_API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );

    if(!response.ok){

      throw new Error(
        "User server error: " +
        response.status
      );

    }

    const result =
      await response.json();

    if(result.success === false){

      throw new Error(
        result.message ||
        "User operation failed."
      );

    }

    closeUserFormModal();

    showToast(
      editing
        ? "User updated successfully."
        : "User added successfully.",
      "success"
    );

    await loadUsers();

  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "Failed to save user.",
      "error"
    );

  }finally{

    button.disabled =
      false;

    button.textContent =
      editing
        ? "Update User"
        : "Add User";

  }

}


/* ============================================================
   USER BLOCK / UNBLOCK
============================================================ */

async function blockUser(
  rowNumber,
  encodedUsername
){

  if(!checkLogin()){
    return;
  }

  const username =
    decodeURIComponent(
      encodedUsername
    );

  const ok =
    confirm(
      'Block user "' +
      username +
      '"?'
    );

  if(!ok){
    return;
  }

  await changeUserStatus(
    rowNumber,
    username,
    "Blocked"
  );

}


async function unblockUser(
  rowNumber,
  encodedUsername
){

  if(!checkLogin()){
    return;
  }

  const username =
    decodeURIComponent(
      encodedUsername
    );

  await changeUserStatus(
    rowNumber,
    username,
    "Active"
  );

}


async function changeUserStatus(
  rowNumber,
  username,
  status
){

  if(!checkLogin()){
    return;
  }

  try{

    const payload = {

      action:
        status === "Blocked"
          ? "blockUser"
          : "unblockUser",

      row:Number(
        rowNumber
      ),

      username,

      status

    };

    const response =
      await fetch(
        USER_API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );

    if(!response.ok){

      throw new Error(
        "User server error: " +
        response.status
      );

    }

    const result =
      await response.json();

    if(result.success === false){

      throw new Error(
        result.message ||
        "Status update failed."
      );

    }

    showToast(
      username +
      " is now " +
      status +
      ".",
      "success"
    );

    await loadUsers();

  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "Failed to update status.",
      "error"
    );

  }

}


async function deleteUser(
  rowNumber,
  encodedUsername
){

  if(!checkLogin()){
    return;
  }

  const username =
    decodeURIComponent(
      encodedUsername
    );

  const ok =
    confirm(
      'Delete user "' +
      username +
      '"?\n\n' +
      "This action cannot be undone."
    );

  if(!ok){
    return;
  }

  try{

    const payload = {

      action:"deleteUser",

      row:Number(
        rowNumber
      ),

      username

    };

    const response =
      await fetch(
        USER_API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );

    if(!response.ok){

      throw new Error(
        "User server error: " +
        response.status
      );

    }

    const result =
      await response.json();

    if(result.success === false){

      throw new Error(
        result.message ||
        "Delete failed."
      );

    }

    showToast(
      "User deleted successfully.",
      "success"
    );

    await loadUsers();

  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "Failed to delete user.",
      "error"
    );

  }

}

function getTodayInputDate(){

  const now =
    new Date();

  return (
    now.getFullYear() +
    "-" +
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    ) +
    "-" +
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    )
  );

}

function showToast(
  message,
  type
){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.className =
    "toast show " +
    (type || "");

  setTimeout(
    function(){

      toast.className =
        "toast";

    },
    3000
  );

}


function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

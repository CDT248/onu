<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hello Animal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, #ffffff55, transparent 30%),
        linear-gradient(135deg,#5b2cff,#00bfff,#00e5a8);
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Background bubbles */
.bubble{
    position:absolute;
    border-radius:50%;
    background:#ffffff18;
    animation:float 8s infinite ease-in-out;
}

.b1{
    width:180px;
    height:180px;
    top:8%;
    left:5%;
}

.b2{
    width:250px;
    height:250px;
    bottom:-80px;
    right:5%;
    animation-delay:2s;
}

.b3{
    width:100px;
    height:100px;
    top:45%;
    right:15%;
    animation-delay:4s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-30px);
    }
}

/* Main Card */
.container{
    position:relative;
    z-index:5;
    width:90%;
    max-width:550px;
    padding:45px 25px 40px;
    text-align:center;

    background:rgba(255,255,255,0.16);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.3);
    border-radius:35px;

    box-shadow:
        0 25px 60px rgba(0,0,0,0.25);
}

/* Animal */
.animal{
    font-size:115px;
    display:inline-block;
    animation:
        animalMove 2s infinite ease-in-out,
        animalBounce 4s infinite;
    filter:drop-shadow(0 12px 10px rgba(0,0,0,.2));
    cursor:pointer;
    user-select:none;
}

@keyframes animalMove{
    0%,100%{
        transform:translateY(0) rotate(-4deg);
    }
    50%{
        transform:translateY(-18px) rotate(4deg);
    }
}

@keyframes animalBounce{
    0%,90%,100%{
        scale:1;
    }
    94%{
        scale:1.12;
    }
}

/* Hello text */
.hello{
    margin-top:10px;
    color:white;
    font-size:clamp(55px,12vw,100px);
    font-weight:900;
    letter-spacing:5px;

    text-shadow:
        0 8px 20px rgba(0,0,0,.25);

    animation:
        helloIn 1.5s ease,
        helloGlow 2.5s infinite alternate;
}

@keyframes helloIn{
    from{
        opacity:0;
        transform:scale(.5) translateY(30px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

@keyframes helloGlow{
    from{
        text-shadow:
            0 8px 20px rgba(0,0,0,.25);
    }
    to{
        text-shadow:
            0 8px 30px rgba(255,255,255,.45);
    }
}

.subtitle{
    color:#ffffffdd;
    font-size:18px;
    margin-top:5px;
    letter-spacing:1px;
}

/* Button */
.helloBtn{
    margin-top:30px;
    border:none;
    outline:none;

    padding:15px 45px;
    border-radius:50px;

    font-size:18px;
    font-weight:bold;
    color:#4b20c9;

    background:white;

    cursor:pointer;

    box-shadow:
        0 10px 25px rgba(0,0,0,.2);

    transition:.25s;
}

.helloBtn:hover{
    transform:translateY(-5px) scale(1.04);
    box-shadow:
        0 15px 35px rgba(0,0,0,.28);
}

.helloBtn:active{
    transform:scale(.95);
}

/* Animal speech */
.message{
    position:absolute;
    top:-25px;
    right:15px;

    background:white;
    color:#333;

    padding:10px 18px;
    border-radius:20px;

    font-size:14px;
    font-weight:bold;

    opacity:0;
    transform:scale(.7);

    transition:.3s;

    box-shadow:0 8px 20px #0003;
}

.message.show{
    opacity:1;
    transform:scale(1);
}

/* Mobile */
@media(max-width:500px){

    .container{
        padding:35px 18px;
        border-radius:28px;
    }

    .animal{
        font-size:90px;
    }

    .hello{
        font-size:60px;
        letter-spacing:3px;
    }

    .subtitle{
        font-size:15px;
    }

    .helloBtn{
        padding:13px 35px;
    }
}
</style>
</head>

<body>

<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>

<div class="container">

    <div class="message" id="message">
        Hello! 🐾
    </div>

    <!-- Live Animal -->
    <div class="animal" id="animal">
        🐼
    </div>

    <!-- Hello -->
    <div class="hello">
        HELLO
    </div>

    <div class="subtitle">
        Welcome to your dashboard ✨
    </div>

    <button class="helloBtn" onclick="sayHello()">
        SAY HELLO 👋
    </button>

</div>

<script>

/* Different animals automatically change */
const animals = [
    "🐼",
    "🐨",
    "🐯",
    "🦁",
    "🐰",
    "🐱",
    "🐶",
    "🦊"
];

let index = 0;

setInterval(() => {

    index++;

    if(index >= animals.length){
        index = 0;
    }

    const animal = document.getElementById("animal");

    animal.style.transform = "scale(0)";

    setTimeout(() => {
        animal.innerHTML = animals[index];
        animal.style.transform = "";
    },300);

},3000);


/* Button */
function sayHello(){

    const message = document.getElementById("message");

    message.classList.add("show");

    setTimeout(() => {
        message.classList.remove("show");
    },2000);
}


/* Click animal */
document.getElementById("animal").addEventListener("click",function(){

    this.style.animation = "none";

    setTimeout(() => {
        this.style.animation =
            "animalMove 2s infinite ease-in-out, animalBounce 4s infinite";
    },50);

    sayHello();
});

</script>

</body>
</html>

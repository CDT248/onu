<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Support Dashboard</title>

<link
  rel="icon"
  type="image/png"
  href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
  min-height:100vh;
  transition:.3s;
}

body.dark{
  background:#101522;
  color:#f5f7fb;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  height:70px;
  background:#ffffff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:100;
}

.dark .header{
  background:#171d2b;
  box-shadow:0 3px 15px rgba(0,0,0,.25);
}

.logo-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  font-size:22px;
  font-weight:bold;
}

.logo-text h2{
  font-size:19px;
}

.logo-text p{
  font-size:12px;
  color:#7b8496;
  margin-top:3px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#f0f3f8;
  font-size:18px;
  transition:.2s;
}

.icon-btn:hover{
  transform:translateY(-1px);
  background:#e4e9f2;
}

.dark .icon-btn{
  background:#252d3d;
  color:white;
}


/* =========================================================
   PROFILE
========================================================= */

.profile{
  position:relative;
}

.profile-btn{
  border:none;
  background:transparent;
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
  padding:4px;
}

.profile-avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  font-weight:bold;
}

.profile-name{
  text-align:left;
}

.profile-name strong{
  display:block;
  font-size:13px;
}

.profile-name span{
  display:block;
  color:#8a93a5;
  font-size:11px;
  margin-top:2px;
}

.profile-menu{
  position:absolute;
  right:0;
  top:52px;
  width:190px;
  background:white;
  border-radius:12px;
  box-shadow:0 12px 35px rgba(0,0,0,.15);
  padding:7px;
  display:none;
}

.profile-menu.show{
  display:block;
}

.dark .profile-menu{
  background:#1d2534;
}

.profile-menu button{
  width:100%;
  border:none;
  background:transparent;
  text-align:left;
  padding:11px 12px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
  color:inherit;
}

.profile-menu button:hover{
  background:#f1f4f9;
}

.dark .profile-menu button:hover{
  background:#293244;
}


/* =========================================================
   MAIN
========================================================= */

.container{
  max-width:1450px;
  margin:auto;
  padding:25px;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.page-title h1{
  font-size:25px;
}

.page-title p{
  color:#7b8496;
  margin-top:5px;
  font-size:13px;
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  border-radius:10px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:#2563eb;
  color:white;
}

.btn-secondary{
  background:#eef2f7;
  color:#253047;
}

.dark .btn-secondary{
  background:#252d3d;
  color:white;
}

.btn-success{
  background:#16a34a;
  color:white;
}

.btn-danger{
  background:#dc2626;
  color:white;
}

.btn-warning{
  background:#f59e0b;
  color:white;
}


/* =========================================================
   FILTER CARD
========================================================= */

.filter-card{
  background:white;
  border-radius:15px;
  padding:17px;
  box-shadow:0 4px 20px rgba(0,0,0,.06);
  margin-bottom:18px;
}

.dark .filter-card{
  background:#171d2b;
}

.filters{
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto;
  gap:10px;
}

.input,
.select{
  width:100%;
  border:1px solid #dce2eb;
  background:#fff;
  color:#172033;
  border-radius:9px;
  padding:11px 12px;
  outline:none;
  font-size:13px;
}

.input:focus,
.select:focus{
  border-color:#2563eb;
}

.dark .input,
.dark .select{
  background:#202838;
  color:white;
  border-color:#343e51;
}


/* =========================================================
   TABLE
========================================================= */

.table-card{
  background:white;
  border-radius:15px;
  box-shadow:0 4px 20px rgba(0,0,0,.06);
  overflow:hidden;
}

.dark .table-card{
  background:#171d2b;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:800px;
}

thead{
  background:#f7f9fc;
}

.dark thead{
  background:#202838;
}

th{
  text-align:left;
  padding:14px;
  font-size:12px;
  color:#687286;
  white-space:nowrap;
}

td{
  padding:14px;
  border-top:1px solid #edf0f5;
  font-size:13px;
  white-space:nowrap;
}

.dark td{
  border-color:#293243;
}

.dark th{
  color:#aeb6c6;
}

.empty{
  text-align:center;
  padding:45px;
  color:#8a93a5;
}


/* =========================================================
   MODAL
========================================================= */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(10,16,28,.62);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:500;
  padding:20px;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:560px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:17px;
  box-shadow:0 20px 70px rgba(0,0,0,.25);
  padding:22px;
}

.dark .modal{
  background:#171d2b;
}

.modal.large{
  max-width:900px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-head h3{
  font-size:19px;
}

.close{
  width:34px;
  height:34px;
  border:none;
  border-radius:9px;
  background:#eef1f6;
  cursor:pointer;
  font-size:18px;
}

.dark .close{
  background:#273041;
  color:white;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.form-group{
  margin-bottom:13px;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  display:block;
  font-size:12px;
  font-weight:600;
  margin-bottom:6px;
}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:18px;
}


/* =========================================================
   USER TABLE
========================================================= */

.user-table-wrap{
  overflow:auto;
}

.user-table{
  width:100%;
  min-width:700px;
}

.status{
  display:inline-flex;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.status-active{
  background:#dcfce7;
  color:#15803d;
}

.status-block{
  background:#fee2e2;
  color:#b91c1c;
}

.role{
  display:inline-flex;
  padding:5px 9px;
  border-radius:20px;
  background:#e0e7ff;
  color:#4338ca;
  font-size:11px;
  font-weight:bold;
}

.user-actions{
  display:flex;
  gap:6px;
}

.small-btn{
  border:none;
  padding:7px 10px;
  border-radius:7px;
  cursor:pointer;
  font-size:11px;
  font-weight:bold;
}

.small-edit{
  background:#dbeafe;
  color:#1d4ed8;
}

.small-block{
  background:#fee2e2;
  color:#b91c1c;
}

.small-unblock{
  background:#dcfce7;
  color:#15803d;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  min-width:260px;
  max-width:400px;
  padding:13px 16px;
  border-radius:11px;
  background:#172033;
  color:white;
  box-shadow:0 10px 35px rgba(0,0,0,.2);
  transform:translateY(100px);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:1000;
  font-size:13px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.toast.success{
  background:#15803d;
}

.toast.error{
  background:#b91c1c;
}


/* =========================================================
   LOADER
========================================================= */

.loader-bg{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
  backdrop-filter:blur(3px);
}

.dark .loader-bg{
  background:rgba(10,15,25,.72);
}

.loader-bg.show{
  display:flex;
}

.loader-box{
  background:white;
  padding:25px 30px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.18);
}

.dark .loader-box{
  background:#1b2331;
  color:white;
}

.spinner{
  width:35px;
  height:35px;
  border:4px solid #e3e8f0;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 12px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

  .header{
    padding:0 13px;
  }

  .profile-name{
    display:none;
  }

  .container{
    padding:15px;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .page-title h1{
    font-size:21px;
  }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

  <div class="logo-area">

    <div class="logo">
      S
    </div>

    <div class="logo-text">

      <h2>Support Dashboard</h2>

      <p>Admin Management System</p>

    </div>

  </div>


  <div class="header-actions">

    <button
      class="icon-btn"
      onclick="loadData()"
      title="Reload"
    >
      ↻
    </button>


    <button
      class="btn btn-primary"
      onclick="openUsersModal()"
    >
      Users
    </button>


    <button
      class="btn btn-success"
      onclick="openEntryModal()"
    >
      + New Entry
    </button>


    <button
      class="icon-btn"
      onclick="toggleTheme()"
      id="themeBtn"
      title="Theme"
    >
      🌙
    </button>


    <div class="profile">

      <button
        class="profile-btn"
        onclick="toggleProfileMenu()"
      >

        <div
          class="profile-avatar"
          id="profileAvatar"
        >
          U
        </div>

        <div class="profile-name">

          <strong id="profileName">
            User
          </strong>

          <span id="profileRole">
            User
          </span>

        </div>

      </button>


      <div
        class="profile-menu"
        id="profileMenu"
      >

        <button onclick="openPasswordModal()">
          🔑 Change Password
        </button>

        <button onclick="logout()">
          🚪 Logout
        </button>

      </div>

    </div>

  </div>

</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="container">


  <div class="top-bar">

    <div class="page-title">

      <h1>Dashboard</h1>

      <p>
        Manage support data and users
      </p>

    </div>


    <div class="actions">

      <button
        class="btn btn-primary"
        onclick="loadData()"
      >
        Refresh Data
      </button>

    </div>

  </div>



  <!-- =====================================================
       FILTER
  ====================================================== -->

  <div class="filter-card">

    <div class="filters">

      <input
        type="text"
        class="input"
        id="searchInput"
        placeholder="Search..."
        oninput="applyFilters()"
      >


      <input
        type="date"
        class="input"
        id="fromDate"
        onchange="applyFilters()"
      >


      <input
        type="date"
        class="input"
        id="toDate"
        onchange="applyFilters()"
      >


      <button
        class="btn btn-secondary"
        onclick="clearFilters()"
      >
        Clear
      </button>

    </div>

  </div>



  <!-- =====================================================
       DATA TABLE
  ====================================================== -->

  <div class="table-card">

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>Name</th>

            <th>IP</th>

            <th>Work</th>

            <th>Date</th>

          </tr>

        </thead>


        <tbody id="dataBody">

          <tr>

            <td
              colspan="4"
              class="empty"
            >
              Loading data...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</main>



<!-- =======================================================
     NEW ENTRY MODAL
======================================================= -->

<div
  class="modal-bg"
  id="entryModal"
>

  <div class="modal">

    <div class="modal-head">

      <h3>New Entry</h3>

      <button
        class="close"
        onclick="closeModal('entryModal')"
      >
        ×
      </button>

    </div>


    <div class="form-grid">

      <div class="form-group">

        <label>Name</label>

        <input
          class="input"
          id="entryName"
          type="text"
        >

      </div>


      <div class="form-group">

        <label>IP</label>

        <input
          class="input"
          id="entryIp"
          type="text"
        >

      </div>


      <div class="form-group full">

        <label>Work</label>

        <input
          class="input"
          id="entryWork"
          type="text"
        >

      </div>

    </div>


    <div class="modal-footer">

      <button
        class="btn btn-secondary"
        onclick="closeModal('entryModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-primary"

        Save
      </button>

    </div>

  </div>

</div>



<!-- =======================================================
     USERS MODAL
======================================================= -->

<div
  class="modal-bg"
  id="usersModal"
>

  <div class="modal large">

    <div class="modal-head">

      <h3>User Management</h3>

      <button
        class="close"

    </div>

    </div>


    <div class="user-table-wrap">

            <th>Username</th>

            <th>Name</th>

            <th>Role</th>

            <th>Status</th>

            <th>Action</th>

          </tr>

        </thead>


        <tbody id="usersBody">

          <tr>

            <td
              colspan="5"
              class="empty"
            >

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>



<!-- =======================================================
     ADD / EDIT USER MODAL
======================================================= -->

<div
  class="modal-bg"
  id="userFormModal"
>

  <div class="modal">

    <div class="modal-head">

      <h3 id="userFormTitle">

      <button

      <div class="form-group full">

        <label>Status</label>

        <select
          class="select"
          id="userStatus"

    <div class="modal-footer">

      <button

        Cancel
      </button>

      <button

        onclick="saveUser()"

        Save User
      </button>

</div>



<!-- =======================================================
     CHANGE PASSWORD MODAL
======================================================= -->

<div
  class="modal-bg"
  id="passwordModal"
>

  <div class="modal">

    <div class="modal-head">

      <label>New Password</label>

      <input
        class="input"
        id="newPassword"

      >

    </div>


    <div class="modal-footer">

      <button
        class="btn btn-secondary"
        onclick="closeModal('passwordModal')"
      >
        Cancel
      </button>

      <button
        class="btn btn-primary"
        onclick="changePassword()"
      >
        Change Password
      </button>

    </div>

  </div>

</div>



<!-- =======================================================
     LOADER
======================================================= -->

<div
  class="loader-bg"
  id="loader"
>

  <div class="loader-box">

    <div class="spinner"></div>

    <div id="loaderText">
      Loading...
    </div>

  </div>

</div>

     TOAST
======================================================= -->

<div
  class="toast"
  id="toast"
></div>



<script>


// ============================================================
// API URLS
// ============================================================

const USER_API_URL =
  "https://script.google.com/macros/s/AKfycbw00GHHheuvtdQtgPURjs4PtsM48-4yaFx-_ms0ZBV5FHhnmcdbJ5DHr3Aix8JPF0kQzA/exec";


const DATA_API_URL =
  "https://script.google.com/macros/s/AKfycbz59T-4CKQDbHJB_ql6OYZf18eN7XUmttp0d2FaOM5pm27yCBOWrEilqA_zMOnFq_rz/exec";



// ============================================================
// GLOBAL VARIABLES
// ============================================================

let allData = [];

let editingUser = false;

let currentUsername =
  localStorage.getItem("username") ||
  localStorage.getItem("loggedUser") ||
  "";



// ============================================================
// PAGE LOAD
// ============================================================

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadTheme();

    loadUser();

    loadData();

  }
);



// ============================================================
// CHECK LOGIN
// ============================================================

function checkLogin(){

  const auth =
    localStorage.getItem(
      "dashboardAuth"
    ) ||
    sessionStorage.getItem(
      "dashboardAuth"
    );


  if(auth !== "true"){

    window.location.href =
      "index.html";

    return false;
  }


  return true;
}



// ============================================================
// LOAD USER
// ============================================================

async function loadUser(){

  if(!checkLogin()) return;


  if(!currentUsername){

    logout();

    return;
  }


  try{

    const url =
      USER_API_URL +
      "?action=getUser&username=" +
      encodeURIComponent(
        currentUsername
      ) +
      "&_=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    if(!result.success){

      showToast(
        result.message ||
        "Unable to load user.",
        "error"
      );

      return;
    }


    const user =
      result.user;


    document.getElementById(
      "profileName"
    ).textContent =
      user.name ||
      user.username;


    document.getElementById(
      "profileRole"
    ).textContent =
      user.role;


    document.getElementById(
      "profileAvatar"
    ).textContent =
      (
        user.name ||
        user.username ||
        "U"
      )
      .charAt(0)
      .toUpperCase();


    localStorage.setItem(
      "name",
      user.name || ""
    );

    localStorage.setItem(
      "role",
      user.role || ""
    );

    localStorage.setItem(
      "status",
      user.status || ""
    );


    // --------------------------------------------------------
    // BLOCK CHECK
    // --------------------------------------------------------

    if(
      String(user.status)
        .toLowerCase() ===
      "block"
    ){

      logout();

      return;
    }


  }catch(error){

    console.error(error);

    showToast(
      "Unable to connect to User API.",
      "error"
    );
  }
}

async function loadData(){

  if(!checkLogin()) return;


  showLoader(
    "Loading data..."
  );

      DATA_API_URL +
      "?action=getData&_=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    if(
      result.success === false
    ){

      throw new Error(
        result.message ||
        "Unable to load data."
      );
    }


    allData =
      result.data ||
      result.users ||
      [];


    renderData(
      allData
    );


  }catch(error){

    document.getElementById(
      "dataBody"
    ).innerHTML = `
      <tr>
        <td colspan="4" class="empty">
          Unable to load data.
        </td>

// ============================================================
// RENDER DATA
// ============================================================

function renderData(data){

  const body =
    document.getElementById(
      "dataBody"
    );


  if(
    !data ||
    !data.length
  ){

    body.innerHTML = `
      <tr>
        <td colspan="4" class="empty">
          No data found.
        </td>
      </tr>
    `;

    return;
  }


  body.innerHTML =
    data.map(
      function(row){

        const name =
          row.Name ??
          row.name ??
          row[0] ??
          "";


        const ip =
          row.Ip ??
          row.IP ??
          row.ip ??
          row[1] ??
          "";


        const work =
          row.Work ??
          row.work ??
          row[2] ??
          "";


        const date =
          row.Date ??
          row.date ??
          row[3] ??
          "";


        return `
          <tr>

            <td>
              ${escapeHtml(name)}
            </td>

            <td>
              ${escapeHtml(ip)}
            </td>

            <td>
              ${escapeHtml(work)}
            </td>

            <td>
              ${escapeHtml(formatDate(date))}
            </td>

          </tr>
        `;

      }
    )
    .join("");
}



// ============================================================
// FILTER
// ============================================================

function applyFilters(){

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const from =
    document.getElementById(
      "fromDate"
    ).value;


  const to =
    document.getElementById(
      "toDate"
    ).value;


  const filtered =
    allData.filter(
      function(row){

        const text =
          JSON.stringify(
            row
          ).toLowerCase();


        if(
          search &&
          !text.includes(search)
        ){

          return false;
        }


        const rawDate =
          row.Date ??
          row.date ??
          row[3] ??
          "";


        if(
          from ||
          to
        ){

          const date =
            normalizeDate(
              rawDate
            );


          if(!date){

            return true;
          }


          if(
            from &&
            date < from
          ){

            return false;
          }


          if(
            to &&
            date > to
          ){

            return false;
          }
        }


        return true;
      }
    );


  renderData(
    filtered
  );
}

// ============================================================

function renderUsers(users){

  const body =
    document.getElementById(
      "usersBody"
    );


  if(
    !users ||
    !users.length
  ){

    body.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          No users found.
        </td>
      </tr>
    `;

    return;
  }


  body.innerHTML =
    users.map(
      function(user){

        const username =
          user.username || "";


        const name =
          user.name || "";


        const role =
          user.role || "guest";


        const status =
          String(
            user.status || "Active"
          );


        const isBlock =
          status.toLowerCase() ===
          "block";


        const statusHtml =
          isBlock

            ? `
              <span class="status status-block">
                Block
              </span>
            `

            : `
              <span class="status status-active">
                Active
              </span>
            `;


        const actionHtml =
          username.toLowerCase() ===
          currentUsername.toLowerCase()

            ? `
              <span
                style="
                  color:#8a93a5;
                  font-size:11px;
                "
              >
                Current User
              </span>
            `

            : isBlock

              ? `
                <button
                  class="small-btn small-unblock"
                  onclick='changeUserStatus(
                    ${JSON.stringify(username)},
                    "Active"
                  )'
                >
                  Unblock
                </button>
              `

              : `
                <button
                  class="small-btn small-block"
                  onclick='changeUserStatus(
                    ${JSON.stringify(username)},
                    "Block"
                  )'
                >
                  Block
                </button>
              `;


        return `
          <tr>

            <td>
              <strong>
                ${escapeHtml(username)}
              </strong>
            </td>

            <td>
              ${escapeHtml(name)}
            </td>

            <td>
              <span class="role">
                ${escapeHtml(role)}
              </span>
            </td>

            <td>
              ${statusHtml}
            </td>

            <td>

              <div class="user-actions">

                <button
                  class="small-btn small-edit"
                  onclick='editUser(
                    ${JSON.stringify(user)}
                  )'
                >
                  Edit
                </button>

                ${actionHtml}

              </div>

            </td>

          </tr>
        `;

      }
    )
    .join("");
}

// ============================================================
// SAVE USER
// ============================================================

async function saveUser(){

  const username =
    document.getElementById(
      "userUsername"
    ).value.trim();


  const name =
    document.getElementById(
      "userName"
    ).value.trim();


  const password =
    document.getElementById(
      "userPassword"
    ).value;


  const role =
    document.getElementById(
      "userRole"
    ).value;


  const status =
    document.getElementById(
      "userStatus"
    ).value;


  const originalUsername =
    document.getElementById(
      "originalUsername"
    ).value;


  if(!username){

    showToast(
      "Username is required.",
      "error"
    );

    return;
  }


  if(!name){

    showToast(
      "Name is required.",
      "error"
    );

    return;
  }


  if(
    !editingUser &&
    !password
  ){

    showToast(
      "Password is required.",
      "error"
    );

    return;
  }


  showLoader(
    editingUser
      ? "Updating user..."
      : "Adding user..."
  );


  try{

    const payload = {

      action:
        editingUser
          ? "editUser"
          : "addUser",

      requester:
        currentUsername,

      username:
        username,

      name:
        name,

      role:
        role,

      status:
        status

    };


    if(editingUser){

      payload.originalUsername =
        originalUsername;


      if(password){

        payload.password =
          password;
      }

    }else{

      payload.password =
        password;
    }


    const response =
      await fetch(
        USER_API_URL,
        {
          method:"POST",

          body:JSON.stringify(
            payload
          )
        }
      );


    const result =
      await response.json();


    if(!result.success){

      throw new Error(
        result.message ||
        "Operation failed."
      );
    }


    closeModal(
      "userFormModal"
    );


    showToast(
      result.message ||
      "User saved successfully.",
      "success"
    );


    loadUsers();


    // নিজের information change হলে reload
    if(
      editingUser &&
      originalUsername.toLowerCase() ===
      currentUsername.toLowerCase()
    ){

      loadUser();
    }


  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "Unable to save user.",
      "error"
    );


  }finally{

    hideLoader();

  }
}



// ============================================================
// BLOCK / UNBLOCK USER
// ============================================================

async function changeUserStatus(
  username,
  status
){

  if(
    !username ||
    !status
  ){

    return;
  }


  if(
    username.toLowerCase() ===
    currentUsername.toLowerCase()
  ){

    showToast(
      "You cannot change your own account status.",
      "error"
    );

    return;
  }


  const actionText =
    status === "Block"
      ? "block"
      : "unblock";


  if(
    !confirm(
      "Are you sure you want to " +
      actionText +
      " this user?"
    )
  ){

    return;
  }


  showLoader(
    status === "Block"
      ? "Blocking user..."
      : "Unblocking user..."
  );


  try{

    const response =
      await fetch(
        USER_API_URL,
        {
          method:"POST",

          body:JSON.stringify({

            action:
              "toggleUserStatus",

            requester:
              currentUsername,

            username:
              username,

            status:
              status

          })
        }
      );


    const result =
      await response.json();


    if(!result.success){

      throw new Error(
        result.message ||
        "Status change failed."
      );
    }


    showToast(
      result.message ||
      "Status changed successfully.",
      "success"
    );


    loadUsers();


  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "Unable to change user status.",
      "error"
    );


  }finally{

    hideLoader();

  }
}

// ============================================================
// DATE FORMAT
// ============================================================

function formatDate(value){

  if(!value){

    return "";
  }


  const date =
    new Date(value);


  if(
    isNaN(
      date.getTime()
    )
  ){

    return String(value);
  }


  return date.toLocaleString(
    "en-GB",
    {
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}



function normalizeDate(value){

  if(!value){

    return "";
  }


  const date =
    new Date(value);


  if(
    isNaN(
      date.getTime()
    )
  ){

    return "";
  }


  const y =
    date.getFullYear();


  const m =
    String(
      date.getMonth() + 1
    ).padStart(2,"0");


  const d =
    String(
      date.getDate()
    ).padStart(2,"0");


  return (
    y +
    "-" +
    m +
    "-" +
    d
  );
}



// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );
}

    "name",
    "role",
    "status",
    "userData",
    "loginData",
    "loggedUser",

  keys.forEach(

      localStorage.removeItem(
        key

      sessionStorage.removeItem(

      );

    }
  );


  sessionStorage.clear();


  window.location.replace(
    "index.html"
  );
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Support Dashboard</title>

<link rel="icon"
      type="image/png"
      sizes="128x128"
      href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
  min-height:100vh;
  transition:.25s;
}

body.dark{
  background:#10151d;
  color:#f1f5f9;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  height:70px;
  background:#ffffff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  padding:0 22px;
  gap:10px;
  position:sticky;
  top:0;
  z-index:50;
}

.dark .header{
  background:#171d27;
  border-color:#293241;
}

.logo{
  font-size:21px;
  font-weight:800;
  color:#16a34a;
  margin-right:auto;
  white-space:nowrap;
}

.header-btn{
  border:0;
  border-radius:9px;
  padding:10px 14px;
  background:#f1f5f9;
  color:#172033;
  font-weight:600;
  transition:.2s;
}

.header-btn:hover{
  transform:translateY(-1px);
  background:#e2e8f0;
}

.dark .header-btn{
  background:#252e3b;
  color:#f8fafc;
}

.header-btn.green{
  background:#16a34a;
  color:#fff;
}

.header-btn.green:hover{
  background:#15803d;
}

.theme-btn{
  width:40px;
  height:40px;
  padding:0;
  border-radius:50%;
}

.profile{
  position:relative;
  margin-left:5px;
}

.profile-btn{
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  gap:8px;
}

.profile-avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#16a34a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  overflow:hidden;
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-weight:700;
  max-width:110px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.profile-menu{
  display:none;
  position:absolute;
  right:0;
  top:50px;
  width:190px;
  background:white;
  border:1px solid #e5e7eb;
  border-radius:12px;
  box-shadow:0 15px 40px rgba(0,0,0,.15);
  padding:7px;
  z-index:100;
}

.dark .profile-menu{
  background:#1b2430;
  border-color:#303b4b;
}

.profile-menu.show{
  display:block;
}

.profile-menu button{
  width:100%;
  border:0;
  background:transparent;
  padding:11px;
  text-align:left;
  border-radius:8px;
  color:inherit;
}

.profile-menu button:hover{
  background:#f1f5f9;
}

.dark .profile-menu button:hover{
  background:#273243;
}

.container{
  max-width:1500px;
  margin:auto;
  padding:20px;
}

.filter-bar{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.search-box{
  flex:1;
  min-width:220px;
  position:relative;
}

.search-box input{
  width:100%;
  padding:12px 14px 12px 40px;
  border:1px solid #dbe2ea;
  border-radius:10px;
  outline:none;
  background:white;
  color:#172033;
}

.search-box span{
  position:absolute;
  left:14px;
  top:11px;
}

.dark .search-box input{
  background:#171d27;
  border-color:#303b4b;
  color:#fff;
}

.filter-bar input,
.filter-bar select{
  padding:12px;
  border:1px solid #dbe2ea;
  border-radius:10px;
  outline:none;
  background:white;
  color:#172033;
}

.dark .filter-bar input,
.dark .filter-bar select{
  background:#171d27;
  border-color:#303b4b;
  color:#fff;
}

.clear-btn{
  padding:12px 16px;
  border:0;
  border-radius:10px;
  background:#64748b;
  color:white;
  font-weight:600;
}

.stats{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.total{
  font-size:18px;
  font-weight:700;
}

.table-card{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(15,23,42,.06);
  border:1px solid #e5e7eb;
}

.dark .table-card{
  background:#171d27;
  border-color:#293241;
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

th{
  background:#16a34a;
  color:#fff;
  padding:13px 12px;
  text-align:left;
  font-size:14px;
}

td{
  padding:12px;
  border-bottom:1px solid #edf0f4;
  font-size:14px;
}

.dark td{
  border-color:#293241;
}

tr:hover td{
  background:#f8fafc;
}

.dark tr:hover td{
  background:#1d2632;
}

.action-group{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.action-btn{
  border:0;
  border-radius:7px;
  padding:7px 10px;
  font-size:12px;
  font-weight:700;
}

.edit-btn{
  background:#2563eb;
  color:white;
}

.sell-btn{
  background:#f59e0b;
  color:white;
}

.delete-btn{
  background:#dc2626;
  color:white;
}

.block-btn{
  background:#ef4444;
  color:#fff;
}

.active-btn{
  background:#16a34a;
  color:#fff;
}

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  padding:15px;
}

.page-btn{
  border:1px solid #dbe2ea;
  background:white;
  padding:8px 12px;
  border-radius:8px;
}

.dark .page-btn{
  background:#202a36;
  border-color:#354152;
  color:#fff;
}

.page-btn.active{
  background:#16a34a;
  color:#fff;
  border-color:#16a34a;
}

.empty{
  padding:45px 20px;
  text-align:center;
  color:#64748b;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.6);
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:560px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:16px;
  padding:22px;
  box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.dark .modal-box{
  background:#171d27;
  color:#fff;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.modal-head h2{
  font-size:20px;
}

.close{
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:#eef2f7;
  font-size:20px;
}

.dark .close{
  background:#273243;
  color:#fff;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:600;
  font-size:14px;
}

.form-group input,
.form-group select{
  width:100%;
  padding:12px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  outline:none;
  background:white;
  color:#172033;
}

.dark .form-group input,
.dark .form-group select{
  background:#202a36;
  border-color:#354152;
  color:#fff;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:18px;
}

.cancel-btn{
  border:0;
  padding:11px 16px;
  border-radius:9px;
  background:#64748b;
  color:white;
  font-weight:600;
}

.save-btn{
  border:0;
  padding:11px 18px;
  border-radius:9px;
  background:#16a34a;
  color:white;
  font-weight:700;
}

.user-table,
.item-table{
  width:100%;
  min-width:600px;
}

.add-user-btn,
.add-item-btn{
  border:0;
  padding:10px 14px;
  border-radius:9px;
  background:#16a34a;
  color:#fff;
  font-weight:700;
  margin-bottom:12px;
}

.item-add-row{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.item-add-row input{
  flex:1;
  padding:11px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  outline:none;
}

.dark .item-add-row input{
  background:#202a36;
  color:#fff;
  border-color:#354152;
}

.loader{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.65);
  z-index:500;
  align-items:center;
  justify-content:center;
}

.dark .loader{
  background:rgba(0,0,0,.55);
}

.loader.show{
  display:flex;
}

.spinner{
  width:45px;
  height:45px;
  border:4px solid #dbeafe;
  border-top-color:#16a34a;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#172033;
  color:white;
  padding:13px 17px;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  transform:translateY(100px);
  opacity:0;
  transition:.3s;
  z-index:1000;
  max-width:340px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.toast.success{
  background:#16a34a;
}

.toast.error{
  background:#dc2626;
}

.toast.warning{
  background:#f59e0b;
}

@media(max-width:800px){
  .header{
    padding:0 10px;
    gap:6px;
  }

  .logo{
    font-size:17px;
  }

  .header-btn{
    padding:9px 10px;
    font-size:12px;
  }

  .profile-name{
    display:none;
  }

  .container{
    padding:12px;
  }

  .filter-bar{
    align-items:stretch;
  }

  .search-box{
    min-width:100%;
  }

  .filter-bar input,
  .filter-bar select,
  .clear-btn{
    flex:1;
  }

  .form-row{
    grid-template-columns:1fr;
  }
}

@media(max-width:550px){
  .header-btn.users-text,
  .header-btn.items-text{
    display:none;
  }

  .modal-box{
    padding:17px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">Support Dashboard</div>

  <button class="header-btn" onclick="loadData(true)">
    ↻ Reload
  </button>

  <button class="header-btn users-text" onclick="openUsersModal()">
    Users
  </button>

  <button class="header-btn items-text" onclick="openItemsModal()">
    Items
  </button>

  <button class="header-btn green" onclick="openEntryModal()">
    + New Entry
  </button>

  <button class="header-btn theme-btn"
          onclick="toggleTheme()"
          id="themeBtn">
    🌙
  </button>

  <div class="profile">

    <button class="profile-btn" onclick="toggleProfileMenu()">

      <div class="profile-avatar" id="profileAvatar">
        U
      </div>

      <span class="profile-name" id="profileName">
        User
      </span>

    </button>

    <div class="profile-menu" id="profileMenu">

      <button onclick="openPasswordModal();closeProfileMenu()">
        🔑 Change Password
      </button>

      <button onclick="logout()">
        🚪 Logout
      </button>

    </div>

  </div>

</header>


<main class="container">

  <div class="filter-bar">

    <div class="search-box">
      <span>🔎</span>
      <input
        type="text"
        id="searchInput"
        placeholder="Search..."
        oninput="applyFilters()"
      >
    </div>

    <input
      type="date"
      id="fromDate"
      onchange="applyFilters()"
    >

    <input
      type="date"
      id="toDate"
      onchange="applyFilters()"
    >

    <select id="dataType"
            onchange="changeDataType()">
      <option value="data">Data</option>
      <option value="sell">Sell</option>
      <option value="delete">Delete</option>
    </select>

    <button class="clear-btn"
            onclick="clearFilters()">
      Clear
    </button>

  </div>


  <div class="stats">
    <div class="total">
      Total: <span id="totalCount">0</span>
    </div>
  </div>


  <div class="table-card">

    <div class="table-wrap">

      <table>

        <thead id="tableHead">
          <tr>
            <th>Name</th>
            <th>IP</th>
            <th>Work</th>
            <th>Date</th>
            <th>Item</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="tableBody">
        </tbody>

      </table>

      <div class="empty" id="emptyState" style="display:none;">
        No data found.
      </div>

    </div>

    <div class="pagination" id="pagination">
    </div>

  </div>

</main>


<!-- =========================================================
     ENTRY MODAL
========================================================= -->

<div class="modal" id="entryModal">

  <div class="modal-box">

    <div class="modal-head">
      <h2 id="entryModalTitle">New Entry</h2>
      <button class="close"
              onclick="closeModal('entryModal')">
        ×
      </button>
    </div>

    <div class="form-row">

      <div class="form-group">
        <label>Name</label>
        <input type="text"
               id="entryName"
               placeholder="Enter name">
      </div>

      <div class="form-group">
        <label>IP</label>
        <input type="text"
               id="entryIp"
               placeholder="Enter IP">
      </div>

    </div>

    <div class="form-group">
      <label>Work</label>
      <input type="text"
             id="entryWork"
             placeholder="Enter work">
    </div>

    <div class="form-row">

      <div class="form-group">
        <label>Item</label>

        <select id="entryItem">
          <option value="">Select Item</option>
        </select>

      </div>

      <div class="form-group">
        <label>Date</label>

        <input type="date"
               id="entryDate">

      </div>

    </div>

    <div class="modal-actions">

      <button class="cancel-btn"
              onclick="closeModal('entryModal')">
        Cancel
      </button>

      <button class="save-btn"
              onclick="saveEntry()">
        Save
      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     USERS MODAL
========================================================= -->

<div class="modal" id="usersModal">

  <div class="modal-box" style="max-width:900px;">

    <div class="modal-head">

      <h2>User Management</h2>

      <button class="close"
              onclick="closeModal('usersModal')">
        ×
      </button>

    </div>

    <button class="add-user-btn"
            onclick="openAddUserModal()">
      + Add User
    </button>

    <div class="table-wrap">

      <table class="user-table">

        <thead>
          <tr>
            <th>Username</th>
            <th>Name</th>
            <th>Role</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="usersBody">
        </tbody>

      </table>

    </div>

  </div>

</div>


<!-- =========================================================
     ADD / EDIT USER MODAL
========================================================= -->

<div class="modal" id="userFormModal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="userFormTitle">Add User</h2>

      <button class="close"
              onclick="closeModal('userFormModal')">
        ×
      </button>

    </div>

    <div class="form-group">

      <label>Username</label>

      <input type="text"
             id="userUsername"
             placeholder="Username">

    </div>

    <div class="form-group">

      <label>Password</label>

      <input type="password"
             id="userPassword"
             placeholder="Password">

    </div>

    <div class="form-group">

      <label>Name</label>

      <input type="text"
             id="userName"
             placeholder="Name">

    </div>

    <div class="form-row">

      <div class="form-group">

        <label>Role</label>

        <select id="userRole">

          <option value="admin">Admin</option>
          <option value="manager">Manager</option>
          <option value="support">Support</option>
          <option value="call">Call</option>
          <option value="guest">Guest</option>

        </select>

      </div>

      <div class="form-group">

        <label>Status</label>

        <select id="userStatus">

          <option value="Active">Active</option>
          <option value="Block">Block</option>

        </select>

      </div>

    </div>

    <div class="modal-actions">

      <button class="cancel-btn"
              onclick="closeModal('userFormModal')">
        Cancel
      </button>

      <button class="save-btn"
              onclick="saveUser()">
        Save
      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     ITEMS MODAL
========================================================= -->

<div class="modal" id="itemsModal">

  <div class="modal-box" style="max-width:800px;">

    <div class="modal-head">

      <h2>Item Management</h2>

      <button class="close"
              onclick="closeModal('itemsModal')">
        ×
      </button>

    </div>

    <div class="item-add-row">

      <input
        type="text"
        id="newItemInput"
        placeholder="Enter new item">

      <button class="add-item-btn"
              onclick="addNewItem()">
        + Add Item
      </button>

    </div>

    <div class="table-wrap">

      <table class="item-table">

        <thead>
          <tr>
            <th>Item</th>
            <th>Date</th>
            <th>User</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="itemsBody">
        </tbody>

      </table>

    </div>

  </div>

</div>


<!-- =========================================================
     PASSWORD MODAL
========================================================= -->

<div class="modal" id="passwordModal">

  <div class="modal-box">

    <div class="modal-head">

      <h2>Change Password</h2>

      <button class="close"
              onclick="closeModal('passwordModal')">
        ×
      </button>

    </div>

    <div class="form-group">

      <label>Current Password</label>

      <input type="password"
             id="currentPassword"
             placeholder="Current password">

    </div>

    <div class="form-group">

      <label>New Password</label>

      <input type="password"
             id="newPassword"
             placeholder="New password">

    </div>

    <div class="form-group">

      <label>Confirm Password</label>

      <input type="password"
             id="confirmPassword"
             placeholder="Confirm password">

    </div>

    <div class="modal-actions">

      <button class="cancel-btn"
              onclick="closeModal('passwordModal')">
        Cancel
      </button>

      <button class="save-btn"
              onclick="changePassword()">
        Change Password
      </button>

    </div>

  </div>

</div>


<!-- LOADER -->

<div class="loader" id="loader">

  <div class="spinner"></div>

</div>


<!-- TOAST -->

<div class="toast" id="toast"></div>


<script>

/* =========================================================
   API URLS
========================================================= */

const USER_API_URL =
"https://script.google.com/macros/s/AKfycbw00GHHheuvtdQtgPURjs4PtsM48-4yaFx-_ms0ZBV5FHhnmcdbJ5DHr3Aix8JPF0kQzA/exec";

const DATA_API_URL =
"https://script.google.com/macros/s/AKfycbz59T-4CKQDbHJB_ql6OYZf18eN7XUmttp0d2FaOM5pm27yCBOWrEilqA_zMOnFq_rz/exec";

const SELL_API_URL =
"https://script.google.com/macros/s/AKfycbyiKn1MH1ZQvebSIo83bZzbbfJimmfRf9PjlPI4w1q1UliuF27gKViYM24oXakpkHuP/exec";

const DELETE_API_URL =
"https://script.google.com/macros/s/AKfycbwDL1JIV7QYcH84VGiWxhUoT-wN9UfuGn0t9boYrs_FaG_ZfcVGjNmaTqSTC6ev0Ig9Kg/exec";

const ITEM_API_URL =
"https://script.google.com/macros/s/AKfycby2e7dzGE5vkS0Q-Eyl9MKLAbkkkD8f37eIVj7VuV8bPytWGOH7cwJ3w25efP7MLGshOw/exec";


/* =========================================================
   VARIABLES
========================================================= */

let allData = [];
let filteredData = [];

let editingUser = null;
let editingDataRow = null;

let currentDataType = "data";

let currentPage = 1;
const pageSize = 10;

let dataCache = null;
let sellCache = null;
let deleteCache = null;

let itemList = [];
let itemCache = null;

let currentUsername = "";


/* =========================================================
   START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadTheme();

    if(!checkLogin()){
      return;
    }

    loadUser();
    loadData();
    loadItems();

  }
);


/* =========================================================
   LOGIN CHECK
========================================================= */

function checkLogin(){

  const auth =
    localStorage.getItem("dashboardAuth") ||
    sessionStorage.getItem("dashboardAuth");

  if(auth !== "true"){

    window.location.href = "index.html";

    return false;
  }

  currentUsername =
    localStorage.getItem("username") ||
    localStorage.getItem("loggedUser") ||
    "";

  return true;
}


/* =========================================================
   USER
========================================================= */

async function loadUser(){

  if(!currentUsername){
    return;
  }

  try{

    const response =
      await fetch(
        USER_API_URL +
        "?action=getUser&username=" +
        encodeURIComponent(currentUsername)
      );

    const result =
      await response.json();

    if(!result.success){
      return;
    }

    const user =

      currentUsername;

      user.Role ||
      user.role ||

    ).textContent = name;

      );

      user.Picture ||

      avatar.innerHTML =

        escapeAttribute(picture) +
        '" alt="Profile">';

    }else{

      avatar.textContent =
        String(name)
        .charAt(0)
        .toUpperCase();

    }

    localStorage.setItem(
      "userName",
      name
    );

    localStorage.setItem(
      "userRole",
      role
    );

      "userStatus",
      status
    );

      .toLowerCase() === "block" ||
      String(status)
      .toLowerCase() === "blocked"
    ){

        "error"
      );

      setTimeout(
        logout,
        1200
      );

    }

  }catch(error){

    console.error(error);

  }

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(force = false){

  showLoader();

  try{

    let cache = null;
    let api = DATA_API_URL;
    let action = "getData";

    if(currentDataType === "sell"){

      cache = sellCache;
      api = SELL_API_URL;
      action = "getSellData";

    }else if(currentDataType === "delete"){

      cache = deleteCache;
      api = DELETE_API_URL;
      action = "getDeletedData";

    }else{

      cache = dataCache;
      api = DATA_API_URL;
      action = "getData";

    }

    if(cache && !force){

      allData = cache;
      applyFilters();

      hideLoader();

      return;
    }

    const response =
      await fetch(
        api +
        "?action=" +
        encodeURIComponent(action)
      );

    const result =
      await response.json();

    if(!result.success){

      throw new Error(
        result.message ||
        "Failed to load data"
      );

    }

    let rows =
      result.data ||
      result.rows ||
      [];

    if(!Array.isArray(rows)){
      rows = [];
    }

    if(currentDataType === "sell"){

      sellCache = rows;

    }else if(currentDataType === "delete"){

      deleteCache = rows;

    }else{

      dataCache = rows;

    }

    allData = rows;

    currentPage = 1;

    applyFilters();

  }catch(error){

    console.error(error);

    allData = [];

    applyFilters();

    showToast(
      error.message ||
      "Unable to load data",
      "error"
    );

  }finally{

    hideLoader();

  }

}

/* =========================================================
   FILTER
========================================================= */

function applyFilters(){

  const search =
    String(
      document.getElementById(
        "searchInput"
      ).value || ""
    )
    .trim()
    .toLowerCase();

  const from =
    document.getElementById(
      "fromDate"
    ).value;

  const to =
    document.getElementById(
      "toDate"
    ).value;

  filteredData =
    allData.filter(
      function(row){

        const json =
          JSON.stringify(row)
          .toLowerCase();

        if(
          search &&
          !json.includes(search)
        ){
          return false;
        }

        const rowDate =
          normalizeDate(
            row.Date ||
            row.date
          );

        if(from){

          if(
            !rowDate ||
            rowDate < from
          ){
            return false;
          }

        }

        if(to){

          if(
            !rowDate ||
            rowDate > to
          ){
            return false;
          }

        }

        return true;

      }
    );

  currentPage = 1;

  renderTable();

}


/* =========================================================
   DATE NORMALIZE
========================================================= */

function normalizeDate(value){

  if(!value){
    return "";
  }

  const text =
    String(value)
    .trim();

  if(
    /^\d{4}-\d{2}-\d{2}$/.test(text)
  ){
    return text;
  }

  const match =
    text.match(
      /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
    );

  if(match){

    return (
      match[3] +
      "-" +
      String(match[2]).padStart(2,"0") +
      "-" +
      String(match[1]).padStart(2,"0")
    );

  }

  const date =
    new Date(text);

  if(
    isNaN(
      date.getTime()
    )
  ){
    return "";
  }

  return (
    date.getFullYear() +
    "-" +
    String(
      date.getMonth() + 1
    ).padStart(2,"0") +
    "-" +
    String(
      date.getDate()
    ).padStart(2,"0")
  );

}

/* =========================================================
   PAGINATION
========================================================= */

function renderPagination(){

  const pagination =
    document.getElementById(
      "pagination"
    );

  pagination.innerHTML = "";

  const pages =
    Math.ceil(
      filteredData.length /
      pageSize
    );

  if(pages <= 1){
    return;
  }

  for(
    let i = 1;
    i <= pages;
    i++
  ){

    const button =
      document.createElement(
        "button"
      );

    button.className =
      "page-btn" +
      (
        i === currentPage
        ? " active"
        : ""
      );

    button.textContent =
      i;

    button.onclick =
      function(){

        currentPage = i;

        renderTable();

      };

    pagination.appendChild(
      button
    );

  }

}

        status:

      };

    }else{

      payload = {

        action:
          "addUser",

        requester:
          currentUsername,

        username:
          username,

        password:
          password,

        name:
          name,

        role:
          role,

        status:
          status

      };

    }

    const response =
      await fetch(
        USER_API_URL,
        {
          method:"POST",
          body:JSON.stringify(
            payload

        }

    if(!result.success){

      error.message ||

/* =========================================================
   ITEMS
========================================================= */

async function openItemsModal(){

  openModal(
    "itemsModal"
  );

  await loadItems(
    true
  );

}


async function loadItems(
  force = false
){

  if(
    itemCache &&
    !force
  ){

    itemList =
      itemCache;

    populateItemSelect();

    renderItems();

    return;

  }

  try{

    const response =
      await fetch(
        ITEM_API_URL +
        "?action=getItems"
      );

    const result =
      await response.json();

    if(!result.success){

      throw new Error(
        result.message ||
        "Unable to load items."
      );

    }

    itemList =
      result.items ||
      result.data ||
      [];

    if(
      !Array.isArray(itemList)
    ){
      itemList = [];
    }

    itemCache =
      itemList;

    populateItemSelect();

    renderItems();

  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "Unable to load items.",
      "error"
    );

  }

}


function populateItemSelect(
  selected = ""
){

  const select =
    document.getElementById(
      "entryItem"
    );

  if(!select){
    return;
  }

  select.innerHTML =
    `<option value="">Select Item</option>`;

  itemList.forEach(
    function(item){

      const value =
        typeof item === "string"
        ? item
        :
        item.Item ||
        item.item ||
        item.Name ||
        item.name ||
        "";

      if(!value){
        return;
      }

      const option =
        document.createElement(
          "option"
        );

      option.value =
        value;

      option.textContent =
        value;

      if(
        String(value) ===
        String(selected)
      ){

        option.selected =
          true;

      }

      select.appendChild(
        option
      );

    }
  );

}


function renderItems(){

  const body =
    document.getElementById(
      "itemsBody"
    );

  if(!body){
    return;
  }

  body.innerHTML = "";

  if(
    itemList.length === 0
  ){

    body.innerHTML =
      `
        <tr>
          <td colspan="4">
            No items found.
          </td>
        </tr>
      `;

    return;

  }

  itemList.forEach(
    function(item,index){

      if(
        typeof item === "string"
      ){

        item = {
          Item:item
        };

      }

      const itemName =
        item.Item ||
        item.item ||
        item.Name ||
        item.name ||
        "";

      const date =
        item.Date ||
        item.date ||
        "";

      const user =
        item.User ||
        item.Username ||
        item.username ||
        "";

      const rowNumber =
        item.row ||
        item.Row ||
        index + 2;

      const tr =
        document.createElement(
          "tr"
        );

      tr.innerHTML = `
        <td>${escapeHtml(itemName)}</td>
        <td>${escapeHtml(date)}</td>
        <td>${escapeHtml(user)}</td>

        <td>
          <button
            class="action-btn delete-btn"
            onclick="deleteItem(${Number(rowNumber)})">
            Delete
          </button>
        </td>
      `;

      body.appendChild(tr);

    }
  );

}

        item,

        ITEM_API_URL,

/* =========================================================

========================================================= */

async function deleteItem(
  row
){

  if(
    !confirm(
      "Are you sure you want to delete this item?"
    )
  ){
    return;
  }

  showLoader();

  try{

    const response =
      await fetch(
        ITEM_API_URL,
        {
          method:"POST",
          body:JSON.stringify({

            action:
              "deleteItem",

            row:
              Number(row)

          })
        }
      );

    const result =
      await response.json();

    if(!result.success){

      throw new Error(
        result.message ||
        "Unable to delete item."
      );

    }

    itemCache = null;

    await loadItems(
      true
    );

    showToast(
      result.message ||
      "Item deleted successfully.",
      "success"
    );

  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "Unable to delete item.",
      "error"
    );

  }finally{

    hideLoader();

  }

}

    "confirmPassword"
  ).value = "";

async function changePassword(){

  const currentPassword =
    document.getElementById(
      "currentPassword"
    ).value;

  const newPassword =
    document.getElementById(
      "newPassword"
    ).value;

  const confirmPassword =
    document.getElementById(
      "confirmPassword"
    ).value;

  if(!currentPassword){

    showToast(
      "Enter current password.",
      "error"
    );

    return;
  }

  if(!newPassword){

    showToast(
      "Enter new password.",
      "error"
    );

    return;
  }

  if(
    newPassword !==
    confirmPassword
  ){

    showToast(
      "Passwords do not match.",
      "error"
    );

    return;
  }

  showLoader();

  try{

    const response =
      await fetch(
        USER_API_URL,
        {
          method:"POST",
          body:JSON.stringify({

            action:
              "changePassword",

            requester:
              currentUsername,

            username:
              currentUsername,

            currentPassword:
              currentPassword,

            newPassword:
              newPassword

          })
        }
      );

    const result =
      await response.json();

    if(!result.success){

      throw new Error(
        result.message ||
        "Unable to change password."
      );

    }

    closeModal(
      "passwordModal"
    );

    showToast(
      result.message ||
      "Password changed successfully.",
      "success"
    );

  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "Password change failed.",
      "error"
    );

  }finally{

    hideLoader();

  }

}


/* =========================================================
   THEME
========================================================= */

function loadTheme(){

  const theme =
    localStorage.getItem(
      "dashboardTheme"
    );

  if(theme === "dark"){

    document.body.classList.add(
      "dark"
    );

    document.getElementById(
      "themeBtn"
    ).textContent = "☀️";

  }else{

    document.getElementById(
      "themeBtn"
    ).textContent = "🌙";

  }

}


function toggleTheme(){

  document.body.classList.toggle(
    "dark"
  );

  const dark =
    document.body.classList.contains(
      "dark"
    );

  localStorage.setItem(
    "dashboardTheme",
    dark
    ? "dark"
    : "light"
  );

  document.getElementById(
    "themeBtn"
  ).textContent =
    dark
    ? "☀️"
    : "🌙";

}

/* =========================================================
   HELPERS
========================================================= */

function todayDate(){

  const d =
    new Date();

  return (
    d.getFullYear() +
    "-" +
    String(
      d.getMonth() + 1
    ).padStart(2,"0") +
    "-" +
    String(
      d.getDate()
    ).padStart(2,"0")
  );

}


function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttribute(value){

  return String(
    value ?? ""
  )
  .replace(
    /"/g,
    "&quot;"
  );

}


function escapeJs(value){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /"/g,
    '\\"'
  )
  .replace(
    /\n/g,
    "\\n"
  )
  .replace(
    /\r/g,
    "\\r"
  );

}

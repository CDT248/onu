<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Support Dashboard</title>

<link
  rel="icon"
  type="image/png"
  href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#1f2937;
  min-height:100vh;
}

/* ================= HEADER ================= */

.header{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.header-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:12px;
  background:rgba(255,255,255,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
}

.header-title{
  font-size:20px;
  font-weight:700;
}

.header-sub{
  font-size:12px;
  opacity:.8;
  margin-top:2px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn,
.profile-btn{
  border:none;
  cursor:pointer;
  color:white;
  background:rgba(255,255,255,.15);
  border-radius:10px;
  padding:9px 12px;
  transition:.2s;
}

.icon-btn:hover,
.profile-btn:hover{
  background:rgba(255,255,255,.25);
}

.profile-btn{
  display:flex;
  align-items:center;
  gap:7px;
}

/* ================= CONTAINER ================= */

.container{
  width:min(1400px,96%);
  margin:20px auto;
}

/* ================= TOP ================= */

.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:16px;
  flex-wrap:wrap;
}

.page-title{
  font-size:25px;
  font-weight:700;
}

.page-subtitle{
  color:#6b7280;
  font-size:13px;
  margin-top:4px;
}

.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  border-radius:10px;
  padding:10px 15px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  transition:.2s;
}

.btn-primary{
  background:#2563eb;
  color:white;
}

.btn-primary:hover{
  background:#1d4ed8;
}

.btn-secondary{
  background:white;
  color:#374151;
  border:1px solid #e5e7eb;
}

.btn-secondary:hover{
  background:#f9fafb;
}

/* ================= STATS ================= */

.stats{
  display:flex;
  gap:10px;
  margin-bottom:16px;
  flex-wrap:wrap;
}

.stat{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:11px 16px;
  min-width:130px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.stat-label{
  color:#6b7280;
  font-size:12px;
}

.stat-value{
  font-size:20px;
  font-weight:700;
  margin-top:3px;
}

/* ================= FILTER ================= */

.filter-card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:15px;
  margin-bottom:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.filter-grid{
  display:grid;
  grid-template-columns:
    minmax(180px,1.5fr)
    minmax(140px,1fr)
    minmax(140px,1fr)
    minmax(140px,.8fr)
    auto;
  gap:10px;
  align-items:end;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-size:12px;
  font-weight:600;
  color:#6b7280;
}

input,
select{
  width:100%;
  height:40px;
  border:1px solid #dbe1ea;
  border-radius:9px;
  padding:0 11px;
  outline:none;
  background:white;
  color:#111827;
}

input:focus,
select:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,.1);
}

/* ================= TABLE ================= */

.table-card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:850px;
}

thead{
  background:#f8fafc;
}

th,
td{
  padding:12px 13px;
  border-bottom:1px solid #edf0f4;
  text-align:left;
  font-size:13px;
  white-space:nowrap;
}

th{
  color:#475569;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.3px;
}

tbody tr:hover{
  background:#f8fbff;
}

.empty{
  text-align:center;
  padding:35px;
  color:#9ca3af;
}

/* ================= ACTION ================= */

.action-box{
  display:flex;
  gap:5px;
}

.action-btn{
  border:none;
  border-radius:7px;
  padding:6px 9px;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
}

.edit-btn{
  background:#eff6ff;
  color:#2563eb;
}

.sell-btn{
  background:#ecfdf5;
  color:#059669;
}

.delete-btn{
  background:#fef2f2;
  color:#dc2626;
}

.action-btn:hover{
  opacity:.8;
}

/* ================= TABLE LOADING ================= */

.table-loading{
  padding:30px;
  text-align:center;
  color:#6b7280;
}

.spinner{
  width:26px;
  height:26px;
  border:3px solid #e5e7eb;
  border-top-color:#2563eb;
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto 9px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* ================= PAGINATION ================= */

.pagination{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 15px;
  gap:10px;
  flex-wrap:wrap;
}

.page-info{
  font-size:12px;
  color:#6b7280;
}

.page-buttons{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.page-btn{
  min-width:34px;
  height:32px;
  border:1px solid #e5e7eb;
  background:white;
  border-radius:7px;
  cursor:pointer;
}

.page-btn.active{
  background:#2563eb;
  color:white;
  border-color:#2563eb;
}

.page-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(500px,100%);
  background:white;
  border-radius:16px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-title{
  font-size:19px;
  font-weight:700;
}

.close-btn{
  border:none;
  background:#f3f4f6;
  width:32px;
  height:32px;
  border-radius:8px;
  cursor:pointer;
  font-size:18px;
}

.modal-form{
  display:grid;
  gap:13px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:8px;
}

/* ================= TOAST ================= */

.toast-container{
  position:fixed;
  top:20px;
  right:20px;
  z-index:3000;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.toast{
  min-width:240px;
  max-width:350px;
  padding:12px 15px;
  border-radius:10px;
  background:#111827;
  color:white;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  animation:toastIn .25s ease;
  font-size:13px;
}

.toast.success{
  background:#059669;
}

.toast.error{
  background:#dc2626;
}

@keyframes toastIn{
  from{
    transform:translateX(30px);
    opacity:0;
  }
  to{
    transform:translateX(0);
    opacity:1;
  }
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

  .filter-grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:600px){

  .header{
    padding:12px;
  }

  .header-title{
    font-size:17px;
  }

  .container{
    width:94%;
    margin:14px auto;
  }

  .page-title{
    font-size:21px;
  }

  .filter-grid{
    grid-template-columns:1fr;
  }

  .top-actions{
    width:100%;
  }

  .top-actions .btn{
    flex:1;
  }

  .stat{
    flex:1;
  }

  .toast-container{
    left:12px;
    right:12px;
    top:12px;
  }

  .toast{
    min-width:0;
    max-width:none;
  }

}

</style>

</head>

<body>


<!-- ============================================================
     HEADER
============================================================ -->

<header class="header">

  <div class="header-left">

    <div class="logo">
      S
    </div>

    <div>
      <div class="header-title">
        Support Dashboard
      </div>

      <div class="header-sub">
        Data Management System
      </div>
    </div>

  </div>


  <div class="header-right">

    <button
      class="icon-btn"
      onclick="loadCurrentData()"
      title="Refresh"
    >
      ↻
    </button>

    <button
      class="profile-btn"
      onclick="showProfile()"
    >
      👤
      <span id="profileName">
        User
      </span>

  </div>

</header>


<!-- ============================================================
     MAIN
============================================================ -->

<div class="container">


  <div class="top-bar">

    <div>

      <div class="page-title">
        Dashboard
      </div>

      <div class="page-subtitle">
        Manage your support data

    </div>


    <div class="top-actions">

      <button

        ↻ Refresh

      <button
        class="btn btn-primary"
        onclick="openNewEntry()"
      >
        + New Entry

    </div>

  </div>


  <!-- ============================================================
       STATS
  ============================================================ -->

  <div class="stats">

    <div class="stat">

      <div class="stat-label">
        Total Data
      </div>

      <div
        class="stat-value"
        id="totalData"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Showing
      </div>

      <div
        class="stat-value"
        id="showingData"
      >
        0
      </div>

    </div>

  </div>


  <!-- ============================================================
       FILTER
  ============================================================ -->

  <div class="filter-card">

    <div class="filter-grid">


      <div class="field">

        <label>
          Search
        </label>

        <input
          type="text"
          id="searchInput"
          placeholder="Search name, IP or work..."
          oninput="applyFilters()"
        >

      </div>


      <div class="field">

        <label>
          From Date
        </label>

        <input
          type="date"
          id="fromDate"
          onchange="applyFilters()"
        >

      </div>


      <div class="field">

        <label>
          To Date
        </label>

        <input
          type="date"
          id="toDate"
          onchange="applyFilters()"
        >

      </div>


      <div class="field">

        <label>
          Data Type
        </label>

        <select
          id="dataType"
          onchange="changeDataType()"
        >

          <option value="data">
            Data
          </option>

          <option value="sell">
            Sell
          </option>

          <option value="delete">
            Delete
          </option>

        </select>

      </div>


      <button
        class="btn btn-secondary"
        onclick="clearFilters()"
      >
        Clear
      </button>


    </div>

  </div>


  <!-- ============================================================
       TABLE
  ============================================================ -->

  <div class="table-card">

    <div class="table-wrap">

      <table>

        <thead id="tableHead">

          <tr>

            <th>
              Name
            </th>

            <th>
              IP
            </th>

            <th>
              Work
            </th>

            <th>
              Date
            </th>

            <th>
              Action
            </th>

          </tr>

        </thead>


        <tbody id="tableBody">

          <tr>

            <td
              colspan="5"

              Loading data...

            </td>

          </tr>

        </tbody>

      </table>

    </div>


    <!-- PAGINATION -->

    <div class="pagination">

      <div
        class="page-info"
        id="pageInfo"
      >
        Page 1
      </div>


      <div
        class="page-buttons"
        id="pageButtons"
      >
      </div>

    </div>

  </div>

</div>


<!-- ============================================================
     NEW ENTRY MODAL
============================================================ -->

>

<!-- ============================================================
     PROFILE MODAL
============================================================ -->

<div
  class="modal"
  id="profileModal"
>

  <div class="modal-box">

    <div class="modal-header">

      <div class="modal-title">
        Profile

        ×

<!-- ============================================================
     TOAST
============================================================ -->

  class="toast-container"

></div>


<script>

/* ============================================================
   4 API URLS
============================================================ */

// 1. USER API
const USER_API_URL =
  "https://script.google.com/macros/s/AKfycbw00GHHheuvtdQtgPURjs4PtsM48-4yaFx-_ms0ZBV5FHhnmcdbJ5DHr3Aix8JPF0kQzA/exec";


// 2. SELL API
const SELL_API_URL =
  "https://script.google.com/macros/s/AKfycbyiKn1MH1ZQvebSIo83bZzbbfJimmfRf9PjlPI4w1q1UliuF27gKViYM24oXakpkHuP/exec";


// 3. DELETE API
const DELETE_API_URL =
  "https://script.google.com/macros/s/AKfycbwDL1JIV7QYcH84VGiWxhUoT-wN9UfuGn0t9boYrs_FaG_ZfcVGjNmaTqSTC6ev0Ig9Kg/exec";


// 4. NEW ENTRY / MAIN DATA API
const DATA_API_URL =
  "https://script.google.com/macros/s/AKfycbz59T-4CKQDbHJB_ql6OYZf18eN7XUmttp0d2FaOM5pm27yCBOWrEilqA_zMOnFq_rz/exec";


/* ============================================================
   VARIABLES
============================================================ */

let allData = [];

let filteredData = [];

let currentPage = 1;

const rowsPerPage = 10;

let currentType = "data";

let editingRow = null;


// Cache
const dataCache = {
  data: null,
  sell: null,
  delete: null
};


/* ============================================================
   LOGIN CHECK
============================================================ */

function checkLogin(){

  const logged =
    localStorage.getItem("dashboardAuth") ||
    sessionStorage.getItem("dashboardAuth");

  if(
    logged !== "true"
  ){

    window.location.href =
      "index.html";

    return false;

  }

  return true;

}


/* ============================================================
   LOAD PROFILE
============================================================ */

function loadProfile(){

  let userData = null;

  try{

    const raw =
      localStorage.getItem("userData");

    if(raw){

      userData =
        JSON.parse(raw);

    }

  }catch(e){}


  const name =
    localStorage.getItem("name") ||
    localStorage.getItem("loggedUser") ||
    (userData && userData.name) ||
    "User";


  const username =
    localStorage.getItem("username") ||
    (userData && userData.username) ||
    "-";


  const role =
    localStorage.getItem("role") ||
    (userData && userData.role) ||
    "-";


  document.getElementById(
    "profileName"
  ).textContent = name;


  document.getElementById(
    "profileModalName"
  ).textContent = name;


  document.getElementById(
    "profileUsername"
  ).textContent = username;


  document.getElementById(
    "profileRole"
  ).textContent = role;

}


/* ============================================================
   PAGE LOAD
============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    if(!checkLogin()) return;

    loadProfile();

    /*
     * IMPORTANT:
     * Only Data API is loaded initially.
     * Sell/Delete are NOT loaded here.
     */

    loadData("data");

  }
);


/* ============================================================
   API URL SELECTOR
============================================================ */

function getApiUrl(type){

  if(type === "sell"){

    return SELL_API_URL;

  }

  if(type === "delete"){

    return DELETE_API_URL;

  }

  return DATA_API_URL;

}


/* ============================================================
   API ACTION SELECTOR
============================================================ */

function getGetAction(type){

  if(type === "sell"){

    return "getSellData";

  }

  if(type === "delete"){

    return "getDeletedData";

  }

  return "getData";

}


/* ============================================================
   LOAD DATA
============================================================ */

async function loadData(type){

  currentType = type;

  currentPage = 1;


  /*
   * If cached data exists:
   * show it immediately.
   */

  if(
    dataCache[type] !== null
  ){

    allData =
      dataCache[type];

    applyFilters();


    /*
     * Refresh selected API in background.
     */

    refreshFromApi(
      type,
      true
    );

    return;

  }


  showTableLoading();


  await refreshFromApi(
    type,
    false
  );

}


/* ============================================================
   REFRESH FROM API
============================================================ */

async function refreshFromApi(
  type,
  silent
){

  if(!silent){

    showTableLoading();

  }


  try{

    const api =
      getApiUrl(type);

    const action =
      getGetAction(type);


    const url =
      api +
      "?action=" +
      encodeURIComponent(action) +
      "&_=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const result =
      await response.json();


    if(
      !result ||
      result.success === false
    ){

      throw new Error(
        result &&
        result.message
          ? result.message
          : "Failed to load data"
      );

    }


    const newData =
      Array.isArray(result.data)
        ? result.data
        : [];


    dataCache[type] =
      newData;


    /*
     * Only use latest response
     * if user is still viewing
     * this type.
     */

    if(
      currentType === type
    ){

      allData =
        newData;

      applyFilters();

    }


  }catch(error){

    if(!silent){

      showTableError(
        error.message
      );

    }else{

      showToast(
        "Refresh failed: " +
        error.message,
        "error"
      );

    }

  }

}


/* ============================================================
   CHANGE DATA TYPE
============================================================ */

function changeDataType(){

  const type =
    document.getElementById(
      "dataType"
    ).value;


  loadData(type);

}


/* ============================================================
   TABLE LOADING
============================================================ */

function showTableLoading(){

  const colspan =
    currentType === "data"
      ? 5
      : 6;


  document.getElementById(
    "tableBody"
  ).innerHTML = `

    <tr>

      <td
        colspan="${colspan}"
        class="empty"
      >

        <div class="table-loading">

          <div class="spinner"></div>

          Loading data...

        </div>

      </td>

    </tr>

  `;

}


/* ============================================================
   TABLE ERROR
============================================================ */

function showTableError(message){

  const colspan =
    currentType === "data"
      ? 5
      : 6;


  document.getElementById(
    "tableBody"

/* ============================================================
   FILTER
============================================================ */

function applyFilters(){

  const search =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();


  const from =
    document.getElementById(
      "fromDate"
    ).value;


  const to =
    document.getElementById(
      "toDate"
    ).value;


  filteredData =
    allData.filter(
      item => {

        let matchesSearch = true;

        let matchesFrom = true;

        let matchesTo = true;


        if(search){

          const text = (

            String(
              item.Name || ""
            ) +

            " " +

            String(
              item.IP ||
              item.Ip ||
              ""
            ) +

            " " +

            String(
              item.Work || ""
            )

          ).toLowerCase();


          matchesSearch =
            text.includes(search);

        }


        const dateValue =
          String(
            item.Date || ""
          );


        if(from){

          matchesFrom =
            dateValue >= from;

        }


        if(to){

          matchesTo =
            dateValue <= to;

        }


        return (
          matchesSearch &&
          matchesFrom &&
          matchesTo
        );

      }
    );


  currentPage = 1;

  renderTable();

}


/* ============================================================
   RENDER TABLE
============================================================ */

function renderTable(){

  const tbody =
    document.getElementById(
      "tableBody"
    );


  const total =
    filteredData.length;


  document.getElementById(
    "totalData"
  ).textContent =
    total;


  const totalPages =
    Math.max(
      1,
      Math.ceil(
        total /
        rowsPerPage
      )
    );


  if(
    currentPage >
    totalPages
  ){

    currentPage =
      totalPages;

  }


  const start =
    (currentPage - 1) *
    rowsPerPage;


  const end =
    Math.min(
      start +
      rowsPerPage,
      total
    );


  const pageData =
    filteredData.slice(
      start,
      end
    );


  document.getElementById(
    "showingData"
  ).textContent =
    pageData.length;


  /* --------------------------------
     HEADERS
  -------------------------------- */

  const thead =
    document.getElementById(
      "tableHead"
    );


  if(
    currentType === "data"
  ){

    thead.innerHTML = `

      <tr>

        <th>Name</th>

        <th>Work</th>

        <th>Date</th>

        <th>Action</th>

  }else{

        <th>IP</th>

        <th>Work</th>

        <th>Date</th>

        <th>${extra}</th>

  /* --------------------------------

  -------------------------------- */

  if(pageData.length === 0){

  /* --------------------------------

  if(

    tbody.innerHTML =
      pageData
        .map(
          item => `

            <tr>

              <td>
                ${escapeHtml(item.Name)}
              </td>

              <td>
                ${escapeHtml(
                  item.IP ||

                  ""
                )}
              </td>

              <td>
                ${escapeHtml(item.Work)}
              </td>

              <td>
                ${formatDisplayDate(item.Date)}
              </td>

              <td>

                <div class="action-box">

                  <button
                    class="action-btn edit-btn"
                    onclick="editEntry(${item.row})"
                  >
                    Edit
                  </button>

                  <button
                    class="action-btn sell-btn"
                    onclick="sellEntry(${item.row})"
                  >
                    Sell
                  </button>

                  <button
                    class="action-btn delete-btn"

                    Delete

                </div>

              </td>

            </tr>

          `
        )
        .join("");

  }


  /* --------------------------------
     SELL
  -------------------------------- */

  else if(
    currentType === "sell"
  ){

    tbody.innerHTML =
      pageData
        .map(
          item => `

            <tr>

              <td>
                ${escapeHtml(item.Name)}
              </td>

              <td>
                ${escapeHtml(
                  item.IP ||
                  item.Ip ||

              </td>

              <td>
                ${escapeHtml(item.Work)}
              </td>

              <td>

                ${escapeHtml(

              </td>

              <td>
                ${escapeHtml(
                  item.User ||
                  ""
                )}

            </tr>

  /* --------------------------------

  else{

    tbody.innerHTML =
      pageData
        .map(
          item => `

            <tr>

              <td>
                ${escapeHtml(item.Name)}
              </td>

/* ============================================================
   PAGINATION
============================================================ */

function renderPagination(){

  const total =
    filteredData.length;


  const totalPages =
    Math.max(
      1,
      Math.ceil(
        total /
        rowsPerPage
      )
    );


  const buttons =
    document.getElementById(
      "pageButtons"
    );


  document.getElementById(
    "pageInfo"
  ).textContent =
    "Page " +
    currentPage +
    " of " +
    totalPages;


  let html = "";


  html += `

    <button
      class="page-btn"
      onclick="goToPage(${currentPage - 1})"
      ${currentPage <= 1 ? "disabled" : ""}
    >
      ‹
    </button>

  `;


  const maxButtons = 5;


  let startPage =
    Math.max(
      1,
      currentPage -
      Math.floor(maxButtons / 2)
    );


  let endPage =
    Math.min(
      totalPages,
      startPage +
      maxButtons -
      1
    );


  if(
    endPage -
    startPage +
    1 <
    maxButtons
  ){

    startPage =
      Math.max(
        1,
        endPage -
        maxButtons +
        1
      );

  }


  for(
    let i = startPage;
    i <= endPage;
    i++
  ){

    html += `

      <button
        class="page-btn ${
          i === currentPage
            ? "active"
            : ""
        }"
        onclick="goToPage(${i})"
      >
        ${i}
      </button>

    `;

  }


  html += `

    <button
      class="page-btn"
      onclick="goToPage(${currentPage + 1})"
      ${currentPage >= totalPages ? "disabled" : ""}
    >
      ›
    </button>

  `;


  buttons.innerHTML =
    html;

}


function goToPage(page){

  const totalPages =
    Math.max(
      1,
      Math.ceil(
        filteredData.length /
        rowsPerPage
      )
    );


  if(
    page < 1 ||
    page > totalPages
  ){

    return;

  }


  currentPage =
    page;


  renderTable();

}

/* ============================================================
   EDIT
============================================================ */

function editEntry(row){

  const item =
    allData.find(
      x =>
        Number(x.row) ===
        Number(row)
    );


  if(!item){

    showToast(
      "Data not found",
      "error"
    );

    return;

  }


  editingRow =
    row;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Edit Entry";


  document.getElementById(
    "saveBtn"
  ).textContent =
    "Update";


  document.getElementById(
    "entryName"
  ).value =
    item.Name || "";


  document.getElementById(
    "entryIp"
  ).value =

    "entryWork"
  ).value =

  ).value =
    item.Date || "";

}


/* ============================================================
   SAVE / UPDATE
============================================================ */

async function saveEntry(){

  const name =
    document.getElementById(
      "entryName"
    ).value.trim();


  const ip =
    document.getElementById(
      "entryIp"
    ).value.trim();


  const work =
    document.getElementById(
      "entryWork"
    ).value.trim();


  const date =
    document.getElementById(
      "entryDate"
    ).value;


  if(!name){

    showToast(
      "Name is required",
      "error"
    );

    return;

  }


  if(!ip){

    showToast(
      "IP is required",
      "error"
    );

    return;

  }


  if(!work){

    showToast(
      "Work is required",
      "error"
    );

    return;

  }


  if(!date){

    showToast(
      "Date is required",
      "error"
    );

    return;

  }


  const saveBtn =
    document.getElementById(
      "saveBtn"
    );


  saveBtn.disabled =
    true;

  saveBtn.textContent =
    editingRow
      ? "Updating..."
      : "Saving...";


  try{

    const action =
      editingRow
        ? "editData"
        : "addData";


    const body = {

      action: action,

      name: name,

      ip: ip,

      work: work,

      date: date

    };


    if(editingRow){

      body.row =
        editingRow;

    }


    const response =
      await fetch(
        DATA_API_URL,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },
          body:
            JSON.stringify(body)
        }
      );


    const result =
      await response.json();


    if(
      !result ||
      result.success === false
    ){

      throw new Error(
        result &&
        result.message
          ? result.message
          : "Operation failed"
      );

    }


    dataCache.data =
      null;


    closeEntryModal();


    showToast(
      editingRow
        ? "Entry updated successfully"
        : "Entry added successfully",
      "success"
    );


    editingRow =
      null;


    await loadData(
      "data"
    );

  }catch(error){

    showToast(
      error.message,
      "error"
    );

  }finally{

    saveBtn.disabled =
      false;

    saveBtn.textContent =
      editingRow
        ? "Update"
        : "Save";

  }

}


/* ============================================================
   SELL
============================================================ */

async function sellEntry(row){

  const item =
    allData.find(
      x =>
        Number(x.row) ===
        Number(row)
    );


  if(!item){

    showToast(
      "Data not found",
      "error"
    );

    return;

  }


  const username =
    localStorage.getItem(
      "username"
    ) ||
    localStorage.getItem(
      "loggedUser"
    ) ||
    "";


  if(
    !confirm(
      "Are you sure you want to sell this entry?"
    )
  ){

    return;

  }


  try{

    const response =
      await fetch(
        SELL_API_URL,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },
          body:
            JSON.stringify({

              action:
                "sellData",

              row:
                row,

              user:
                username

            })

        }
      );


    const result =
      await response.json();


    if(
      !result ||
      result.success === false
    ){

      throw new Error(
        result &&
        result.message
          ? result.message
          : "Sell failed"
      );

    }


    /*
     * Clear both affected caches.
     */

    dataCache.data =
      null;

    dataCache.sell =
      null;


    showToast(
      "Entry sold successfully",
      "success"
    );


    /*
     * Reload current Data only.
     */

    await loadData(
      "data"
    );

  }catch(error){

    showToast(
      error.message,
      "error"
    );

  }

}


/* ============================================================
   DELETE
============================================================ */

async function deleteEntry(row){

  const item =
    allData.find(
      x =>
        Number(x.row) ===
        Number(row)
    );


  if(!item){

    showToast(
      "Data not found",
      "error"
    );

    return;

  }


  if(
    !confirm(
      "Are you sure you want to delete this entry?"
    )
  ){

    return;

  }


  const username =
    localStorage.getItem(
      "username"
    ) ||
    localStorage.getItem(
      "loggedUser"
    ) ||
    "";


  try{

    /*
     * STEP 1:
     * Save to Delete Sheet
     */

    const archiveResponse =
      await fetch(
        DELETE_API_URL,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },
          body:
            JSON.stringify({

              action:
                "deleteData",

              name:
                item.Name || "",

              ip:
                item.IP ||
                item.Ip ||
                "",

              work:
                item.Work || "",

              date:
                item.Date || "",

              user:
                username

            })

        }
      );


    const archiveResult =
      await archiveResponse.json();


    if(
      !archiveResult ||
      archiveResult.success === false
    ){

      throw new Error(
        archiveResult &&
        archiveResult.message
          ? archiveResult.message
          : "Could not save Delete record"
      );

    }


    /*
     * STEP 2:
     * Remove from Main Data Sheet
     */

    const deleteResponse =
      await fetch(
        DATA_API_URL,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },
          body:
            JSON.stringify({

              action:
                "deleteData",

              row:
                row

            })

        }
      );


    const deleteResult =
      await deleteResponse.json();


    if(
      !deleteResult ||
      deleteResult.success === false
    ){

      throw new Error(
        deleteResult &&
        deleteResult.message
          ? deleteResult.message
          : "Could not remove main data"
      );

    }


    /*
     * Clear affected caches.
     */

    dataCache.data =
      null;

    dataCache.delete =
      null;


    showToast(
      "Entry deleted successfully",
      "success"
    );


    await loadData(
      "data"
    );

  }catch(error){

    showToast(
      error.message,
      "error"
    );

  }

}

/* ============================================================

============================================================ */

function showToast(
  message,
  type="success"
){

  const container =
    document.getElementById(
      "toastContainer"
    );


  const toast =
    document.createElement(
      "div"
    );


  toast.className =
    "toast " +
    type;


  toast.textContent =
    message;


  container.appendChild(
    toast
  );


  setTimeout(
    () => {

      toast.remove();

    },
    3000
  );

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* ============================================================
   DATE DISPLAY
============================================================ */

function formatDisplayDate(value){

  if(!value){

    return "";

  }


  const text =
    String(value);


  if(
    /^\d{4}-\d{2}-\d{2}$/.test(
      text
    )
  ){

    const parts =
      text.split("-");


    return (
      parts[2] +
      "/" +
      parts[1] +
      "/" +
      parts[0]
    );

  }


  return text;

}

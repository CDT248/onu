<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ewwar AGM Username</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#123f34,#1f6b59,#0d3028);
    color:white;
    overflow:hidden;
}

/* Background circles */

body::before,
body::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.05);
}

body::before{
    width:400px;
    height:400px;
    top:-150px;
    left:-100px;
}

body::after{
    width:500px;
    height:500px;
    bottom:-220px;
    right:-150px;
}


/* Main Box */

.container{
    position:relative;
    z-index:2;
    width:90%;
    max-width:650px;
    padding:55px 35px;
    text-align:center;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius:30px;

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    box-shadow:0 25px 70px rgba(0,0,0,.35);
}


/* Logo / Title */

.logo{
    font-size:34px;
    font-weight:bold;
    color:#80cbc4;
    margin-bottom:12px;
}

.subtitle{
    font-size:15px;
    color:#c9ded9;
    margin-bottom:35px;
}


/* Loading Circle */

.loader{
    width:90px;
    height:90px;
    margin:0 auto 30px;

    border:7px solid rgba(255,255,255,.15);
    border-top:7px solid #70c8be;
    border-right:7px solid #70c8be;

    border-radius:50%;

    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}


/* Main Message */

h1{
    font-size:28px;
    margin-bottom:15px;
}

.message{
    font-size:16px;
    line-height:1.7;
    color:#d7e7e3;
    margin-bottom:30px;
}


/* Status */

.status{
    display:inline-flex;
    align-items:center;
    gap:10px;

    padding:10px 20px;

    border-radius:30px;

    background:rgba(112,200,190,.12);
    border:1px solid rgba(112,200,190,.25);

    color:#9de0d8;

    font-size:13px;
}


/* Green Dot */

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#69d6a8;

    box-shadow:0 0 12px #69d6a8;

    animation:pulse 1.5s infinite;
}

@keyframes pulse{

    0%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.4;
        transform:scale(1.4);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }

}


/* Time */

.time{
    margin-top:30px;
    font-size:13px;
    color:#91aaa3;
}


/* Footer */

.footer{
    margin-top:35px;
    padding-top:20px;

    border-top:1px solid rgba(255,255,255,.1);

    font-size:11px;
    color:#78948e;
}


/* Mobile */

@media(max-width:600px){

    .container{
        width:92%;
        padding:40px 22px;
        border-radius:25px;
    }

    .logo{
        font-size:27px;
    }

    h1{
        font-size:23px;
    }

    .message{
        font-size:14px;
    }

    .loader{
        width:75px;
        height:75px;
    }

}

</style>

</head>

<body>


<div class="container">

    <div class="logo">
        Ewwar AGM Username
    </div>

    <div class="subtitle">
        Website Service
    </div>


    <div class="loader"></div>


    <h1>
        কাজ চলছে
    </h1>


    <div class="message">
        আপনার সাইটে বর্তমানে কাজ চলছে।<br>
        অনুগ্রহ করে কিছুক্ষণ অপেক্ষা করুন।<br>
        কাজ শেষ হলে সাইটটি আবার ব্যবহার করতে পারবেন।
    </div>


    <div class="status">

        <span class="dot"></span>

        Site Work In Progress

    </div>


    <div class="time">

        বর্তমান সময়:
        <span id="time">Loading...</span>

    </div>


    <div class="footer">

        © 2026 Ewwar AGM Username
        <br>
        Please wait while we improve the website.

    </div>

</div>


<script>

/* Live Bangladesh Time */

function updateTime(){

    const now = new Date();

    const options = {
        timeZone:"Asia/Dhaka",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
    };

    const time =
        now.toLocaleTimeString("en-US",options);

    document.getElementById("time").innerText = time;

}

updateTime();

setInterval(updateTime,1000);

</script>


</body>
</html>

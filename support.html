<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Dashboard</title>
<link rel="icon" href="17163834.png">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#1f2937;
  min-height:100vh;
  transition:.3s;
}

body.dark{
  background:#111827;
  color:#f3f4f6;
}

.header{
  height:70px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:100;
}

body.dark .header{
  background:#1f2937;
  box-shadow:0 2px 10px rgba(0,0,0,.3);
}

.header-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:12px;
  object-fit:cover;
}

.header-title{
  font-size:20px;
  font-weight:700;
}

.header-right{
  display:flex;
  align-items:center;
  gap:9px;
}

button{
  border:none;
  cursor:pointer;
  font-family:inherit;
}

.btn{
  padding:10px 15px;
  border-radius:9px;
  font-weight:600;
  font-size:14px;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:#16a34a;
  color:#fff;
}

.btn-primary:hover{
  background:#15803d;
}

.btn-blue{
  background:#2563eb;
  color:#fff;
}

.btn-dark{
  background:#374151;
  color:#fff;
}

.btn-danger{
  background:#dc2626;
  color:#fff;
}

.btn-warning{
  background:#f59e0b;
  color:#fff;
}

.profile{
  position:relative;
}

.profile-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#16a34a;
  color:white;
  font-weight:bold;
  font-size:16px;
}

.profile-menu{
  display:none;
  position:absolute;
  right:0;
  top:52px;
  width:180px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 8px 25px rgba(0,0,0,.15);
  overflow:hidden;
  z-index:200;
}

body.dark .profile-menu{
  background:#1f2937;
}

.profile-menu.show{
  display:block;
}

.profile-menu button{
  width:100%;
  padding:13px 15px;
  text-align:left;
  background:transparent;
  color:#374151;
  font-size:14px;
}

body.dark .profile-menu button{
  color:#f3f4f6;
}

.profile-menu button:hover{
  background:#f3f4f6;
}

body.dark .profile-menu button:hover{
  background:#374151;
}

.container{
  max-width:1500px;
  margin:auto;
  padding:22px;
}

.top-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  gap:15px;
}

.top-title h2{
  font-size:23px;
  margin-bottom:4px;
}

.top-title p{
  color:#6b7280;
  font-size:13px;
}

body.dark .top-title p{
  color:#9ca3af;
}

.filters{
  background:#fff;
  padding:15px;
  border-radius:12px;
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
  margin-bottom:18px;
}

body.dark .filters{
  background:#1f2937;
}

.search-box{
  flex:1;
  min-width:220px;
}

input,
select{
  width:100%;
  padding:11px 12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  background:#fff;
  color:#111827;
  outline:none;
}

body.dark input,
body.dark select{
  background:#111827;
  color:#f3f4f6;
  border-color:#4b5563;
}

input:focus,
select:focus{
  border-color:#16a34a;
}

.filter-small{
  width:160px;
}

.table-wrap{
  background:#fff;
  border-radius:12px;
  overflow:auto;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

body.dark .table-wrap{
  background:#1f2937;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:900px;
}

th{
  background:#f3f4f6;
  padding:13px 12px;
  text-align:left;
  font-size:13px;
  white-space:nowrap;
}

body.dark th{
  background:#374151;
}

td{
  padding:12px;
  border-top:1px solid #e5e7eb;
  font-size:13px;
}

body.dark td{
  border-color:#374151;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.action-btn{
  padding:7px 10px;
  border-radius:7px;
  color:#fff;
  font-size:12px;
  font-weight:600;
}

.edit{
  background:#2563eb;
}

.sell{
  background:#f59e0b;
}

.delete{
  background:#dc2626;
}

.empty{
  text-align:center;
  padding:35px;
  color:#6b7280;
}

.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  padding:18px;
}

.pagination button{
  padding:8px 13px;
  border-radius:7px;
  background:#e5e7eb;
}

body.dark .pagination button{
  background:#374151;
  color:#fff;
}

.pagination button.active{
  background:#16a34a;
  color:#fff;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  align-items:center;
  justify-content:center;
  z-index:500;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:500px;
  background:#fff;
  border-radius:15px;
  padding:22px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

body.dark .modal-box{
  background:#1f2937;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-header h3{
  font-size:19px;
}

.close{
  background:none;
  font-size:25px;
  color:#6b7280;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:600;
}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:18px;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111827;
  color:#fff;
  padding:13px 17px;
  border-radius:9px;
  display:none;
  z-index:1000;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.toast.show{
  display:block;
}

.loader{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:900;
}

body.dark .loader{
  background:rgba(17,24,39,.75);
}

.loader.show{
  display:flex;
}

.spinner{
  width:45px;
  height:45px;
  border:4px solid #d1d5db;
  border-top-color:#16a34a;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@media(max-width:700px){
  .header{
    padding:0 12px;
  }

  .header-title{
    font-size:16px;
  }

  .header-right .btn{
    padding:8px 10px;
    font-size:12px;
  }

  .container{
    padding:12px;
  }

  .top-actions{
    align-items:flex-start;
    flex-direction:column;
  }

  .filter-small{
    width:100%;
  }

  .search-box{
    min-width:100%;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-left">
    <img src="17163834.png" class="logo" onerror="this.style.display='none'">
    <div class="header-title">Support Dashboard</div>
  </div>

  <div class="header-right">
    <button class="btn btn-dark" onclick="loadData()">Reload</button>
    <button class="btn btn-primary" onclick="openNewEntry()">+ New Entry</button>
    <button class="btn btn-blue" onclick="toggleTheme()">Dark Mode</button>

    <div class="profile">
      <button class="profile-btn" onclick="toggleProfile()">U</button>

      <div class="profile-menu" id="profileMenu">
        <button onclick="openPasswordModal()">Change Password</button>
        <button onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
</header>

<main class="container">

  <div class="top-actions">
    <div class="top-title">
      <h2 id="dataTitle">Data</h2>
      <p id="dataSubtitle">Support data entries</p>
    </div>

    <button class="btn btn-primary" onclick="loadData()">Refresh Data</button>
  </div>

  <div class="filters">

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Search..."
        oninput="applyFilters()"
      >
    </div>

    <div class="filter-small">
      <input
        type="date"
        id="fromDate"
        onchange="applyFilters()"
      >
    </div>

    <div class="filter-small">
      <input
        type="date"
        id="toDate"
        onchange="applyFilters()"
      >
    </div>

    <!-- Sell / Paid / Delete sections removed -->
    <div class="filter-small">
      <select id="dataType" onchange="changeDataType()">
        <option value="data">Data</option>
      </select>
    </div>

    <button class="btn btn-dark" onclick="clearFilters()">Clear</button>

  </div>

  <div class="table-wrap">
    <table>
      <thead id="tableHead">
        <tr>
          <th>Name</th>
          <th>IP</th>
          <th>Work</th>
          <th>Date</th>
          <th>Item</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="tableBody">
        <tr>
          <td colspan="6" class="empty">Loading...</td>
        </tr>
      </tbody>
    </table>

    <div class="pagination" id="pagination"></div>
  </div>

</main>


<!-- New / Edit Entry Modal -->
<div class="modal" id="entryModal">
  <div class="modal-box">

    <div class="modal-header">
      <h3 id="entryModalTitle">New Entry</h3>
      <button class="close" onclick="closeModal('entryModal')">&times;</button>
    </div>

    <div class="form-group">
      <label>Name</label>
      <input type="text" id="entryName" readonly>
    </div>

    <div class="form-group">
      <label>IP</label>
      <input type="text" id="entryIp" placeholder="Enter IP">
    </div>

    <div class="form-group">
      <label>Work</label>
      <input type="text" id="entryWork" placeholder="Enter Work">
    </div>

    <div class="form-group">
      <label>Date</label>
      <input type="date" id="entryDate">
    </div>

    <div class="form-group">
      <label>Item</label>
      <input type="text" id="entryItem" placeholder="Enter Item">
    </div>

    <div class="modal-footer">
      <button class="btn btn-dark" onclick="closeModal('entryModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveEntry()">Save</button>
    </div>

  </div>
</div>


<!-- Password Modal -->
<div class="modal" id="passwordModal">
  <div class="modal-box">

    <div class="modal-header">
      <h3>Change Password</h3>
      <button class="close" onclick="closeModal('passwordModal')">&times;</button>
    </div>

    <div class="form-group">
      <label>Current Password</label>
      <input type="password" id="currentPassword">
    </div>

    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="newPassword">
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword">
    </div>

    <div class="modal-footer">
      <button class="btn btn-dark" onclick="closeModal('passwordModal')">Cancel</button>
      <button class="btn btn-primary" onclick="changePassword()">Change</button>
    </div>

  </div>
</div>


<div class="loader" id="loader">
  <div class="spinner"></div>
</div>

<div class="toast" id="toast"></div>


<script>

const USER_API_URL =
'https://script.google.com/macros/s/AKfycbw00GHHheuvtdQtgPURjs4PtsM48-4yaFx-_ms0ZBV5FHhnmcdbJ5DHr3Aix8JPF0kQzA/exec';

const DATA_API_URL =
'https://script.google.com/macros/s/AKfycbz59T-4CKQDbHJB_ql6OYZf18eN7XUmttp0d2FaOM5pm27yCBOWrEilqA_zMOnFq_rz/exec';

const SELL_API_URL =
'https://script.google.com/macros/s/AKfycbyiKn1MH1ZQvebSIo83bZzbbfJimmfRf9PjlPI4w1q1UliuF27gKViYM24oXakpkHuP/exec';

const PAID_API_URL =
'https://script.google.com/macros/s/AKfycb_y_kDEHln_Dj_0YfB421POWa2XAuN6g2PDypQtyS2arrxgPVtyZZOwAp_TKLrUnRudKng/exec';

const DELETE_API_URL =
'https://script.google.com/macros/s/AKfycbwDL1JIV7QYcH84VGiWxhUoT-wN9UfuGn0t9boYrs_FaG_ZfcVGjNmaTqSTC6ev0Ig9Kg/exec';

const ITEM_API_URL =
'https://script.google.com/macros/s/AKfycby2e7dzGE5vkS0Q-Eyl9MKLAbkkkD8f37eIVj7VuV8bPytWGOH7cwJ3w25efP7MLGshOw/exec';


let allData = [];
let filteredData = [];

let currentDataType = 'data';
let currentUsername = '';

let currentPage = 1;
const rowsPerPage = 10;

let editingDataRow = null;
let editingSellRow = null;

let dataCache = [];
let sellCache = [];
let paidCache = [];
let deleteCache = [];

let itemList = [];


document.addEventListener('DOMContentLoaded', function(){

  loadTheme();
  checkLogin();
  loadUser();
  loadData();
  loadItems();

  setupBackProtection();

});


function checkLogin(){

  const auth =
    sessionStorage.getItem('dashboardAuth') ||
    localStorage.getItem('dashboardAuth');

  if(!auth){
    window.location.href = 'index.html';
  }

}


function loadUser(){

  currentUsername =
    localStorage.getItem('username') ||
    localStorage.getItem('loggedUser') ||
    '';

  if(!currentUsername) return;

  fetch(
    USER_API_URL +
    '?action=getUser&username=' +
    encodeURIComponent(currentUsername)
  )
  .then(r => r.json())
  .then(data => {

    if(!data || !data.success) return;

    const user = data.user || data;

    localStorage.setItem(
      'userData',
      JSON.stringify(user)
    );

    if(
      user.status &&
      (
        user.status.toLowerCase() === 'blocked' ||
        user.status.toLowerCase() === 'inactive'
      )
    ){
      logout();
      return;
    }

    const name =
      user.name ||
      user.Name ||
      currentUsername;

    document.querySelector('.profile-btn').textContent =
      name.charAt(0).toUpperCase();

    document.getElementById('entryName').value = name;

  })
  .catch(err => {
    console.error(err);
  });

}


function changeDataType(){

  /*
    Sell / Paid / Delete sections are removed.
    Data is now the only web section.
  */

  currentDataType = 'data';

  const select = document.getElementById('dataType');

  if(select){
    select.value = 'data';
  }

  updateDataTitle();
  loadData();

}


function updateDataTitle(){

  document.getElementById('dataTitle').textContent = 'Data';
  document.getElementById('dataSubtitle').textContent =
    'Support data entries';

}


function loadData(){

  showLoader();

  currentDataType = 'data';

  fetch(DATA_API_URL + '?action=getData')
    .then(r => r.json())
    .then(data => {

      hideLoader();

      if(Array.isArray(data)){
        allData = data;
      }
      else if(data && Array.isArray(data.data)){
        allData = data.data;
      }
      else if(data && Array.isArray(data.rows)){
        allData = data.rows;
      }
      else{
        allData = [];
      }

      dataCache = allData;

      applyFilters();

    })
    .catch(err => {

      hideLoader();

      console.error(err);

      showToast('Failed to load data');

      allData = [];
      filteredData = [];

      renderData();

    });

}


function renderData(){

  const head = document.getElementById('tableHead');
  const body = document.getElementById('tableBody');

  head.innerHTML = `
    <tr>
      <th>Name</th>
      <th>IP</th>
      <th>Work</th>
      <th>Date</th>
      <th>Item</th>
      <th>Action</th>
    </tr>
  `;

  if(!filteredData.length){

    body.innerHTML = `
      <tr>
        <td colspan="6" class="empty">
          No data found
        </td>
      </tr>
    `;

    document.getElementById('pagination').innerHTML = '';

    return;
  }


  const start =
    (currentPage - 1) * rowsPerPage;

  const end =
    start + rowsPerPage;

  const pageData =
    filteredData.slice(start, end);


  body.innerHTML = pageData.map((row,index) => {

    const actualIndex = start + index;

    const name =
      row.Name ??
      row.name ??
      row[0] ??
      '';

    const ip =
      row.Ip ??
      row.IP ??
      row.ip ??
      row[1] ??
      '';

    const work =
      row.Work ??
      row.work ??
      row[2] ??
      '';

    const date =
      row.Date ??
      row.date ??
      row[3] ??
      '';

    const item =
      row.Item ??
      row.item ??
      row[4] ??
      '';


    return `
      <tr>

        <td>${escapeHtml(name)}</td>

        <td>${escapeHtml(ip)}</td>

        <td>${escapeHtml(work)}</td>

        <td>${escapeHtml(date)}</td>

        <td>${escapeHtml(item)}</td>

        <td>

          <div class="actions">

            <button
              class="action-btn edit"
              onclick="editDataEntry(${actualIndex})">
              Edit
            </button>

            <button
              class="action-btn sell"
              onclick="sellDataEntry(${actualIndex})">
              Sell
            </button>

            <button
              class="action-btn delete"
              onclick="deleteDataEntry(${actualIndex})">
              Delete
            </button>

          </div>

        </td>

      </tr>
    `;

  }).join('');


  renderPagination();

}


function applyFilters(){

  const search =
    document.getElementById('searchInput')
      .value
      .toLowerCase()
      .trim();

  const from =
    document.getElementById('fromDate').value;

  const to =
    document.getElementById('toDate').value;


  filteredData = allData.filter(row => {

    const values = Object.values(row || {});

    const text =
      values.join(' ')
        .toLowerCase();

    if(search && !text.includes(search)){
      return false;
    }


    const dateValue =
      row.Date ??
      row.date ??
      row[3] ??
      '';

    if(from && dateValue){

      const d =
        normalizeDate(dateValue);

      if(d && d < from){
        return false;
      }

    }

    if(to && dateValue){

      const d =
        normalizeDate(dateValue);

      if(d && d > to){
        return false;
      }

    }

    return true;

  });


  currentPage = 1;

  renderData();

}


function normalizeDate(value){

  if(!value) return '';

  const d = new Date(value);

  if(isNaN(d.getTime())){

    const match =
      String(value).match(
        /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
      );

    if(match){

      const day =
        match[1].padStart(2,'0');

      const month =
        match[2].padStart(2,'0');

      const year =
        match[3];

      return `${year}-${month}-${day}`;

    }

    return '';

  }

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,'0'),
    String(d.getDate()).padStart(2,'0')
  ].join('-');

}


function clearFilters(){

  document.getElementById('searchInput').value = '';
  document.getElementById('fromDate').value = '';
  document.getElementById('toDate').value = '';

  currentPage = 1;

  applyFilters();

}


function renderPagination(){

  const totalPages =
    Math.ceil(
      filteredData.length / rowsPerPage
    );

  const pagination =
    document.getElementById('pagination');

  if(totalPages <= 1){

    pagination.innerHTML = '';

    return;

  }


  let html = '';

  html += `
    <button
      onclick="changePage(${currentPage - 1})"
      ${currentPage === 1 ? 'disabled' : ''}>
      Previous
    </button>
  `;


  for(let i=1; i<=totalPages; i++){

    html += `
      <button
        class="${i === currentPage ? 'active' : ''}"
        onclick="changePage(${i})">
        ${i}
      </button>
    `;

  }


  html += `
    <button
      onclick="changePage(${currentPage + 1})"
      ${currentPage === totalPages ? 'disabled' : ''}>
      Next
    </button>
  `;


  pagination.innerHTML = html;

}


function changePage(page){

  const totalPages =
    Math.ceil(
      filteredData.length / rowsPerPage
    );

  if(page < 1 || page > totalPages){
    return;
  }

  currentPage = page;

  renderData();

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


function openNewEntry(){

  editingDataRow = null;

  editingSellRow = null;

  document.getElementById('entryModalTitle').textContent =
    'New Entry';

  const userData =
    JSON.parse(
      localStorage.getItem('userData') || '{}'
    );

  document.getElementById('entryName').value =
    userData.name ||
    userData.Name ||
    currentUsername ||
    '';

  document.getElementById('entryIp').value = '';
  document.getElementById('entryWork').value = '';
  document.getElementById('entryItem').value = '';

  const today =
    new Date();

  const date =
    today.getFullYear() +
    '-' +
    String(today.getMonth()+1).padStart(2,'0') +
    '-' +
    String(today.getDate()).padStart(2,'0');

  document.getElementById('entryDate').value = date;

  document.getElementById('entryModal').classList.add('show');

}


function editDataEntry(index){

  const row =
    filteredData[index];

  if(!row) return;

  editingDataRow = row;

  editingSellRow = null;

  document.getElementById('entryModalTitle').textContent =
    'Edit Entry';

  document.getElementById('entryName').value =
    row.Name ??
    row.name ??
    row[0] ??
    '';

  document.getElementById('entryIp').value =
    row.Ip ??
    row.IP ??
    row.ip ??
    row[1] ??
    '';

  document.getElementById('entryWork').value =
    row.Work ??
    row.work ??
    row[2] ??
    '';

  document.getElementById('entryDate').value =
    normalizeDate(
      row.Date ??
      row.date ??
      row[3] ??
      ''
    );

  document.getElementById('entryItem').value =
    row.Item ??
    row.item ??
    row[4] ??
    '';

  document.getElementById('entryModal').classList.add('show');

}


function saveEntry(){

  const name =
    document.getElementById('entryName').value.trim();

  const ip =
    document.getElementById('entryIp').value.trim();

  const work =
    document.getElementById('entryWork').value.trim();

  const date =
    document.getElementById('entryDate').value;

  const item =
    document.getElementById('entryItem').value.trim();


  if(!name || !ip || !work || !date){

    showToast('Please fill all required fields');

    return;

  }


  showLoader();


  if(editingDataRow){

    const payload = {

      action:'editData',

      row: editingDataRow.row ||
           editingDataRow.rowNumber ||
           editingDataRow._row,

      name:name,
      ip:ip,
      work:work,
      date:date,
      item:item,
      username:currentUsername

    };


    fetch(DATA_API_URL,{

      method:'POST',

      body:JSON.stringify(payload)

    })
    .then(r => r.json())
    .then(result => {

      hideLoader();

      if(result && result.success){

        closeModal('entryModal');

        showToast('Entry updated successfully');

        editingDataRow = null;

        loadData();

      }
      else{

        showToast(
          result?.message ||
          'Update failed'
        );

      }

    })
    .catch(err => {

      hideLoader();

      console.error(err);

      showToast('Update failed');

    });

    return;

  }


  const payload = {

    action:'addData',

    name:name,
    ip:ip,
    work:work,
    date:date,
    item:item,
    username:currentUsername

  };


  fetch(DATA_API_URL,{

    method:'POST',

    body:JSON.stringify(payload)

  })
  .then(r => r.json())
  .then(result => {

    hideLoader();

    if(result && result.success){

      closeModal('entryModal');

      showToast('Entry added successfully');

      loadData();

    }
    else{

      showToast(
        result?.message ||
        'Failed to add entry'
      );

    }

  })
  .catch(err => {

    hideLoader();

    console.error(err);

    showToast('Failed to add entry');

  });

}

function openPasswordModal(){

  document.getElementById('currentPassword').value = '';
  document.getElementById('newPassword').value = '';
  document.getElementById('confirmPassword').value = '';

  document.getElementById('passwordModal')
    .classList.add('show');

  toggleProfile();

}


function changePassword(){

  const currentPassword =
    document.getElementById('currentPassword').value;

  const newPassword =
    document.getElementById('newPassword').value;

  const confirmPassword =
    document.getElementById('confirmPassword').value;


  if(!currentPassword ||
     !newPassword ||
     !confirmPassword){

    showToast('Please fill all fields');

    return;

  }


  if(newPassword !== confirmPassword){

    showToast('New passwords do not match');

    return;

  }


  showLoader();


  fetch(USER_API_URL,{

    method:'POST',

    body:JSON.stringify({

      action:'changePassword',

      username:currentUsername,

      currentPassword:currentPassword,

      newPassword:newPassword

    })

  })
  .then(r => r.json())
  .then(result => {

    hideLoader();

    if(result && result.success){

      closeModal('passwordModal');

      showToast('Password changed successfully');

    }
    else{

      showToast(
        result?.message ||
        'Password change failed'
      );

    }

  })
  .catch(err => {

    hideLoader();

    console.error(err);

    showToast('Password change failed');

  });

}


function toggleProfile(){

  document
    .getElementById('profileMenu')
    .classList.toggle('show');

}


document.addEventListener('click', function(e){

  const profile =
    document.querySelector('.profile');

  if(
    profile &&
    !profile.contains(e.target)
  ){

    document
      .getElementById('profileMenu')
      .classList.remove('show');

  }

});


function closeModal(id){

  document
    .getElementById(id)
    .classList.remove('show');

}


window.addEventListener('click', function(e){

  if(e.target.classList.contains('modal')){

    e.target.classList.remove('show');

  }

});


function toggleTheme(){

  document.body.classList.toggle('dark');

  localStorage.setItem(
    'dashboardTheme',
    document.body.classList.contains('dark')
      ? 'dark'
      : 'light'
  );

}


function loadTheme(){

  if(
    localStorage.getItem('dashboardTheme') === 'dark'
  ){

    document.body.classList.add('dark');

  }

}


function logout(){

  sessionStorage.removeItem('dashboardAuth');

  localStorage.removeItem('dashboardAuth');
  localStorage.removeItem('username');
  localStorage.removeItem('userData');
  localStorage.removeItem('loggedUser');
  localStorage.removeItem('currentUser');
  localStorage.removeItem('userInfo');

  window.location.replace('index.html');

}


function showLoader(){

  document
    .getElementById('loader')
    .classList.add('show');

}


function hideLoader(){

  document
    .getElementById('loader')
    .classList.remove('show');

}


function showToast(message){

  const toast =
    document.getElementById('toast');

  toast.textContent = message;

  toast.classList.add('show');

  setTimeout(() => {

    toast.classList.remove('show');

  },3000);

}


function escapeHtml(value){

  if(value === null ||
     value === undefined){

    return '';

  }

  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


function setupBackProtection(){

  history.pushState(null,'',location.href);

  window.addEventListener('popstate',function(){

    history.pushState(null,'',location.href);

  });

}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<link
  rel="icon"
  type="image/png"
  sizes="128x128"
  href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#f4f7fb;
  color:#1f2937;
  transition:.3s;
}

body.dark{
  background:#101827;
  color:#fff;
}


/* ================= HEADER ================= */

.header{
  height:72px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:100;
}

.dark .header{
  background:#172033;
}

.logoArea{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:12px;
  background:linear-gradient(135deg,#0f9d58,#087f45);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:22px;
  font-weight:bold;
}

.titleBox h2{
  font-size:20px;
}

.titleBox p{
  font-size:12px;
  color:#7b8494;
  margin-top:3px;
}

.dark .titleBox p{
  color:#aeb7c6;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:10px;
}

.iconBtn{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#f0f3f7;
  cursor:pointer;
  font-size:19px;
  transition:.2s;
}

.iconBtn:hover{
  transform:translateY(-2px);
}

.dark .iconBtn{
  background:#263247;
  color:white;
}


/* ================= PROFILE ================= */

.profile{
  position:relative;
}

.profileBtn{
  border:0;
  background:#f0f3f7;
  padding:7px 12px 7px 8px;
  border-radius:25px;
  display:flex;
  align-items:center;
  gap:8px;
  cursor:pointer;
}

.dark .profileBtn{
  background:#263247;
  color:white;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:linear-gradient(135deg,#18a765,#087f45);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:bold;
}

.profileName{
  max-width:120px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.dropdown{
  display:none;
  position:absolute;
  right:0;
  top:52px;
  width:190px;
  background:white;
  border-radius:15px;
  padding:8px;
  box-shadow:0 10px 35px rgba(0,0,0,.18);
  z-index:200;
}

.dark .dropdown{
  background:#1c273a;
}

.dropdown.show{
  display:block;
}

.dropdown button{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
}

.dropdown button:hover{
  background:#f0f3f7;
}

.dark .dropdown button{
  color:white;
}

.dark .dropdown button:hover{
  background:#29364c;
}


/* ================= MAIN ================= */

.container{
  width:min(1200px,94%);
  margin:30px auto;
}

.welcome{
  background:linear-gradient(135deg,#0f9d58,#087f45);
  border-radius:22px;
  padding:30px;
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:25px;
}

.welcome h1{
  font-size:27px;
  margin-bottom:7px;
}

.welcome p{
  opacity:.9;
  font-size:14px;
}

.newBtn{
  border:0;
  background:white;
  color:#087f45;
  padding:13px 20px;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
  font-size:14px;
  white-space:nowrap;
}

.newBtn:hover{
  transform:translateY(-2px);
}


/* ================= CARDS ================= */

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:25px;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.dark .card{
  background:#172033;
}

.cardLabel{
  color:#8a94a6;
  font-size:12px;
  text-transform:uppercase;
  margin-bottom:8px;
}

.dark .cardLabel{
  color:#9faabd;
}

.cardValue{
  font-size:22px;
  font-weight:bold;
}


/* ================= TABLE ================= */

.tableBox{
  background:white;
  border-radius:20px;
  padding:22px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
  overflow:hidden;
}

.dark .tableBox{
  background:#172033;
}

.tableHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.tableHeader h3{
  font-size:18px;
}

.refreshText{
  border:0;
  background:#eef7f2;
  color:#087f45;
  padding:9px 13px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.dark .refreshText{
  background:#263b35;
  color:#62d49a;
}

.tableScroll{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

thead{
  background:#f5f7fa;
}

.dark thead{
  background:#202c40;
}

th{
  padding:14px 15px;
  text-align:left;
  font-size:13px;
  color:#697386;
}

.dark th{
  color:#b8c1d0;
}

td{
  padding:15px;
  border-bottom:1px solid #edf0f4;
  font-size:14px;
}

.dark td{
  border-color:#293448;
}

tbody tr:hover{
  background:#f8fafc;
}

.dark tbody tr:hover{
  background:#202c40;
}

.empty{
  text-align:center;
  padding:35px;
  color:#8a94a6;
}


/* ================= MODAL ================= */

.modalOverlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  align-items:center;
  justify-content:center;
  z-index:500;
  padding:20px;
}

.modalOverlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:470px;
  background:white;
  border-radius:22px;
  padding:25px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  animation:popup .2s ease;
}

.dark .modal{
  background:#172033;
  color:white;
}

@keyframes popup{

  from{
    opacity:0;
    transform:scale(.95) translateY(10px);
  }

  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }

}

.modalTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.modalTitle h2{
  font-size:20px;
}

.closeBtn{
  width:35px;
  height:35px;
  border:0;
  border-radius:10px;
  background:#f0f2f5;
  cursor:pointer;
  font-size:18px;
}

.dark .closeBtn{
  background:#29364b;
  color:white;
}

.formGroup{
  margin-bottom:16px;
}

.formGroup label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

.formGroup input{
  width:100%;
  padding:13px 14px;
  border:1px solid #dce1e8;
  border-radius:11px;
  outline:none;
  font-size:14px;
  background:white;
}

.formGroup input:focus{
  border-color:#0f9d58;
  box-shadow:0 0 0 3px rgba(15,157,88,.1);
}

.dark .formGroup input{
  background:#202c40;
  color:white;
  border-color:#344258;
}

.formGroup input[readonly]{
  background:#f3f5f7;
  color:#6b7280;
  cursor:not-allowed;
}

.dark .formGroup input[readonly]{
  background:#222d40;
  color:#9ba6b8;
}

.saveBtn{
  width:100%;
  border:0;
  background:linear-gradient(135deg,#0f9d58,#087f45);
  color:white;
  padding:14px;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
  margin-top:5px;
}

.saveBtn:disabled{
  opacity:.6;
  cursor:not-allowed;
}


/* ================= TOAST ================= */

.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  background:#172033;
  color:white;
  padding:14px 18px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  transform:translateY(100px);
  opacity:0;
  transition:.3s;
  z-index:1000;
  max-width:320px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.toast.success{
  background:#087f45;
}

.toast.error{
  background:#c62828;
}


/* ================= LOADER ================= */

.loading{
  display:none;
  text-align:center;
  padding:30px;
  color:#7b8494;
}

.loading.show{
  display:block;
}


/* ================= RESPONSIVE ================= */

@media(max-width:900px){

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:600px){

  .header{
    padding:0 14px;
  }

  .titleBox p{
    display:none;
  }

  .profileName{
    display:none;
  }

  .container{
    width:94%;
    margin:20px auto;
  }

  .welcome{
    padding:22px;
    flex-direction:column;
    align-items:flex-start;
  }

  .welcome h1{
    font-size:23px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .card{
    padding:17px;
  }

  .cardValue{
    font-size:18px;
  }

  .tableBox{
    padding:15px;
  }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

  <div class="logoArea">

    <div class="logo">
      D
    </div>

    <div class="titleBox">

      <h2>Dashboard</h2>

      <p>
        Data Management System
      </p>

    </div>

  </div>


  <div class="headerRight">

    <button
      class="iconBtn"
      onclick="loadData()"
      title="Refresh"
    >
      ↻
    </button>


    <button
      class="iconBtn"
      onclick="toggleDark()"
      title="Dark Mode"
    >
      ◐
    </button>


    <div class="profile">

      <button
        class="profileBtn"
        onclick="toggleProfile()"
      >

        <div
          class="avatar"
          id="avatar"
        >
          U
        </div>

        <span
          class="profileName"
          id="headerName"
        >
          User
        </span>

        <span>⌄</span>

      </button>


      <div
        class="dropdown"
        id="profileMenu"
      >

        <button onclick="showProfile()">
          👤 My Profile
        </button>

        <button onclick="logout()">
          🚪 Logout
        </button>

      </div>

    </div>

  </div>

</header>



<!-- ================= MAIN ================= -->

<main class="container">


  <!-- WELCOME -->

  <section class="welcome">

    <div>

      <h1>
        Welcome,
        <span id="welcomeName">
          User
        </span>
      </h1>

      <p>
        Manage your entries from your dashboard.
      </p>

    </div>


    <button
      class="newBtn"
      onclick="openEntryModal()"
    >
      ＋ New Entry
    </button>

  </section>



  <!-- CARDS -->

  <section class="cards">

    <div class="card">

      <div class="cardLabel">
        Username
      </div>

      <div
        class="cardValue"
        id="usernameCard"
      >
        -
      </div>

    </div>


    <div class="card">

      <div class="cardLabel">
        Role
      </div>

      <div
        class="cardValue"
        id="roleCard"
      >
        -
      </div>

    </div>


    <div class="card">

      <div class="cardLabel">
        Status
      </div>

      <div
        class="cardValue"
        id="statusCard"
      >
        -
      </div>

    </div>


    <div class="card">

      <div class="cardLabel">
        Total Entries
      </div>

      <div
        class="cardValue"
        id="totalCard"
      >
        0
      </div>

    </div>

  </section>



  <!-- DATA TABLE -->

  <section class="tableBox">

    <div class="tableHeader">

      <h3>
        Recent Entries
      </h3>

      <button
        class="refreshText"
        onclick="loadData()"
      >
        ↻ Refresh
      </button>

    </div>


    <div class="tableScroll">

      <table>

        <thead>

          <tr>

            <th>Name</th>

            <th>IP</th>

            <th>Work</th>

            <th>Date</th>

          </tr>

        </thead>


        <tbody id="dataBody"></tbody>

      </table>

    </div>


    <div
      class="loading"
      id="loading"
    >
      Loading data...
    </div>

  </section>

</main>



<!-- ================= NEW ENTRY MODAL ================= -->

<div
  class="modalOverlay"
  id="entryModal"
>

  <div class="modal">

    <div class="modalTitle">

      <h2>
        New Entry
      </h2>

      <button
        class="closeBtn"
        onclick="closeEntryModal()"
      >
        ×
      </button>

    </div>


    <form
      id="entryForm"
      onsubmit="saveEntry(event)"
    >


      <!-- NAME -->

      <div class="formGroup">

        <label>
          Name
        </label>

        <input
          type="text"
          id="entryName"
          readonly
        >

      </div>



      <!-- IP -->

      <div class="formGroup">

        <label>
          IP
        </label>

        <input
          type="text"
          id="entryIP"
          placeholder="Enter IP address"
          autocomplete="off"
          required
        >

      </div>



      <!-- WORK -->

      <div class="formGroup">

        <label>
          Work
        </label>

        <input
          type="text"
          id="entryWork"
          placeholder="Enter work"
          autocomplete="off"
          required
        >

      </div>



      <!-- DATE -->

      <div class="formGroup">

        <label>
          Date
        </label>

        <input
          type="text"
          id="entryDate"
          readonly
        >

      </div>



      <button
        type="submit"
        class="saveBtn"
        id="saveBtn"
      >
        Entry
      </button>

    </form>

  </div>

</div>



<!-- ================= TOAST ================= -->

<div
  class="toast"
  id="toast"
></div>



<script>


// ============================================================
// NEW API URL
// ============================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbz59T-4CKQDbHJB_ql6OYZf18eN7XUmttp0d2FaOM5pm27yCBOWrEilqA_zMOnFq_rz/exec";


// ============================================================
// USER DATA
// ============================================================

let userData = null;


// ============================================================
// PAGE LOAD
// ============================================================

document.addEventListener(
  "DOMContentLoaded",
  function(){

    checkLogin();

    loadDarkMode();

  }
);


// ============================================================
// CHECK LOGIN
// ============================================================

function checkLogin(){

  let savedUser = null;


  try{

    savedUser =
      JSON.parse(
        localStorage.getItem(
          "userData"
        ) || "null"
      );

  }catch(e){

    savedUser = null;

  }


  if(!savedUser){

    try{

      savedUser =
        JSON.parse(
          localStorage.getItem(
            "loginData"
          ) || "null"
        );


      if(
        savedUser &&
        savedUser.user
      ){

        savedUser =
          savedUser.user;

      }

    }catch(e){

      savedUser = null;

    }

  }


  const loggedUsername =
    localStorage.getItem(
      "username"
    );


  if(
    !savedUser &&
    !loggedUsername
  ){

    window.location.href =
      "index.html";

    return;

  }


  if(!savedUser){

    savedUser = {

      username:
        loggedUsername || "",

      name:
        localStorage.getItem(
          "name"
        ) ||
        loggedUsername ||
        "",

      role:
        localStorage.getItem(
          "role"
        ) ||
        "User",

      status:
        "Active"

    };

  }


  userData =
    savedUser;


  setUserUI();

  loadData();

}


// ============================================================
// SET USER UI
// ============================================================

function setUserUI(){

  if(!userData) return;


  const name =
    userData.name ||
    userData.username ||
    "User";


  const username =
    userData.username ||
    "User";


  const role =
    userData.role ||
    "User";


  const status =
    userData.status ||
    "Active";


  document.getElementById(
    "welcomeName"
  ).textContent =
    name;


  document.getElementById(
    "headerName"
  ).textContent =
    name;


  document.getElementById(
    "usernameCard"
  ).textContent =
    username;


  document.getElementById(
    "roleCard"
  ).textContent =
    role;


  document.getElementById(
    "statusCard"
  ).textContent =
    status;


  document.getElementById(
    "avatar"
  ).textContent =
    name
      .charAt(0)
      .toUpperCase();


  document.getElementById(
    "entryName"
  ).value =
    name;


  setToday();

}


// ============================================================
// TODAY DATE
// ============================================================

function setToday(){

  const now =
    new Date();


  const day =
    String(
      now.getDate()
    ).padStart(2,"0");


  const month =
    String(
      now.getMonth() + 1
    ).padStart(2,"0");


  const year =
    now.getFullYear();


  const hours =
    String(
      now.getHours()
    ).padStart(2,"0");


  const minutes =
    String(
      now.getMinutes()
    ).padStart(2,"0");


  const seconds =
    String(
      now.getSeconds()
    ).padStart(2,"0");


  document.getElementById(
    "entryDate"
  ).value =
    `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;

}


// ============================================================
// LOAD DATA FROM GOOGLE SHEET
// ============================================================

async function loadData(){

  const loading =
    document.getElementById(
      "loading"
    );


  const body =
    document.getElementById(
      "dataBody"
    );


  loading.classList.add(
    "show"
  );


  try{

    const response =
      await fetch(
        API_URL +
        "?action=getData&_=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    if(
      !result.success
    ){

      throw new Error(
        result.message ||
        "Unable to load data."
      );

    }


    renderData(
      result.data || []
    );


  }catch(error){

    body.innerHTML = `
      <tr>
        <td
          colspan="4"
          class="empty"
        >
          Unable to load data.
        </td>
      </tr>
    `;


    showToast(
      error.message,
      "error"
    );

  }finally{

    loading.classList.remove(
      "show"
    );

  }

}


// ============================================================
// RENDER SHEET DATA
// ============================================================

function renderData(data){

  const body =
    document.getElementById(
      "dataBody"
    );


  document.getElementById(
    "totalCard"
  ).textContent =
    data.length;


  if(
    !data ||
    data.length === 0
  ){

    body.innerHTML = `
      <tr>
        <td
          colspan="4"
          class="empty"
        >
          No entries found.
        </td>
      </tr>
    `;

    return;

  }


  body.innerHTML = "";


  data.forEach(
    function(row){

      const tr =
        document.createElement(
          "tr"
        );


      tr.innerHTML = `

        <td>
          ${escapeHTML(row.name)}
        </td>

        <td>
          ${escapeHTML(row.ip)}
        </td>

        <td>
          ${escapeHTML(row.work)}
        </td>

        <td>
          ${escapeHTML(row.date)}
        </td>

      `;


      body.appendChild(
        tr
      );

    }
  );

}


// ============================================================
// OPEN NEW ENTRY
// ============================================================

function openEntryModal(){

  if(!userData){

    showToast(
      "User information not found.",
      "error"
    );

    return;

  }


  // Name cannot be edited
  document.getElementById(
    "entryName"
  ).value =
    userData.name ||
    userData.username ||
    "";


  // Clear IP
  document.getElementById(
    "entryIP"
  ).value = "";


  // Clear Work
  document.getElementById(
    "entryWork"
  ).value = "";


  // Date automatically selected
  setToday();


  document.getElementById(
    "entryModal"
  ).classList.add(
    "show"
  );


  setTimeout(
    function(){

      document.getElementById(
        "entryIP"
      ).focus();

    },
    100
  );

}


// ============================================================
// CLOSE ENTRY
// ============================================================

function closeEntryModal(){

  document.getElementById(
    "entryModal"
  ).classList.remove(
    "show"
  );

}


// ============================================================
// SAVE ENTRY TO SHEET
// ============================================================

async function saveEntry(event){

  event.preventDefault();


  if(!userData){

    showToast(
      "Login information not found.",
      "error"
    );

    return;

  }


  const ip =
    document.getElementById(
      "entryIP"
    ).value.trim();


  const work =
    document.getElementById(
      "entryWork"
    ).value.trim();


  if(!ip){

    showToast(
      "Please enter IP.",
      "error"
    );

    return;

  }


  if(!work){

    showToast(
      "Please enter Work.",
      "error"
    );

    return;

  }


  const saveBtn =
    document.getElementById(
      "saveBtn"
    );


  saveBtn.disabled =
    true;


  saveBtn.textContent =
    "Saving...";


  try{

    const payload = {

      action:
        "addEntry",

      username:
        userData.username ||
        localStorage.getItem(
          "username"
        ) ||
        "",

      name:
        userData.name ||
        userData.username ||
        "",

      ip:
        ip,

      work:
        work,

      date:
        new Date().toISOString()

    };


    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    const result =
      await response.json();


    if(
      !result.success
    ){

      throw new Error(
        result.message ||
        "Entry could not be saved."
      );

    }


    closeEntryModal();


    showToast(
      "Entry saved successfully.",
      "success"
    );


    // Reload Sheet data
    await loadData();


  }catch(error){

    showToast(
      error.message,
      "error"
    );

  }finally{

    saveBtn.disabled =
      false;

    saveBtn.textContent =
      "Entry";

  }

}


// ============================================================
// PROFILE MENU
// ============================================================

function toggleProfile(){

  document
    .getElementById(
      "profileMenu"
    )
    .classList.toggle(
      "show"
    );

}


document.addEventListener(
  "click",
  function(event){

    const profile =
      document.querySelector(
        ".profile"
      );


    if(
      !profile.contains(
        event.target
      )
    ){

      document
        .getElementById(
          "profileMenu"
        )
        .classList.remove(
          "show"
        );

    }

  }
);


// ============================================================
// PROFILE
// ============================================================

function showProfile(){

  document
    .getElementById(
      "profileMenu"
    )
    .classList.remove(
      "show"
    );


  showToast(
    "Logged in as " +
    (
      userData
        ? userData.name ||
          userData.username
        : "User"
    ),
    "success"
  );

}


// ============================================================
// LOGOUT
// ============================================================

function logout(){

  localStorage.removeItem(
    "dashboardAuth"
  );

  localStorage.removeItem(
    "username"
  );

  localStorage.removeItem(
    "userData"
  );

  localStorage.removeItem(
    "loginData"
  );

  localStorage.removeItem(
    "loggedUser"
  );

  localStorage.removeItem(
    "currentUser"
  );

  localStorage.removeItem(
    "userInfo"
  );


  sessionStorage.removeItem(
    "dashboardAuth"
  );


  window.location.replace(
    "index.html"
  );

}


// ============================================================
// DARK MODE
// ============================================================

function toggleDark(){

  document.body.classList.toggle(
    "dark"
  );


  localStorage.setItem(
    "darkMode",
    document.body.classList.contains(
      "dark"
    )
      ? "true"
      : "false"
  );

}


function loadDarkMode(){

  if(
    localStorage.getItem(
      "darkMode"
    ) === "true"
  ){

    document.body.classList.add(
      "dark"
    );

  }

}


// ============================================================
// TOAST
// ============================================================

let toastTimer;


function showToast(
  message,
  type = ""
){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.className =
    "toast show " +
    type;


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function(){

        toast.classList.remove(
          "show"
        );

      },
      3000
    );

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


// ============================================================
// CLOSE MODAL OUTSIDE CLICK
// ============================================================

document
  .getElementById(
    "entryModal"
  )
  .addEventListener(
    "click",
    function(event){

      if(
        event.target === this
      ){

        closeEntryModal();

      }

    }
  );


// ============================================================
// ESC KEY
// ============================================================

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeEntryModal();

    }

  }
);


// ============================================================
// BACK BUTTON PROTECTION
// ============================================================

history.pushState(
  null,
  "",
  location.href
);


window.addEventListener(
  "popstate",
  function(){

    history.pushState(
      null,
      "",
      location.href
    );

  }
);

</script>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Support Dashboard</title>

<link
  rel="icon"
  type="image/png"
  href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
  min-height:100vh;
  transition:.25s;
}

body.dark{
  background:#111827;
  color:#f3f4f6;
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  height:70px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:100;
}

body.dark .header{
  background:#182131;
  border-color:#273449;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:700;
  color:#16a34a;
}

.logo-icon{
  width:38px;
  height:38px;
  border-radius:11px;
  background:#16a34a;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:8px;
}


/* =========================================================
   BUTTONS
========================================================= */

.btn{
  border:0;
  border-radius:9px;
  padding:10px 15px;
  font-size:14px;
  font-weight:600;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-green{
  background:#16a34a;
  color:#fff;
}

.btn-green:hover{
  background:#15803d;
}

.btn-light{
  background:#f1f5f9;
  color:#334155;
}

.btn-light:hover{
  background:#e2e8f0;
}

.btn-danger{
  background:#ef4444;
  color:#fff;
}

.btn-danger:hover{
  background:#dc2626;
}

body.dark .btn-light{
  background:#273449;
  color:#e5e7eb;
}

body.dark .btn-light:hover{
  background:#334155;
}


/* =========================================================
   MAIN
========================================================= */

.main{
  max-width:1400px;
  margin:auto;
  padding:28px;
}


/* =========================================================
   FILTER
========================================================= */

.filter-box{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:18px;
  margin-bottom:22px;
}

body.dark .filter-box{
  background:#182131;
  border-color:#273449;
}

.filter-row{
  display:grid;
  grid-template-columns:2fr 1fr 1fr auto auto;
  gap:10px;
  align-items:end;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-size:12px;
  font-weight:600;
  color:#64748b;
}

body.dark .field label{
  color:#94a3b8;
}

.field input,
.field select{
  width:100%;
  height:42px;
  border:1px solid #dbe2ea;
  border-radius:8px;
  padding:0 12px;
  outline:none;
  background:#fff;
  color:#172033;
}

.field input:focus,
.field select:focus{
  border-color:#16a34a;
  box-shadow:0 0 0 3px rgba(22,163,74,.1);
}

body.dark .field input,
body.dark .field select{
  background:#111827;
  border-color:#334155;
  color:#f3f4f6;
}

.filter-buttons{
  display:flex;
  gap:8px;
}


/* =========================================================
   TABLE
========================================================= */

.table-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:15px;
  overflow:hidden;
}

body.dark .table-card{
  background:#182131;
  border-color:#273449;
}

.table-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 20px;
  border-bottom:1px solid #e5e7eb;
}

body.dark .table-header{
  border-color:#273449;
}

.table-title{
  font-size:17px;
  font-weight:700;
}

.table-count{
  font-size:13px;
  color:#64748b;
}

body.dark .table-count{
  color:#94a3b8;
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

thead{
  background:#f8fafc;
}

body.dark thead{
  background:#111827;
}

th{
  text-align:left;
  padding:14px 20px;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.4px;
  color:#64748b;
  white-space:nowrap;
}

body.dark th{
  color:#94a3b8;
}

td{
  padding:15px 20px;
  border-top:1px solid #edf0f3;
  font-size:14px;
  vertical-align:middle;
}

body.dark td{
  border-color:#273449;
}

tbody tr:hover{
  background:#f8fafc;
}

body.dark tbody tr:hover{
  background:#202c3d;
}

.empty{
  text-align:center;
  padding:45px 20px;
  color:#64748b;
}

body.dark .empty{
  color:#94a3b8;
}


/* =========================================================
   BADGES
========================================================= */

.badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:5px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}

.badge-active{
  background:#dcfce7;
  color:#15803d;
}

.badge-blocked{
  background:#fee2e2;
  color:#dc2626;
}

.badge-inactive{
  background:#fef3c7;
  color:#b45309;
}

.badge-admin{
  background:#ede9fe;
  color:#6d28d9;
}

.badge-manager{
  background:#dbeafe;
  color:#1d4ed8;
}

.badge-support{
  background:#dcfce7;
  color:#15803d;
}

.badge-call{
  background:#cffafe;
  color:#0e7490;
}

.badge-guest{
  background:#f1f5f9;
  color:#475569;
}

body.dark .badge-guest{
  background:#273449;
  color:#cbd5e1;
}


/* =========================================================
   PROFILE
========================================================= */

.profile-wrap{
  position:relative;
}

.profile-btn{
  display:flex;
  align-items:center;
  gap:8px;
}

.profile-icon{
  width:28px;
  height:28px;
  border-radius:50%;
  background:#dcfce7;
  color:#15803d;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
}

.profile-menu{
  position:absolute;
  top:48px;
  right:0;
  width:220px;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  box-shadow:0 15px 40px rgba(0,0,0,.12);
  padding:8px;
  display:none;
  z-index:300;
}

.profile-menu.show{
  display:block;
}

body.dark .profile-menu{
  background:#182131;
  border-color:#334155;
}

.profile-user{
  padding:12px;
  border-bottom:1px solid #e5e7eb;
  margin-bottom:5px;
}

body.dark .profile-user{
  border-color:#334155;
}

.profile-name{
  font-weight:700;
  font-size:14px;
}

.profile-username{
  font-size:12px;
  color:#64748b;
  margin-top:3px;
}

body.dark .profile-username{
  color:#94a3b8;
}

.profile-item{
  width:100%;
  background:transparent;
  border:0;
  text-align:left;
  padding:11px 12px;
  border-radius:8px;
  font-size:14px;
  color:#334155;
}

.profile-item:hover{
  background:#f1f5f9;
}

body.dark .profile-item{
  color:#e5e7eb;
}

body.dark .profile-item:hover{
  background:#273449;
}

.profile-item.logout{
  color:#dc2626;
}


/* =========================================================
   MODAL BACKGROUND
========================================================= */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.58);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:500;
}

.modal-bg.show{
  display:flex;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
  width:100%;
  max-width:460px;
  background:#fff;
  border-radius:16px;
  padding:24px;
  box-shadow:0 25px 60px rgba(0,0,0,.2);
  max-height:90vh;
  overflow-y:auto;
}

.modal.large{
  max-width:900px;
}

body.dark .modal{
  background:#182131;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.modal-title{
  font-size:19px;
  font-weight:700;
}

.close{
  width:34px;
  height:34px;
  border:0;
  border-radius:8px;
  background:#f1f5f9;
  font-size:20px;
  color:#475569;
}

body.dark .close{
  background:#273449;
  color:#e5e7eb;
}


/* =========================================================
   MODAL FORM
========================================================= */

.modal-field{
  margin-bottom:15px;
}

.modal-field label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:7px;
  color:#475569;
}

body.dark .modal-field label{
  color:#cbd5e1;
}

.modal-field input,
.modal-field select{
  width:100%;
  height:44px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  padding:0 12px;
  outline:none;
  background:#fff;
  color:#172033;
}

.modal-field input:focus,
.modal-field select:focus{
  border-color:#16a34a;
}

body.dark .modal-field input,
body.dark .modal-field select{
  background:#111827;
  border-color:#334155;
  color:#fff;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:20px;
}


/* =========================================================
   USERS TOOLBAR
========================================================= */

.users-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.users-search{
  flex:1;
}

.users-search input{
  width:100%;
  height:42px;
  border:1px solid #dbe2ea;
  border-radius:9px;
  padding:0 12px;
  outline:none;
}

.users-search input:focus{
  border-color:#16a34a;
}

body.dark .users-search input{
  background:#111827;
  border-color:#334155;
  color:#fff;
}


/* =========================================================
   USER ACTION BUTTON
========================================================= */

.edit-btn{
  border:0;
  background:#eff6ff;
  color:#2563eb;
  padding:7px 11px;
  border-radius:7px;
  font-size:12px;
  font-weight:700;
}

.edit-btn:hover{
  background:#dbeafe;
}

body.dark .edit-btn{
  background:#172554;
  color:#93c5fd;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  min-width:250px;
  max-width:380px;
  background:#172033;
  color:#fff;
  padding:13px 16px;
  border-radius:10px;
  box-shadow:0 15px 35px rgba(0,0,0,.2);
  transform:translateY(100px);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:1000;
  font-size:14px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.toast.success{
  background:#15803d;
}

.toast.error{
  background:#dc2626;
}


/* =========================================================
   LOADER
========================================================= */

.loader-bg{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.65);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:900;
}

.loader-bg.show{
  display:flex;
}

body.dark .loader-bg{
  background:rgba(15,23,42,.65);
}

.loader{
  width:44px;
  height:44px;
  border:4px solid #d1fae5;
  border-top-color:#16a34a;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:1000px){

  .header{
    padding:0 15px;
  }

  .filter-row{
    grid-template-columns:1fr 1fr;
  }

  .filter-row .search-field{
    grid-column:1 / -1;
  }

}

@media(max-width:700px){

  .header{
    height:auto;
    min-height:65px;
    padding:10px 12px;
  }

  .logo span{
    display:none;
  }

  .header-right{
    gap:5px;
  }

  .header-right .reload-text,
  .header-right .new-text,
  .header-right .users-text,
  .header-right .theme-text{
    display:none;
  }

  .btn{
    padding:9px 10px;
  }

  .main{
    padding:18px 12px;
  }

  .filter-row{
    grid-template-columns:1fr;
  }

  .filter-row .search-field{
    grid-column:auto;
  }

  .filter-buttons{
    width:100%;
  }

  .filter-buttons .btn{
    flex:1;
  }

  .users-toolbar{
    flex-direction:column;
    align-items:stretch;
  }

  .users-toolbar .btn{
    width:100%;
  }

  .modal{
    padding:19px;
  }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

  <div class="logo">

    <div class="logo-icon">
      ✓
    </div>

    <span>
      Support Dashboard
    </span>

  </div>


  <div class="header-right">


    <!-- Reload -->

    <button
      class="btn btn-light"
      onclick="loadData()"
    >
      ↻
      <span class="reload-text">
        Reload
      </span>
    </button>


    <!-- USERS -->

    <button
      class="btn btn-light"
      id="usersButton"
      onclick="openUsersModal()"
    >
      👥
      <span class="users-text">
        Users
      </span>
    </button>


    <!-- NEW ENTRY -->

    <button
      class="btn btn-green"
      onclick="openEntryModal()"
    >
      +
      <span class="new-text">
        New Entry
      </span>
    </button>


    <!-- THEME -->

    <button
      class="btn btn-light"
      onclick="toggleTheme()"
      id="themeBtn"
    >
      ☾
      <span class="theme-text">
        Dark
      </span>
    </button>


    <!-- PROFILE -->

    <div class="profile-wrap">

      <button
        class="btn btn-light profile-btn"
        onclick="toggleProfile()"
      >

        <span class="profile-icon">
          <span id="profileLetter">
            U
          </span>
        </span>

        <span id="profileButtonName">
          Profile
        </span>

      </button>


      <div
        class="profile-menu"
        id="profileMenu"
      >

        <div class="profile-user">

          <div
            class="profile-name"
            id="menuName"
          >
            User
          </div>

          <div
            class="profile-username"
            id="menuUsername"
          >
            @username
          </div>

        </div>


        <button
          class="profile-item"
          onclick="openPasswordModal()"
        >
          🔑 Change Password
        </button>


        <button
          class="profile-item logout"
          onclick="logout()"
        >
          ↪ Logout
        </button>

      </div>

    </div>

  </div>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="main">


  <!-- FILTER -->

  <section class="filter-box">

    <div class="filter-row">


      <div class="field search-field">

        <label>
          Search
        </label>

        <input
          type="text"
          id="searchInput"
          placeholder="Search name, IP or work..."
          oninput="applyFilters()"
        >

      </div>


      <div class="field">

        <label>
          From Date
        </label>

        <input
          type="date"
          id="fromDate"
          onchange="applyFilters()"
        >

      </div>


      <div class="field">

        <label>
          To Date
        </label>

        <input
          type="date"
          id="toDate"
          onchange="applyFilters()"
        >

      </div>


      <div class="filter-buttons">

        <button
          class="btn btn-green"
          onclick="applyFilters()"
        >
          Filter
        </button>

      </div>


      <div class="filter-buttons">

        <button
          class="btn btn-light"
          onclick="clearFilters()"
        >
          Clear
        </button>

      </div>


    </div>

  </section>


  <!-- DATA TABLE -->

  <section class="table-card">

    <div class="table-header">

      <div class="table-title">
        Recent Entries
      </div>

      <div
        class="table-count"
        id="entryCount"
      >
        0 Entries
      </div>

    </div>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>Name</th>
            <th>IP</th>
            <th>Work</th>
            <th>Date</th>

          </tr>

        </thead>


        <tbody id="dataBody">

          <tr>

            <td
              colspan="4"
              class="empty"
            >
              Loading...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>


</main>


<!-- =========================================================
     USERS MODAL
========================================================= -->

<div
  class="modal-bg"
  id="usersModal"
>

  <div class="modal large">

    <div class="modal-head">

      <div class="modal-title">
        User Management
      </div>

      <button
        class="close"
        onclick="closeUsersModal()"
      >
        ×
      </button>

    </div>


    <div class="users-toolbar">

      <div class="users-search">

        <input
          type="text"
          id="userSearch"
          placeholder="Search username, name, role or status..."
          oninput="filterUsers()"
        >

      </div>


      <button
        class="btn btn-green"
        onclick="openAddUserModal()"
      >
        + Add User
      </button>

    </div>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>
              Username
            </th>

            <th>
              Name
            </th>

            <th>
              Role
            </th>

            <th>
              Status
            </th>

            <th>
              Action
            </th>

          </tr>

        </thead>


        <tbody id="usersBody">

          <tr>

            <td
              colspan="5"
              class="empty"
            >
              Loading users...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>


<!-- =========================================================
     ADD / EDIT USER MODAL
========================================================= -->

<div
  class="modal-bg"
  id="userFormModal"
>

  <div class="modal">

    <div class="modal-head">

      <div
        class="modal-title"
        id="userFormTitle"
      >
        Add User
      </div>

      <button
        class="close"
        onclick="closeUserFormModal()"
      >
        ×
      </button>

    </div>


    <!-- Username -->

    <div class="modal-field">

      <label>
        Username
      </label>

      <input
        type="text"
        id="formUsername"
        placeholder="Enter username"
      >

    </div>


    <!-- Password -->

    <div class="modal-field">

      <label>
        Password
      </label>

      <input
        type="password"
        id="formPassword"
        placeholder="Enter password"
      >

      <div
        id="passwordHint"
        style="
          font-size:11px;
          color:#64748b;
          margin-top:5px;
        "
      >
        Password is required for new users.
      </div>

    </div>


    <!-- Name -->

    <div class="modal-field">

      <label>
        Name
      </label>

      <input
        type="text"
        id="formName"
        placeholder="Enter name"
      >

    </div>


    <!-- Role -->

    <div class="modal-field">

      <label>
        Role
      </label>

      <select
        id="formRole"
      >

        <option value="admin">
          Admin
        </option>

        <option value="manager">
          Manager
        </option>

        <option value="support">
          Support
        </option>

        <option value="call">
          Call
        </option>

        <option value="guest">
          Guest
        </option>

      </select>

    </div>


    <!-- Status -->

    <div class="modal-field">

      <label>
        Status
      </label>

      <select
        id="formStatus"
      >

        <option value="Active">
          Active
        </option>

        <option value="Blocked">
          Blocked
        </option>

        <option value="Inactive">
          Inactive
        </option>

      </select>

    </div>


    <div class="modal-actions">

      <button
        class="btn btn-light"
        onclick="closeUserFormModal()"
      >
        Cancel
      </button>

      <button
        class="btn btn-green"
        id="userSaveButton"
        onclick="saveUser()"
      >
        Add User
      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     NEW ENTRY MODAL
========================================================= -->

<div
  class="modal-bg"
  id="entryModal"
>

  <div class="modal">

    <div class="modal-head">

      <div class="modal-title">
        New Entry
      </div>

      <button
        class="close"
        onclick="closeEntryModal()"
      >
        ×
      </button>

    </div>


    <div class="modal-field">

      <label>
        Name
      </label>

      <input
        type="text"
        id="entryName"
        readonly
      >

    </div>


    <div class="modal-field">

      <label>
        Date
      </label>

      <input
        type="text"
        id="entryDate"
        readonly
      >

    </div>


    <div class="modal-field">

      <label>
        IP Address
      </label>

      <input
        type="text"
        id="entryIP"

// ============================================================

const USER_API_URL =

// DATA SPREADSHEET API
// Dashboard Data / New Entry

const DATA_API_URL =
  "https://script.google.com/macros/s/AKfycbz59T-4CKQDbHJB_ql6OYZf18eN7XUmttp0d2FaOM5pm27yCBOWrEilqA_zMOnFq_rz/exec";

// ============================================================
// CHECK LOGIN
// ============================================================

function checkLogin(){

  const auth =
    localStorage.getItem(
      "dashboardAuth"
    );

  const sessionAuth =
    sessionStorage.getItem(
      "dashboardAuth"
    );


  if(
    auth !== "true" &&
    sessionAuth !== "true"
  ){

    window.location.replace(
      "index.html"
    );

    return;

  }


  loadUser();

}


// ============================================================
// LOAD USER
// ============================================================

async function loadUser(){

  try{

    let savedUser = null;


    const userData =
      localStorage.getItem(
        "userData"
      );


    if(userData){

      try{

        savedUser =
          JSON.parse(
            userData
          );

      }catch(e){}

    }


    if(!savedUser){

      const loginData =
        localStorage.getItem(
          "loginData"
        );


      if(loginData){

        try{

          const parsed =
            JSON.parse(
              loginData
            );

          savedUser =
            parsed.user ||
            parsed;

        }catch(e){}

      }

    }


    if(!savedUser){

      const current =
        localStorage.getItem(
          "currentUser"
        );


      if(current){

        try{

          savedUser =
            JSON.parse(
              current
            );

        }catch(e){}

      }

    }


    let username =
      localStorage.getItem(
        "username"
      );


    if(
      !username &&
      savedUser
    ){

      username =
        savedUser.username ||
        "";

    }


    if(!username){

      logout();

      return;

    }


    const response =
      await fetch(
        USER_API_URL +
        "?action=getUser&username=" +
        encodeURIComponent(
          username
        ),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    if(
      result &&
      result.success &&
      result.user
    ){

      currentUser =
        result.user;

    }else if(savedUser){

      currentUser =
        savedUser;

    }else{

      logout();

      return;

    }


    updateProfileUI();

    updateUsersButton();

    loadData();


  }catch(error){

    console.error(error);


    const saved =
      localStorage.getItem(
        "userData"
      );


    if(saved){

      try{

        currentUser =
          JSON.parse(saved);

        updateProfileUI();

        updateUsersButton();

        loadData();

        return;

      }catch(e){}

    }


    showToast(
      "Could not load user information.",
      "error"
    );

  }

}

// ============================================================
// LOAD DATA
// ============================================================

async function loadData(){

  showLoader();


  try{

    const response =
      await fetch(
        DATA_API_URL +
        "?action=getData&_=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    if(
      !result ||
      !result.success
    ){

      throw new Error(
        result &&
        result.message
          ? result.message
          : "Could not load data."
      );

    }


    allData =
      Array.isArray(
        result.data
      )
        ? result.data
        : [];


    applyFilters();


  }catch(error){

    console.error(error);


    document.getElementById(
      "dataBody"
    ).innerHTML = `

      <tr>
        <td
          colspan="4"
          class="empty"
        >
          Could not load data.
        </td>
      </tr>

    `;

      "entryCount"

      "0 Entries";

      "Could not load dashboard data.",
      "error"
    );


  }finally{

    hideLoader();

  }

}


// ============================================================
// FILTER DATA
// ============================================================

function applyFilters(){

  const search =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();


  const fromDate =
    document.getElementById(
      "fromDate"
    ).value;


  const toDate =
    document.getElementById(
      "toDate"
    ).value;


  const filtered =
    allData.filter(
      function(item){

        const name =
          String(
            item.name || ""
          ).toLowerCase();


        const ip =
          String(
            item.ip || ""
          ).toLowerCase();


        const work =
          String(
            item.work || ""
          ).toLowerCase();


        const dateText =
          String(
            item.date || ""
          );


        if(
          search &&
          !(
            name.includes(search) ||
            ip.includes(search) ||
            work.includes(search) ||
            dateText
              .toLowerCase()
              .includes(search)
          )
        ){

          return false;

        }


        if(
          fromDate ||
          toDate
        ){

          const itemDate =
            parseDateForFilter(
              dateText
            );


          if(itemDate){

            const itemDay =
              itemDate
                .toISOString()
                .slice(0,10);


            if(
              fromDate &&
              itemDay < fromDate
            ){

              return false;

            }


            if(
              toDate &&
              itemDay > toDate
            ){

              return false;

            }

          }

        }


        return true;

      }
    );


  renderData(
    filtered
  );

}


// ============================================================
// DATE PARSER
// ============================================================

function parseDateForFilter(
  value
){

  if(!value){
    return null;
  }


  let date =
    new Date(value);


  if(
    !isNaN(
      date.getTime()
    )
  ){

    return date;

  }


  const match =
    value.match(
      /^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/
    );


  if(match){

    const months = {

      january:0,
      february:1,
      march:2,
      april:3,
      may:4,
      june:5,
      july:6,
      august:7,
      september:8,
      october:9,
      november:10,
      december:11

    };


    const month =
      months[
        match[2].toLowerCase()
      ];


    if(
      month !== undefined
    ){

      return new Date(
        Number(
          match[3]
        ),
        month,
        Number(
          match[1]
        )
      );

    }

  }


  return null;

}

async function saveUser(){

  if(!currentUser){

    showToast(
      "User information not available.",
      "error"
    );

    return;

  }


  const username =
    document.getElementById(
      "formUsername"
    ).value.trim();


  const password =
    document.getElementById(
      "formPassword"
    ).value;


  const name =
    document.getElementById(
      "formName"
    ).value.trim();


  const role =
    document.getElementById(
      "formRole"
    ).value;


  const status =
    document.getElementById(
      "formStatus"
    ).value;


  if(!username){

    showToast(
      "Username is required.",
      "error"
    );

    return;

  }


  if(
    userFormMode === "add" &&
    !password
  ){

    showToast(
      "Password is required.",
      "error"
    );

    return;

  }


  if(
    password &&
    password.length < 4
  ){

    showToast(
      "Password must be at least 4 characters.",
      "error"
    );

    return;

  }


  if(!name){

    showToast(
      "Name is required.",
      "error"
    );

    return;

  }


  showLoader();


  try{

    let body;


    // --------------------------------------------------------
    // ADD
    // --------------------------------------------------------

    if(
      userFormMode === "add"
    ){

      body = {

        action:
          "addUser",

        requester:
          currentUser.username,

        username:
          username,

        password:
          password,

        name:
          name,

        role:
          role,

        status:
          status

      };

    }


    // --------------------------------------------------------
    // EDIT
    // --------------------------------------------------------

    else{

      body = {

        action:
          "editUser",

        requester:
          currentUser.username,

        originalUsername:
          editingUsername,

        username:
          username,

        password:
          password,

        name:
          name,

        role:
          role,

        status:
          status

      };

    }


    const response =
      await fetch(
        USER_API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(
              body
            )

        }
      );


    const result =
      await response.json();


    if(
      result &&
      result.success
    ){

      closeUserFormModal();


      showToast(
        userFormMode === "add"
          ? "User added successfully."
          : "User updated successfully.",
        "success"
      );


      await loadUsers();


    }else{

      showToast(
        result &&
        result.message
          ? result.message
          : "Operation failed.",
        "error"
      );

    }


  }catch(error){

    console.error(error);


    showToast(
      "Could not connect to User server.",
      "error"
    );


  }finally{

    hideLoader();

  }

}

// ============================================================
// CAPITALIZE
// ============================================================

function capitalize(
  value
){

  const text =
    String(
      value || ""
    );


  if(!text){
    return "";
  }


  return (
    text
      .charAt(0)
      .toUpperCase() +
    text
      .slice(1)
  );

}


// ============================================================
// CHANGE PASSWORD
// ============================================================

function openPasswordModal(){

  closeProfile();


  document.getElementById(
    "currentPassword"
  ).value = "";

  document.getElementById(
    "newPassword"
  ).value = "";

  document.getElementById(
    "confirmPassword"
  ).value = "";


  document.getElementById(
    "passwordModal"
  ).classList.add(
    "show"
  );


  setTimeout(
    function(){

      document.getElementById(
        "currentPassword"
      ).focus();

    },
    100
  );

}


function closePasswordModal(){

  document.getElementById(
    "passwordModal"
  ).classList.remove(
    "show"
  );

}


async function changePassword(){

  if(!currentUser){

    showToast(
      "User information not available.",
      "error"
    );

    return;

  }


  const currentPassword =
    document.getElementById(
      "currentPassword"
    ).value;


  const newPassword =
    document.getElementById(
      "newPassword"
    ).value;


  const confirmPassword =
    document.getElementById(
      "confirmPassword"
    ).value;


  if(!currentPassword){

    showToast(
      "Enter current password.",
      "error"
    );

    return;

  }


  if(!newPassword){

    showToast(
      "Enter new password.",
      "error"
    );

    return;

  }


  if(
    newPassword.length < 4
  ){

    showToast(
      "New password must be at least 4 characters.",
      "error"
    );

    return;

  }


  if(
    newPassword !==
    confirmPassword
  ){

    showToast(
      "New passwords do not match.",
      "error"
    );

    return;

  }


  if(
    currentPassword ===
    newPassword
  ){

    showToast(
      "New password must be different.",
      "error"
    );

    return;

  }


  showLoader();


  try{

    const response =
      await fetch(
        USER_API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({

              action:
                "changePassword",

              username:
                currentUser.username,

              currentPassword:
                currentPassword,

              newPassword:
                newPassword

            })

        }
      );


    const result =
      await response.json();


    if(
      result &&
      result.success
    ){

      closePasswordModal();


      showToast(
        "Password changed successfully.",
        "success"
      );


    }else{

      showToast(
        result &&
        result.message
          ? result.message
          : "Password change failed.",
        "error"
      );

    }


  }catch(error){

    console.error(error);


    showToast(
      "Could not connect to User server.",
      "error"
    );


  }finally{

    hideLoader();

  }

}

function logout(){

  const keys = [

    "dashboardAuth",
    "username",
    "name",
    "role",
    "status",
    "userData",
    "loginData",
    "loggedUser",
    "currentUser",
    "userInfo"

  ];


  keys.forEach(
    function(key){

      localStorage.removeItem(
        key
      );

    }
  );


  sessionStorage.removeItem(
    "dashboardAuth"
  );


  window.location.replace(
    "index.html"
  );

}

  );

  );

function updateThemeButton(
  dark
){

  const button =
    document.getElementById(
      "themeBtn"
    );


  if(!button){
    return;
  }


  if(dark){

    button.innerHTML =
      "☀ <span class='theme-text'>Light</span>";

  }else{

    button.innerHTML =
      "☾ <span class='theme-text'>Dark</span>";

  }

}


// ============================================================
// TOAST
// ============================================================

function showToast(
  message,
  type
){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.className =
    "toast";


  if(type){

    toast.classList.add(
      type
    );

  }


  clearTimeout(
    toastTimer
  );


  setTimeout(
    function(){

      toast.classList.add(
        "show"
      );

    },
    10
  );


  toastTimer =
    setTimeout(
      function(){

        toast.classList.remove(
          "show"
        );

      },
      3200
    );

}

// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(
  value
){

  return String(
    value || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


// ============================================================
// ESCAPE JAVASCRIPT
// ============================================================

function escapeJs(
  value
){

  return String(
    value || ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /"/g,
    '\\"'
  )
  .replace(
    /\n/g,
    "\\n"
  )
  .replace(
    /\r/g,
    "\\r"
  );

}


// ============================================================
// FORMAT DATE TIME
// ============================================================

function formatDateTime(
  date
){

  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );


  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const year =
    date.getFullYear();


  const hours =
    String(
      date.getHours()
    ).padStart(
      2,
      "0"
    );


  const minutes =
    String(
      date.getMinutes()
    ).padStart(
      2,
      "0"
    );


  const seconds =
    String(
      date.getSeconds()
    ).padStart(
      2,
      "0"
    );


  return (
    day +
    "/" +
    month +
    "/" +
    year +
    " " +
    hours +
    ":" +
    minutes +
    ":" +
    seconds
  );

}

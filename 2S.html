<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Status</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .box {
            background: white;
            padding: 30px 50px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .status {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }

        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: green;
            border-radius: 50%;
            margin-right: 8px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>My Website</h1>

        <p class="status">
            <span class="dot"></span>
            Site কাজ করছে
        </p>
    </div>

</body>
</html>

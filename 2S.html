<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dashboard</title>

<link
  rel="icon"
  type="image/png"
  href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

:root{
  --bg:#f4f8f7;
  --card:#ffffff;
  --text:#183f35;
  --muted:#78918a;
  --primary:#285b4d;
  --secondary:#68b8b1;
  --border:#e3ece9;
  --shadow:0 10px 30px rgba(24,63,53,.08);
}

body.dark{
  --bg:#101c19;
  --card:#172a25;
  --text:#f2f8f6;
  --muted:#91aaa2;
  --primary:#68b8b1;
  --secondary:#4d968f;
  --border:#29423b;
  --shadow:0 10px 30px rgba(0,0,0,.25);
}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  transition:.25s;
}


/* =========================
   HEADER
========================= */

.header{
  height:75px;
  background:var(--card);
  border-bottom:1px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 35px;

  position:sticky;
  top:0;
  z-index:100;

  box-shadow:var(--shadow);
}

.header-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:42px;
  height:42px;

  border-radius:13px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--primary);
  color:white;

  font-size:20px;
  font-weight:bold;
}

.dashboard-title{
  font-size:20px;
  font-weight:bold;
}

.dashboard-subtitle{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}


/* =========================
   HEADER RIGHT
========================= */

.header-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.icon-btn{
  width:42px;
  height:42px;

  border:1px solid var(--border);
  border-radius:12px;

  background:var(--card);
  color:var(--text);

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:18px;

  transition:.2s;
}

.icon-btn:hover{
  background:var(--primary);
  color:white;
  transform:translateY(-2px);
}


/* =========================
   USER PROFILE
========================= */

.profile{
  position:relative;
}

.profile-btn{
  height:45px;

  border:1px solid var(--border);
  border-radius:25px;

  background:var(--card);
  color:var(--text);

  padding:4px 12px 4px 5px;

  display:flex;
  align-items:center;
  gap:9px;

  cursor:pointer;
}

.avatar{
  width:35px;
  height:35px;

  border-radius:50%;

  background:var(--secondary);
  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:bold;
  font-size:14px;

  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-size:12px;
  font-weight:bold;
}

.profile-role{
  font-size:9px;
  color:var(--muted);
  margin-top:2px;
}


/* =========================
   PROFILE MENU
========================= */

.profile-menu{
  position:absolute;

  right:0;
  top:56px;

  width:220px;

  background:var(--card);

  border:1px solid var(--border);

  border-radius:16px;

  box-shadow:0 20px 45px rgba(0,0,0,.15);

  padding:10px;

  display:none;
}

.profile-menu.show{
  display:block;
  animation:menu .15s ease;
}

@keyframes menu{

  from{
    opacity:0;
    transform:translateY(-5px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.profile-info{
  padding:12px;

  border-bottom:1px solid var(--border);

  margin-bottom:7px;
}

.profile-info strong{
  display:block;
  font-size:14px;
}

.profile-info span{
  font-size:10px;
  color:var(--muted);
}

.menu-item{
  width:100%;

  border:0;

  background:transparent;

  color:var(--text);

  text-align:left;

  padding:11px 12px;

  border-radius:10px;

  cursor:pointer;

  font-size:12px;
}

.menu-item:hover{
  background:var(--bg);
}

.menu-item.logout{
  color:#d9534f;
}


/* =========================
   MAIN
========================= */

.main{
  padding:30px 35px;
  max-width:1400px;
  margin:auto;
}


/* =========================
   WELCOME
========================= */

.welcome-box{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:25px;
}

.welcome-title{
  font-size:27px;
  font-weight:bold;
}

.welcome-text{
  margin-top:7px;
  color:var(--muted);
  font-size:13px;
}


/* =========================
   ACTION BUTTONS
========================= */

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.action-btn{
  border:0;

  padding:12px 18px;

  border-radius:12px;

  cursor:pointer;

  background:var(--primary);

  color:white;

  font-size:12px;
  font-weight:bold;

  transition:.2s;
}

.action-btn:hover{
  transform:translateY(-2px);
  opacity:.9;
}

.action-btn.refresh{
  background:var(--secondary);
}

.action-btn.dark{
  background:#273c37;
}


/* =========================
   CARDS
========================= */

.cards{
  display:grid;

  grid-template-columns:
  repeat(4,1fr);

  gap:18px;

  margin-bottom:25px;
}

.card{
  background:var(--card);

  border:1px solid var(--border);

  border-radius:18px;

  padding:22px;

  box-shadow:var(--shadow);

  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.card-icon{
  width:42px;
  height:42px;

  border-radius:12px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#dcefeb;

  font-size:19px;
}

body.dark .card-icon{
  background:#223b34;
}

.card-label{
  margin-top:16px;

  color:var(--muted);

  font-size:11px;
}

.card-value{
  margin-top:5px;

  font-size:24px;

  font-weight:bold;
}


/* =========================
   CONTENT BOX
========================= */

.content{
  display:grid;

  grid-template-columns:
  1fr 330px;

  gap:20px;
}

.box{
  background:var(--card);

  border:1px solid var(--border);

  border-radius:18px;

  box-shadow:var(--shadow);

  overflow:hidden;
}

.box-header{
  padding:20px;

  border-bottom:1px solid var(--border);

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.box-title{
  font-size:16px;
  font-weight:bold;
}

.box-subtitle{
  font-size:10px;
  color:var(--muted);
  margin-top:4px;
}


/* =========================
   TABLE
========================= */

.table-wrap{
  width:100%;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  padding:13px 18px;

  text-align:left;

  font-size:10px;

  color:var(--muted);

  background:var(--bg);

  white-space:nowrap;
}

td{
  padding:15px 18px;

  border-top:1px solid var(--border);

  font-size:11px;

  white-space:nowrap;
}

.status{
  display:inline-block;

  padding:5px 10px;

  border-radius:20px;

  background:#dff4e8;

  color:#27734a;

  font-size:9px;

  font-weight:bold;
}

body.dark .status{
  background:#193b2d;
  color:#7bd69d;
}


/* =========================
   SIDE PROFILE CARD
========================= */

.user-card{
  padding:25px;

  text-align:center;
}

.big-avatar{
  width:85px;
  height:85px;

  border-radius:50%;

  background:var(--secondary);

  color:white;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:30px;
  font-weight:bold;

  overflow:hidden;
}

.big-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.user-name{
  margin-top:15px;

  font-size:18px;

  font-weight:bold;
}

.user-username{
  margin-top:5px;

  font-size:11px;

  color:var(--muted);
}

.role-badge{
  display:inline-block;

  margin-top:12px;

  padding:6px 13px;

  border-radius:20px;

  background:#dcefeb;

  color:#285b4d;

  font-size:10px;

  font-weight:bold;
}

body.dark .role-badge{
  background:#223b34;
  color:#8fd7d0;
}

.info-row{
  display:flex;

  justify-content:space-between;

  padding:13px 0;

  border-bottom:1px solid var(--border);

  font-size:11px;
}

.info-row:last-child{
  border-bottom:0;
}

.info-label{
  color:var(--muted);
}


/* =========================
   NEW ENTRY MODAL
========================= */

.modal{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,.55);

  display:none;

  justify-content:center;

  align-items:center;

  z-index:1000;

  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:430px;

  max-width:100%;

  background:var(--card);

  border-radius:20px;

  padding:25px;

  box-shadow:0 25px 70px rgba(0,0,0,.3);

  animation:modal .2s ease;
}

@keyframes modal{

  from{
    opacity:0;
    transform:scale(.9);
  }

  to{
    opacity:1;
    transform:scale(1);
  }

}

.modal-header{
  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:22px;
}

.modal-title{
  font-size:19px;
  font-weight:bold;
}

.close{
  width:34px;
  height:34px;

  border:0;

  border-radius:10px;

  background:var(--bg);

  color:var(--text);

  cursor:pointer;

  font-size:18px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;

  margin-bottom:7px;

  font-size:11px;

  color:var(--muted);
}

.form-group input,
.form-group textarea{
  width:100%;

  border:1px solid var(--border);

  outline:0;

  background:var(--bg);

  color:var(--text);

  border-radius:11px;

  padding:11px 13px;

  font-size:12px;
}

.form-group textarea{
  min-height:80px;
  resize:vertical;
}

.submit-btn{
  width:100%;

  height:43px;

  border:0;

  border-radius:22px;

  background:var(--primary);

  color:white;

  cursor:pointer;

  font-size:12px;

  font-weight:bold;

  margin-top:5px;
}


/* =========================
   TOAST
========================= */

.toast{
  position:fixed;

  right:25px;
  bottom:25px;

  background:var(--primary);

  color:white;

  padding:13px 18px;

  border-radius:12px;

  font-size:11px;

  box-shadow:0 15px 35px rgba(0,0,0,.2);

  transform:translateY(100px);

  opacity:0;

  transition:.3s;

  z-index:2000;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}


/* =========================
   MOBILE
========================= */

@media(max-width:950px){

  .cards{
    grid-template-columns:
    repeat(2,1fr);
  }

  .content{
    grid-template-columns:1fr;
  }

}

@media(max-width:700px){

  .header{
    padding:0 15px;
    height:65px;
  }

  .dashboard-title{
    font-size:16px;
  }

  .dashboard-subtitle{
    display:none;
  }

  .profile-name{
    display:none;
  }

  .main{
    padding:20px 15px;
  }

  .welcome-box{
    display:block;
  }

  .actions{
    margin-top:18px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .card{
    padding:16px;
  }

  .card-value{
    font-size:20px;
  }

}

@media(max-width:450px){

  .welcome-title{
    font-size:23px;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .header-left .logo{
    width:36px;
    height:36px;
  }

  .icon-btn{
    width:36px;
    height:36px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="header-left">

    <div class="logo">
      D
    </div>

    <div>

      <div class="dashboard-title">
        Dashboard
      </div>

      <div class="dashboard-subtitle">
        Welcome to your workspace
      </div>

    </div>

  </div>


  <div class="header-right">


    <!-- Refresh -->

    <button
      class="icon-btn"
      onclick="refreshPage()"
      title="Refresh"
    >
      ↻
    </button>


    <!-- Dark Mode -->

    <button
      class="icon-btn"
      onclick="toggleDarkMode()"
      id="darkButton"
      title="Dark Mode"
    >
      🌙
    </button>


    <!-- Profile -->

    <div class="profile">

      <button
        class="profile-btn"
        onclick="toggleProfile()"
      >

        <div
          class="avatar"
          id="avatar"
        >
          U
        </div>

        <div>

          <div
            class="profile-name"
            id="headerName"
          >
            User
          </div>

          <div
            class="profile-role"
            id="headerRole"
          >
            User
          </div>

        </div>

        <span>⌄</span>

      </button>


      <div
        class="profile-menu"
        id="profileMenu"
      >

        <div class="profile-info">

          <strong id="menuName">
            User
          </strong>

          <span id="menuUsername">
            @username
          </span>

        </div>


        <button
          class="menu-item"
          onclick="showProfile()"
        >
          👤 My Profile
        </button>


        <button
          class="menu-item"
          onclick="changePassword()"
        >
          🔐 Change Password
        </button>


        <button
          class="menu-item"
          onclick="toggleDarkMode();closeProfile()"
        >
          🌙 Dark Mode
        </button>


        <button
          class="menu-item logout"
          onclick="logout()"
        >
          🚪 Logout
        </button>

      </div>

    </div>

  </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="main">


  <!-- Welcome -->

  <div class="welcome-box">

    <div>

      <div
        class="welcome-title"
        id="welcomeName"
      >
        Welcome 👋
      </div>

      <div class="welcome-text">
        Manage your dashboard from here.
      </div>

    </div>


    <div class="actions">

      <button
        class="action-btn"
        onclick="openNewEntry()"
      >
        ＋ New Entry
      </button>


      <button
        class="action-btn refresh"
        onclick="refreshPage()"
      >
        ↻ Refresh
      </button>


      <button
        class="action-btn dark"
        onclick="toggleDarkMode()"
      >
        ◐ Dark Mode
      </button>

    </div>

  </div>



  <!-- Cards -->

  <div class="cards">


    <div class="card">

      <div class="card-top">

        <div>
          <div class="card-label">
            USERNAME
          </div>

          <div
            class="card-value"
            id="cardUsername"
          >
            -
          </div>
        </div>

        <div class="card-icon">
          👤
        </div>

      </div>

    </div>


    <div class="card">

      <div class="card-top">

        <div>
          <div class="card-label">
            ROLE
          </div>

          <div
            class="card-value"
            id="cardRole"
          >
            -
          </div>
        </div>

        <div class="card-icon">
          🛡️
        </div>

      </div>

    </div>


    <div class="card">

      <div class="card-top">

        <div>
          <div class="card-label">
            STATUS
          </div>

          <div
            class="card-value"
            id="cardStatus"
          >
            -
          </div>
        </div>

        <div class="card-icon">
          ✓
        </div>

      </div>

    </div>


    <div class="card">

      <div class="card-top">

        <div>
          <div class="card-label">
            TODAY
          </div>

          <div
            class="card-value"
            id="today"
          >
            -
          </div>
        </div>

        <div class="card-icon">
          📅
        </div>

      </div>

    </div>

  </div>



  <!-- Content -->

  <div class="content">


    <!-- Recent Entries -->

    <div class="box">

      <div class="box-header">

        <div>

          <div class="box-title">
            Recent Entries
          </div>

          <div class="box-subtitle">
            Your latest dashboard activity
          </div>

        </div>

        <button
          class="action-btn refresh"
          onclick="refreshPage()"
        >
          Refresh
        </button>

      </div>


      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>NAME</th>
              <th>USERNAME</th>
              <th>ROLE</th>
              <th>STATUS</th>
            </tr>

          </thead>


          <tbody id="tableBody">

            <tr>

              <td id="tableName">
                -
              </td>

              <td id="tableUsername">
                -
              </td>

              <td id="tableRole">
                -
              </td>

              <td>
                <span
                  class="status"
                  id="tableStatus"
                >
                  -
                </span>
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>



    <!-- User Card -->

    <div class="box">

      <div class="user-card">

        <div
          class="big-avatar"
          id="bigAvatar"
        >
          U
        </div>


        <div
          class="user-name"
          id="profileName"
        >
          User
        </div>


        <div
          class="user-username"
          id="profileUsername"
        >
          @username
        </div>


        <div
          class="role-badge"
          id="profileRole"
        >
          User
        </div>


        <div style="margin-top:25px;">

          <div class="info-row">

            <span class="info-label">
              Status
            </span>

            <strong id="profileStatus">
              Active
            </strong>

          </div>


          <div class="info-row">

            <span class="info-label">
              Login
            </span>

            <strong>
              Online
            </strong>

          </div>


          <div class="info-row">

            <span class="info-label">
              Date
            </span>

            <strong id="profileDate">
              -
            </strong>

          </div>

        </div>

      </div>

    </div>

  </div>

</main>



<!-- =========================
     NEW ENTRY MODAL
========================= -->

<div
  class="modal"
  id="newEntryModal"
>

  <div class="modal-box">

    <div class="modal-header">

      <div class="modal-title">
        New Entry
      </div>

      <button
        class="close"
        onclick="closeNewEntry()"
      >
        ×
      </button>

    </div>


    <div class="form-group">

      <label>
        Name
      </label>

      <input
        type="text"
        id="entryName"
        placeholder="Enter name"
      >

    </div>


    <div class="form-group">

      <label>
        IP
      </label>

      <input
        type="text"
        id="entryIp"
        placeholder="Enter IP"
      >

    </div>


    <div class="form-group">

      <label>
        Work
      </label>

      <textarea
        id="entryWork"
        placeholder="Enter work details"
      ></textarea>

    </div>


    <button
      class="submit-btn"
      onclick="saveEntry()"
    >
      Save Entry
    </button>

  </div>

</div>



<!-- TOAST -->

<div
  class="toast"
  id="toast"
>
  Done
</div>



<script>


/* =========================
   USER DATA
========================= */

let userData = {};


/* =========================
   LOAD USER
========================= */

function loadUser(){

  try{

    const saved =
      localStorage.getItem("userData");


    if(saved){

      userData =
        JSON.parse(saved);

    }

  }catch(error){

    console.error(error);

  }


  const username =
    userData.username ||
    localStorage.getItem("username") ||
    "User";


  const name =
    userData.name ||
    username;


  const role =
    userData.role ||
    "User";


  const status =
    userData.status ||
    "Active";


  /* Header */

  document.getElementById(
    "headerName"
  ).innerText = name;


  document.getElementById(
    "headerRole"
  ).innerText = role;


  document.getElementById(
    "menuName"
  ).innerText = name;


  document.getElementById(
    "menuUsername"
  ).innerText =
    "@" + username;


  /* Welcome */

  document.getElementById(
    "welcomeName"
  ).innerText =
    "Welcome, " + name + " 👋";


  /* Cards */

  document.getElementById(
    "cardUsername"
  ).innerText = username;


  document.getElementById(
    "cardRole"
  ).innerText = role;


  document.getElementById(
    "cardStatus"
  ).innerText = status;


  /* Table */

  document.getElementById(
    "tableName"
  ).innerText = name;


  document.getElementById(
    "tableUsername"
  ).innerText = username;


  document.getElementById(
    "tableRole"
  ).innerText = role;


  document.getElementById(
    "tableStatus"
  ).innerText = status;


  /* Profile */

  document.getElementById(
    "profileName"
  ).innerText = name;


  document.getElementById(
    "profileUsername"
  ).innerText =
    "@" + username;


  document.getElementById(
    "profileRole"
  ).innerText = role;


  document.getElementById(
    "profileStatus"
  ).innerText = status;


  /* Avatar */

  const picture =
    userData.picture ||
    localStorage.getItem("picture") ||
    "";


  const firstLetter =
    name.charAt(0).toUpperCase();


  if(picture){

    document.getElementById(
      "avatar"
    ).innerHTML =
      '<img src="' +
      picture +
      '" alt="Profile">';


    document.getElementById(
      "bigAvatar"
    ).innerHTML =
      '<img src="' +
      picture +
      '" alt="Profile">';

  }else{

    document.getElementById(
      "avatar"
    ).innerText =
      firstLetter;


    document.getElementById(
      "bigAvatar"
    ).innerText =
      firstLetter;

  }

}


/* =========================
   DATE
========================= */

function setDate(){

  const now =
    new Date();


  const options = {
    day:"2-digit",
    month:"short",
    year:"numeric"
  };


  const date =
    now.toLocaleDateString(
      "en-US",
      options
    );


  document.getElementById(
    "today"
  ).innerText = date;


  document.getElementById(
    "profileDate"
  ).innerText = date;

}


/* =========================
   REFRESH
========================= */

function refreshPage(){

  const button =
    document.querySelector(
      ".action-btn.refresh"
    );


  showToast("Refreshing...");


  setTimeout(function(){

    window.location.reload();

  },400);

}


/* =========================
   DARK MODE
========================= */

function toggleDarkMode(){

  document.body.classList.toggle(
    "dark"
  );


  const dark =
    document.body.classList.contains(
      "dark"
    );


  localStorage.setItem(
    "darkMode",
    dark ? "true" : "false"
  );


  document.getElementById(
    "darkButton"
  ).innerText =
    dark ? "☀️" : "🌙";

}


/* =========================
   LOAD DARK MODE
========================= */

function loadDarkMode(){

  const dark =
    localStorage.getItem(
      "darkMode"
    );


  if(dark === "true"){

    document.body.classList.add(
      "dark"
    );


    document.getElementById(
      "darkButton"
    ).innerText = "☀️";

  }

}


/* =========================
   PROFILE MENU
========================= */

function toggleProfile(){

  document
    .getElementById("profileMenu")
    .classList.toggle("show");

}


function closeProfile(){

  document
    .getElementById("profileMenu")
    .classList.remove("show");

}


document.addEventListener(
  "click",
  function(e){

    const profile =
      document.querySelector(".profile");


    if(
      profile &&
      !profile.contains(e.target)
    ){

      closeProfile();

    }

  }
);


/* =========================
   PROFILE
========================= */

function showProfile(){

  closeProfile();

  document
    .getElementById("newEntryModal")
    .classList.remove("show");

  showToast(
    "Profile: " +
    (
      userData.name ||
      userData.username ||
      "User"
    )
  );

}


/* =========================
   CHANGE PASSWORD
========================= */

function changePassword(){

  closeProfile();

  showToast(
    "Please contact your administrator to change password."
  );

}


/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.removeItem(
    "dashboardAuth"
  );

  localStorage.removeItem(
    "username"
  );

  localStorage.removeItem(
    "userData"
  );

  localStorage.removeItem(
    "loginData"
  );

  localStorage.removeItem(
    "loggedUser"
  );

  localStorage.removeItem(
    "currentUser"
  );

  localStorage.removeItem(
    "userInfo"
  );

  sessionStorage.removeItem(
    "dashboardAuth"
  );


  window.location.replace(
    "index.html"
  );

}


/* =========================
   NEW ENTRY
========================= */

function openNewEntry(){

  document
    .getElementById("newEntryModal")
    .classList.add("show");

}


function closeNewEntry(){

  document
    .getElementById("newEntryModal")
    .classList.remove("show");

}


/* =========================
   SAVE ENTRY
========================= */

function saveEntry(){

  const name =
    document
      .getElementById("entryName")
      .value.trim();


  const ip =
    document
      .getElementById("entryIp")
      .value.trim();


  const work =
    document
      .getElementById("entryWork")
      .value.trim();


  if(!name){

    showToast(
      "Please enter name."
    );

    return;

  }


  if(!ip){

    showToast(
      "Please enter IP."
    );

    return;

  }


  if(!work){

    showToast(
      "Please enter work."
    );

    return;

  }


  /*
   * এখানে পরে Google Sheet API
   * connect করা যাবে।
   */

  closeNewEntry();


  document.getElementById(
    "entryName"
  ).value = "";


  document.getElementById(
    "entryIp"
  ).value = "";


  document.getElementById(
    "entryWork"
  ).value = "";


  showToast(
    "Entry saved successfully."
  );

}


/* =========================
   TOAST
========================= */

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.innerText =
    message;


  toast.classList.add(
    "show"
  );


  setTimeout(function(){

    toast.classList.remove(
      "show"
    );

  },2500);

}


/* =========================
   MODAL OUTSIDE CLICK
========================= */

document
  .getElementById("newEntryModal")
  .addEventListener(
    "click",
    function(e){

      if(e.target === this){

        closeNewEntry();

      }

    }
  );


/* =========================
   LOGIN PROTECTION
========================= */

function checkLogin(){

  const auth =
    localStorage.getItem(
      "dashboardAuth"
    );


  if(auth !== "true"){

    window.location.replace(
      "index.html"
    );

    return false;

  }


  return true;

}


/* =========================
   START
========================= */

if(checkLogin()){

  loadUser();

  setDate();

  loadDarkMode();

}

</script>

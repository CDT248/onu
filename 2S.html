<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Data Dashboard</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

:root{

  --bg:#f4f7f6;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#e5e7eb;
  --input:#ffffff;
  --thead:#f8fafc;
  --hover:#fafafa;

  --green:#087f5b;
  --green-dark:#066b4d;

  --shadow:rgba(0,0,0,.20);

}

body.dark{

  --bg:#111827;
  --card:#1f2937;
  --text:#f9fafb;
  --muted:#9ca3af;
  --border:#374151;
  --input:#111827;
  --thead:#172033;
  --hover:#263244;

  --shadow:rgba(0,0,0,.50);

}

body{

  background:var(--bg);
  color:var(--text);

  transition:.25s;

}


/* =====================================================
HEADER
===================================================== */

.header{

  width:100%;
  min-height:70px;

  background:var(--card);

  border-bottom:1px solid var(--border);

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 25px;

  position:sticky;

  top:0;

  z-index:100;

}

.logo{

  font-size:22px;

  font-weight:700;

  color:var(--green);

}


/* =====================================================
HEADER RIGHT
===================================================== */

.header-right{

  display:flex;

  align-items:center;

  gap:10px;

}


/* =====================================================
USERNAME
===================================================== */

.logged-user{

  height:42px;

  padding:0 14px;

  border:1px solid var(--border);

  border-radius:8px;

  background:var(--input);

  color:var(--text);

  display:flex;

  align-items:center;

  gap:7px;

  font-size:13px;

  font-weight:600;

}


/* =====================================================
BUTTON
===================================================== */

button{

  border:none;

  cursor:pointer;

  transition:.2s;

}

button:disabled{

  cursor:not-allowed;

  opacity:.5;

}

.btn{

  padding:11px 17px;

  border-radius:8px;

  font-size:14px;

  font-weight:600;

}

.btn-primary{

  background:var(--green);

  color:#ffffff;

}

.btn-primary:hover{

  background:var(--green-dark);

}

.btn-refresh{

  background:var(--input);

  color:var(--text);

  border:1px solid var(--border);

}

.btn-refresh:hover{

  background:var(--hover);

}


/* =====================================================
LOGOUT
===================================================== */

.btn-logout{

  background:#fee2e2;

  color:#dc2626;

  border:1px solid #fecaca;

}

.btn-logout:hover{

  background:#fecaca;

}


/* =====================================================
THEME
===================================================== */

.theme-btn{

  height:42px;

  padding:0 14px;

  border-radius:8px;

  background:var(--input);

  color:var(--text);

  border:1px solid var(--border);

  font-size:13px;

  font-weight:600;

}

.theme-btn:hover{

  background:var(--hover);

}


/* =====================================================
MAIN
===================================================== */

.container{

  width:100%;

  max-width:1500px;

  margin:auto;

  padding:25px;

}


/* =====================================================
TOP
===================================================== */

.top-section{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:20px;

}

.title h1{

  font-size:27px;

  margin-bottom:5px;

}

.title p{

  color:var(--muted);

  font-size:14px;

}


/* =====================================================
FILTER
===================================================== */

.filter-box{

  background:var(--card);

  border:1px solid var(--border);

  border-radius:12px;

  padding:18px;

  margin-bottom:20px;

}

.filters{

  display:grid;

  grid-template-columns:1fr auto;

  gap:12px;

  align-items:end;

}

.field{

  display:flex;

  flex-direction:column;

  gap:6px;

}

.field label{

  font-size:12px;

  font-weight:600;

  color:var(--muted);

}

.field input{

  width:100%;

  height:42px;

  border:1px solid var(--border);

  border-radius:8px;

  padding:0 12px;

  outline:none;

  background:var(--input);

  color:var(--text);

  font-size:14px;

}

.field input:focus{

  border-color:var(--green);

}


/* =====================================================
TABLE
===================================================== */

.table-box{

  background:var(--card);

  border:1px solid var(--border);

  border-radius:12px;

  overflow:hidden;

}

.table-header{

  padding:16px 18px;

  border-bottom:1px solid var(--border);

  display:flex;

  justify-content:space-between;

  align-items:center;

}

.table-header h2{

  font-size:17px;

}

.total-count{

  font-size:13px;

  color:var(--muted);

}

.table-wrapper{

  width:100%;

  overflow-x:auto;

}

table{

  width:100%;

  border-collapse:collapse;

  min-width:650px;

}

th{

  background:var(--thead);

  padding:14px;

  text-align:left;

  font-size:12px;

  color:var(--muted);

  white-space:nowrap;

  border-bottom:1px solid var(--border);

}

td{

  padding:14px;

  border-bottom:1px solid var(--border);

  font-size:13px;

  white-space:nowrap;

}

tr:hover td{

  background:var(--hover);

}

.date-cell{

  color:var(--muted);

  font-weight:500;

}


/* =====================================================
PAGINATION
===================================================== */

.pagination-box{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:15px 18px;

  border-top:1px solid var(--border);

}

.page-info{

  font-size:13px;

  color:var(--muted);

}

.pagination{

  display:flex;

  gap:5px;

  flex-wrap:wrap;

}

.page-btn{

  min-width:35px;

  height:35px;

  border:1px solid var(--border);

  background:var(--input);

  color:var(--text);

  border-radius:6px;

  font-size:13px;

}

.page-btn:hover{

  background:var(--hover);

}

.page-btn.active{

  background:var(--green);

  color:#ffffff;

  border-color:var(--green);

}


/* =====================================================
MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.55);

  display:none;

  justify-content:center;

  align-items:center;

  padding:20px;

  z-index:999;

}

.modal.show{

  display:flex;

}

.modal-box{

  width:100%;

  max-width:700px;

  max-height:95vh;

  overflow-y:auto;

  background:var(--card);

  color:var(--text);

  border-radius:16px;

  box-shadow:

    0 20px 60px

    var(--shadow);

}

.modal-header{

  padding:20px 24px;

  border-bottom:1px solid var(--border);

  display:flex;

  justify-content:space-between;

  align-items:center;

  position:sticky;

  top:0;

  background:var(--card);

  z-index:2;

}

.modal-header h2{

  font-size:20px;

}

.close-btn{

  width:36px;

  height:36px;

  border-radius:50%;

  background:var(--input);

  border:1px solid var(--border);

  font-size:22px;

  color:var(--text);

}

.close-btn:hover{

  background:var(--hover);

}


/* =====================================================
FORM
===================================================== */

.form{

  padding:30px 25px;

}

.form-grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:22px 18px;

}

.form-group{

  display:flex;

  flex-direction:column;

  gap:9px;

}

.form-group.full{

  grid-column:1 / -1;

}

.form-group label{

  font-size:13px;

  font-weight:600;

  color:var(--text);

}

.form-group input,

.form-group textarea{

  width:100%;

  border:1px solid var(--border);

  border-radius:9px;

  padding:13px 14px;

  outline:none;

  font-size:14px;

  background:var(--input);

  color:var(--text);

}

.form-group input{

  height:48px;

}

.form-group textarea{

  min-height:150px;

  resize:vertical;

}

.form-group input:focus,

.form-group textarea:focus{

  border-color:var(--green);

  box-shadow:

    0 0 0 2px

    rgba(8,127,91,.10);

}


/* READ ONLY FIELD */

.readonly-field{

  background:var(--thead) !important;

  cursor:not-allowed;

}


/* =====================================================
FORM FOOTER
===================================================== */

.form-footer{

  display:flex;

  justify-content:flex-end;

  gap:10px;

  padding-top:30px;

}


/* =====================================================
LOADING
===================================================== */

.loading{

  text-align:center;

  padding:45px 20px;

  color:var(--muted);

}

.empty{

  text-align:center;

  padding:55px 20px;

  color:var(--muted);

}


/* =====================================================
TOAST
===================================================== */

.toast{

  position:fixed;

  right:25px;

  bottom:25px;

  min-width:260px;

  padding:14px 17px;

  border-radius:9px;

  color:#ffffff;

  background:#111827;

  box-shadow:

    0 10px 30px

    rgba(0,0,0,.2);

  transform:translateY(100px);

  opacity:0;

  transition:.3s;

  z-index:2000;

  font-size:14px;

}

.toast.show{

  transform:translateY(0);

  opacity:1;

}

.toast.success{

  background:#087f5b;

}

.toast.error{

  background:#dc2626;

}


/* =====================================================
MOBILE
===================================================== */

@media(max-width:900px){

  .filters{

    grid-template-columns:1fr;

  }

  .top-section{

    align-items:flex-start;

    flex-direction:column;

  }

}


@media(max-width:600px){

  .header{

    height:auto;

    min-height:70px;

    padding:12px 15px;

    gap:10px;

    flex-wrap:wrap;

  }

  .logo{

    font-size:18px;

  }

  .header-right{

    gap:6px;

    width:100%;

    justify-content:flex-end;

    flex-wrap:wrap;

  }

  .header-right .btn,

  .theme-btn,

  .logged-user{

    padding:9px 10px;

    font-size:12px;

    height:38px;

  }

  .container{

    padding:15px;

  }

  .form-grid{

    grid-template-columns:1fr;

  }

  .form-group.full{

    grid-column:auto;

  }

  .form{

    padding:25px 18px;

  }

  .modal{

    padding:10px;

  }

  .modal-box{

    max-height:96vh;

    border-radius:13px;

  }

  .pagination-box{

    flex-direction:column;

    gap:12px;

  }

  .toast{

    left:15px;

    right:15px;

    min-width:auto;

  }

}

</style>

</head>


<body>


<!-- =====================================================
HEADER
===================================================== -->

<header class="header">

  <div class="logo">

    DATA DASHBOARD

  </div>


  <div class="header-right">


    <!-- LOGGED USER -->

    <div
      class="logged-user"
      id="loggedUser"
    >
      👤 Loading...
    </div>


    <!-- THEME -->

    <button
      class="theme-btn"
      id="themeBtn"
      onclick="toggleTheme()"
    >
      🌙 Dark
    </button>


    <!-- REFRESH -->

    <button
      class="btn btn-refresh"
      id="refreshBtn"
      onclick="loadData()"
    >
      🔄 Refresh
    </button>


    <!-- NEW ENTRY -->

    <button
      class="btn btn-primary"
      onclick="openEntryModal()"
    >
      ➕ New Entry
    </button>


    <!-- LOGOUT -->

    <button
      class="btn btn-logout"
      onclick="logout()"
    >
      🚪 Logout
    </button>

  </div>

</header>


<!-- =====================================================
MAIN
===================================================== -->

<main class="container">


  <div class="top-section">

    <div class="title">

      <h1>
        Data Dashboard
      </h1>

      <p>
        View existing entries and create new entries.
      </p>

    </div>

  </div>


  <!-- ===================================================
  SEARCH
  ==================================================== -->

  <section class="filter-box">

    <div class="filters">

      <div class="field search-field">

        <label>
          🔍 Search
        </label>

        <input
          type="text"
          id="searchInput"
          placeholder="Search Name, IP, Work or Date..."
          oninput="applyFilters()"
          autocomplete="off"
        >

      </div>


      <button
        class="btn btn-refresh"
        onclick="clearSearch()"
      >
        Clear
      </button>

    </div>

  </section>


  <!-- ===================================================
  TABLE
  ==================================================== -->

  <section class="table-box">


    <div class="table-header">

      <h2>
        All Entries
      </h2>


      <div class="total-count">

        Total:
        <strong id="totalCount">
          0
        </strong>

      </div>

    </div>


    <div class="table-wrapper">

      <table>

        <thead>

          <tr>

            <th>
              Name
            </th>

            <th>
              IP
            </th>

            <th>
              Work
            </th>

            <th>
              Date
            </th>

          </tr>

        </thead>


        <tbody id="tableBody">

          <tr>

            <td colspan="4">

              <div class="loading">

                Loading data...

              </div>

            </td>

          </tr>

        </tbody>

      </table>

    </div>


    <!-- PAGINATION -->

    <div class="pagination-box">

      <div
        class="page-info"
        id="pageInfo"
      >
        Page 1
      </div>


      <div
        class="pagination"
        id="pagination"
      ></div>

    </div>


  </section>


</main>


<!-- =====================================================
NEW ENTRY MODAL
===================================================== -->

<div
  class="modal"
  id="entryModal"
>


  <div class="modal-box">


    <div class="modal-header">

      <h2>
        New Entry
      </h2>


      <button
        class="close-btn"
        onclick="closeEntryModal()"
      >
        ×
      </button>

    </div>


    <form
      class="form"
      id="entryForm"
      onsubmit="submitEntry(event)"
    >


      <div class="form-grid">


        <!-- USERNAME -->

        <div class="form-group">

          <label>
            Username
          </label>

          <input
            type="text"
            id="usernameInput"
            readonly
            class="readonly-field"
          >

        </div>


        <!-- IP -->

        <div class="form-group">

          <label>
            IP
          </label>

          <input
            type="text"
            id="ipInput"
            placeholder="Enter IP"
            autocomplete="off"
            required
          >

        </div>


        <!-- WORK -->

        <div class="form-group full">

          <label>
            Work
          </label>

          <textarea
            id="workInput"
            placeholder="Enter work"
            required
          ></textarea>

        </div>


        <!-- DATE -->

        <div class="form-group">

          <label>
            Date
          </label>

          <input
            type="date"
            id="dateInput"
            readonly
            class="readonly-field"
          >

        </div>


      </div>


      <div class="form-footer">


        <button
          type="button"
          class="btn btn-refresh"
          onclick="closeEntryModal()"
        >
          Cancel
        </button>


        <button
          type="submit"
          class="btn btn-primary"
          id="submitBtn"
        >
          Save Entry
        </button>


      </div>


    </form>


  </div>

</div>


<!-- =====================================================
TOAST
===================================================== -->

<div
  class="toast"
  id="toast"
></div>


<script>


/* =====================================================
GOOGLE APPS SCRIPT URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbx6fo2Nogf3ETCtS_B-o0HCFqEs3vYkJ9IT9uu_-3l1w8fNJw77mZipeyFm-zZcjUw-5Q/exec";


/* =====================================================
SETTINGS
===================================================== */

const ROWS_PER_PAGE = 10;


/* =====================================================
GLOBAL DATA
===================================================== */

let allData = [];

let filteredData = [];

let currentPage = 1;


/* =====================================================
LOGIN CHECK
===================================================== */

let loggedUsername = "";


function checkLogin(){

  /*
    প্রথমে username খুঁজবে
  */

  loggedUsername =
    localStorage.getItem("username") ||
    "";


  /*
    যদি username না থাকে,
    login page-এ পাঠাবে
  */

  if(!loggedUsername){

    /*
      অন্য possible login data
    */

    const userData =
      localStorage.getItem("userData");

    const loginData =
      localStorage.getItem("loginData");


    if(userData){

      try{

        const parsed =
          JSON.parse(userData);

        loggedUsername =
          parsed.username ||
          parsed.Username ||
          parsed.user ||
          "";

      }catch(error){}

    }


    if(!loggedUsername && loginData){

      try{

        const parsed =
          JSON.parse(loginData);

        loggedUsername =
          parsed.username ||
          parsed.Username ||
          parsed.user ||
          "";

      }catch(error){}

    }

  }


  /*
    Still no login
  */

  if(!loggedUsername){

    window.location.replace(
      "index.html"
    );

    return false;

  }


  /*
    Show username
  */

  document.getElementById(
    "loggedUser"
  ).textContent =
    "👤 " + loggedUsername;


  return true;

}


/* =====================================================
LOGOUT
===================================================== */

function logout(){

  const confirmed =
    confirm(
      "Are you sure you want to logout?"
    );


  if(!confirmed){

    return;

  }


  /*
    Clear login values
  */

  localStorage.removeItem(
    "username"
  );

  localStorage.removeItem(
    "user"
  );

  localStorage.removeItem(
    "userData"
  );

  localStorage.removeItem(
    "loginData"
  );

  localStorage.removeItem(
    "token"
  );

  localStorage.removeItem(
    "authToken"
  );

  localStorage.removeItem(
    "session"
  );

  localStorage.removeItem(
    "loggedIn"
  );


  sessionStorage.clear();


  /*
    Go login
  */

  window.location.replace(
    "index.html"
  );

}


/* =====================================================
5 MINUTE AUTO LOGOUT
===================================================== */

const INACTIVITY_LIMIT =
  5 * 60 * 1000;

let inactivityTimer = null;


function resetInactivityTimer(){

  clearTimeout(
    inactivityTimer
  );


  inactivityTimer =
    setTimeout(
      autoLogout,
      INACTIVITY_LIMIT
    );

}


function autoLogout(){

  clearTimeout(
    inactivityTimer
  );


  localStorage.removeItem(
    "username"
  );

  localStorage.removeItem(
    "user"
  );

  localStorage.removeItem(
    "userData"
  );

  localStorage.removeItem(
    "loginData"
  );

  localStorage.removeItem(
    "token"
  );

  localStorage.removeItem(
    "authToken"
  );

  localStorage.removeItem(
    "session"
  );

  localStorage.removeItem(
    "loggedIn"
  );


  sessionStorage.clear();


  window.location.replace(
    "index.html"
  );

}


/* =====================================================
USER ACTIVITY
===================================================== */

const activityEvents = [

  "mousemove",
  "mousedown",
  "keydown",
  "scroll",
  "touchstart",
  "click",
  "wheel"

];


activityEvents.forEach(
  function(eventName){

    document.addEventListener(
      eventName,
      resetInactivityTimer,
      true
    );

  }
);


/* =====================================================
THEME
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    /*
      Login check first
    */

    if(!checkLogin()){

      return;

    }


    loadTheme();

    loadData();

    resetInactivityTimer();

  }
);


function loadTheme(){

  const savedTheme =
    localStorage.getItem(
      "dashboardTheme"
    );


  if(
    savedTheme === "dark"
  ){

    document.body.classList.add(
      "dark"
    );

  }


  updateThemeButton();

}


function toggleTheme(){

  document.body.classList.toggle(
    "dark"
  );


  const isDark =
    document.body.classList.contains(
      "dark"
    );


  localStorage.setItem(
    "dashboardTheme",
    isDark
      ? "dark"
      : "light"
  );


  updateThemeButton();

}


function updateThemeButton(){

  const btn =
    document.getElementById(
      "themeBtn"
    );


  if(!btn){

    return;

  }


  const isDark =
    document.body.classList.contains(
      "dark"
    );


  btn.textContent =
    isDark
      ? "☀️ White"
      : "🌙 Dark";

}


/* =====================================================
LOAD DATA
===================================================== */

async function loadData(){

  const refreshBtn =
    document.getElementById(
      "refreshBtn"
    );


  refreshBtn.disabled =
    true;


  refreshBtn.textContent =
    "⏳ Loading...";


  showLoading();


  try{

    const response =
      await fetch(
        API_URL +
        "?action=getData&_=" +
        Date.now(),
        {
          method:"GET",
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "API Response:",
      result
    );


    if(
      result.success === false
    ){

      throw new Error(
        result.message ||
        "Failed to load data."
      );

    }


    if(
      !Array.isArray(
        result.data
      )
    ){

      throw new Error(
        "Invalid data received from Google Sheet."
      );

    }


    allData =
      result.data;


    filteredData =
      [...allData];


    currentPage = 1;


    renderTable();

    updateTotal();


  }catch(error){

    console.error(
      "Load Error:",
      error
    );


    showError(
      error.message ||
      "Failed to load data."
    );


    showToast(
      error.message ||
      "Data loading failed.",
      "error"
    );


  }finally{

    refreshBtn.disabled =
      false;


    refreshBtn.textContent =
      "🔄 Refresh";

  }

}


/* =====================================================
RENDER TABLE
===================================================== */

function renderTable(){

  const tbody =
    document.getElementById(
      "tableBody"
    );


  if(
    filteredData.length === 0
  ){

    tbody.innerHTML = `

      <tr>

        <td colspan="4">

          <div class="empty">

            No data found.

          </div>

        </td>

      </tr>

    `;


    renderPagination();

    return;

  }


  const start =
    (
      currentPage - 1
    ) *
    ROWS_PER_PAGE;


  const end =
    start +
    ROWS_PER_PAGE;


  const pageData =
    filteredData.slice(
      start,
      end
    );


  let html = "";


  pageData.forEach(
    function(row){

      html += `

        <tr>

          <td>
            ${escapeHTML(
              row.Name ||
              row.Username ||
              ""
            )}
          </td>

          <td>
            ${escapeHTML(
              row.Ip ||
              row.IP ||
              ""
            )}
          </td>

          <td>
            ${escapeHTML(
              row.Work ||
              ""
            )}
          </td>

          <td class="date-cell">
            ${escapeHTML(
              row.Date ||
              ""
            )}
          </td>

        </tr>

      `;

    }
  );


  tbody.innerHTML =
    html;


  renderPagination();

}


/* =====================================================
SEARCH
===================================================== */

function applyFilters(){

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  filteredData =
    allData.filter(
      function(row){

        if(!search){

          return true;

        }


        const searchText = (

          String(
            row.Name ||
            row.Username ||
            ""
          ) +

          " " +

          String(
            row.Ip ||
            row.IP ||
            ""
          ) +

          " " +

          String(
            row.Work ||
            ""
          ) +

          " " +

          String(
            row.Date ||
            ""
          )

        ).toLowerCase();


        return searchText.includes(
          search
        );

      }
    );


  currentPage = 1;


  renderTable();

  updateTotal();

}


/* =====================================================
CLEAR SEARCH
===================================================== */

function clearSearch(){

  document
    .getElementById(
      "searchInput"
    )
    .value = "";


  filteredData =
    [...allData];


  currentPage = 1;


  renderTable();

  updateTotal();

}


/* =====================================================
PAGINATION
===================================================== */

function renderPagination(){

  const pagination =
    document.getElementById(
      "pagination"
    );


  const pageInfo =
    document.getElementById(
      "pageInfo"
    );


  const totalPages =
    Math.ceil(
      filteredData.length /
      ROWS_PER_PAGE
    );


  if(
    totalPages <= 1
  ){

    pagination.innerHTML =
      "";


    pageInfo.textContent =
      filteredData.length
        ? "Page 1"
        : "Page 0";


    return;

  }


  let html = "";


  html += `

    <button
      class="page-btn"
      onclick="changePage(${currentPage - 1})"
      ${
        currentPage === 1
          ? "disabled"
          : ""
      }
    >
      ‹
    </button>

  `;


  let startPage =
    Math.max(
      1,
      currentPage - 2
    );


  let endPage =
    Math.min(
      totalPages,
      currentPage + 2
    );


  for(
    let i = startPage;
    i <= endPage;
    i++
  ){

    html += `

      <button
        class="page-btn ${
          i === currentPage
            ? "active"
            : ""
        }"
        onclick="changePage(${i})"
      >
        ${i}
      </button>

    `;

  }


  html += `

    <button
      class="page-btn"
      onclick="changePage(${currentPage + 1})"
      ${
        currentPage === totalPages
          ? "disabled"
          : ""
      }
    >
      ›
    </button>

  `;


  pagination.innerHTML =
    html;


  pageInfo.textContent =
    `Page ${currentPage} of ${totalPages}`;

}


function changePage(page){

  const totalPages =
    Math.ceil(
      filteredData.length /
      ROWS_PER_PAGE
    );


  if(
    page < 1 ||
    page > totalPages
  ){

    return;

  }


  currentPage =
    page;


  renderTable();

}


/* =====================================================
TOTAL
===================================================== */

function updateTotal(){

  document
    .getElementById(
      "totalCount"
    )
    .textContent =
    filteredData.length;

}


/* =====================================================
OPEN ENTRY MODAL
===================================================== */

function openEntryModal(){

  /*
    Username automatic
  */

  document
    .getElementById(
      "usernameInput"
    )
    .value =
    loggedUsername;


  /*
    Date automatic
  */

  document
    .getElementById(
      "dateInput"
    )
    .value =
    getTodayInputDate();


  /*
    Clear IP + Work
  */

  document
    .getElementById(
      "ipInput"
    )

  document
    .getElementById(
      "workInput"
    )

  document
    .getElementById(
      "entryModal"

}


/* =====================================================
CLOSE MODAL
===================================================== */

function closeEntryModal(){

  document
    .getElementById(
      "entryModal"
    )
    .classList
    .remove("show");

}


/* =====================================================
SUBMIT NEW ENTRY
===================================================== */

async function submitEntry(event){

  event.preventDefault();


  const submitBtn =
    document.getElementById(
      "submitBtn"
    );


  const username =
    loggedUsername;


  const ip =
    document
      .getElementById(
        "ipInput"
      )
      .value
      .trim();


  const work =
    document
      .getElementById(
        "workInput"
      )
      .value
      .trim();


  const date =
    document
      .getElementById(
        "dateInput"
      )
      .value;


  if(!username){

    showToast(
      "Login session not found.",
      "error"
    );

    return;

  }


  if(!ip){

    showToast(
      "Please enter IP.",
      "error"
    );

    return;

  }


  if(!work){

    showToast(
      "Please enter Work.",
      "error"
    );

    return;

  }


  /* =================================================
  DUPLICATE IP CHECK
  ================================================= */

  const duplicateIP =
    allData.some(
      function(row){

        const oldIP =
          String(
            row.Ip ||
            row.IP ||
            ""
          )
          .trim()
          .toLowerCase();


        return (
          oldIP ===
          ip.toLowerCase()
        );

      }
    );


  if(duplicateIP){

    showToast(
      "This IP has already been entered.",
      "error"
    );

    return;

  }


  submitBtn.disabled =
    true;


  submitBtn.textContent =
    "Saving...";


  try{

    /*
      New entry only
    */

    const payload = {

      action:"create",

      data:{

        Name:username,

        Ip:ip,

        Work:work,

        Date:date

      }

    };


    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "Save Response:",
      result
    );


    if(
      result.success === false
    ){

      throw new Error(
        result.message ||
        "Entry save failed."
      );

    }


    closeEntryModal();


    showToast(
      "Entry added successfully.",
      "success"
    );


    await loadData();


  }catch(error){

    console.error(
      "Save Error:",
      error
    );


    /*
      যদি backend duplicate IP detect করে
    */

    showToast(
      error.message ||
      "Failed to save entry.",
      "error"
    );


  }finally{

    submitBtn.disabled =
      false;


    submitBtn.textContent =
      "Save Entry";

  }

}


/* =====================================================
TODAY DATE
===================================================== */

function getTodayInputDate(){

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    )
    .padStart(
      2,
      "0"
    );


  const day =
    String(
      now.getDate()
    )
    .padStart(
      2,
      "0"
    );


  return (

    year +
    "-" +
    month +
    "-" +
    day

  );

}

/* =====================================================
TOAST
===================================================== */

function showToast(
  message,
  type
){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.className =
    "toast show " +
    (
      type || ""
    );


  setTimeout(
    function(){

      toast.className =
        "toast";

    },
    3000
  );

}


/* =====================================================
HTML SECURITY
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
MODAL OUTSIDE CLICK
===================================================== */

document
  .getElementById(
    "entryModal"
  )
  .addEventListener(
    "click",
    function(event){

      if(
        event.target === this
      ){

        closeEntryModal();

      }

    }
  );


/* =====================================================
ESCAPE
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeEntryModal();

    }

  }
);

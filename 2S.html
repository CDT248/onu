
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Support Dashboard</title>

<link
rel="icon"
type="image/png"
href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png"
>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#eefaf3,#f7fbff);
  color:#17221c;
}

/* ================= HEADER ================= */

.header{
  height:72px;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid #e2eee7;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.logoArea{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:12px;
  background:linear-gradient(135deg,#18a558,#087b3e);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
}

.logoText h2{
  font-size:19px;
}

.logoText p{
  color:#7b8a82;
  font-size:12px;
  margin-top:3px;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:8px;
  position:relative;
}

.topBtn{
  border:1px solid #dce9e1;
  background:#fff;
  color:#30443a;
  padding:9px 14px;
  border-radius:10px;
  font-size:13px;
}

.topBtn:hover{
  background:#effaf4;
}

.profileBtn{
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid #dce9e1;
  background:#fff;
  padding:7px 11px;
  border-radius:12px;
  cursor:pointer;
}

.profileCircle{
  width:32px;
  height:32px;
  border-radius:50%;
  background:linear-gradient(135deg,#18a558,#087b3e);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.profileName{
  max-width:100px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:13px;
}

.profileMenu{
  position:absolute;
  top:55px;
  right:0;
  width:235px;
  background:#fff;
  border:1px solid #e1ebe5;
  border-radius:15px;
  box-shadow:0 15px 40px rgba(0,0,0,.13);
  padding:10px;
  display:none;
  z-index:200;
}

.profileMenu.show{
  display:block;
}

.profileInfo{
  padding:12px;
  border-bottom:1px solid #edf2ef;
  margin-bottom:7px;
}

.profileInfo small{
  display:block;
  color:#8a9890;
  font-size:11px;
  margin-bottom:3px;
}

.profileInfo strong{
  font-size:14px;
}

.menuItem{
  width:100%;
  border:0;
  background:#fff;
  text-align:left;
  padding:11px 12px;
  border-radius:9px;
  color:#26372f;
  cursor:pointer;
}

.menuItem:hover{
  background:#effaf4;
}

.logoutItem{
  color:#d73535;
}

/* ================= MAIN ================= */

.container{
  width:min(1200px,94%);
  margin:28px auto 50px;
}

/* ================= WELCOME ================= */

.welcome{
  background:linear-gradient(135deg,#fff,#f3fbf6);
  border:1px solid #e1eee6;
  border-radius:22px;
  padding:25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  box-shadow:0 10px 30px rgba(24,80,48,.06);
}

.welcome h1{
  font-size:27px;
  margin-bottom:7px;
}

.welcome p{
  color:#718078;
  font-size:14px;
}

.newBtn{
  border:0;
  background:linear-gradient(135deg,#18a558,#087b3e);
  color:#fff;
  padding:12px 19px;
  border-radius:12px;
  font-weight:bold;
  box-shadow:0 7px 18px rgba(24,165,88,.23);
  cursor:pointer;
}

/* ================= CARDS ================= */

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-top:20px;
}

.card{
  background:#fff;
  border:1px solid #e2ece6;
  border-radius:17px;
  padding:20px;
  box-shadow:0 7px 24px rgba(0,0,0,.045);
}

.cardLabel{
  color:#7c8982;
  font-size:12px;
  margin-bottom:10px;
}

.cardValue{
  font-size:20px;
  font-weight:bold;
  word-break:break-word;
}

.active{
  color:#129650;
}

/* ================= TABLE ================= */

.contentBox{
  background:#fff;
  border:1px solid #e2ece6;
  border-radius:19px;
  margin-top:22px;
  padding:20px;
  box-shadow:0 7px 24px rgba(0,0,0,.045);
}

.contentTop{
  margin-bottom:17px;
}

.contentTop h2{
  font-size:18px;
}

/* ================= TOOLS ================= */

.entryTools{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}

.searchBox{
  position:relative;
  width:320px;
}

.searchIcon{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:#8b9991;
}

.searchBox input{
  width:100%;
  height:40px;
  border:1px solid #dce7e0;
  border-radius:10px;
  padding:0 12px 0 37px;
  outline:none;
  background:#fbfdfc;
  font-size:13px;
}

.searchBox input:focus{
  border-color:#20a45b;
  box-shadow:0 0 0 3px rgba(32,164,91,.09);
}

.dateTools{
  display:flex;
  align-items:center;
  gap:7px;
}

.dateTools label{
  font-size:11px;
  color:#78877e;
}

.dateTools input{
  height:38px;
  border:1px solid #dce7e0;
  border-radius:9px;
  padding:0 8px;
  font-size:12px;
  outline:none;
  background:#fbfdfc;
}

.filterBtn,
.clearBtn{
  height:38px;
  border-radius:9px;
  padding:0 12px;
  font-size:12px;
  cursor:pointer;
}

.filterBtn{
  background:#18a558;
  color:#fff;
  border:1px solid #18a558;
}

.clearBtn{
  background:#fff;
  border:1px solid #dce7e0;
  color:#536158;
}

/* ================= TABLE ================= */

.tableWrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

thead th{
  text-align:left;
  background:#f3f8f5;
  color:#63736a;
  font-size:11px;
  text-transform:uppercase;
  padding:13px 12px;
  border-bottom:1px solid #e1ebe5;
}

tbody td{
  padding:14px 12px;
  border-bottom:1px solid #edf1ee;
  font-size:13px;
  color:#35443c;
}

tbody tr:hover{
  background:#fbfefc;
}

.noData{
  text-align:center;
  padding:35px !important;
  color:#89958e;
}

/* ================= MODAL ================= */

.modalOverlay{
  position:fixed;
  inset:0;
  background:rgba(15,30,21,.45);
  backdrop-filter:blur(4px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:400;
}

.modalOverlay.show{
  display:flex;
}

.modal{
  width:min(450px,100%);
  background:#fff;
  border-radius:20px;
  padding:23px;
  box-shadow:0 25px 70px rgba(0,0,0,.22);
}

.modalHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.modalHeader h2{
  font-size:19px;
}

.closeBtn{
  border:0;
  background:#f1f5f2;
  width:33px;
  height:33px;
  border-radius:9px;
  font-size:18px;
  cursor:pointer;
}

.formGroup{
  margin-bottom:15px;
}

.formGroup label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:7px;
  color:#526159;
}

.formGroup input{
  width:100%;
  height:43px;
  border:1px solid #dce7e0;
  border-radius:10px;
  padding:0 12px;
  outline:none;
}

.formGroup input:focus{
  border-color:#18a558;
}

.formGroup input[readonly]{
  background:#f4f8f5;
  color:#68766e;
}

.modalActions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:20px;
}

.cancelBtn{
  border:1px solid #dce6e0;
  background:#fff;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
}

.saveBtn{
  border:0;
  background:#18a558;
  color:#fff;
  padding:10px 17px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

/* ================= LOADER ================= */

.loader{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(3px);
  z-index:500;
  align-items:center;
  justify-content:center;
}

.loader.show{
  display:flex;
}

.loaderBox{
  background:#fff;
  padding:20px 25px;
  border-radius:15px;
  box-shadow:0 15px 40px rgba(0,0,0,.15);
  font-size:14px;
}

.spinner{
  width:22px;
  height:22px;
  border:3px solid #dcefe4;
  border-top-color:#18a558;
  border-radius:50%;
  animation:spin .8s linear infinite;
  display:inline-block;
  vertical-align:middle;
  margin-right:8px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  background:#17251e;
  color:#fff;
  padding:13px 17px;
  border-radius:11px;
  font-size:13px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  transform:translateY(100px);
  opacity:0;
  transition:.3s;
  z-index:700;
  max-width:320px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.toast.success{
  background:#087b3e;
}

.toast.error{
  background:#c93434;
}

/* ================= RESPONSIVE ================= */

@media(max-width:850px){

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .welcome{
    align-items:flex-start;
    flex-direction:column;
  }

  .entryTools{
    flex-direction:column;
    align-items:stretch;
  }

  .searchBox{
    width:100%;
  }

  .dateTools{
    flex-wrap:wrap;
  }

}

@media(max-width:550px){

  .header{
    padding:0 13px;
  }

  .logoText p{
    display:none;
  }

  .profileName{
    display:none;
  }

  .topBtn{
    padding:8px 10px;
    font-size:12px;
  }

  .container{
    width:94%;
    margin-top:18px;
  }

  .welcome{
    padding:19px;
  }

  .welcome h1{
    font-size:22px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .card{
    padding:15px;
  }

  .cardValue{
    font-size:17px;
  }

  .dateTools input{
    width:130px;
  }

}

</style>

</head>


<body>


<!-- ==========================================================
HEADER
=========================================================== -->

<header class="header">

  <div class="logoArea">

    <div class="logo">
      D
    </div>

    <div class="logoText">

      <h2>Support Dashboard</h2>

      <p>Support Management System</p>

    </div>

  </div>


  <div class="headerRight">

    <!-- RELOAD -->

    <button
      class="topBtn"
      onclick="loadData()"
    >
      ↻ Reload
    </button>


    <!-- PROFILE -->

    <button
      class="profileBtn"
      onclick="toggleProfile()"
    >

      <div
        class="profileCircle"
        id="profileCircle"
      >
        U
      </div>

      <span
        class="profileName"
        id="profileName"
      >
        User
      </span>

      <span>⌄</span>

    </button>


    <!-- PROFILE MENU -->

    <div
      class="profileMenu"
      id="profileMenu"
    >

      <div class="profileInfo">

        <small>Username</small>

        <strong id="menuUsername">
          -
        </strong>

      </div>


      <button
        class="menuItem"
        onclick="openPasswordModal()"
      >
        🔑 Change Password
      </button>


      <button
        class="menuItem logoutItem"
        onclick="logoutUser()"
      >
        ↪ Logout
      </button>

    </div>

  </div>

</header>



<!-- ==========================================================
MAIN
=========================================================== -->

<main class="container">


  <!-- WELCOME -->

  <section class="welcome">

    <div>

      <h1>
        Welcome,
        <span id="welcomeName">User</span> 👋
      </h1>

      <p>
        Manage your support entries from your dashboard.
      </p>

    </div>


    <!-- NEW ENTRY BUTTON -->

    <button
      class="newBtn"
      onclick="openEntryModal()"
    >
      ＋ New Entry
    </button>

  </section>



  <!-- ========================================================
  USER CARDS
  ========================================================= -->

  <section class="cards">


    <div class="card">

      <div class="cardLabel">
        Username
      </div>

      <div
        class="cardValue"
        id="usernameCard"
      >
        -
      </div>

    </div>


    <div class="card">

      <div class="cardLabel">
        Role
      </div>

      <div
        class="cardValue"
        id="roleCard"
      >
        -
      </div>

    </div>


    <div class="card">

      <div class="cardLabel">
        Status
      </div>

      <div
        class="cardValue active"
        id="statusCard"
      >
        -
      </div>

    </div>


    <div class="card">

      <div class="cardLabel">
        Total Entries
      </div>

      <div
        class="cardValue"
        id="totalCard"
      >
        0
      </div>

    </div>

  </section>



  <!-- ========================================================
  RECENT ENTRIES
  ========================================================= -->

  <section class="contentBox">


    <div class="contentTop">

      <h2>
        Recent Entries
      </h2>

    </div>


    <!-- SEARCH + DATE FILTER -->

    <div class="entryTools">


      <!-- LEFT SEARCH -->

      <div class="searchBox">

        <span class="searchIcon">
          🔍
        </span>

        <input
          type="text"
          id="searchInput"
          placeholder="Search Name, IP or Work..."
          oninput="applyFilters()"
        >

      </div>


      <!-- RIGHT DATE FILTER -->

      <div class="dateTools">

        <label>
          From
        </label>

        <input
          type="date"
          id="fromDate"
          onchange="applyFilters()"
        >


        <label>
          To
        </label>

        <input
          type="date"
          id="toDate"
          onchange="applyFilters()"
        >


        <button
          class="filterBtn"
          onclick="applyFilters()"
        >
          Filter
        </button>


        <button
          class="clearBtn"
          onclick="clearFilters()"
        >
          Clear
        </button>

      </div>

    </div>



    <!-- TABLE -->

    <div class="tableWrap">

      <table>

        <thead>

          <tr>

            <th>Name</th>

            <th>IP</th>

            <th>Work</th>

            <th>Date</th>

          </tr>

        </thead>


        <tbody id="tableBody">

          <tr>

            <td
              colspan="4"
              class="noData"
            >
              Loading...
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>



<!-- ==========================================================
NEW ENTRY MODAL
=========================================================== -->

<div
  class="modalOverlay"
  id="entryModal"
>

  <div class="modal">

    <div class="modalHeader">

      <h2>
        New Entry
      </h2>

      <button
        class="closeBtn"
        onclick="closeEntryModal()"
      >
        ×
      </button>

    </div>


    <!-- NAME -->

    <div class="formGroup">

      <label>
        Name
      </label>

      <input
        type="text"
        id="entryName"
        readonly
      >

    </div>


    <!-- IP -->

    <div class="formGroup">

      <label>
        IP Address
      </label>

      <input
        type="text"
        id="entryIP"
        placeholder="Enter IP address"
      >

    </div>


    <!-- WORK -->

    <div class="formGroup">

      <label>
        Work
      </label>

      <input
        type="text"
        id="entryWork"
        placeholder="Enter work"
      >

    </div>


    <!-- DATE -->

    <div class="formGroup">

      <label>
        Date
      </label>

      <input
        type="text"
        id="entryDate"
        readonly
      >

    </div>


    <div class="modalActions">

      <button
        class="cancelBtn"
        onclick="closeEntryModal()"
      >
        Cancel
      </button>

      <button
        class="saveBtn"
        onclick="saveEntry()"
        id="saveEntryBtn"
      >
        Entry
      </button>

    </div>

  </div>

</div>



<!-- ==========================================================
CHANGE PASSWORD MODAL
=========================================================== -->

<div
  class="modalOverlay"
  id="passwordModal"
>

  <div class="modal">

    <div class="modalHeader">

      <h2>
        Change Password
      </h2>

      <button
        class="closeBtn"
        onclick="closePasswordModal()"
      >
        ×
      </button>

    </div>


    <div class="formGroup">

      <label>
        Username
      </label>

      <input
        type="text"
        id="passwordUsername"
        readonly
      >

    </div>


    <div class="formGroup">

      <label>
        Current Password
      </label>

      <input
        type="password"
        id="currentPassword"
        placeholder="Enter current password"
      >

    </div>


    <div class="formGroup">

      <label>
        New Password
      </label>

      <input
        type="password"
        id="newPassword"
        placeholder="Enter new password"
      >

    </div>


    <div class="formGroup">

      <label>
        Confirm New Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
      >

    </div>


    <div class="modalActions">

      <button
        class="cancelBtn"
        onclick="closePasswordModal()"
      >
        Cancel
      </button>

      <button
        class="saveBtn"
        onclick="changePassword()"
        id="changePasswordBtn"
      >
        Change Password
      </button>

    </div>

  </div>

</div>



<!-- ==========================================================
LOADER
=========================================================== -->

<div
  class="loader"
  id="loader"
>

  <div class="loaderBox">

    <span class="spinner"></span>

    <span id="loaderText">
      Loading...
    </span>

  </div>

</div>



<!-- ==========================================================
TOAST
=========================================================== -->

<div
  class="toast"
  id="toast"
>
  Message
</div>



<script>


// ============================================================
// API URL
// ============================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbz59T-4CKQDbHJB_ql6OYZf18eN7XUmttp0d2FaOM5pm27yCBOWrEilqA_zMOnFq_rz/exec";


// ============================================================
// GLOBAL
// ============================================================

let allEntries = [];

let currentUser = {
  username:"",
  name:"",
  role:"",
  status:""
};


// ============================================================
// PAGE LOAD
// ============================================================

document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadUser();

    loadData();

    document.addEventListener(
      "click",
      function(e){

        const menu =
          document.getElementById(
            "profileMenu"
          );

        const button =
          document.querySelector(
            ".profileBtn"
          );


        if(
          menu.classList.contains("show") &&
          !menu.contains(e.target) &&
          !button.contains(e.target)
        ){

          menu.classList.remove("show");

        }

      }
    );

  }
);


// ============================================================
// LOAD USER
// ============================================================

function loadUser(){

  let saved = null;


  try{

    saved =
      JSON.parse(
        localStorage.getItem(
          "userData"
        ) || "null"
      );

  }catch(e){}


  if(!saved){

    try{

      saved =
        JSON.parse(
          localStorage.getItem(
            "loginData"
          ) || "null"
        );

    }catch(e){}

  }


  if(!saved){

    saved = {

      username:
        localStorage.getItem(
          "username"
        ) || "",

      name:
        localStorage.getItem(
          "name"
        ) || "",

      role:
        localStorage.getItem(
          "role"
        ) || "",

      status:
        localStorage.getItem(
          "status"
        ) || "Active"

    };

  }


  // Support different login object formats

  if(saved.user){

    saved =
      saved.user;

  }


  currentUser.username =
    saved.username ||
    saved.userName ||
    saved.Username ||
    "";

  currentUser.name =
    saved.name ||
    saved.Name ||
    "";

  currentUser.role =
    saved.role ||
    saved.Role ||
    "support";

  currentUser.status =
    saved.status ||
    saved.Status ||
    "Active";


  updateUserUI();


  if(currentUser.username){

    fetchUserInfo();

  }

}


// ============================================================
// GET LATEST USER FROM SHEET
// ============================================================

async function fetchUserInfo(){

  try{

    const url =
      API_URL +
      "?action=getUser&username=" +
      encodeURIComponent(
        currentUser.username
      ) +
      "&_=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    if(
      result.success &&
      result.user
    ){

      currentUser =
        result.user;


      localStorage.setItem(
        "userData",
        JSON.stringify(
          currentUser
        )
      );


      updateUserUI();

    }

  }catch(error){

    console.log(
      "User info error:",
      error
    );

// ============================================================
// LOAD DATA
// ============================================================

async function loadData(){

  showLoader(
    "Loading dashboard..."
  );


  try{

    const url =
      API_URL +
      "?action=getData&_=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const result =
      await response.json();


    if(!result.success){

      throw new Error(
        result.message ||
        "Could not load data."
      );

    }


    allEntries =
      Array.isArray(result.data)
        ? result.data
        : [];


    document.getElementById(
      "totalCard"
    ).textContent =
      allEntries.length;


    applyFilters();


  }catch(error){

    console.error(error);


    document.getElementById(
      "tableBody"
    ).innerHTML = `
      <tr>
        <td
          colspan="4"
          class="noData"
        >
          Failed to load entries.
        </td>
      </tr>
    `;


    showToast(
      error.message ||
      "Failed to load data.",
      "error"
    );

  }


  hideLoader();

}


// ============================================================
// FILTER
// ============================================================

function applyFilters(){

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const fromDate =
    document
      .getElementById(
        "fromDate"
      )
      .value;


  const toDate =
    document
      .getElementById(
        "toDate"
      )
      .value;


  // If From > To

  if(
    fromDate &&
    toDate &&
    fromDate > toDate
  ){

    showToast(
      "From date cannot be after To date.",
      "error"
    );

    return;

  }


  const filtered =
    allEntries.filter(
      function(entry){

        // SEARCH

        const searchText =
          (
            String(
              entry.name || ""
            ) +
            " " +
            String(
              entry.ip || ""
            ) +
            " " +
            String(
              entry.work || ""
            )
          )
          .toLowerCase();


        if(
          search &&
          !searchText.includes(
            search
          )
        ){

          return false;

        }


        // DATE

        const entryDate =
          getEntryDate(
            entry.date
          );


        if(fromDate){

          if(
            !entryDate ||
            entryDate < new Date(
              fromDate +
              "T00:00:00"
            )
          ){

            return false;

          }

        }


        if(toDate){

          if(
            !entryDate ||
            entryDate > new Date(
              toDate +
              "T23:59:59"
            )
          ){

            return false;

          }

        }


        return true;

      }
    );


  renderTable(
    filtered
  );

}


// ============================================================
// PARSE DATE
// ============================================================

function getEntryDate(value){

  if(!value){
    return null;
  }


  const text =
    String(value).trim();


  // Try normal Date parser

  let date =
    new Date(text);


  if(
    !isNaN(
      date.getTime()
    )
  ){

    return date;

  }


  // dd MMMM yyyy HH:mm:ss

  const match =
    text.match(
      /^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})(?:\s+(\d{1,2}):(\d{2}):(\d{2}))?$/
    );


  if(match){

    const months = {

      january:0,
      february:1,
      march:2,
      april:3,
      may:4,
      june:5,
      july:6,
      august:7,
      september:8,
      october:9,
      november:10,
      december:11

    };


    const month =
      String(
        match[2]
      ).toLowerCase();


    if(
      Object.prototype.hasOwnProperty.call(
        months,
        month
      )
    ){

      return new Date(
        Number(match[3]),
        months[month],
        Number(match[1]),
        Number(match[4] || 0),
        Number(match[5] || 0),
        Number(match[6] || 0)
      );

    }

  }


  return null;

}


// ============================================================
// RENDER TABLE
// ============================================================

function renderTable(data){

  const tbody =
    document.getElementById(
      "tableBody"
    );


  if(!data.length){

    tbody.innerHTML = `
      <tr>
        <td
          colspan="4"
          class="noData"
        >
          No entries found.
        </td>
      </tr>
    `;

    return;

  }


  tbody.innerHTML =
    data.map(
      function(entry){

        return `
          <tr>

            <td>
              ${escapeHtml(
                entry.name
              )}
            </td>

            <td>
              ${escapeHtml(
                entry.ip
              )}
            </td>

            <td>
              ${escapeHtml(
                entry.work
              )}
            </td>

            <td>
              ${escapeHtml(
                entry.date
              )}
            </td>

          </tr>
        `;

      }
    ).join("");

}


// ============================================================
// ESCAPE
// ============================================================

function escapeHtml(value){

  return String(
    value || ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

// ============================================================
// DATE FORMAT
// ============================================================

function formatDateTime(date){

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");


  const month =
    date.toLocaleString(
      "en-US",
      {
        month:"long"
      }
    );


  const year =
    date.getFullYear();


  const hours =
    String(
      date.getHours()
    ).padStart(2,"0");


  const minutes =
    String(
      date.getMinutes()
    ).padStart(2,"0");


  const seconds =
    String(
      date.getSeconds()
    ).padStart(2,"0");


  return (
    day +
    " " +
    month +
    " " +
    year +
    " " +
    hours +
    ":" +
    minutes +
    ":" +
    seconds
  );

}


// ============================================================
// SAVE ENTRY
// ============================================================

async function saveEntry(){

  const ip =
    document.getElementById(
      "entryIP"
    ).value.trim();


  const work =
    document.getElementById(
      "entryWork"
    ).value.trim();


  if(!ip){

    showToast(
      "Please enter IP address.",
      "error"
    );

    return;

  }


  if(!work){

    showToast(
      "Please enter Work.",
      "error"
    );

    return;

  }


  if(!currentUser.username){

    showToast(
      "User session not found. Please login again.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById(
      "saveEntryBtn"
    );


  button.disabled = true;

  button.textContent =
    "Saving...";


  showLoader(
    "Saving entry..."
  );


  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({

              action:
                "addEntry",

              username:
                currentUser.username,

              ip:
                ip,

              work:
                work

            })

        }
      );


    const result =
      await response.json();


    if(!result.success){

      throw new Error(
        result.message ||
        "Entry failed."
      );

    }


    closeEntryModal();


    showToast(
      "New entry added successfully.",
      "success"
    );


    await loadData();


  }catch(error){

    console.error(error);


    showToast(
      error.message ||
      "Could not save entry.",
      "error"
    );

  }


  button.disabled = false;

  button.textContent =
    "Entry";


  hideLoader();

}

// ============================================================
// CHANGE PASSWORD
// ============================================================

async function changePassword(){

  const currentPassword =
    document.getElementById(
      "currentPassword"
    ).value;


  const newPassword =
    document.getElementById(
      "newPassword"
    ).value;


  const confirmPassword =
    document.getElementById(
      "confirmPassword"
    ).value;


  if(!currentPassword){

    showToast(
      "Enter current password.",
      "error"
    );

    return;

  }


  if(!newPassword){

    showToast(
      "Enter new password.",
      "error"
    );

    return;

  }


  if(newPassword.length < 4){

    showToast(
      "New password must be at least 4 characters.",
      "error"
    );

    return;

  }


  if(
    newPassword !==
    confirmPassword
  ){

    showToast(
      "New passwords do not match.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById(
      "changePasswordBtn"
    );


  button.disabled = true;

  button.textContent =
    "Changing...";


  showLoader(
    "Changing password..."
  );


  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({

              action:
                "changePassword",

              username:
                currentUser.username,

              currentPassword:
                currentPassword,

              newPassword:
                newPassword

            })

        }
      );


    const result =
      await response.json();


    if(!result.success){

      throw new Error(
        result.message ||
        "Password change failed."
      );

    }


    closePasswordModal();


    showToast(
      "Password changed successfully.",
      "success"
    );


  }catch(error){

    showToast(
      error.message ||
      "Password change failed.",
      "error"
    );

  }


  button.disabled = false;

  button.textContent =
    "Change Password";


  hideLoader();

}

// ============================================================
// TOAST
// ============================================================

let toastTimer;


function showToast(
  message,
  type
){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.className =
    "toast show " +
    (type || "");


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function(){

        toast.classList.remove(
          "show"
        );

      },
      3000
    );

}

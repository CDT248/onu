<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Support Dashboard</title>

<link rel="icon"
      type="image/png"
      href="https://cdn-icons-png.flaticon.com/128/17163/17163834.png">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

:root{
  --bg:#f4f7f6;
  --card:#ffffff;
  --text:#17221f;
  --muted:#71807a;
  --border:#e2e8e5;
  --green:#16a36b;
  --green-dark:#108255;
  --input:#f8faf9;
  --shadow:0 10px 30px rgba(0,0,0,.07);
}

body.dark{
  --bg:#101513;
  --card:#18201d;
  --text:#f1f5f3;
  --muted:#9aa9a3;
  --border:#2a3531;
  --green:#20c982;
  --green-dark:#16a96b;
  --input:#111916;
  --shadow:0 12px 35px rgba(0,0,0,.35);
}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  transition:.25s;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
  border:none;
}

/* ================= HEADER ================= */

.header{
  width:100%;
  background:var(--card);
  border-bottom:1px solid var(--border);
  box-shadow:var(--shadow);
  position:sticky;
  top:0;
  z-index:100;
}

.header-inner{
  max-width:1400px;
  margin:auto;
  min-height:72px;
  padding:12px 22px;
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:10px;
  margin-right:auto;
}

.logo{
  width:40px;
  height:40px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#16a36b,#0d7e51);
  color:#fff;
  font-size:20px;
  font-weight:bold;
}

.logo-text{
  font-size:19px;
  font-weight:700;
}

.header-btn{
  height:42px;
  padding:0 15px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-weight:600;
  transition:.2s;
}

.reload-btn{
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
}

.reload-btn:hover{
  transform:translateY(-1px);
}

.new-btn{
  background:var(--green);
  color:#fff;
  box-shadow:0 5px 15px rgba(22,163,107,.25);
}

.new-btn:hover{
  background:var(--green-dark);
  transform:translateY(-1px);
}

.theme-btn{
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
}

.profile-btn{
  width:42px;
  padding:0;
  border-radius:50%;
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
  font-size:18px;
}

/* ================= PROFILE MENU ================= */

.profile-wrap{
  position:relative;
}

.profile-menu{
  position:absolute;
  top:52px;
  right:0;
  width:230px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:10px;
  box-shadow:var(--shadow);
  display:none;
}

.profile-menu.show{
  display:block;
}

.profile-user{
  padding:12px;
  border-bottom:1px solid var(--border);
  margin-bottom:7px;
}

.profile-user strong{
  display:block;
  font-size:15px;
}

.profile-user span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.menu-item{
  width:100%;
  padding:11px 12px;
  background:transparent;
  color:var(--text);
  border-radius:9px;
  text-align:left;
}

.menu-item:hover{
  background:var(--input);
}

.menu-item.logout{
  color:#e05252;
}

/* ================= MAIN ================= */

.main{
  max-width:1400px;
  margin:auto;
  padding:22px;
}

/* ================= FILTER ================= */

.filter-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.search-box{
  flex:1;
  position:relative;
}

.search-box span{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

.search-box input{
  width:100%;
  height:42px;
  padding:0 13px 0 39px;
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
}

.date-group{
  display:flex;
  align-items:center;
  gap:7px;
}

.date-group input{
  height:42px;
  width:145px;
  padding:0 10px;
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
}

.filter-btn{
  height:42px;
  padding:0 15px;
  border-radius:10px;
  background:var(--green);
  color:#fff;
  font-weight:600;
}

.clear-btn{
  height:42px;
  padding:0 15px;
  border-radius:10px;
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
  font-weight:600;
}

/* ================= TABLE ================= */

.table-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.table-title{
  padding:17px 18px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.table-title h2{
  font-size:17px;
}

.table-title span{
  font-size:12px;
  color:var(--muted);
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

thead{
  background:var(--input);
}

th,
td{
  padding:14px 16px;
  text-align:left;
  border-bottom:1px solid var(--border);
}

th{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.4px;
  color:var(--muted);
}

td{
  font-size:14px;
}

tbody tr:hover{
  background:var(--input);
}

.empty{
  text-align:center;
  padding:40px 20px;
  color:var(--muted);
}

/* ================= MODAL ================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:500;
}

.overlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:470px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 25px 70px rgba(0,0,0,.3);
  overflow:hidden;
  animation:modalIn .2s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(12px) scale(.98);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.modal-head{
  padding:18px 20px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal-head h3{
  font-size:18px;
}

.close-btn{
  width:34px;
  height:34px;
  border-radius:9px;
  background:var(--input);
  color:var(--text);
  font-size:19px;
}

.modal-body{
  padding:20px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:600;
}

.form-group input{
  width:100%;
  height:44px;
  padding:0 12px;
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
}

.form-group input:focus{
  border-color:var(--green);
}

.form-group input[readonly]{
  opacity:.75;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

.cancel-btn{
  height:42px;
  padding:0 16px;
  border-radius:10px;
  background:var(--input);
  color:var(--text);
  border:1px solid var(--border);
}

.save-btn{
  height:42px;
  padding:0 18px;
  border-radius:10px;
  background:var(--green);
  color:#fff;
  font-weight:600;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  min-width:250px;
  max-width:350px;
  padding:13px 16px;
  background:#17211d;
  color:#fff;
  border-radius:11px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  transform:translateY(80px);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:1000;
  font-size:14px;
}

.toast.show{
  transform:translateY(0);
  opacity:1;
}

.toast.success{
  border-left:4px solid #20c982;
}

.toast.error{
  border-left:4px solid #ef5b5b;
}

/* ================= LOADER ================= */

.loader{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:900;
}

.loader.show{
  display:flex;
}

.loader-box{
  background:var(--card);
  color:var(--text);
  padding:22px 28px;
  border-radius:15px;
  box-shadow:var(--shadow);
  font-weight:600;
}

/* ================= MOBILE ================= */

@media(max-width:850px){

  .header-inner{
    padding:10px 12px;
    gap:7px;
  }

  .logo-text{
    font-size:16px;
  }

  .logo{
    width:36px;
    height:36px;
  }

  .header-btn{
    height:38px;
    padding:0 10px;
    font-size:12px;
  }

  .theme-btn{
    width:38px;
    padding:0;
    font-size:16px;
  }

  .profile-btn{
    width:38px;
    height:38px;
  }

  .main{
    padding:13px;
  }

  .filter-card{
    flex-wrap:wrap;
  }

  .search-box{
    flex-basis:100%;
  }

  .date-group{
    width:100%;
  }

  .date-group input{
    flex:1;
    width:auto;
  }

  .filter-btn,
  .clear-btn{
    flex:1;
  }
}

@media(max-width:520px){

  .logo-area{
    min-width:0;
  }

  .logo-text{
    display:none;
  }

  .new-btn{
    padding:0 9px;
  }

  .new-btn span{
    display:none;
  }

  .reload-btn span{
    display:none;
  }

  .header-btn{
    width:38px;
    padding:0;
  }

  .profile-menu{
    right:-5px;
  }

  .date-group{
    flex-wrap:wrap;
  }

  .date-group input{
    width:calc(50% - 4px);
    flex:none;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">
  <div class="header-inner">

    <div class="logo-area">
      <div class="logo">S</div>
      <div class="logo-text">Support Dashboard</div>
    </div>

    <button class="header-btn reload-btn" onclick="loadData()">
      ↻ <span>Reload</span>
    </button>

    <button class="header-btn new-btn" onclick="openEntryModal()">
      ＋ <span>New Entry</span>
    </button>

    <button class="header-btn theme-btn"
            id="themeBtn"
            onclick="toggleTheme()"
            title="Dark Mode">
      ☾
    </button>

    <div class="profile-wrap">

      <button class="header-btn profile-btn"
              onclick="toggleProfile()">
        👤
      </button>

      <div class="profile-menu" id="profileMenu">

        <div class="profile-user">
          <strong id="profileName">User</strong>
          <span id="profileUsername">@username</span>
        </div>

        <button class="menu-item"
                onclick="openPasswordModal()">
          🔑 Change Password
        </button>

        <button class="menu-item logout"
                onclick="logoutUser()">
          🚪 Logout
        </button>

      </div>
    </div>

  </div>
</header>


<!-- ================= MAIN ================= -->

<main class="main">

  <!-- FILTER -->

  <section class="filter-card">

    <div class="search-box">
      <span>🔍</span>
      <input
        type="text"
        id="searchInput"
        placeholder="Search Name, IP or Work..."
        oninput="applyFilters()">
    </div>

    <div class="date-group">

      <input
        type="date"
        id="fromDate">

      <input
        type="date"
        id="toDate">

      <button
        class="filter-btn"
        onclick="applyFilters()">
        Filter
      </button>

      <button
        class="clear-btn"
        onclick="clearFilters()">
        Clear
      </button>

    </div>

  </section>


  <!-- TABLE -->

  <section class="table-card">

    <div class="table-title">
      <h2>Recent Entries</h2>
      <span id="entryCount">0 Entries</span>
    </div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Name</th>
            <th>IP</th>
            <th>Work</th>
            <th>Date</th>
          </tr>
        </thead>

        <tbody id="tableBody">

          <tr>
            <td colspan="4" class="empty">
              Loading...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </section>

</main>


<!-- ================= NEW ENTRY MODAL ================= -->

<div class="overlay" id="entryOverlay">

  <div class="modal">

    <div class="modal-head">
      <h3>New Entry</h3>

      <button class="close-btn"
              onclick="closeEntryModal()">
        ×
      </button>
    </div>

    <div class="modal-body">

      <div class="form-group">
        <label>Name</label>
        <input
          type="text"
          id="entryName"
          readonly>
      </div>

      <div class="form-group">
        <label>Date</label>
        <input
          type="text"
          id="entryDate"
          readonly>
      </div>

      <div class="form-group">
        <label>IP Address</label>
        <input
          type="text"
          id="entryIP"
          placeholder="Enter IP address">
      </div>

      <div class="form-group">
        <label>Work</label>
        <input
          type="text"
          id="entryWork"
          placeholder="Enter work">
      </div>

      <div class="modal-actions">

        <button
          class="cancel-btn"
          onclick="closeEntryModal()">
          Cancel
        </button>

        <button
          class="save-btn"
          onclick="saveEntry()">
          Entry
        </button>

      </div>

    </div>

  </div>

</div>


<!-- ================= CHANGE PASSWORD MODAL ================= -->

<div class="overlay" id="passwordOverlay">

  <div class="modal">

    <div class="modal-head">
      <h3>Change Password</h3>

      <button class="close-btn"
              onclick="closePasswordModal()">
        ×
      </button>
    </div>

    <div class="modal-body">

      <div class="form-group">
        <label>Current Password</label>
        <input
          type="password"
          id="currentPassword"
          placeholder="Enter current password">
      </div>

      <div class="form-group">
        <label>New Password</label>
        <input
          type="password"
          id="newPassword"
          placeholder="Enter new password">
      </div>

      <div class="form-group">
        <label>Confirm New Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm new password">
      </div>

      <div class="modal-actions">

        <button
          class="cancel-btn"
          onclick="closePasswordModal()">
          Cancel
        </button>

        <button
          class="save-btn"
          onclick="changePassword()">
          Save Password
        </button>

      </div>

    </div>

  </div>

</div>


<!-- ================= LOADER ================= -->

<div class="loader" id="loader">
  <div class="loader-box">
    Please wait...
  </div>
</div>


<!-- ================= TOAST ================= -->

<div class="toast" id="toast"></div>


<script>

/* =========================================================
   API
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbz59T-4CKQDbHJB_ql6OYZf18eN7XUmttp0d2FaOM5pm27yCBOWrEilqA_zMOnFq_rz/exec";


/* =========================================================
   GLOBAL DATA
========================================================= */

let allData = [];

let currentUser = {
  username:"",
  name:"",
  role:"",
  status:""
};


/* =========================================================
   START
========================================================= */

document.addEventListener("DOMContentLoaded", function(){

  loadTheme();
  loadUser();
  loadData();

});


/* =========================================================
   USER
========================================================= */

function loadUser(){

  let saved = null;

  try{
    saved =
      JSON.parse(localStorage.getItem("userData") || "null")
      || JSON.parse(localStorage.getItem("loginData") || "null");
  }catch(e){}

  currentUser.username =
    localStorage.getItem("username")
    || (saved && saved.username)
    || "";

  currentUser.name =
    localStorage.getItem("name")
    || (saved && saved.name)
    || currentUser.username;

  currentUser.role =
    localStorage.getItem("role")
    || (saved && saved.role)
    || "";

  currentUser.status =
    localStorage.getItem("status")
    || (saved && saved.status)
    || "";

  if(!currentUser.username){

    window.location.href = "index.html";
    return;
  }

  document.getElementById("profileName").textContent =
    currentUser.name || currentUser.username;

  document.getElementById("profileUsername").textContent =
    "@" + currentUser.username;

  fetchUserInfo();

}


/* =========================================================
   GET USER FROM SHEET
========================================================= */

async function fetchUserInfo(){

  try{

    const response = await fetch(
      API_URL +
      "?action=getUser&username=" +
      encodeURIComponent(currentUser.username) +
      "&_=" + Date.now()
    );

    const result = await response.json();

    if(result.success && result.user){

      currentUser.username = result.user.username;
      currentUser.name = result.user.name;
      currentUser.role = result.user.role;
      currentUser.status = result.user.status;

      localStorage.setItem(
        "username",
        currentUser.username
      );

      localStorage.setItem(
        "name",
        currentUser.name
      );

      localStorage.setItem(
        "role",
        currentUser.role
      );

      localStorage.setItem(
        "status",
        currentUser.status
      );

      document.getElementById("profileName").textContent =
        currentUser.name || currentUser.username;

      document.getElementById("profileUsername").textContent =
        "@" + currentUser.username;
    }

  }catch(error){

    console.log("User info error:",error);

  }

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

  showLoader();

  try{

    const response = await fetch(
      API_URL +
      "?action=getData&_=" + Date.now(),
      {
        method:"GET",
        cache:"no-store"
      }
    );

    const result = await response.json();

    if(result.success){

      allData = Array.isArray(result.data)
        ? result.data
        : [];

      applyFilters();

    }else{

      showToast(
        result.message || "Failed to load data.",
        "error"
      );

      renderTable([]);

    }

  }catch(error){

    console.error(error);

    showToast(
      "Could not connect to server.",
      "error"
    );

    renderTable([]);

  }finally{

    hideLoader();

  }

}


/* =========================================================
   FILTER
========================================================= */

function applyFilters(){

  const search =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const from =
    document.getElementById("fromDate").value;

  const to =
    document.getElementById("toDate").value;

  let filtered = allData.filter(function(item){

    const text =
      (
        (item.name || "") + " " +
        (item.ip || "") + " " +
        (item.work || "")
      ).toLowerCase();

    if(search && !text.includes(search)){
      return false;
    }

    if(from || to){

      const date = parseDate(item.date);

      if(!date){
        return false;
      }

      const dateOnly =
        formatDateInput(date);

      if(from && dateOnly < from){
        return false;
      }

      if(to && dateOnly > to){
        return false;
      }

    }

    return true;

  });

  renderTable(filtered);

}


/* =========================================================
   DATE PARSER
========================================================= */

function parseDate(value){

  if(!value){
    return null;
  }

  const direct =
    new Date(value);

  if(!isNaN(direct.getTime())){
    return direct;
  }

  const match =
    String(value).match(
      /^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/
    );

  if(match){

    const months = [
      "january",
      "february",
      "march",
      "april",
      "may",
      "june",
      "july",
      "august",
      "september",
      "october",
      "november",
      "december"
    ];

    const month =
      months.indexOf(
        match[2].toLowerCase()
      );

    if(month >= 0){

      return new Date(
        Number(match[3]),
        month,
        Number(match[1])
      );

    }

  }

  return null;

}


function formatDateInput(date){

  const y =
    date.getFullYear();

  const m =
    String(date.getMonth()+1).padStart(2,"0");

  const d =
    String(date.getDate()).padStart(2,"0");

  return y + "-" + m + "-" + d;

}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable(data){

  const body =
    document.getElementById("tableBody");

  document.getElementById("entryCount").textContent =
    data.length + (data.length === 1 ? " Entry" : " Entries");

  if(!data.length){

    body.innerHTML = `
      <tr>
        <td colspan="4" class="empty">
          No entries found.
        </td>
      </tr>
    `;

    return;
  }

  body.innerHTML =
    data.map(function(item){

      return `
        <tr>
          <td>${escapeHTML(item.name || "")}</td>
          <td>${escapeHTML(item.ip || "")}</td>
          <td>${escapeHTML(item.work || "")}</td>
          <td>${escapeHTML(item.date || "")}</td>
        </tr>
      `;

    }).join("");

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   CLEAR FILTER
========================================================= */

function clearFilters(){

  document.getElementById("searchInput").value = "";
  document.getElementById("fromDate").value = "";
  document.getElementById("toDate").value = "";

  applyFilters();

}


/* =========================================================
   NEW ENTRY
========================================================= */

function openEntryModal(){

  document.getElementById("entryName").value =
    currentUser.name || currentUser.username;

  const now = new Date();

  document.getElementById("entryDate").value =
    formatDisplayDate(now);

  document.getElementById("entryIP").value = "";
  document.getElementById("entryWork").value = "";

  document.getElementById("entryOverlay")
    .classList.add("show");

  setTimeout(function(){

    document.getElementById("entryIP").focus();

  },100);

}


function closeEntryModal(){

  document.getElementById("entryOverlay")
    .classList.remove("show");

/* =========================================================
   SAVE ENTRY
========================================================= */

async function saveEntry(){

  const ip =
    document.getElementById("entryIP")
      .value
      .trim();

  const work =
    document.getElementById("entryWork")
      .value
      .trim();

  if(!ip){

    showToast(
      "Please enter IP address.",
      "error"
    );

    return;
  }

  if(!work){

    showToast(
      "Please enter Work.",
      "error"
    );

    return;
  }

  showLoader();

  try{

    const response = await fetch(
      API_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },
        body:JSON.stringify({
          action:"addEntry",
          username:currentUser.username,
          ip:ip,
          work:work
        })
      }
    );

    const result =
      await response.json();

    if(result.success){

      closeEntryModal();

      showToast(
        "New entry added successfully.",
        "success"
      );

      await loadData();

    }else{

      showToast(
        result.message || "Failed to add entry.",
        "error"
      );

    }

  }catch(error){

    console.error(error);

    showToast(
      "Could not connect to server.",
      "error"
    );

  }finally{

    hideLoader();

  }

}


/* =========================================================
   FORMAT DISPLAY DATE
========================================================= */

function formatDisplayDate(date){

  const months = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
  ];

  const day =
    String(date.getDate()).padStart(2,"0");

  const month =
    months[date.getMonth()];

  const year =
    date.getFullYear();

  const hours =
    String(date.getHours()).padStart(2,"0");

  const minutes =
    String(date.getMinutes()).padStart(2,"0");

  const seconds =
    String(date.getSeconds()).padStart(2,"0");

  return `${day} ${month} ${year} ${hours}:${minutes}:${seconds}`;

}


/* =========================================================
   CHANGE PASSWORD
========================================================= */

function openPasswordModal(){

  closeProfile();

  document.getElementById("currentPassword").value = "";
  document.getElementById("newPassword").value = "";
  document.getElementById("confirmPassword").value = "";

  document.getElementById("passwordOverlay")
    .classList.add("show");

}


function closePasswordModal(){

  document.getElementById("passwordOverlay")
    .classList.remove("show");

}


async function changePassword(){

  const currentPassword =
    document.getElementById("currentPassword")
      .value;

  const newPassword =
    document.getElementById("newPassword")
      .value;

  const confirmPassword =
    document.getElementById("confirmPassword")
      .value;

  if(!currentPassword){

    showToast(
      "Enter current password.",
      "error"
    );

    return;
  }

  if(!newPassword){

    showToast(
      "Enter new password.",
      "error"
    );

    return;
  }

  if(newPassword.length < 4){

    showToast(
      "New password must be at least 4 characters.",
      "error"
    );

    return;
  }

  if(newPassword !== confirmPassword){

    showToast(
      "New passwords do not match.",
      "error"
    );

    return;
  }

  showLoader();

  try{

    const response = await fetch(
      API_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },
        body:JSON.stringify({
          action:"changePassword",
          username:currentUser.username,
          currentPassword:currentPassword,
          newPassword:newPassword
        })
      }
    );

    const result =
      await response.json();

    if(result.success){

      closePasswordModal();

      showToast(
        "Password changed successfully.",
        "success"
      );

    }else{

      showToast(
        result.message || "Password change failed.",
        "error"
      );

    }

  }catch(error){

    console.error(error);

    showToast(
      "Could not connect to server.",
      "error"
    );

  }finally{

    hideLoader();

  }

}

/* =========================================================
   DARK MODE
========================================================= */

function loadTheme(){

  const savedTheme =
    localStorage.getItem("dashboardTheme");

  if(savedTheme === "dark"){

    document.body.classList.add("dark");

  }

  updateThemeButton();

}


function toggleTheme(){

  document.body.classList.toggle("dark");

  const isDark =
    document.body.classList.contains("dark");

  localStorage.setItem(
    "dashboardTheme",
    isDark ? "dark" : "light"
  );

  updateThemeButton();

}


function updateThemeButton(){

  const btn =
    document.getElementById("themeBtn");

  if(document.body.classList.contains("dark")){

    btn.textContent = "☀";
    btn.title = "Light Mode";

  }else{

    btn.textContent = "☾";
    btn.title = "Dark Mode";

  }

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message,type="success"){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.className =
    "toast show " + type;

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(function(){

      toast.classList.remove("show");

    },3000);

}


/* =========================================================
   LOADER
========================================================= */

function showLoader(){

  document.getElementById("loader")
    .classList.add("show");

}


function hideLoader(){

  document.getElementById("loader")
    .classList.remove("show");

}

   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================================= */

      closeEntryModal();
    }

  });


document.getElementById("passwordOverlay")
  .addEventListener("click",function(e){

    if(e.target === this){
      closePasswordModal();
    }

  });


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener("keydown",function(e){

  if(e.key === "Escape"){

    closeEntryModal();
    closePasswordModal();
    closeProfile();

  }

});

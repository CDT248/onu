<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Support Dashboard</title>


<style>

/* =====================================================
RESET
===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}


/* =====================================================
THEME
===================================================== */

:root{

  --bg:#f4f7f6;

  --card:#ffffff;

  --text:#1f2937;

  --muted:#6b7280;

  --border:#e5e7eb;

  --input:#ffffff;

  --thead:#f8fafc;

  --hover:#fafafa;

  --green:#087f5b;

  --green-dark:#066b4d;

  --shadow:rgba(0,0,0,.20);

}


body.dark{

  --bg:#111827;

  --card:#1f2937;

  --text:#f9fafb;

  --muted:#9ca3af;

  --border:#374151;

  --input:#111827;

  --thead:#172033;

  --hover:#263244;

  --shadow:rgba(0,0,0,.50);

}


body{

  background:var(--bg);

  color:var(--text);

  transition:.25s;

}


/* =====================================================
HEADER
===================================================== */

.header{

  width:100%;

  min-height:70px;

  background:var(--card);

  border-bottom:1px solid var(--border);

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 25px;

  position:sticky;

  top:0;

  z-index:100;

}


.logo{

  font-size:22px;

  font-weight:700;

  color:var(--green);

}


.header-right{

  display:flex;

  align-items:center;

  gap:10px;

}


/* =====================================================
BUTTON
===================================================== */

button{

  border:none;

  cursor:pointer;

  transition:.2s;

}


button:disabled{

  cursor:not-allowed;

  opacity:.5;

}


.btn{

  padding:11px 17px;

  border-radius:8px;

  font-size:14px;

  font-weight:600;

}


.btn-primary{

  background:var(--green);

  color:#ffffff;

}


.btn-primary:hover{

  background:var(--green-dark);

}


.btn-refresh{

  background:var(--input);

  color:var(--text);

  border:1px solid var(--border);

}


.btn-refresh:hover{

  background:var(--hover);

}


.theme-btn{

  height:42px;

  padding:0 14px;

  border-radius:8px;

  background:var(--input);

  color:var(--text);

  border:1px solid var(--border);

  font-size:13px;

  font-weight:600;

}


.theme-btn:hover{

  background:var(--hover);

}


/* =====================================================
USER INFO
===================================================== */

.user-info{

  font-size:13px;

  color:var(--muted);

  margin-right:5px;

}


.user-info strong{

  color:var(--green);

}


/* =====================================================
MAIN
===================================================== */

.container{

  width:100%;

  max-width:1500px;

  margin:auto;

  padding:25px;

}


/* =====================================================
TOP
===================================================== */

.top-section{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:20px;

}


.title h1{

  font-size:27px;

  margin-bottom:5px;

}


.title p{

  color:var(--muted);

  font-size:14px;

}


/* =====================================================
SEARCH
===================================================== */

.filter-box{

  background:var(--card);

  border:1px solid var(--border);

  border-radius:12px;

  padding:18px;

  margin-bottom:20px;

}


.filters{

  display:grid;

  grid-template-columns:1fr auto;

  gap:12px;

  align-items:end;

}


.field{

  display:flex;

  flex-direction:column;

  gap:6px;

}


.field label{

  font-size:12px;

  font-weight:600;

  color:var(--muted);

}


.field input{

  width:100%;

  height:42px;

  border:1px solid var(--border);

  border-radius:8px;

  padding:0 12px;

  outline:none;

  background:var(--input);

  color:var(--text);

  font-size:14px;

}


.field input:focus{

  border-color:var(--green);

}


/* =====================================================
TABLE
===================================================== */

.table-box{

  background:var(--card);

  border:1px solid var(--border);

  border-radius:12px;

  overflow:hidden;

}


.table-header{

  padding:16px 18px;

  border-bottom:1px solid var(--border);

  display:flex;

  justify-content:space-between;

  align-items:center;

}


.table-header h2{

  font-size:17px;

}


.total-count{

  font-size:13px;

  color:var(--muted);

}


.table-wrapper{

  width:100%;

  overflow-x:auto;

}


table{

  width:100%;

  border-collapse:collapse;

  min-width:650px;

}


th{

  background:var(--thead);

  padding:14px;

  text-align:left;

  font-size:12px;

  color:var(--muted);

  white-space:nowrap;

  border-bottom:1px solid var(--border);

}


td{

  padding:14px;

  border-bottom:1px solid var(--border);

  font-size:13px;

  white-space:nowrap;

}


tr:hover td{

  background:var(--hover);

}


.date-cell{

  color:var(--muted);

  font-weight:500;

}


/* =====================================================
PAGINATION
===================================================== */

.pagination-box{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:15px 18px;

  border-top:1px solid var(--border);

}


.page-info{

  font-size:13px;

  color:var(--muted);

}


.pagination{

  display:flex;

  gap:5px;

  flex-wrap:wrap;

}


.page-btn{

  min-width:35px;

  height:35px;

  border:1px solid var(--border);

  background:var(--input);

  color:var(--text);

  border-radius:6px;

  font-size:13px;

}


.page-btn:hover{

  background:var(--hover);

}


.page-btn.active{

  background:var(--green);

  color:#ffffff;

  border-color:var(--green);

}


/* =====================================================
MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.55);

  display:none;

  justify-content:center;

  align-items:center;

  padding:20px;

  z-index:999;

}


.modal.show{

  display:flex;

}


.modal-box{

  width:100%;

  max-width:650px;

  max-height:95vh;

  overflow-y:auto;

  background:var(--card);

  color:var(--text);

  border-radius:16px;

  box-shadow:

    0 20px 60px

    var(--shadow);

}


.modal-header{

  padding:20px 24px;

  border-bottom:1px solid var(--border);

  display:flex;

  justify-content:space-between;

  align-items:center;

  position:sticky;

  top:0;

  background:var(--card);

  z-index:2;

}


.modal-header h2{

  font-size:20px;

}


.close-btn{

  width:36px;

  height:36px;

  border-radius:50%;

  background:var(--input);

  border:1px solid var(--border);

  font-size:22px;

  color:var(--text);

}


.close-btn:hover{

  background:var(--hover);

}


/* =====================================================
FORM
===================================================== */

.form{

  padding:30px 25px;

}


.form-grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:22px 18px;

}


.form-group{

  display:flex;

  flex-direction:column;

  gap:9px;

}


.form-group.full{

  grid-column:1 / -1;

}


.form-group label{

  font-size:13px;

  font-weight:600;

  color:var(--text);

}


.form-group input,

.form-group textarea{

  width:100%;

  border:1px solid var(--border);

  border-radius:9px;

  padding:13px 14px;

  outline:none;

  font-size:14px;

  background:var(--input);

  color:var(--text);

}


.form-group input{

  height:48px;

}


.form-group textarea{

  min-height:150px;

  resize:vertical;

}


.form-group input:focus,

.form-group textarea:focus{

  border-color:var(--green);

  box-shadow:

    0 0 0 2px

    rgba(8,127,91,.10);

}


/* READ ONLY INPUT */

.readonly-input{

  background:

    var(--thead) !important;

  cursor:not-allowed;

  color:var(--muted) !important;

}


/* =====================================================
FORM FOOTER
===================================================== */

.form-footer{

  display:flex;

  justify-content:flex-end;

  gap:10px;

  padding-top:30px;

}


.btn-cancel{

  background:var(--input);

  color:var(--text);

  border:1px solid var(--border);

}


/* =====================================================
LOADING
===================================================== */

.loading{

  text-align:center;

  padding:45px 20px;

  color:var(--muted);

}


.empty{

  text-align:center;

  padding:55px 20px;

  color:var(--muted);

}


/* =====================================================
TOAST
===================================================== */

.toast{

  position:fixed;

  right:25px;

  bottom:25px;

  min-width:260px;

  padding:14px 17px;

  border-radius:9px;

  color:#ffffff;

  background:#111827;

  box-shadow:

    0 10px 30px

    rgba(0,0,0,.2);

  transform:translateY(100px);

  opacity:0;

  transition:.3s;

  z-index:2000;

  font-size:14px;

}


.toast.show{

  transform:translateY(0);

  opacity:1;

}


.toast.success{

  background:#087f5b;

}


.toast.error{

  background:#dc2626;

}


/* =====================================================
MOBILE
===================================================== */

@media(max-width:700px){

  .header{

    height:auto;

    min-height:70px;

    padding:12px 15px;

    gap:10px;

    flex-wrap:wrap;

  }


  .logo{

    font-size:18px;

  }


  .header-right{

    width:100%;

    justify-content:flex-end;

    flex-wrap:wrap;

  }


  .user-info{

    width:100%;

    text-align:right;

  }


  .container{

    padding:15px;

  }


  .top-section{

    align-items:flex-start;

    flex-direction:column;

  }


  .filters{

    grid-template-columns:1fr;

  }


  .form-grid{

    grid-template-columns:1fr;

  }


  .form-group.full{

    grid-column:auto;

  }


  .form{

    padding:25px 18px;

  }


  .modal{

    padding:10px;

  }


  .modal-box{

    max-height:96vh;

    border-radius:13px;

  }


  .pagination-box{

    flex-direction:column;

    gap:12px;

  }


  .toast{

    left:15px;

    right:15px;

    min-width:auto;

  }

}

</style>

</head>


<body>


<!-- =====================================================
HEADER
===================================================== -->

<header class="header">


  <div class="logo">

    SUPPORT DASHBOARD

  </div>


  <div class="header-right">


    <div class="user-info">

      Logged in as:

      <strong id="loggedUsername">

        Loading...

      </strong>

    </div>


    <button
      class="theme-btn"
      id="themeBtn"
      onclick="toggleTheme()"
    >

      🌙 Dark

    </button>


    <button
      class="btn btn-refresh"
      id="refreshBtn"
      onclick="loadData()"
    >

      🔄 Refresh

    </button>


    <button
      class="btn btn-primary"
      onclick="openEntryModal()"
    >

      ➕ New Entry

    </button>

  </div>

</header>


<!-- =====================================================
MAIN
===================================================== -->

<main class="container">


  <div class="top-section">


    <div class="title">

      <h1>

        Support Data

      </h1>


      <p>

        View entries and add new support work.

      </p>

    </div>


  </div>


  <!-- ===================================================
  SEARCH ONLY
  ==================================================== -->

  <section class="filter-box">


    <div class="filters">


      <div class="field">


        <label>

          🔍 Search

        </label>


        <input
          type="text"
          id="searchInput"
          placeholder="Search Name, IP or Work..."
          oninput="applyFilters()"
          autocomplete="off"
        >


      </div>


      <button
        class="btn btn-refresh"
        onclick="clearSearch()"
      >

        Clear

      </button>


    </div>

  </section>


  <!-- ===================================================
  TABLE
  ==================================================== -->

  <section class="table-box">


    <div class="table-header">


      <h2>

        All Entries

      </h2>


      <div class="total-count">

        Total:

        <strong id="totalCount">

          0

        </strong>

      </div>


    </div>


    <div class="table-wrapper">


      <table>


        <thead>


          <tr>


            <th>

              Name

            </th>


            <th>

              IP

            </th>


            <th>

              Work

            </th>


            <th>

              Date

            </th>


          </tr>


        </thead>


        <tbody id="tableBody">


          <tr>


            <td colspan="4">


              <div class="loading">

                ⏳ Loading data...

              </div>


            </td>


          </tr>


        </tbody>


      </table>


    </div>


    <!-- PAGINATION -->

    <div class="pagination-box">


      <div
        class="page-info"
        id="pageInfo"
      >

        Page 1

      </div>


      <div
        class="pagination"
        id="pagination"
      ></div>


    </div>


  </section>


</main>


<!-- =====================================================
NEW ENTRY MODAL
===================================================== -->

<div
  class="modal"
  id="entryModal"
>


  <div class="modal-box">


    <div class="modal-header">


      <h2>

        New Entry

      </h2>


      <button
        class="close-btn"
        onclick="closeEntryModal()"
      >

        ×

      </button>


    </div>


    <form
      class="form"
      id="entryForm"
      onsubmit="submitEntry(event)"
    >


      <div class="form-grid">


        <!-- USERNAME / NAME -->

        <div class="form-group">


          <label>

            Name

          </label>


          <input
            type="text"
            id="nameInput"
            class="readonly-input"
            readonly
          >


        </div>


        <!-- IP -->

        <div class="form-group">


          <label>

            IP

          </label>


          <input
            type="text"
            id="ipInput"
            placeholder="Enter IP"
            autocomplete="off"
            required
          >


        </div>


        <!-- WORK -->

        <div class="form-group full">


          <label>

            Work

          </label>


          <textarea
            id="workInput"
            placeholder="Enter work"
            required
          ></textarea>


        </div>


        <!-- DATE -->

        <div class="form-group">


          <label>

            Date

          </label>


          <input
            type="text"
            id="dateInput"
            class="readonly-input"
            readonly
          >


        </div>


      </div>


      <div class="form-footer">


        <button
          type="button"
          class="btn btn-cancel"
          onclick="closeEntryModal()"
        >

          Cancel

        </button>


        <button
          type="submit"
          class="btn btn-primary"
          id="submitBtn"
        >

          Save Entry

        </button>


      </div>


    </form>


  </div>

</div>


<!-- =====================================================
TOAST
===================================================== -->

<div
  class="toast"
  id="toast"
></div>


<script>


/* =====================================================
GOOGLE APPS SCRIPT URL
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbx6fo2Nogf3ETCtS_B-o0HCFqEs3vYkJ9IT9uu_-3l1w8fNJw77mZipeyFm-zZcjUw-5Q/exec";


/* =====================================================
SETTINGS
===================================================== */

const ROWS_PER_PAGE = 10;


/* =====================================================
GLOBAL DATA
===================================================== */

let allData = [];

let filteredData = [];

let currentPage = 1;

let currentUsername = "";


/* =====================================================
LOGIN CHECK
===================================================== */

function checkLogin(){

  let username = "";


  /*
    First priority:
    username
  */

  username =
    localStorage.getItem("username") ||
    "";


  /*
    Try userData
  */

  if(!username){

    try{

      const userData =
        JSON.parse(
          localStorage.getItem("userData") || "null"
        );


      if(userData){

        username =
          userData.username ||
          userData.Username ||
          userData.userName ||
          "";

      }

    }catch(error){

      console.log(
        "userData parse error"
      );

    }

  }


  /*
    Try loginData
  */

  if(!username){

    try{

      const loginData =
        JSON.parse(
          localStorage.getItem("loginData") || "null"
        );


      if(loginData){

        username =
          loginData.username ||
          loginData.Username ||
          loginData.userName ||
          "";

      }

    }catch(error){

      console.log(
        "loginData parse error"
      );

    }

  }


  /*
    No username = not logged in
  */

  if(!username){

    window.location.replace(
      "index.html"
    );

    return false;

  }


  currentUsername =
    String(username).trim();


  document.getElementById(
    "loggedUsername"
  ).textContent =
    currentUsername;


  return true;

}


/* =====================================================
5 MINUTE AUTO LOGOUT
===================================================== */

const INACTIVITY_LIMIT =
  5 * 60 * 1000;


let inactivityTimer = null;


function resetInactivityTimer(){

  clearTimeout(
    inactivityTimer
  );


  inactivityTimer =
    setTimeout(
      autoLogout,
      INACTIVITY_LIMIT
    );

}


function autoLogout(){

  clearTimeout(
    inactivityTimer
  );


  localStorage.removeItem(
    "username"
  );


  localStorage.removeItem(
    "user"
  );


  localStorage.removeItem(
    "userData"
  );


  localStorage.removeItem(
    "loginData"
  );


  localStorage.removeItem(
    "token"
  );


  localStorage.removeItem(
    "authToken"
  );


  localStorage.removeItem(
    "session"
  );


  localStorage.removeItem(
    "loggedIn"
  );


  sessionStorage.clear();


  window.location.replace(
    "index.html"
  );

}


/* =====================================================
USER ACTIVITY
===================================================== */

const activityEvents = [

  "mousemove",

  "mousedown",

  "keydown",

  "scroll",

  "touchstart",

  "click",

  "wheel"

];


activityEvents.forEach(
  function(eventName){

    document.addEventListener(
      eventName,
      resetInactivityTimer,
      true
    );

  }
);


resetInactivityTimer();


/* =====================================================
INITIAL LOAD
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    /*
      Login check FIRST
    */

    if(!checkLogin()){

      return;

    }


    loadTheme();

    loadData();

  }
);


/* =====================================================
THEME
===================================================== */

function loadTheme(){

  const savedTheme =
    localStorage.getItem(
      "dashboardTheme"
    );


  if(savedTheme === "dark"){

    document.body.classList.add(
      "dark"
    );

  }


  updateThemeButton();

}


function toggleTheme(){

  document.body.classList.toggle(
    "dark"
  );


  const isDark =
    document.body.classList.contains(
      "dark"
    );


  localStorage.setItem(
    "dashboardTheme",
    isDark
      ? "dark"
      : "light"
  );


  updateThemeButton();

}


function updateThemeButton(){

  const btn =
    document.getElementById(
      "themeBtn"
    );


  if(!btn){

    return;

  }


  const isDark =
    document.body.classList.contains(
      "dark"
    );


  btn.textContent =
    isDark
      ? "☀️ White"
      : "🌙 Dark";

}


/* =====================================================
LOAD DATA
===================================================== */

async function loadData(){

  const refreshBtn =
    document.getElementById(
      "refreshBtn"
    );


  refreshBtn.disabled =
    true;


  refreshBtn.textContent =
    "⏳ Loading...";


  showLoading();


  try{


    const response =
      await fetch(
        API_URL +
        "?action=getData&_=" +
        Date.now(),
        {

          method:"GET",

          cache:"no-store"

        }
      );


    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "API Response:",
      result
    );


    if(
      result.success === false
    ){

      throw new Error(
        result.message ||
        "Failed to load data."
      );

    }


    if(
      !Array.isArray(
        result.data
      )
    ){

      throw new Error(
        "Invalid data received from Google Sheet."
      );

    }


    allData =
      result.data;


    filteredData =
      [...allData];


    currentPage = 1;


    renderTable();

    updateTotal();


  }catch(error){


    console.error(
      "Load Error:",
      error
    );


    showError(
      error.message ||
      "Failed to load data."
    );


    showToast(
      error.message ||
      "Data loading failed.",
      "error"
    );


  }finally{


    refreshBtn.disabled =
      false;


    refreshBtn.textContent =
      "🔄 Refresh";

  }

}


/* =====================================================
RENDER TABLE
===================================================== */

function renderTable(){

  const tbody =
    document.getElementById(
      "tableBody"
    );


  if(
    filteredData.length === 0
  ){

    tbody.innerHTML = `

      <tr>

        <td colspan="4">

          <div class="empty">

            No data found.

          </div>

        </td>

      </tr>

    `;


    renderPagination();

    return;

  }


  const start =
    (
      currentPage - 1
    ) *
    ROWS_PER_PAGE;


  const end =
    start +
    ROWS_PER_PAGE;


  const pageData =
    filteredData.slice(
      start,
      end
    );


  let html = "";


  pageData.forEach(
    function(row){


      html += `

        <tr>

          <td>

            ${escapeHTML(
              row.Name || ""
            )}

          </td>


          <td>

            ${escapeHTML(
              row.Ip || ""
            )}

          </td>


          <td>

            ${escapeHTML(
              row.Work || ""
            )}

          </td>


          <td class="date-cell">

            ${escapeHTML(
              row.Date || ""
            )}

          </td>

        </tr>

      `;

    }
  );


  tbody.innerHTML =
    html;


  renderPagination();

}


/* =====================================================
SEARCH
===================================================== */

function applyFilters(){

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();


  filteredData =
    allData.filter(
      function(row){


        if(!search){

          return true;

        }


        const searchText = (

          String(
            row.Name || ""
          ) +

          " " +

          String(
            row.Ip || ""
          ) +

          " " +

          String(
            row.Work || ""
          ) +

          " " +

          String(
            row.Date || ""
          )

        ).toLowerCase();


        return searchText.includes(
          search
        );

      }
    );


  currentPage = 1;


  renderTable();

  updateTotal();

}


/* =====================================================
CLEAR SEARCH
===================================================== */

function clearSearch(){

  document
    .getElementById(
      "searchInput"
    )
    .value = "";


  filteredData =
    [...allData];


  currentPage = 1;


  renderTable();

  updateTotal();

}


/* =====================================================
PAGINATION
===================================================== */

function renderPagination(){

  const pagination =
    document.getElementById(
      "pagination"
    );


  const pageInfo =
    document.getElementById(
      "pageInfo"
    );


  const totalPages =
    Math.ceil(
      filteredData.length /
      ROWS_PER_PAGE
    );


  if(
    totalPages <= 1
  ){

    pagination.innerHTML =
      "";


    pageInfo.textContent =
      filteredData.length
        ? "Page 1"
        : "Page 0";


    return;

  }


  let html = "";


  html += `

    <button
      class="page-btn"
      onclick="changePage(${currentPage - 1})"
      ${
        currentPage === 1
          ? "disabled"
          : ""
      }
    >

      ‹

    </button>

  `;


  let startPage =
    Math.max(
      1,
      currentPage - 2
    );


  let endPage =
    Math.min(
      totalPages,
      currentPage + 2
    );


  for(
    let i = startPage;
    i <= endPage;
    i++
  ){

    html += `

      <button
        class="page-btn ${
          i === currentPage
            ? "active"
            : ""
        }"
        onclick="changePage(${i})"
      >

        ${i}

      </button>

    `;

  }


  html += `

    <button
      class="page-btn"
      onclick="changePage(${currentPage + 1})"
      ${
        currentPage === totalPages
          ? "disabled"
          : ""
      }
    >

      ›

    </button>

  `;


  pagination.innerHTML =
    html;


  pageInfo.textContent =
    `Page ${currentPage} of ${totalPages}`;

}


function changePage(page){

  const totalPages =
    Math.ceil(
      filteredData.length /
      ROWS_PER_PAGE
    );


  if(
    page < 1 ||
    page > totalPages
  ){

    return;

  }


  currentPage =
    page;


  renderTable();

}


/* =====================================================
TOTAL
===================================================== */

function updateTotal(){

  document
    .getElementById(
      "totalCount"
    )
    .textContent =
    filteredData.length;

}


/* =====================================================
OPEN NEW ENTRY
===================================================== */

function openEntryModal(){

  /*
    Re-check login
  */

  if(!currentUsername){

    if(!checkLogin()){

      return;

    }

  }


  document
    .getElementById(
      "entryForm"
    )
    .reset();


  /*
    NAME = USERNAME
  */

  document
    .getElementById(
      "nameInput"
    )
    .value =
    currentUsername;


  /*
    DATE AUTO
  */

  document
    .getElementById(
      "dateInput"
    )
    .value =
    getTodayDisplayDate();


  /*
    Clear IP / Work
  */

  document
    .getElementById(
      "ipInput"
    )
    .value = "";


  document
    .getElementById(
      "workInput"
    )
    .value = "";


  document
    .getElementById(
      "entryModal"
    )
    .classList
    .add("show");


  setTimeout(
    function(){

      document
        .getElementById(
          "ipInput"
        )
        .focus();

    },
    100
  );

}


/* =====================================================
CLOSE MODAL
===================================================== */

function closeEntryModal(){

  document
    .getElementById(
      "entryModal"
    )
    .classList
    .remove("show");

}


/* =====================================================
SUBMIT ENTRY
===================================================== */

async function submitEntry(event){

  event.preventDefault();


  /*
    Check login
  */

  if(!currentUsername){

    if(!checkLogin()){

      return;

    }

  }


  const submitBtn =
    document.getElementById(
      "submitBtn"
    );


  const ip =
    document
      .getElementById(
        "ipInput"
      )
      .value
      .trim();


  const work =
    document
      .getElementById(
        "workInput"
      )
      .value
      .trim();


  if(!ip){

    showToast(
      "Please enter IP.",
      "error"
    );

    return;

  }


  if(!work){

    showToast(
      "Please enter Work.",
      "error"
    );

    return;

  }


  /*
    DUPLICATE IP CHECK
  */

  const normalizedIP =
    ip.toLowerCase();


  const duplicate =
    allData.some(
      function(row){

        return String(
          row.Ip || ""
        )
        .trim()
        .toLowerCase() ===
        normalizedIP;

      }
    );


  if(duplicate){

    showToast(
      "This IP already exists. Duplicate entry is not allowed.",
      "error"
    );

    return;

  }


  submitBtn.disabled =
    true;


  submitBtn.textContent =
    "Saving...";


  try{


    /*
      Date auto generated
    */

    const today =
      getTodayDisplayDate();


    /*
      NAME ALWAYS USERNAME
    */

    const payload = {

      action:"create",


      data:{

        Name:
          currentUsername,

        Ip:
          ip,

        Work:
          work,

        Date:
          today

      }

    };


    console.log(
      "Sending:",
      payload
    );


    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    if(!response.ok){

      throw new Error(
        "Server error: " +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "Save Response:",
      result
    );


    if(
      result.success === false
    ){

      throw new Error(
        result.message ||
        "Save failed."
      );

    }


    closeEntryModal();


    showToast(
      "Entry added successfully.",
      "success"
    );


    await loadData();


  }catch(error){


    console.error(
      "Save Error:",
      error
    );


    /*
      Backend duplicate error
    */

    if(
      String(
        error.message
      )
      .toLowerCase()
      .includes("duplicate")
      ||
      String(
        error.message
      )
      .toLowerCase()
      .includes("already")
    ){

      showToast(
        "This IP already exists. Entry not added.",
        "error"
      );

    }else{

      showToast(
        error.message ||
        "Failed to save entry.",
        "error"
      );

    }


  }finally{


    submitBtn.disabled =
      false;


    submitBtn.textContent =
      "Save Entry";

  }

}


/* =====================================================
TODAY DATE
===================================================== */

function getTodayDisplayDate(){

  const now =
    new Date();


  const day =
    String(
      now.getDate()
    )
    .padStart(
      2,
      "0"
    );


  const month =
    String(
      now.getMonth() + 1
    )
    .padStart(
      2,
      "0"
    );


  const year =
    now.getFullYear();


  /*
    DD-MM-YYYY

    Example:
    23-08-2026
  */

  return (

    day +
    "-" +
    month +
    "-" +
    year

  );

}


/* =====================================================
LOADING
===================================================== */

function showLoading(){

    .getElementById(
      "tableBody"
    )
    .innerHTML = `

      <tr>

        <td colspan="4">

          </div>

/* =====================================================
ERROR
===================================================== */

function showError(message){

  document
    .getElementById(
      "tableBody"
    )
    .innerHTML = `

      <tr>

        <td colspan="4">

          <div class="empty">

            ❌
            ${escapeHTML(

            )}

          </div>

    `;

}


/* =====================================================
TOAST
===================================================== */

function showToast(
  message,
  type
){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.className =
    "toast show " +
    (
      type || ""
    );


  setTimeout(
    function(){

      toast.className =
        "toast";

    },
    3500
  );

}


/* =====================================================
HTML SECURITY
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
CLOSE MODAL OUTSIDE CLICK
===================================================== */

document
  .getElementById(
    "entryModal"
  )
  .addEventListener(
    "click",
    function(event){

      if(
        event.target === this
      ){

        closeEntryModal();

      }

    }
  );


/* =====================================================
ESCAPE
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeEntryModal();

    }

  }
);

</script>
